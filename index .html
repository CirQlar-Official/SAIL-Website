\napart? What will the Training Loss chart do? Use what you know from Day\n2.</em></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>What I changed</strong></th>\n<th><strong>What I predicted</strong></th>\n<th><strong>What actually happened</strong></th>\n<th><strong>Why it happened</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><em>After logging: switch Activation back to ReLU and train once more\n— watch what changes immediately.</em></p>\n<p><strong>Modification 2 — Add Hidden Layers</strong></p>\n<p><strong>The change: Reset trick (flip Activation away and back to\nReLU), then use the layer-add button → 4 hidden layers.</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>MY PREDICTION — write this BEFORE you test.</strong>\n<em>More layers means more neurons, more weighted sums, more ReLUs. Will\nthe loss get LOWER? Will it get there FASTER? Will the bars look more\nconfident?</em></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>What I changed</strong></th>\n<th><strong>What I predicted</strong></th>\n<th><strong>What actually happened</strong></th>\n<th><strong>Why it happened</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Modification 3 — Remove Hidden Layers to One</strong></p>\n<p><strong>The change: Use the layer-remove button → 1 hidden layer (the\nminimum).</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>MY PREDICTION — write this BEFORE you test.</strong> <em>One\nhidden layer, still with ReLU. Can ONE layer still tell your two\ngestures apart? Why or why not?</em></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>What I changed</strong></th>\n<th><strong>What I predicted</strong></th>\n<th><strong>What actually happened</strong></th>\n<th><strong>Why it happened</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Modification 4 — Break the Learning Rate</strong></p>\n<p><strong>The change: Reset trick, restore hidden layers to 2,\nActivation to ReLU. Drag the Learning Rate slider to maximum:\n0.100.</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>MY PREDICTION — write this BEFORE you test.</strong>\n<em>This is TEN TIMES bigger than 0.01. Look at the U-curve on the board\nand picture that step size. What happens to the Training Loss\nchart?</em></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>What I changed</strong></th>\n<th><strong>What I predicted</strong></th>\n<th><strong>What actually happened</strong></th>\n<th><strong>Why it happened</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Reflection — Complete After All Four\nModifications</strong></p>\n<p><strong>1. </strong>You removed hidden layers (Mod 3), and you\nremoved the activation function (Mod 1). Both made the network “simpler”\n— but they are FUNDAMENTALLY different limitations. In 2–3 sentences,\nexplain the difference.</p>\n<p><strong>2. </strong>A classmate says: “So more layers is always\nbetter.” Using what you saw in Modification 2, explain in 2–3 sentences\nwhy that is not quite right.</p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Bring this worksheet to Day 5. </strong>It is your notes,\nyour evidence, and where your Day 5 project starts. Your Day 5\npresentation is one of these log entries, out loud.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<h1 id=\"worksheet-4-my-day-5-project-plan\">WORKSHEET 4 — My Day 5\nProject Plan</h1>\n<p><em>Complete during Segment 8, alongside the lesson. This is your\nlaunchpad for tomorrow.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>What Day 5 will ask of you.</strong> • Choose one gesture\npair (or a new pair of categories) in the SAIL Architect Lab. • Make at\nleast THREE deliberate modifications, with a written prediction before\neach one. • Get the network as confident as reasonably possible — and\nknow WHY your final configuration works. • Present for 2–3 minutes: what\nI tried, what I predicted, what happened, and why. <strong>You have\nalready done this. Four times. It is called Worksheet 3.</strong></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Part A — My Plan</strong></p>\n<p><em>This is graded for COMPLETION, not correctness. Fill in every\nrow. You will start Day 5 immediately — not spend the first thirty\nminutes deciding what to do.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Planning question</strong></th>\n<th><strong>My answer</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Which gesture pair (or new pair of categories) will I\nuse?</strong></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>What is my FIRST modification going to be — and what do I\npredict it will do?</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>What is my SECOND modification going to be — and why that\none?</strong></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>What is my THIRD modification going to be — and why that\none?</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>What is ONE thing I want to find out tomorrow that I do not\nknow yet?</strong></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>If my network gets STUCK (flat, high loss), what are the\nfirst TWO things I will try?</strong></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Part B — My Strongest Log Entry</strong></p>\n<p><em>Look back at Worksheet 3. Which of your four “Why” columns is\nyour BEST explanation — the one where you explained a cause, not just an\nobservation? Copy it here. This is the model for how you should sound\ntomorrow.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Bring this packet to Day 5. </strong>Worksheet 3 (your log)\nand Worksheet 4 (your plan) are the two pages your entire Day 5 project\nis built on.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<h1 id=\"day-4-mini-assessment\">DAY 4 MINI-ASSESSMENT</h1>\n<p><em>Segment 9 • 8 questions • 10 minutes • Devices closed. Notes\nclosed.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Name: ______________________</strong></th>\n<th><strong>Date: ______________________</strong></th>\n<th><strong>Table Group: ________________</strong></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Answer all 8 questions independently. Show your work for any\ncalculation question.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Question 1. </strong>(Conceptual) In your own words, what is\nloss? Your answer MUST say whether a higher or a lower loss is\nbetter.</p>\n<p><strong>Question 2. </strong>(Conceptual) In order, name the four\nsteps of the training loop.</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Step</strong></th>\n<th><strong>Your answer</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1</strong></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>2</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>3</strong></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>4</strong></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Question 3. </strong>(Applied — show your work) A model\npredicts 5, 8, and 10. The correct answers were 6, 8, and 12. Calculate\nthe loss using the error-square-average method.</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Prediction</strong></th>\n<th><strong>Correct answer</strong></th>\n<th><strong>Error (pred − correct)</strong></th>\n<th><strong>Error squared</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>5</strong></td>\n<td>6</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>8</strong></td>\n<td>8</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>10</strong></td>\n<td>12</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Loss = ( ____ + ____ + ____ ) ÷ 3 = __________</strong></p>\n<p><strong>Question 4. </strong>(Applied) Model A has a loss of 0.9.\nModel B has a loss of 0.2. Which model is better, and how do you\nknow?</p>\n<p><strong>Question 5. </strong>(Conceptual) A network’s Training Loss\nchart is flat and HIGH, and has been for a long time. Should the student\nwait longer, or change something? Explain in 1–2 sentences.</p>\n<p><strong>Question 6. </strong>(Conceptual) You set the Activation\nFunction to Linear and the network could not reliably tell your two\ngestures apart, no matter how long it trained. Explain WHY in 1–2\nsentences. Use the word “straight” somewhere in your answer.</p>\n<p><strong>Question 7. </strong>(Conceptual) Explain what the learning\nrate controls, and describe what goes wrong when it is set much too\nlarge.</p>\n<p><strong>Question 8. </strong>(Conceptual) A classmate says: “My model\nis very confident on my own pictures, so it must be a good, fair model.”\nExplain in 2–3 sentences why that confidence alone does not guarantee\nthis.</p>\n<p>Page 1 of 2</p>\n"};

window.SAIL_DATA.days[5] = {"day": 5, "title": "Independent Build & Showcase", "tagline": "Your network, your experiment, your explanation — today nobody tells you what to change.", "minutes": 180, "slideCount": 20, "tools": [{"name": "SAIL Architect Lab", "url": "https://cirqlar-official.github.io/SAIL-project-lab/", "desc": "The browser-based neural-network builder used for training, modification, and the Day 5 project.", "id": "lab", "segments": [1, 2, 4, 6, 7, 8]}], "slides": [{"n": 1, "label": "STUDENT AI LAB · SAIL", "title": "Day 5: Independent", "section": "overview"}, {"n": 2, "label": "SEGMENT 2 · CONCEPT 1", "title": "Controlled experiment: a test in which you change exactly", "section": "seg2"}, {"n": 3, "label": "LEARNING OBJECTIVES", "title": "By the End of Today, You will be able to…", "section": "objectives"}, {"n": 4, "label": "SEGMENT 1", "title": "The Handoff: Today You Run It", "section": "seg1"}, {"n": 5, "label": "DAY 5 · ROADMAP", "title": "Schedule", "section": "timeline"}, {"n": 6, "label": "SEGMENT 2 · CONCEPT 1", "title": "The Three Micro-Steps of Every Run", "section": "seg2"}, {"n": 7, "label": "SEGMENT 2 · LIVE MODEL", "title": "Watch One Experiment, Out Loud", "section": "seg2"}, {"n": 8, "label": "ON THE BOARD ALL DAY", "title": "The Standing Studio Procedure", "section": "seg2"}, {"n": 9, "label": "SEGMENT 3", "title": "5:00", "section": "seg3"}, {"n": 10, "label": "SEGMENT 4 · 45 MIN", "title": "Studio Block A: Independent Build & Baseline", "section": "seg4"}, {"n": 11, "label": "SEGMENT 4 · WHOLE-ROOM PAUSE", "title": "Flat and High Means Stuck, Not Slow", "section": "seg4"}, {"n": 12, "label": "SEGMENT 5", "title": "10:00", "section": "seg5"}, {"n": 13, "label": "SEGMENT 6 · CONCEPT 2", "title": "Technical explanation: what you changed, what you", "section": "seg6"}, {"n": 14, "label": "SEGMENT 6 · CONCEPT 2", "title": "The Four-Part Spoken Frame", "section": "seg6"}, {"n": 15, "label": "SEGMENT 6 · LIVE MODEL", "title": "Same Result, Two Talks", "section": "seg6"}, {"n": 16, "label": "SEGMENT 7 · 30 MIN", "title": "Studio Block B: Finalize Result & Build the Talk", "section": "seg7"}, {"n": 17, "label": "SEGMENT 8 · 20 MIN", "title": "Showcase: The Three-Point Standard", "section": "seg8"}, {"n": 18, "label": "SEGMENT 9", "title": "Mini-Assessment - 8 Questions, 8 Minutes", "section": "seg9"}, {"n": 19, "label": "SEGMENT 9 · THE ONE SENTENCE", "title": "A low loss does not mean a good model - it", "section": "seg9"}, {"n": 20, "label": "END OF DAY 5 · END OF COURSE", "title": "You Ran It.", "section": "seg9"}], "sections": [{"id": "overview", "kind": "general", "num": null, "title": "Overview", "html": "<p><strong>STUDENT AI LAB (SAIL)</strong></p>\n<p><strong>Day 5: Independent Build </strong>&amp;** Showcase —\nDesigning, Running, and Presenting Your Own Neural-Network\nExperiment**</p>\n<p><em>Complete Instructional Module — Instructor Script, Student\nActivities, and Assessment</em></p>\n<p><strong>Total instructional time: </strong>180 minutes (3 hours).</p>\n<p><strong>Audience: </strong>4-H participants, ages 14–18. Students\nhave completed Days 1–4 of SAIL and possess only the knowledge\nestablished there.</p>\n<p><strong>Prerequisite materials: </strong>Completed Day 1–Day 4\nmodules (AI definition; data/input/output vocabulary; AI ethics basics;\nslope-intercept algebra; weight, bias, and weighted sum; linear\nvs. nonlinear relationships; neuron, layer, hidden layer, activation\nfunction, ReLU, and the manual forward pass; loss, the training loop,\nthe live Training Loss chart, and the change–predict–observe–explain\nModification Log). No knowledge beyond Days 1–4 is assumed, and no new\nAI concept is introduced today.</p>\n<p><strong>Students must bring: </strong>Their completed Day 4 Student\nWorksheet Packet — specifically Worksheet 3 (their four-column\nModification Log) and Worksheet 4 (their My Day 5 Project Plan). Day 5\nbegins from Worksheet 4 and cannot start on time without it. If you\ncollected packets overnight, return them before the opening bell.</p>\n<p><strong>Title: </strong>Day 5 — Independent Build &amp; Showcase:\nDesigning, Running, and Presenting Your Own Neural-Network\nExperiment.</p>\n<h3 id=\"overview\"><strong>Overview</strong></h3>\n<p>Day 4 ended with two finished artifacts already in every student’s\nhands: a four-column Modification Log documenting at least four\nsupervised change–predict–observe–explain cycles, and a written My Day 5\nProject Plan naming the gesture pair they will use, the modifications\nthey intend to make, and their first two moves if the network gets\nstuck. Day 5 introduces no new AI concept. Its job is to hand the entire\nweek back to the student and ask them to run it themselves, from a plan\nthey already wrote, on a question they chose. Every technical idea they\nwill use today — the weighted sum from Day 2, the neuron and ReLU from\nDay 3, loss and the training loop from Day 4, and the live SAIL\nArchitect Lab — is already theirs. What is new today is not a concept\nbut a level of independence: for the first time, nobody tells the\nstudent what to change.</p>\n<p>The day has two halves. In the first half, students learn to run a\ndisciplined experiment without an instructor calling each move —\ndesigning a controlled test, changing one thing at a time, writing a\nprediction before every run, and reading the Training Loss chart and\nLive Inference bars to decide what to do next. This is the same\nchange–predict–observe–explain loop they rehearsed eight or more times\non Day 4, now self-directed. In the second half, students learn to turn\none log entry into a clear two-to-three-minute spoken explanation that a\nperson who never took this course could follow, and they deliver it to\nthe room. The capstone is therefore both technical and communicative: a\nstudent finishes Day 5 having built a working classifier they designed,\nand having explained — in plain language, to an audience — exactly what\nthey changed, what they expected, what happened, and why.</p>\n<p>By the end of the day, students will have chosen and captured their\nown two-or-more-category data set in the SAIL Architect Lab, run at\nleast three deliberate, one-variable-at-a-time modifications with a\nwritten prediction before each, gotten their network as confident as\nthey reasonably can, diagnosed and recovered from at least one stuck or\ndegraded run using the loss chart, and stood up to explain their\nstrongest result to their peers using the week’s vocabulary correctly.\nDay 5 is where the week’s scaffolding becomes visible mastery: the\nstudent, not the instructor, is now the person who decides what the\nnetwork should do and can say why it did it.</p>\n"}, {"id": "objectives", "kind": "general", "num": null, "title": "2. Learning Objectives (Measurable)", "html": "<p>By the end of Day 5, students will be able to:</p>\n<ul>\n<li><p><strong>Design </strong>a controlled, one-variable-at-a-time\nexperiment on their own network by stating which single control they\nwill change, holding all others fixed, and writing a testable prediction\nbefore running it.</p></li>\n<li><p><strong>Execute </strong>an independent build in the SAIL\nArchitect Lab — capturing their own labeled data for two or more\ncategories, training the network, and reaching a stated confidence goal\n— without step-by-step instructor direction.</p></li>\n<li><p><strong>Diagnose </strong>a stuck or degraded run from the\nTraining Loss chart and the Live Inference bars alone, and name the\ncorrect next move (change activation, adjust hidden-layer count, or tune\nthe learning rate) rather than simply waiting or guessing.</p></li>\n<li><p><strong>Document </strong>each modification as a complete\nchange–predict–observe–explain cycle in writing, with the “why” stated\nin terms of a mechanism (straight-line limit, bending capacity, or step\nsize) rather than a bare outcome.</p></li>\n<li><p><strong>Translate </strong>one written Modification Log entry\ninto a clear, correctly sequenced two-to-three-minute spoken explanation\naimed at a listener who has never taken the course.</p></li>\n<li><p><strong>Use </strong>the week’s vocabulary — weight, bias,\nweighted sum, neuron, layer, activation function, ReLU, loss, training —\naccurately and in the right places while presenting, defining any term\nthe moment it is first used.</p></li>\n<li><p><strong>Evaluate </strong>a peer’s presentation against a fixed\nthree-point standard (a specific change, a real prediction, and a\nmechanism-level explanation) and give one concrete, non-evaluative piece\nof feedback.</p></li>\n<li><p><strong>Explain </strong>in two or three sentences why a network\nwith a low training loss can still be an unfair or unreliable model,\nconnecting the week’s central lesson — a model is faithful to its data,\nnot to the truth — to their own captured data set.</p></li>\n</ul>\n"}, {"id": "gen3connectiontoday4", "kind": "general", "num": null, "title": "3. Connection to Day 4", "html": "<h3\nid=\"skills-students-already-possess-established-on-days-14-not-retaught-today\"><strong>Skills\nstudents already possess (established on Days 1–4, not retaught\ntoday)</strong></h3>\n<ul>\n<li><p>The full weighted-sum calculation z = w x + b, and the definition\nof a neuron as a weighted sum plus an activation function.</p></li>\n<li><p>The ReLU rule (if z is zero or positive, pass it through\nunchanged; if z is negative, output 0), and the ability to perform a\ncomplete manual forward pass through a small network.</p></li>\n<li><p>The definition of loss as one number measuring how far\npredictions are from the correct answers, the fact that lower is better,\nand the four-step training loop: forward pass, measure loss, adjust,\nrepeat.</p></li>\n<li><p>Direct, hands-on control of the SAIL Architect Lab: capturing\nwebcam data for named classes, pressing TRAIN MODEL / HALT COMPILATION,\nreading the Training Loss chart and the Live Inference Data bars,\nchanging the Activation Function, adding and removing hidden layers, and\nmoving the Learning Rate slider — including the “reset trick” (flip the\nActivation Function dropdown away from ReLU and immediately back to\nforce a fresh random start).</p></li>\n<li><p>The change–predict–observe–explain discipline, written as a\nfour-column Modification Log, rehearsed at least four times under\nsupervision on Day 4.</p></li>\n<li><p>The week’s central conclusion, earned by hand on Day 4: a low\nloss does not mean a good model — it means a model that fits the data it\nwas given.</p></li>\n</ul>\n<h3 id=\"brief-review-plan-10-minutes-segment-1\"><strong>Brief review\nplan (10 minutes, Segment 1)</strong></h3>\n<p>Day 5 opens with a 10-minute review, not a reteach. The review is\nrestricted to exactly the two things today’s independent work depends\non: (1) the change–predict–observe–explain cycle and where students\nalready wrote four of them (Worksheet 3), and (2) the plan each student\nalready committed to (Worksheet 4). The mechanics of individual controls\n(ReLU, learning rate, hidden layers) are not re-explained in the\nabstract today — they are confirmed in passing as students execute their\nown plans, and the Segment 1 review points each student back to their\nown Day 4 log rather than to the board.</p>\n<h3 id=\"how-todays-lesson-builds-on-that-foundation\"><strong>How today’s\nlesson builds on that foundation</strong></h3>\n<p>Day 4 supplied the discipline; Day 5 supplies the freedom. On Day 4\nthe instructor named each modification, timed each run, and cued each\nprediction. Today the student does all three. Every new demand of Day 5\nis a Day 4 skill with the instructor removed:</p>\n<ul>\n<li><p>Choosing what to change is the Day 4 Structure Lab, minus the\ninstructor announcing the modification.</p></li>\n<li><p>Running a controlled test is the Day 4 “reset trick” and\none-variable-at-a-time habit, now self-initiated instead of\ncued.</p></li>\n<li><p>Diagnosing a stuck run is Day 4’s loss-chart reading, now used to\nmake the next decision instead of confirming an expected one.</p></li>\n<li><p>Presenting is, in Day 4’s own words, “one of those log entries,\nout loud” — a spoken version of a Worksheet 3 row students have already\nwritten many times.</p></li>\n</ul>\n<p>Because none of this is new content, the two “concept” segments below\nteach the two genuinely new capstone competencies of the day —\nindependent experimental design and technical communication — rather\nthan any new AI mechanism. Each is defined precisely, broken into\nmicro-steps, fully scripted, and checked twice.</p>\n"}, {"id": "timeline", "kind": "general", "num": null, "title": "4. Full Timeline (180 Minutes Total)", "html": "<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>#</strong></th>\n<th><strong>Segment</strong></th>\n<th><strong>Duration</strong></th>\n<th><strong>Time Block</strong></th>\n<th><strong>Type</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Review + The Handoff: Today You Run It</td>\n<td>10 min</td>\n<td>0:00–0:10</td>\n<td>Discussion</td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>Concept 1: Designing a Controlled Experiment</td>\n<td>25 min</td>\n<td>0:10–0:35</td>\n<td>Lecture + Modeling</td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>Break</td>\n<td>5 min</td>\n<td>0:35–0:40</td>\n<td>Break</td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>Studio Block A: Independent Build &amp; Baseline</td>\n<td>45 min</td>\n<td>0:40–1:25</td>\n<td>Independent Studio</td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td>Break</td>\n<td>10 min</td>\n<td>1:25–1:35</td>\n<td>Break</td>\n</tr>\n<tr class=\"even\">\n<td>6</td>\n<td>Concept 2: Explaining It So Anyone Understands</td>\n<td>20 min</td>\n<td>1:35–1:55</td>\n<td>Lecture + Modeling</td>\n</tr>\n<tr class=\"odd\">\n<td>7</td>\n<td>Studio Block B: Finalize Result &amp; Build the Talk</td>\n<td>30 min</td>\n<td>1:55–2:25</td>\n<td>Independent Studio</td>\n</tr>\n<tr class=\"even\">\n<td>8</td>\n<td>Showcase: Presentations &amp; Peer Feedback</td>\n<td>20 min</td>\n<td>2:25–2:45</td>\n<td>Capstone / Showcase</td>\n</tr>\n<tr class=\"odd\">\n<td>9</td>\n<td>Mini-Assessment, Week Synthesis &amp; Wrap-Up</td>\n<td>15 min</td>\n<td>2:45–3:00</td>\n<td>Assessment</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Total: 180 minutes.</strong></p>\n"}, {"id": "gen5materialsandroomsetup", "kind": "general", "num": null, "title": "5. Materials and Room Setup", "html": "<h3 id=\"instructor-materials\"><strong>Instructor materials</strong></h3>\n<ul>\n<li><p>One instructor laptop with a reliable internet connection and a\nworking webcam, connected to a projector.</p></li>\n<li><p>The SAIL Architect Lab loaded and confirmed working, with camera\npermission already granted, before students arrive:\nhttps://<a href=\"https://cirqlar-official.github.io/SAIL-project-lab/\" target=\"_blank\" rel=\"noopener\">cirqlar-official.github.io/SAIL-project-lab/</a></p></li>\n<li><p>Whiteboard or chalkboard with markers/chalk, used in Segments 1,\n2, and 6.</p></li>\n<li><p>A visible countdown timer projected or on the board — used to run\nthe two Studio Blocks and the Showcase to time. This is required today,\nnot optional: independent studio time without a visible clock is the\nsingle most common way this day runs over.</p></li>\n<li><p>The Day 5 Answer Key and rubrics (contained in this module —\nSegments 8 and 9).</p></li>\n<li><p>A printed copy of this module, or the module open on a second\nscreen.</p></li>\n</ul>\n<h3 id=\"student-materials-per-student-or-per-pair\"><strong>Student\nmaterials (per student, or per pair)</strong></h3>\n<ul>\n<li><p>One internet-connected device with a built-in or attached webcam\nand a modern browser (Chrome or Edge recommended). The SAIL Architect\nLab requires no login, no account, and no installation, but it does\nrequire camera permission when prompted.</p></li>\n<li><p>The student’s completed Day 4 Student Worksheet Packet, brought\nto class — Worksheet 3 (Modification Log) and Worksheet 4 (My Day 5\nProject Plan) are used starting in Segment 1.</p></li>\n<li><p>The Day 5 Student Worksheet Packet (produced separately from this\nmodule) containing: the Experiment Design Sheet, the Day 5 Modification\nLog, the Presentation Builder, the Peer-Feedback Cards, and the Day 5\nMini-Assessment. There is no homework component.</p></li>\n<li><p>Pencil and scratch paper.</p></li>\n</ul>\n<h3 id=\"room-and-grouping\"><strong>Room and grouping</strong></h3>\n<ul>\n<li><p>Students work in the same pairs used on Day 4 wherever possible,\nsince the webcam activity is easier with one student making the gesture\nand the other operating the controls. A student who worked alone on Day\n4 may continue alone if they prefer.</p></li>\n<li><p>Arrange the room so that, during the Showcase (Segment 8), every\nstudent can see the projector and the presenter. If the presenter will\ndrive their own device to the projector, confirm the cable or\nscreen-share path works before class.</p></li>\n<li><p>Confirm consistent, adequate lighting across the room before\nclass, as on Day 4. Uneven lighting is a legitimate thing for a student\nto name in a presentation, but it should not surprise you.</p></li>\n<li><p>Snacks available at the two breaks, per standing SAIL\npractice.</p></li>\n</ul>\n<h3 id=\"instructor-preparation-15-minutes\"><strong>Instructor\npreparation (≈15 minutes)</strong></h3>\n<p>This module assumes an instructor who ran Day 4 and is already\nfamiliar with the SAIL Architect Lab. If you did not personally run Day\n4, complete Day 4’s 30-minute “Step A — Do the whole thing yourself”\npreparation before delivering today. In addition, do the following,\nwhich takes about 15 minutes:</p>\n<ul>\n<li><p>Pick one gesture pair and personally run the exact experiment you\nwill model in Segment 2, Step 2.3 (change Activation Function from ReLU\nto Linear, with everything else held fixed). You must see, on your own\ngesture pair and your own room’s lighting, the loss chart flatten at a\nhigher value under Linear, because you will narrate it live.</p></li>\n<li><p>Read three or four of your class’s Day 4 Worksheet 4 plans in\nadvance if you collected the packets. Note any student whose “if my\nnetwork gets stuck” row said “ask the teacher” — that student needs a\nfirst move handed to them in Segment 1, not in Segment 4 when the clock\nis running.</p></li>\n<li><p>Write the standing Studio Procedure (below) on a side board and\nleave it up for the entire day. Every student will refer to it during\nboth Studio Blocks.</p></li>\n</ul>\n<p>* THE STANDING STUDIO PROCEDURE (keep on the board all day)**</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>1</strong></th>\n<th>Change ONE thing. Never two. If you change two, you will not know\nwhich one did it.</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>2</strong></td>\n<td>Write your prediction BEFORE you press TRAIN MODEL. A prediction\nwritten after is not a prediction.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>3</strong></td>\n<td>Train. Watch the Training Loss chart fall (or not) and read the Live\nInference bars.</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>4</strong></td>\n<td>Record what actually happened, then write WHY in terms of a\nmechanism — straight-line limit, bending capacity, or step size.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>5</strong></td>\n<td>Stuck? Flat, high loss = change something (activation, layers,\nlearning rate). Do not just wait.</td>\n</tr>\n</tbody>\n</table>\n"}, {"id": "seg1", "kind": "segment", "num": 1, "title": "Segment 1: Review + The Handoff — Today You Run It", "html": "<p><strong>Duration: </strong>10 minutes (0:00–0:10) | Type:\nDiscussion</p>\n<p><strong>Materials needed: </strong>Students’ Day 4 packets open to\nWorksheet 3 (Modification Log) and Worksheet 4 (My Day 5 Project\nPlan).</p>\n<h3 id=\"step-1.1-the-one-sentence-review-3-min\"><strong>Step 1.1 — The\none-sentence review (3 min)</strong></h3>\n<p><strong>Instructor action: </strong>As students settle, have them\nopen the Day 4 packet to Worksheet 4. Do not re-teach any control. Say\nthe following.</p>\n<p><strong>Say: </strong>“All week you built the pieces. Monday you did\ny equals m x plus b on paper. Tuesday you turned slope and intercept\ninto weight and bias and dragged sliders. Wednesday you chained weighted\nsums into neurons and did a forward pass by hand. Yesterday a network\ntaught itself, using pictures you captured, and you wrote down four\ntimes exactly what you changed, what you predicted, what happened, and\nwhy. Here is the whole difference for today: yesterday I told you what\nto change. Today you do. Everything else is the same.”*</p>\n<h3\nid=\"step-1.2-point-every-student-at-their-own-plan-4-min\"><strong>Step\n1.2 — Point every student at their own plan (4 min)</strong></h3>\n<p><strong>Say: </strong>“Look at Worksheet 4 in front of you. You\nalready wrote today’s project down yesterday, in this room, while it was\nfresh. Your gesture pair is on it. Your first three modifications are on\nit, each with a reason. And your first two moves if you get stuck are on\nit. You are not starting from a blank page. You are starting from a plan\nyou already made.”*</p>\n<p><strong>Instructor action: </strong>Circulate for 90 seconds. Read\nthe “if my network gets stuck” row on each Worksheet 4. Any student\nwhose row is blank or says “ask the teacher” gets a first move handed to\nthem right now, verbally: “If your loss chart is flat and high, your\nfirst move is the reset trick, then try ReLU with two hidden layers.”\nWrite the name of any such student on your own sheet; you will check on\nthem first in Studio Block A.</p>\n<h3 id=\"step-1.3-state-the-days-two-deliverables-3-min\"><strong>Step 1.3\n— State the day’s two deliverables (3 min)</strong></h3>\n<p><strong>Instructor action: </strong>Put these two lines on the board\nand leave them up all day.</p>\n<ul>\n<li><p><strong>Deliverable 1 — </strong>A working network you designed,\nwith at least three modifications logged (change, predict, observe,\nexplain).</p></li>\n<li><p><strong>Deliverable 2 — </strong>A 2–3 minute talk: here is what\nI tried, here is what I predicted, here is what happened, and here is\nwhy.</p></li>\n</ul>\n<p><strong>Say: </strong>“Two things leave this room finished today: a\nnetwork you built, and a two-to-three-minute explanation of one thing\nyou changed and why it worked. That’s the whole day. Both of them are\nthings you have already done — you just haven’t done them on your own\nyet. You will by three o’clock.”*</p>\n"}, {"id": "seg2", "kind": "segment", "num": 2, "title": "Segment 2 — Concept 1: Designing a Controlled Experiment (25 min)", "html": "<p><strong>Duration: </strong>25 minutes (0:10–0:35) | Type: Lecture +\nLive Modeling</p>\n<p><strong>Purpose: </strong>This is the first of the day’s two new\ncapstone competencies. It is not a new AI concept — it is the method\nthat turns yesterday’s cued modifications into a self-directed\nexperiment. Everything a student does in Studio Block A depends on\ngetting this right.</p>\n<h3 id=\"step-2.1-technical-definition-first-4-min\"><strong>Step 2.1 —\nTechnical definition first (4 min)</strong></h3>\n<p><strong>Instructor action: </strong>Write the definition on the board\nword-for-word before saying anything else, then read it.</p>\n<p><strong>Controlled experiment: </strong>a test in which you change\nexactly one thing, keep everything else the same, and write down what\nyou expect to happen before you run it — so that whatever changes in the\nresult can be blamed on the one thing you changed, and nothing else.</p>\n<p><strong>Say: </strong>“Every word of that matters. Change exactly one\nthing. Keep everything else the same. Write your prediction before you\nrun it. If you do all three, then when the result changes, you know why\n— because only one thing was different. If you change two things at\nonce, the experiment is broken before it starts, because you can never\nsay which of the two caused the result. This is the difference between\nan experiment and just clicking buttons.”*</p>\n<h3\nid=\"step-2.2-the-three-micro-steps-each-defined-before-use-6-min\"><strong>Step\n2.2 — The three micro-steps, each defined before use (6\nmin)</strong></h3>\n<p>Break the definition into three moves. Teach them in order, and name\neach one as students will use it on their Experiment Design Sheet.</p>\n<p><strong>Micro-step 1 — Name the one variable. </strong>A variable is\nthe single control you will change on this run — and only one. In the\nSAIL Architect Lab there are exactly three you may pick from: the\nActivation Function, the number of hidden layers, or the Learning Rate.\nYou choose one of the three for a given run. The other two do not\nmove.</p>\n<p><strong>Micro-step 2 — Fix the controls. </strong>To fix a control\nmeans to write down its current value and promise not to touch it this\nrun. Before you change your one variable, write down where the other two\ncontrols are set, so that if you get confused later you can put them\nback.</p>\n<p><strong>Micro-step 3 — Predict, then run. </strong>Write one sentence\nsaying what you expect the Training Loss chart and the Live Inference\nbars to do, and why, using a mechanism word — straight-line limit,\nbending capacity, or step size. Only then press TRAIN MODEL.</p>\n<p><strong>Say: </strong>“Notice these are the exact same three moves\nthat are on the board in the Standing Studio Procedure. Concept 1 is\njust the reason those five steps are in that order. One variable,\neverything else fixed, prediction before the run. Do that and you are\nrunning a real experiment. Skip any one of them and you are\nguessing.”*</p>\n<h3\nid=\"step-2.3-live-model-the-instructor-runs-one-controlled-experiment-out-loud-9-min\"><strong>Step\n2.3 — Live model: the instructor runs ONE controlled experiment out loud\n(9 min)</strong></h3>\n<p><strong>Instructor action: </strong>Do this at the projector, on your\nown gesture pair, thinking aloud. This is the single most important\nmodeling moment of the morning — students are about to copy exactly\nthis. Move slowly and narrate every micro-step by name.</p>\n<p>Run the experiment: change the Activation Function from ReLU to\nLinear, holding hidden layers and learning rate fixed. Narrate as\nfollows.</p>\n<p><strong>Say: </strong>“Micro-step one — name the one variable. Today\nI am changing the Activation Function, and only that. Micro-step two —\nfix the controls. Right now I have two hidden layers and a learning rate\nof 0.01. I am writing those down and I am not touching them. Micro-step\nthree — predict, then run. My prediction: with Linear activation, the\nnetwork can only make a straight-line rule, and telling my open hand\nfrom my fist needs a bent rule, so I expect the Training Loss chart to\nflatten higher than it did with ReLU, and the Live Inference bars to\nhover near fifty-fifty. My mechanism word is straight-line limit. Now —\nand only now — I press TRAIN MODEL.”*</p>\n<p><strong>Instructor action: </strong>Train. Let students watch the\nloss chart flatten high and the bars waver. Then say:</p>\n<p><strong>Say: </strong>“Look at that. Loss settled higher, bars near\nfifty-fifty. My prediction held, and I can say exactly why: I only\nchanged one thing, so the worse result has exactly one possible cause —\nthe Linear activation removed the network’s ability to bend. That\nsentence — ‘I changed one thing, here’s what happened, here’s the\nmechanism’ — is your whole job in Studio Block A, and it is your whole\npresentation this afternoon.”*</p>\n<p><strong>Instructor action: </strong>Flip the Activation Function back\nto ReLU (this also does the reset trick) and retrain once so the room\nends the demo on a working network, loss falling and bars confident.\nSay: “And back to ReLU — there’s the bend, there’s the confidence. One\nvariable, one conclusion.”</p>\n<h3 id=\"step-2.4-expected-student-responses\"><strong>Step 2.4 — Expected\nstudent responses</strong></h3>\n<ul>\n<li><p>Strong: students restate the three micro-steps in order and\ncorrectly identify that changing two controls at once would make the\nresult uninterpretable.</p></li>\n<li><p>Developing: students can say “change one thing” but forget the\n“write the prediction first” move, or cannot name a mechanism word.\nRedirect them to the board.</p></li>\n<li><p>Watch-for: a student who says “just try a bunch of settings and\nkeep the best one.” Name this directly — that finds a setting but\nproduces no explanation, and the explanation is half of today’s grade\nand the entire presentation.</p></li>\n</ul>\n<h3 id=\"two-checks-for-understanding-concept-1\"><strong>Two Checks for\nUnderstanding — Concept 1</strong></h3>\n<p><strong>CFU 1 (after Step 2.2 — the one-variable rule)</strong></p>\n<p><strong>Ask: </strong>A classmate wants to know if their network gets\nbetter, so on one run they switch to Linear AND drag the learning rate\nto maximum, then train once. What is wrong with that test, and how would\nyou fix it?</p>\n<p><strong>Proficient answer: </strong>They changed two things at once,\nso if the result changes they cannot tell whether the Linear activation\nor the learning rate caused it. Fix: change only one — test Linear with\nthe learning rate held where it was, then, on a separate run, test the\nlearning rate with activation held at ReLU.</p>\n<p><strong>Common wrong answer: </strong>“Nothing’s wrong, they still\ntrained it and got a result.”</p>\n<p><strong>Correction / redirect: </strong>A result you cannot explain\nis not a usable result today. The point of one-variable-at-a-time is\nthat the change becomes the explanation. Two variables, no\nexplanation.</p>\n<p><strong>CFU 2 (after Step 2.3 — prediction and\nmechanism)</strong></p>\n<p><strong>Ask: </strong>Before running a test where you add a third\nhidden layer, write a one-sentence prediction that names a mechanism\nword. What might it be?</p>\n<p><strong>Proficient answer: </strong>Accept any prediction that (a)\nstates an expected effect on loss or the inference bars and (b) uses a\nmechanism word. Example: “Adding a third layer gives the network more\nbending capacity, so I expect the loss to settle a little lower, though\nit may only help a little if my gestures don’t need it.”</p>\n<p><strong>Common wrong answer: </strong>“I predict it will get better.”\n(No mechanism, and “better” is not defined.)</p>\n<p><strong>Correction / redirect: </strong>“Better” how — lower loss,\nmore confident bars? And why — what does a layer add? Push for the\nmechanism word (bending capacity) and a measurable effect. This is\nexactly the sentence they’ll present this afternoon.</p>\n"}, {"id": "seg3", "kind": "segment", "num": 3, "title": "Segment 3: Break", "html": "<p><strong>Duration: </strong>5 minutes (0:35–0:40)</p>\n<p><strong>Say: </strong>“Five-minute break. When you come back, you\nbuild your own network. Have Worksheet 4 and your Experiment Design\nSheet out and ready. Be back in your seat at [state exact clock\ntime].”*</p>\n"}, {"id": "seg4", "kind": "segment", "num": 4, "title": "Segment 4: Studio Block A — Independent Build & Baseline (45 min)", "html": "<p><strong>Duration: </strong>45 minutes (0:40–1:25) | Type: Independent\nStudio</p>\n<p><strong>Purpose: </strong>Students execute their own plan: capture\ntheir data, establish a baseline, and run their first two controlled\nexperiments. This is the first extended stretch of the course with no\ninstructor-cued moves. Your job shifts from lecturer to floor coach —\nyou circulate, you do not present.</p>\n<h3 id=\"step-4.1-launch-the-studio-3-min\"><strong>Step 4.1 — Launch the\nstudio (3 min)</strong></h3>\n<p><strong>Instructor action: </strong>Start the projected countdown\ntimer at 45:00. Point to the Standing Studio Procedure on the board. Say\nthe following, then stop talking and let them work.</p>\n<p><strong>Say: </strong>“Forty-five minutes. Here is the order, and it\nis on your Experiment Design Sheet. First: open the lab, name your\nclasses, and capture your data — twenty to thirty varied frames per\nclass, moving a little each time. Second: train once with your starting\nsettings and write that down as your baseline — that is the number every\nchange gets compared to. Third: run your first modification from\nWorksheet 4, one variable, prediction first. Then your second. Every run\nis a full log row. I am coming around. When I stop at your station I am\ngoing to ask you one question: what is the one thing you changed, and\nwhat did you predict?”*</p>\n<h3\nid=\"step-4.2-the-three-studio-phases-with-checkpoints-posted-on-the-board\"><strong>Step\n4.2 — The three studio phases, with checkpoints (posted on the\nboard)</strong></h3>\n<p>Post these three phases and their target clock times so students can\nself-pace. Announce each checkpoint aloud when the timer hits it.</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Phase</strong></th>\n<th><strong>What students do</strong></th>\n<th><strong>Done by (of 45:00)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Capture &amp;</strong> Baseline**</td>\n<td>Name 2+ classes; capture 20–30 varied frames each; train once at\nstarting settings; record the baseline loss and inference\nconfidence.</td>\n<td>by 0:55 (first 15 min)</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Experiment 1</strong></td>\n<td>Run modification #1 from Worksheet 4: fix the other controls, write\nthe prediction, train, record observation and a mechanism-level\nwhy.</td>\n<td>by 1:10 (next 15 min)</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Experiment 2</strong></td>\n<td>Run modification #2: same discipline. If a run gets stuck, use the\ndiagnosis routine (Step 4.4) rather than waiting.</td>\n<td>by 1:25 (final 15 min)</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"step-4.3-instructor-circulation-script-what-to-say-at-each-station\"><strong>Step\n4.3 — Instructor circulation script (what to say at each\nstation)</strong></h3>\n<p>Circulate continuously. At each station, ask one diagnostic question\nand move on — do not solve the problem for the student. Use these exact\nprompts by situation.</p>\n<p><strong>If the student is capturing data: </strong>“Are your frames\nvaried — tilted, closer, farther — or all identical? Identical frames\nteach the network less.”</p>\n<p><strong>If the student has just trained: </strong>“What was your\nbaseline number, and is this run above it or below it?” Force the\ncomparison; a result with no baseline is not a result.</p>\n<p><strong>If the student is about to change a control: </strong>“What\nis the one thing you’re changing, and where is your prediction written?”\nIf the prediction isn’t written yet, wait there until it is.</p>\n<p><strong>If the student changed two things: </strong>“Which of the two\ncaused the change you’re seeing? You can’t know. Reset, and change them\none at a time.”</p>\n<p><strong>If the student says “it’s not working”: </strong>Do not look\nat their screen and fix it. Say: “Read me your Training Loss chart. Flat\nand high, or falling? What does the Standing Procedure say to do about\nflat and high?”</p>\n<h3\nid=\"step-4.4-the-stuck-run-diagnosis-routine-teach-this-once-aloud-at-15-minutes-in\"><strong>Step\n4.4 — The stuck-run diagnosis routine (teach this once, aloud, at ≈15\nminutes in)</strong></h3>\n<p><strong>Instructor action: </strong>About fifteen minutes in, the\nfirst stuck runs appear. Pause the room for 60 seconds and run this once\nfor everyone, then release them again.</p>\n<p><strong>Say: </strong>“Quick whole-room pause. Some of you have a\nTraining Loss chart that is flat and high and staying there. That is not\nthe network being slow — that is the network being stuck, and yesterday\nyou proved waiting longer does not fix stuck. Here is the routine, and\nit is on the board. One: is your Activation Function on Linear? If yes\nand your categories are shape-based, that’s your problem — straight-line\nlimit — switch to ReLU. Two: if it’s already ReLU, do the reset trick —\nflip the activation away and back — to get a fresh random start, and\ntrain again. Three: if it still won’t fall, your data may be too similar\nbetween classes — recapture with more contrast. Try those in order. Back\nto work.”*</p>\n<p><strong>Deliverable for Segment 4: </strong>Each student has captured\ntheir own data, recorded a baseline, and completed at least two full\nModification Log rows (change, predict, observe, why). Students who move\nfaster complete a third. A student with a baseline and zero completed\nrows at 1:25 is flagged for pairing in Segment 7.</p>\n"}, {"id": "seg5", "kind": "segment", "num": 5, "title": "Segment 5: Break", "html": "<p><strong>Duration: </strong>10 minutes (1:25–1:35)</p>\n<p><strong>Say: </strong>“Ten-minute break — the longer one. Leave your\nnetwork where it is; nothing you’ve trained will disappear. When you’re\nback, we learn the second half of today: how to explain what you did so\nthat anyone — your little brother, your grandmother — could follow it.\nBe back at [state exact clock time].”*</p>\n"}, {"id": "seg6", "kind": "segment", "num": 6, "title": "Segment 6 — Concept 2: Explaining It So Anyone Understands (20 min)", "html": "<p><strong>Duration: </strong>20 minutes (1:35–1:55) | Type: Lecture +\nLive Modeling</p>\n<p><strong>Purpose: </strong>The day’s second new capstone competency:\ntechnical communication. Students already have the content — a completed\nlog row. Concept 2 teaches them to convert that written row into a clear\nspoken explanation for a listener who never took the course. This is\nwhat the Showcase grades.</p>\n<h3 id=\"step-6.1-technical-definition-first-3-min\"><strong>Step 6.1 —\nTechnical definition first (3 min)</strong></h3>\n<p><strong>Technical explanation: </strong>a short spoken account of\nsomething you did, built in a fixed order — what you changed, what you\nexpected, what happened, and why — in which every specialized word is\ndefined the instant it is first used, so that a listener who has never\nseen the tool can still follow the reasoning.</p>\n<p><strong>Say: </strong>“You already wrote this four times yesterday\nand at least twice this morning. A log row is a written technical\nexplanation. All Concept 2 does is turn it from something you wrote for\nyourself into something you say to someone else — and the someone else\nis the hard part, because they don’t know what a weighted sum is unless\nyou tell them.”*</p>\n<h3\nid=\"step-6.2-the-four-part-spoken-frame-defined-in-order-6-min\"><strong>Step\n6.2 — The four-part spoken frame, defined in order (6 min)</strong></h3>\n<p>This is the same four columns as the Modification Log, spoken. Put\nthe frame on the board and keep it up through the Showcase.</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Part</strong></th>\n<th><strong>What you say</strong></th>\n<th><strong>Sounds like</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1. The change</strong></td>\n<td>Name the one thing you changed, in plain words. Define the term as\nyou say it.</td>\n<td>“I switched the activation function — the rule that lets the network\nbend — from ReLU to Linear.”</td>\n</tr>\n<tr class=\"even\">\n<td><strong>2. The prediction</strong></td>\n<td>Say what you expected before you ran it, and why.</td>\n<td>“I expected it to get worse, because Linear can only draw a\nstraight-line rule.”</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>3. What happened</strong></td>\n<td>Report the result you actually saw — the loss chart and the\nconfidence bars.</td>\n<td>“The loss flattened higher and the bars dropped toward\nfifty-fifty.”</td>\n</tr>\n<tr class=\"even\">\n<td><strong>4. Why (mechanism)</strong></td>\n<td>Explain the cause with a mechanism word. This is the part that turns\na demo into an explanation.</td>\n<td>“Telling my two hand shapes apart needs a bent rule, and a straight\nline can’t bend.”</td>\n</tr>\n</tbody>\n</table>\n<p><strong>The define-as-you-go rule: </strong>The listener does not\nknow the course vocabulary. Every specialized word — activation\nfunction, ReLU, loss, weighted sum — gets a three-word plain-language\ngloss the first time it is spoken, exactly as in the examples above.\nThis is the same norm SAIL used on Day 1 (“every definition before I use\nthe term”), now performed by the student.</p>\n<h3\nid=\"step-6.3-live-model-a-good-talk-and-a-bad-talk-8-min\"><strong>Step\n6.3 — Live model: a good talk and a bad talk (8 min)</strong></h3>\n<p><strong>Instructor action: </strong>Deliver two 30-second versions of\nthe SAME result out loud. Do the weak one first, then the strong one, so\nthe contrast lands. Ask the room to spot the difference.</p>\n<p><strong>Weak version (deliver, then critique): </strong>“So I like\nchanged the activation thing to Linear and it got worse, the numbers\nwent up, so yeah ReLU is better I guess.”</p>\n<p><strong>Say: </strong>“What was missing? No prediction — I never said\nwhat I expected. No definition — I said ‘the activation thing’ and never\ntold you what it is. And no mechanism — I said it got worse but never\nwhy. ‘ReLU is better I guess’ is not an explanation.”*</p>\n<p><strong>Strong version (deliver, then label the four parts):\n</strong>“I changed one thing: the activation function — that’s the rule\nthat lets the network bend — from ReLU to Linear. I predicted it would\nget worse, because Linear can only make a straight-line rule. And it\ndid: the loss settled higher and the confidence bars fell toward\nfifty-fifty. The reason is that telling my open hand from my fist needs\na bent boundary, and a straight line can’t bend — no matter how long it\ntrains.”</p>\n<p><strong>Say: </strong>“Same result, both times. The difference is the\nfour parts — change, prediction, what happened, why — and one defined\nword. That strong version is thirty seconds. Yours will be two to three\nminutes because you’ll walk us through your data and more than one\nchange, but every piece of it is built from that same four-part\nframe.”*</p>\n<h3 id=\"step-6.4-expected-student-responses\"><strong>Step 6.4 — Expected\nstudent responses</strong></h3>\n<ul>\n<li><p>Strong: students name all three things missing from the weak talk\n(prediction, definition, mechanism) without prompting.</p></li>\n<li><p>Developing: students catch “it didn’t say why” but miss the\nundefined jargon. Point explicitly at “the activation thing.”</p></li>\n<li><p>Watch-for: a student who thinks the strong version is “too much\ntalking.” Reframe: the four parts are not padding — drop any one and the\nlistener is lost. Confidence without explanation is exactly what Day 4\nwarned about, now in spoken form.</p></li>\n</ul>\n<h3 id=\"two-checks-for-understanding-concept-2\"><strong>Two Checks for\nUnderstanding — Concept 2</strong></h3>\n<p><strong>CFU 3 (after Step 6.2 — the four-part frame)</strong></p>\n<p><strong>Ask: </strong>A presenter says: “I added a hidden layer and\nthe loss went down.” Which of the four parts did they give, and which\nare missing?</p>\n<p><strong>Proficient answer: </strong>They gave Part 1 (the change) and\nPart 3 (what happened). Missing: Part 2 (the prediction — what they\nexpected before running) and Part 4 (the mechanism why — e.g., “the\nextra layer gave the network more bending capacity”).</p>\n<p><strong>Common wrong answer: </strong>“They did all of it, they said\nwhat they changed and the result.”</p>\n<p><strong>Correction / redirect: </strong>The change and the result are\nonly two of the four parts. Without the prediction and the mechanism,\nthe audience learns what happened but not whether the presenter\nunderstood it — and understanding is what we’re grading.</p>\n<p><strong>CFU 4 (after Step 6.3 — define-as-you-go)</strong></p>\n<p><strong>Ask: </strong>You’re about to say the word “loss” to an\naudience that never took this course. Give the three-word gloss you’ll\nsay right after it.</p>\n<p><strong>Proficient answer: </strong>Accept any brief, correct\nplain-language gloss, e.g. “loss — how wrong the model is,” or “loss, a\nscore of how far off it is (lower is better).” The gloss must convey\nthat lower means better or that it measures error.</p>\n<p><strong>Common wrong answer: </strong>“I’d just say loss, they can\nfigure it out.”</p>\n<p><strong>Correction / redirect: </strong>They can’t — they’ve never\nheard the word used this way. One short gloss the first time is the\nwhole difference between a talk people follow and a talk people nod\nthrough. Define it once, then use it freely.</p>\n"}, {"id": "seg7", "kind": "segment", "num": 7, "title": "Segment 7: Studio Block B — Finalize Result & Build the Talk (30 min)", "html": "<p><strong>Duration: </strong>30 minutes (1:55–2:25) | Type: Independent\nStudio</p>\n<p><strong>Purpose: </strong>Students lock in their best configuration,\nrun one final experiment if they have time, choose their single\nstrongest log row, and turn it into a rehearsed 2–3 minute talk using\nthe four-part frame. They finish this block ready to present.</p>\n<h3 id=\"step-7.1-launch-2-min\"><strong>Step 7.1 — Launch (2\nmin)</strong></h3>\n<p><strong>Instructor action: </strong>Reset the projected timer to\n30:00. Say the following.</p>\n<p><strong>Say: </strong>“Thirty minutes, in three parts. First ten:\nfinish your experiments — get your network as confident as you\nreasonably can, and if you have a third modification in you, run it now\nwith a written prediction. Next ten: pick your single best log row — the\none where you understand the why most clearly — and build it into the\nfour-part talk on your Presentation Builder. Last ten: rehearse it out\nloud with your partner, once each, timed. Two to three minutes.\nGo.”*</p>\n<h3 id=\"step-7.2-the-three-phases-posted\"><strong>Step 7.2 — The three\nphases, posted</strong></h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Phase</strong></th>\n<th><strong>What students do</strong></th>\n<th><strong>Done by (of 30:00)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Finalize</strong></td>\n<td>Reach best confidence; optionally run a final logged modification;\nconfirm at least three total log rows are complete.</td>\n<td>by 2:05</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Build the talk</strong></td>\n<td>Choose the single strongest log row; fill the Presentation Builder\nusing the four-part frame; write the plain-language gloss for each\nspecialized word.</td>\n<td>by 2:15</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Rehearse</strong></td>\n<td>Deliver the talk aloud to a partner once, timed to 2–3 min; partner\nchecks off all four parts are present before switching.</td>\n<td>by 2:25</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"step-7.3-instructor-circulation-during-block-b\"><strong>Step 7.3\n— Instructor circulation during Block B</strong></h3>\n<p>Your prompts shift from building to explaining. At each station:</p>\n<p><strong>During Finalize: </strong>“Which of your runs are you\nproudest of understanding — not the one with the lowest loss, the one\nwhere you can best say why?” That is the row they should present.</p>\n<p><strong>During Build: </strong>“Read me your Part 4 — your why. Does\nit have a mechanism word?” If it doesn’t, they are not ready to present;\nstay until it does.</p>\n<p><strong>During Rehearse: </strong>Listen to one talk in full per pair\nif you can. Time it. If it runs under a minute, it’s missing parts; if\nover four, it’s including every run instead of the strongest one.</p>\n<p><strong>Support flag from Segment 4: </strong>Go first to any student\nflagged in Studio Block A. Hand them their strongest row — even if it’s\nthe baseline versus one change — and coach the four-part frame directly.\nEvery student presents something; nobody is exempted.</p>\n<h3 id=\"two-anticipated-misconceptions-in-block-b\"><strong>Two\nanticipated misconceptions in Block B</strong></h3>\n<ul>\n<li><p><strong>“The run with the lowest loss is the one I should\npresent.” </strong>Not necessarily. The best presentation is the run the\nstudent understands most clearly, because the grade is the explanation,\nnot the number. Redirect them to the row with the strongest\n‘why.’</p></li>\n<li><p><strong>“I should present everything I did.” </strong>No — one\nlog row, done well, in the four-part frame. A tour of every click is\nexactly the weak talk from Step 6.3, stretched to three\nminutes.</p></li>\n</ul>\n<p><strong>Deliverable for Segment 7: </strong>Every student has a\ncompleted Presentation Builder for one log row, with all four parts\nfilled and each specialized word given a plain-language gloss, and has\nrehearsed it aloud once, timed. Nobody enters the Showcase without a\nrehearsed talk.</p>\n"}, {"id": "seg8", "kind": "segment", "num": 8, "title": "Segment 8: Showcase — Presentations & Peer Feedback (20 min)", "html": "<p><strong>Duration: </strong>20 minutes (2:25–2:45) | Type: Capstone /\nShowcase</p>\n<p><strong>Purpose: </strong>This is the culminating activity of the\nweek. Each student delivers their rehearsed 2–3 minute talk; peers\nevaluate it against a fixed three-point standard and give one concrete\npiece of feedback. The Showcase is where independent build (Concept 1)\nand technical communication (Concept 2) come together as visible\nmastery.</p>\n<h3 id=\"step-8.1-set-the-format-and-the-standard-3-min\"><strong>Step 8.1\n— Set the format and the standard (3 min)</strong></h3>\n<p><strong>Instructor action: </strong>Because 20 minutes cannot fit a\nfull class of individual 3-minute talks, use the pod format below — it\ngives every student a real audience and keeps the whole room\naccountable. State the plan and the standard, then start.</p>\n<p><strong>The pod format: </strong>Students present within their table\npod (3–4 students). Every student presents to their pod. While one\npresents, the others in the pod are the audience and complete one\nPeer-Feedback Card each. The instructor rotates between pods, listening\nto at least one full talk per pod and spot-checking the standard. After\nthe pod round, the instructor calls on two or three students identified\nwhile circulating to deliver their talk to the whole room.</p>\n<p><strong>Instructor action: </strong>Put the three-point standard on\nthe board. Read it aloud; this is the exact rubric both peers and you\nwill use.</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>#</strong></th>\n<th><strong>The presenter must…</strong></th>\n<th><strong>A listener can check by asking…</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1</strong></td>\n<td>Name one specific change (one variable).</td>\n<td>“What was the single thing they changed?” Answerable in one phrase =\npass.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>2</strong></td>\n<td>State a real prediction made before the run.</td>\n<td>“What did they say they expected, and why?” A why is required.</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>3</strong></td>\n<td>Explain the result with a mechanism.</td>\n<td>“Did they say WHY it happened — straight-line limit, bending\ncapacity, or step size — not just that it happened?”</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Say: </strong>“Three things. One: they named one specific\nchange. Two: they gave a real prediction, made before the run, with a\nreason. Three: they explained why the result happened with a mechanism\nword. If all three are there, that talk passes. Your Peer-Feedback Card\nasks you to check those three boxes and write one concrete thing — not\n‘good job,’ but something like ‘you nailed the why’ or ‘I didn’t catch\nyour prediction.’”*</p>\n<h3 id=\"step-8.2-the-pod-presentation-round-12-min\"><strong>Step 8.2 —\nThe pod presentation round (12 min)</strong></h3>\n<p><strong>Instructor action: </strong>Start the timer at 12:00. In a\npod of four, that is about three minutes per presenter including a\n30-second feedback beat. Announce the rotation rule so pods\nself-manage.</p>\n<p><strong>Say: </strong>“Pods, you run yourselves. Presenter one goes\nnow — two to three minutes. When they finish, take thirty seconds: each\nlistener says the one concrete thing on their card, out loud, to the\npresenter. Then rotate. Presenter two. I’m coming around to every pod.\nGo.”*</p>\n<p><strong>Instructor action: </strong>Rotate continuously. In each pod,\nlisten to at least one full talk and silently score it against the\nthree-point standard on your own copy. Note one strong presenter per pod\nfor the whole-room round. If a pod finishes early, have them re-run the\nweakest talk with the fix the feedback identified — a second attempt is\nwhere the learning consolidates.</p>\n<p><strong>Instructor scoring during the round: </strong>Score each talk\nyou hear as Proficient (all three standard points present), Developing\n(two present), or Needs support (one or none). This score is the\nstudent’s Segment 8 assessment — see the rubric in Segment 9. You do not\nneed to hear every talk in full; the pod feedback cards cover the rest,\nand you collect those.</p>\n<h3 id=\"step-8.3-whole-room-spotlight-5-min\"><strong>Step 8.3 —\nWhole-room spotlight (5 min)</strong></h3>\n<p><strong>Instructor action: </strong>Call the two or three presenters\nyou flagged. Each delivers to the whole room. After each, ask the room\none question against the standard, then affirm.</p>\n<p><strong>Say: </strong>“Room, you just heard [name]. Standard point\nthree — did they give a mechanism, an actual why, not just ‘it got\nbetter’? [Take one answer.] They did — [restate their mechanism in one\nsentence]. That is exactly the bar. That is a person who did not just\nclick buttons; they ran an experiment and can tell you what it\nmeans.”*</p>\n<p><strong>Deliverable for Segment 8: </strong>Every student has\ndelivered their talk at least once to a real audience and has both given\nand received peer feedback on the three-point standard. Collect the\nPeer-Feedback Cards; they are the record that every student\npresented.</p>\n<h3\nid=\"anticipated-showcase-problems-and-exact-fixes\"><strong>Anticipated\nShowcase problems and exact fixes</strong></h3>\n<ul>\n<li><p><strong>A student freezes or won’t present. </strong>Do not skip\nthem. Shrink the ask: “Just tell your pod the one thing you changed and\nwhat happened.” Two of the three points is a passing floor for a nervous\nfirst-time presenter; the goal today is that everyone speaks.</p></li>\n<li><p><strong>A talk is all jargon, no definitions. </strong>After it,\nmodel the fix in one line: “Great content — now define ‘activation\nfunction’ for us in three words.” Have them redo just that sentence.\nThis is Concept 2 landing in real time.</p></li>\n<li><p><strong>A pod runs out of talks early. </strong>Assign the\nre-run: the weakest talk in the pod goes again, applying the one\nconcrete piece of feedback it received. A second attempt with a specific\nfix is the most valuable use of extra pod time.</p></li>\n<li><p><strong>A student presents the lowest-loss run but can’t say why\nit worked. </strong>This is the exact failure the whole week guarded\nagainst. Ask: “Which of your runs can you explain best?” and have them\npresent that one instead, even if its loss is higher. The explanation is\nthe deliverable.</p></li>\n</ul>\n"}, {"id": "seg9", "kind": "segment", "num": 9, "title": "Segment 9: Mini-Assessment, Week Synthesis & Wrap-Up (15 min)", "html": "<p><strong>Duration: </strong>15 minutes (2:45–3:00) | Type:\nAssessment</p>\n<p><strong>Materials needed: </strong>Day 5 Mini-Assessment (in student\npacket). Devices closed. Notes closed. This segment must start no later\nthan 2:45.</p>\n<h3 id=\"step-9.1-mini-assessment-8-min\"><strong>Step 9.1 —\nMini-Assessment (8 min)</strong></h3>\n<p><strong>Instructions given to students, exactly as written:\n</strong>Answer all 8 questions on your own. You have 8 minutes. Devices\nclosed, notes closed. Show your work for any calculation question.</p>\n<p><strong>Question 1 </strong>(Conceptual) *What are the three rules of\na controlled experiment in the SAIL Architect Lab? (One variable;\neverything else fixed; and…?)</p>\n<p><strong>Question 2 </strong>(Applied) *A classmate switches to Linear\nactivation and raises the learning rate at the same time, then trains\nonce. Why can’t they conclude anything from this run? State the fix.</p>\n<p><strong>Question 3 </strong>(Applied / Calculation) *A tiny model\npredicts 3, 7, and 8. The correct answers were 4, 7, and 10. Calculate\nthe loss using the error-square-average method. Show your work.</p>\n<p><strong>Question 4 </strong>(Conceptual) *Your Training Loss chart\nhas been flat and high for a long time. Name one specific thing you\nshould change, and say why waiting longer will not help.</p>\n<p><strong>Question 5 </strong>(Conceptual) *Name the four parts of a\ngood spoken technical explanation, in order.</p>\n<p><strong>Question 6 </strong>(Conceptual) *You are about to say the\nword “ReLU” to someone who never took this course. Write the short\nplain-language definition you would say right after it.</p>\n<p><strong>Question 7 </strong>(Conceptual) *A network is trained only\non ReLU activation with two hidden layers. You switch it to Linear and\nit can no longer tell your two hand shapes apart. Explain why, using the\nword “straight.”</p>\n<p><strong>Question 8 </strong>(Conceptual) *Your network reaches a very\nlow loss and is extremely confident on your own captured pictures.\nExplain in two or three sentences why that alone does not make it a\ngood, fair model for everyone.</p>\n<h3 id=\"answer-key\"><strong>Answer Key</strong></h3>\n<p><strong>1. </strong>One variable changed; all other controls held\nfixed; and a prediction written before the run.* All three required for\nfull credit. Missing the “prediction first” clause is the most common\ngap — 0.5.*</p>\n<p><strong>2. </strong>They changed two things at once, so any change in\nthe result could be caused by either the Linear activation or the higher\nlearning rate — the run cannot say which. Fix: change only one variable\nper run (test Linear alone, then the learning rate alone, each with the\nother held fixed).* Both the reason and the fix are required.*</p>\n<p><strong>3. </strong>Errors: 3−4 = −1; 7−7 = 0; 8−10 = −2. Squared: 1,\n0, 4. Sum = 5. Loss = 5 ÷ 3 = 1.67 (accept 5/3 or ≈1.7).* A student who\naverages the raw errors and gets −1 has skipped the squaring step — this\nis a 0 and is the single most diagnostic error on the assessment.*</p>\n<p><strong>4. </strong>Change one of: the Activation Function (e.g.,\nReLU if it was on Linear), the number of hidden layers, or the Learning\nRate; or recapture more varied/contrasting data. Waiting will not help\nbecause a flat, high loss means the network is stuck, not slow —\nadditional training epochs do not fix a structural problem.* Any one\nspecific change plus the “stuck, not slow” reasoning earns full\ncredit.*</p>\n<p><strong>5. </strong>(1) The change — the one thing you changed. (2)\nThe prediction — what you expected before running, and why. (3) What\nhappened — the actual result. (4) The why — the mechanism that caused\nit.* All four, in order, for full credit.*</p>\n<p><strong>6. </strong>Accept any brief correct gloss, e.g. “ReLU — the\nrule that lets a neuron pass a value through if it’s positive and output\nzero if it’s negative,” or more simply “the on/off rule that lets the\nnetwork bend.”* The gloss must convey either the positive/zero behavior\nor the “lets it bend” role. Reward brevity and plain language.*</p>\n<p><strong>7. </strong>With Linear activation the network can only ever\nproduce a straight-line rule between the two classes’ pixel patterns,\nand stacking more Linear layers still only produces a straight-line\nrule. Telling two hand shapes apart needs a bent boundary, so a straight\nline cannot do it no matter how long it trains.* The causal chain from\n“no bending” to “straight-line rule only” is what earns credit. This is\nthe load-bearing question — see notes below.*</p>\n<p><strong>8. </strong>A low loss and high confidence only show that the\nmodel fits the exact pictures it was trained on, from the people who\nsupplied them. The network minimizes loss against that data alone and\nhas no way to know whether the data represents everyone who might use\nit. If the captured pictures were narrow — one person, one lighting\nsetup, one angle — the model would learn that narrowness perfectly and\nstill look confident. A low loss means a model that fits its data, not a\nmodel that is correct or fair.* Accept any answer that separates “fits\nthe training data” from “is a good, fair model.” This is the week’s\ncentral lesson.*</p>\n<h3 id=\"scoring-guidance\"><strong>Scoring guidance</strong></h3>\n<p>Score each of the 8 questions as 1 point for a fully correct answer,\n0.5 for a directionally correct answer missing a required part, and 0\nfor an incorrect or blank answer.</p>\n<ul>\n<li><p>A score of 6/8 or higher indicates the student met the week’s\nlearning outcomes.</p></li>\n<li><p>Question 3 (the only calculation) and Question 7 (the\nstraight-line explanation) are the two diagnostic questions. A student\nwho misses both has the mechanics without the meaning, even if the rest\nis correct.</p></li>\n<li><p>Question 8 is intentionally the hardest and is the week’s thesis.\nReward any answer that recognizes the model is faithful to its data\nrather than to the truth; do not penalize imprecise wording.</p></li>\n</ul>\n<h3 id=\"step-9.2-week-synthesis-and-wrap-up-7-min\"><strong>Step 9.2 —\nWeek synthesis and wrap-up (7 min)</strong></h3>\n<p><strong>Instructor action: </strong>Close the week. Point at the\nboard where Monday’s y = mx + b and today’s live classifier both live.\nDeliver this.</p>\n<p><strong>Say: </strong>“Five days ago, some of you had never written y\nequals m x plus b with any idea what it was for. Today you designed your\nown experiment, on a network you built, trained on data you captured\nwith your own hands, and you stood up and explained to other people what\nyou changed and why it worked. Nobody handed you the answer today. You\nran it.”*</p>\n<p><strong>Say: </strong>“And here is the one sentence to carry out of\nthis room, because it is the most important thing in the whole week: a\nlow loss does not mean a good model — it means a model that fits the\ndata it was given. You didn’t take my word for that. You built the\nevidence yourself. The network you trained had no opinions and no goals.\nIt had one number, and it made that number smaller using exactly the\npictures you gave it and nobody else’s. That is what every AI system you\nwill ever use is doing — the ones with billions of weights are doing the\nsame four steps, just more times, on more data. You now know what is\ninside the box, and you know the one question to always ask about it:\nwhat data was it given, and who wasn’t in it?”*</p>\n<p><strong>Instructor action: </strong>Collect the Day 5 Mini-Assessment\nand the Peer-Feedback Cards. Students keep everything else. Thank the\ngroup and close. There is no homework — the course is complete.</p>\n"}, {"id": "gen6teachernotesoperational", "kind": "general", "num": null, "title": "6. Teacher Notes (Operational Clarity)", "html": "<h3 id=\"what-to-watch-for-in-student-confusion\"><strong>What to watch\nfor in student confusion</strong></h3>\n<ul>\n<li><p>During Segment 2 and all of Studio Block A, watch for students\nchanging two controls between runs. This is the single most common error\nof the day and it silently destroys the experiment. Every time you see\nit, name it and require a reset before the next run — do not let a\ntwo-variable run stand as evidence for anything.</p></li>\n<li><p>During both Studio Blocks, watch for students chasing the lowest\nloss number instead of the clearest explanation. A student optimizing\nthe number will present a run they cannot explain. Redirect early and\noften: the grade is the why, not the number.</p></li>\n<li><p>During Segment 6 and the Showcase, watch for undefined jargon. A\nstudent who says “activation function” without a gloss has content but\nnot communication. Catch it in rehearsal (Segment 7), not for the first\ntime in front of the room.</p></li>\n</ul>\n<h3 id=\"when-to-slow-down\"><strong>When to slow down</strong></h3>\n<ul>\n<li><p>If, at the Step 4.4 whole-room pause, most of the room has a\nflat, high loss chart, do not release them back to independent work yet.\nRe-run the diagnosis routine once more, slowly, on the projector with\nyour own network, before letting them continue — a room full of stuck\nnetworks with no diagnosis will waste the rest of Studio Block\nA.</p></li>\n<li><p>If, during CFU 3 or CFU 4 in Segment 6, most of the room cannot\nname the missing parts of a weak talk, do not start Studio Block B.\nSpend three extra minutes delivering one more weak/strong contrast pair,\ntaking the time from Step 7.1’s launch rather than from\nrehearsal.</p></li>\n</ul>\n<h3 id=\"what-not-to-skip\"><strong>What NOT to skip</strong></h3>\n<ul>\n<li><p>Do not skip the Segment 2 live model (Step 2.3). Students imitate\nexactly what they see modeled; a described experiment they did not watch\nyou run produces button-clicking in Studio Block A. The live, narrated,\none-variable run is the load-bearing demonstration of the\nmorning.</p></li>\n<li><p>Do not skip the Segment 7 rehearsal phase. A talk delivered for\nthe first time in the Showcase is a talk that has not been checked\nagainst the four-part frame. The timed partner rehearsal is what\nguarantees every student walks into the Showcase with a talk that\nactually contains all four parts.</p></li>\n<li><p>Do not skip the Step 9.2 “what data was it given, and who wasn’t\nin it” close. It is the sentence the entire five-day scaffold exists to\nearn, and it is the one idea students should be able to state a year\nfrom now.</p></li>\n</ul>\n<h3 id=\"time-management-warnings\"><strong>Time-management\nwarnings</strong></h3>\n<ul>\n<li><p>The two Studio Blocks (Segments 4 and 7) are the flex in the day.\nIf the morning runs long, recover time by trimming Studio Block A’s\nthird-experiment window — never by cutting the Segment 2 model or the\nSegment 6 frame, which are what make the studio time\nproductive.</p></li>\n<li><p>The Showcase (Segment 8) must start by 2:25 to protect a full\n15-minute assessment block. If Studio Block B runs over, cut the\noptional final experiment (Step 7.2 “Finalize”), not the rehearsal — an\nunrehearsed showcase is worse than one fewer experiment.</p></li>\n<li><p>Segment 9 must start no later than 2:45. If the day is behind at\nthe Showcase, shorten the whole-room spotlight (Step 8.3) to a single\npresenter rather than borrowing from the assessment.</p></li>\n</ul>\n<h3 id=\"differentiation\"><strong>Differentiation</strong></h3>\n<ul>\n<li><p><strong>Students needing support: </strong>Hand
