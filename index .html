"SEGMENT 5", "title": "Predict-Then-Test: Moving the Weight Slider", "section": "seg5"}, {"n": 16, "label": "SEGMENT 5", "title": "Predict-Then-Test: Moving the Bias Slider", "section": "seg5"}, {"n": 17, "label": "SEGMENT 5", "title": "Fitting a Line to Data Set A", "section": "seg5"}, {"n": 18, "label": "SEGMENT 5", "title": "Class Check: Comparing Fitted Values", "section": "seg5"}, {"n": 19, "label": "SEGMENT 6", "title": "10:00", "section": "break6"}, {"n": 20, "label": "SEGMENT 7", "title": "Two Definitions Before We Test Anything", "section": "seg7"}, {"n": 21, "label": "SEGMENT 7 · WORKED EXAMPLE 3", "title": "Trying to Fit a Straight Line to Curved Data", "section": "seg7"}, {"n": 22, "label": "SEGMENT 7", "title": "A single weighted sum can only ever draw", "section": "seg7"}, {"n": 23, "label": "SEGMENT 7", "title": "Linear or Nonlinear?", "section": "seg7"}, {"n": 24, "label": "SEGMENT 7", "title": "Linear or Nonlinear? - Answers", "section": "seg7"}, {"n": 25, "label": "SEGMENT 8", "title": "Same Math, New Name - And a Discovery", "section": "seg8"}, {"n": 26, "label": "SEGMENT 8", "title": "Preview: What a Single Weighted Sum Cannot Do", "section": "seg8"}, {"n": 27, "label": "SEGMENT 9", "title": "Mini-Assessment - 8 Questions", "section": "assessment"}, {"n": 28, "label": null, "title": "Mini-Assessment - Answers", "section": "assessment"}, {"n": 29, "label": "SEGMENT 9", "title": "Common Misconceptions to Watch For", "section": "misconceptions"}, {"n": 30, "label": "END OF DAY 2", "title": "You Built the Model With Your Own", "section": "seg9"}], "sections": [{"id": "overview", "kind": "general", "num": null, "title": "Overview", "html": "<p><strong>SAIL — Day 2 Instructional Module Student AI Lab</strong></p>\n<p><strong>STUDENT AI LAB (SAIL)</strong></p>\n<p><em>Day 2: The Linear Prediction Model - Slope, Intercept, and\nWeighted Sums in Desmos</em></p>\n<p>Complete Instructional Module - Instructor Script, Student\nActivities, and Assessment</p>\n<p><strong>Total instructional time: </strong>180 minutes (3 hours)</p>\n<p><strong>Audience: </strong>4-H participants, ages 14-18. Students\nhave completed Day 1 of SAIL and possess only the knowledge established\nthere.</p>\n<p><strong>Prerequisite materials: </strong>Completed Day 1 module (AI\ndefinition, data/input/output vocabulary, AI ethics basics,\nslope-intercept algebra). No knowledge beyond Day 1 is assumed.</p>\n<p><strong>Title: </strong>Day 2 - The Linear Prediction Model: Slope,\nIntercept, and Weighted Sums in Desmos</p>\n<h3 id=\"overview\">Overview</h3>\n<p>Day 1 ended with students watching a line move on a screen, without\ntouching it themselves, and calculating y = mx + b by hand on paper. Day\n2 closes that gap. Students will build their own linear prediction model\nin Desmos, using sliders to control the same slope and intercept they\ncalculated by hand on Day 1, and will watch their predictions change in\nreal time as they move those sliders. Today also introduces the idea of\na weighted sum, which is the exact same calculation as y = mx + b, but\nrenamed and reframed using the vocabulary that AI systems actually use:\nweight (w) in place of slope (m), and the same bias (b) in place of\nintercept. This is not a new skill - it is a new name for a skill\nstudents already have. By the end of today, students will have plotted\nreal data points, built a line that fits those points using\nslider-controlled weight and bias, predicted what would happen to that\nline before moving each slider, and compared a straight-line (linear)\nrelationship to a curved (nonlinear) one - seeing for the first time\nthat a single straight line cannot fit every kind of pattern. That last\nobservation is the deliberate seed for Day 3, when students will learn\nwhy neural networks add multiple layers and activation functions\nspecifically to handle the nonlinear patterns a single line cannot.</p>\n"}, {"id": "objectives", "kind": "general", "num": null, "title": "2. Learning Objectives (Measurable)", "html": "<p>By the end of Day 2, students will be able to:</p>\n<ul>\n<li><p><strong>Define </strong>a weighted sum as the calculation w × x +\nb, and explain that this is the same structure as y = mx + b with new\nnames for the same two parts.</p></li>\n<li><p><strong>Identify </strong>the weight and bias in a given linear\nmodel and state which one controls the tilt of the line and which one\ncontrols its starting height.</p></li>\n<li><p><strong>Plot </strong>a set of given data points on a coordinate\ngrid in Desmos and visually judge whether they form a roughly\nstraight-line pattern.</p></li>\n<li><p><strong>Build </strong>a working linear model in Desmos using\nslider-controlled weight and bias, and adjust that model so its line\npasses as closely as possible through a set of plotted data\npoints.</p></li>\n<li><p><strong>Predict </strong>in writing, before testing, how a\nspecific change to the weight or bias slider will change the line, then\nverify the prediction by moving the slider.</p></li>\n<li><p><strong>Calculate </strong>the weighted-sum output of a model by\nhand for a given input, weight, and bias, and verify that answer using\nthe Desmos model.</p></li>\n<li><p><strong>Distinguish </strong>between a linear relationship and a\nnonlinear relationship when shown two data sets, and explain in one\nsentence why a single straight line cannot fit a nonlinear data set\nwell.</p></li>\n<li><p><strong>Explain </strong>why a model with a poor fit (large\ndistance between the line and the data points) is a less useful\nprediction tool than a model with a good fit, using the language of\ninput, output, and prediction from Day 1.</p></li>\n</ul>\n"}, {"id": "gen3connectiontoday1", "kind": "general", "num": null, "title": "3. Connection to Day 1", "html": "<h3\nid=\"skills-students-already-possess-established-on-day-1-not-retaught-today\">Skills\nstudents already possess (established on Day 1, not retaught today)</h3>\n<ul>\n<li><p>The two-part AI definition and the AI-vs.-rule-based test (used\nonly briefly today, in the framing of Segment 1, not retaught).</p></li>\n<li><p>The three-part vocabulary: data (what a system learned from),\ninput (what you give it right now), and output (what it gives back right\nnow).</p></li>\n<li><p>Passive, instructor-led exposure to a linear regression\nscatterplot and line (<a href=\"https://mlu-explain.github.io\" target=\"_blank\" rel=\"noopener\">mlu-explain.github.io</a>), including informal first\nexposure to the words “slope” and “intercept” as the line’s tilt and\nwhere it crosses the vertical axis.</p></li>\n<li><p>Full command of slope-intercept form: y = mx + b, with m defined\nas slope, b defined as intercept, x as input, y as output, and the\nability to calculate y by hand given m, b, and x, using the explicit\nmultiply-then-add step order.</p></li>\n<li><p>The habit of writing a prediction before calculating, practiced\nin Day 1’s “Predict Before You Calculate” worksheet.</p></li>\n<li><p>Basic AI ethics vocabulary (bias, data privacy, automated\ndecision-making), which is not used again today but will return later in\nthe course.</p></li>\n</ul>\n<h3 id=\"brief-review-plan-10-minutes-segment-1\">Brief review plan (10\nminutes, Segment 1)</h3>\n<p>Day 2 opens with a 10-minute review, not a reteach. The review is\nrestricted to exactly the three things today’s new content depends on:\n(1) the meaning of slope and intercept in y = mx + b, (2) the ability to\ncalculate y given m, b, and x, and (3) the predict-before-calculating\nhabit. The AI definition, the AI-vs.-rule-based test, and the ethics\nvocabulary are not reviewed today, because no new content in Day 2\ndepends on them.</p>\n<h3 id=\"how-todays-lesson-builds-on-that-foundation\">How today’s lesson\nbuilds on that foundation</h3>\n<p>Day 1 was entirely paper-and-projector: students calculated\nslope-intercept equations by hand and watched an instructor move a line\non a shared screen, but never touched a model themselves. Day 2 is the\nfirst day students build and control a model with their own hands. Every\nnew concept today is a direct extension of a Day 1 skill, never a\nbrand-new starting point:</p>\n<ul>\n<li><p>The weighted sum (w × x + b) is introduced explicitly as the same\ncalculation as y = mx + b, with w replacing m. Students do not learn a\nnew calculation; they learn a new name for a calculation they already\nperform correctly.</p></li>\n<li><p>Slider-controlled weight and bias in Desmos are the hands-on\nversion of the slope and intercept students already calculated by hand\non paper.</p></li>\n<li><p>Plotting real data points and fitting a line to them is the\nhands-on version of the scatterplot-and-line behavior students watched,\nbut did not control, during Day 1’s visual demo.</p></li>\n<li><p>The predict-before-testing structure used in every Desmos\nactivity today is the same structure used in Day 1’s “Predict Before You\nCalculate” worksheet, now applied to a slider instead of a pencil\ncalculation.</p></li>\n</ul>\n"}, {"id": "timeline", "kind": "general", "num": null, "title": "4. Full Timeline (180 Minutes Total)", "html": "<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>#</strong></th>\n<th><strong>Segment</strong></th>\n<th><strong>Duration</strong></th>\n<th><strong>Time Block</strong></th>\n<th><strong>Type</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Review of Day 1 Algebra + Day 2 Roadmap</td>\n<td>10 min</td>\n<td>0:00–0:10</td>\n<td>Lecture / Discussion</td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>From Slope-Intercept to Weighted Sums</td>\n<td>25 min</td>\n<td>0:10–0:35</td>\n<td>Lecture + Activity</td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>Break</td>\n<td>5 min</td>\n<td>0:35–0:40</td>\n<td>Break</td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>Plotting Data and Judging Fit by Eye</td>\n<td>30 min</td>\n<td>0:40–1:10</td>\n<td>Lecture + Activity</td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td>Hands-On Desmos: Building a Slider-Controlled Linear Model</td>\n<td>40 min</td>\n<td>1:10–1:50</td>\n<td>Guided Hands-On Activity</td>\n</tr>\n<tr class=\"even\">\n<td>6</td>\n<td>Break</td>\n<td>10 min</td>\n<td>1:50–2:00</td>\n<td>Break</td>\n</tr>\n<tr class=\"odd\">\n<td>7</td>\n<td>Linear vs. Nonlinear: Where a Straight Line Breaks Down</td>\n<td>30 min</td>\n<td>2:00–2:30</td>\n<td>Lecture + Activity</td>\n</tr>\n<tr class=\"even\">\n<td>8</td>\n<td>Connecting Today to Day 3 (Preview)</td>\n<td>15 min</td>\n<td>2:30–2:45</td>\n<td>Lecture + Discussion</td>\n</tr>\n<tr class=\"odd\">\n<td>9</td>\n<td>Mini-Assessment and Wrap-Up</td>\n<td>15 min</td>\n<td>2:45–3:00</td>\n<td>Assessment</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Total: 180 minutes.</strong></p>\n"}, {"id": "seg1", "kind": "segment", "num": 1, "title": "Segment 1: Review of Day 1 Algebra + Day 2 Roadmap", "html": "<p><strong>Duration: </strong>10 minutes (0:00–0:10) | <strong>Type:\n</strong>Lecture / Discussion</p>\n<p><strong>Materials needed: </strong>Board or slide. No printed\nmaterials for this segment.</p>\n<h3 id=\"step-1.1---roadmap-2-min\">Step 1.1 - Roadmap (2 min)</h3>\n<p><em>Welcome back. Yesterday you defined what AI is, you learned the\nwords data, input, and output, and you calculated y equals m x plus b by\nhand on paper. You also watched, on a screen, a line moving in response\nto data - but you didn’t touch it yourself.</em> <em>Today, you touch\nit. Today’s plan, in order: a quick review of yesterday’s algebra, a new\nname for that same algebra, plotting real data points, building your own\nslider-controlled line in Desmos, comparing straight-line data to curved\ndata, and a short connection to what’s coming on Day 3.</em></p>\n<p>Instructor action: Write today’s six segment names on the board/slide\nin order, left to right, exactly as done on Day 1.</p>\n<h3\nid=\"step-1.2---targeted-review-slope-intercept-and-calculation-8-min\">Step\n1.2 - Targeted Review: Slope, Intercept, and Calculation (8 min)</h3>\n<p>This review covers only the three Day 1 skills that today’s new\ncontent depends on. Do not review the AI definition, the\nAI-vs.-rule-based test, or ethics vocabulary - nothing new today depends\non those.</p>\n<p><em>Quick review, three questions, out loud, as a class.</em>\n<em>Question one: in the equation y equals m x plus b, which letter is\nthe slope, and which letter is the intercept? [Pause for class answer.]\nCorrect - m is slope, b is intercept.</em> <em>Question two: what does\nslope tell you, in your own words? [Pause for class answer.] Correct -\nslope tells you how much the output changes for every one-unit increase\nin the input.</em> <em>Question three, a quick calculation: y equals 3x\nplus 2. What is y when x equals 5? [Pause, cold-call one student.] Step\none, identify: m equals 3, b equals 2, x equals 5. Step two, substitute:\ny equals 3 times 5, plus 2. Step three, multiply first: y equals 15,\nplus 2. Step four, add: y equals 17.</em> <em>One last reminder before\nwe move on: yesterday, every time you calculated, you wrote a prediction\nfirst, before you calculated. You’re going to do that exact same thing\ntoday - except today, instead of predicting a number on paper, you’ll\npredict what a line will do before you move a slider.</em></p>\n<h3 id=\"cfu-check---review-confirmation\">CFU Check - Review\nConfirmation</h3>\n<p>Before moving to Segment 2, confirm the room is ready: ask one more\nstudent to state the full equation y = mx + b in words (input, slope,\nintercept, output) without looking at notes. If the student cannot do\nthis without notes, repeat Step 1.2’s Question three with a new equation\nbefore proceeding - Segment 2 cannot succeed if this is shaky.</p>\n"}, {"id": "seg2", "kind": "segment", "num": 2, "title": "Segment 2: From Slope-Intercept to Weighted Sums", "html": "<p><strong>Duration: </strong>25 minutes (0:10–0:35) | <strong>Type:\n</strong>Lecture + Activity</p>\n<p><strong>Materials needed: </strong>Board or slide; printed “Rename\nthe Parts” worksheet, one per student.</p>\n<h3 id=\"step-2.1---define-weight-and-weighted-sum-8-min\">Step 2.1 -\nDefine “Weight” and “Weighted Sum” (8 min)</h3>\n<p><em>Two new definitions.</em> <em>Weight: in an AI model, the number\nthat controls how much a given input affects the output - the exact same\nrole that slope, the letter m, played yesterday. From now on, when we\nare talking about an AI model instead of a plain algebra equation, we\nwill call this number w instead of m.</em> <em>Weighted sum: the\ncalculation w times x, plus b - written as w x plus b. This is the exact\nsame calculation as y equals m x plus b. Nothing about <strong>the\nmath</strong> has changed. Only two labels changed: m became w, and we\nnow call the whole calculation a “weighted sum” instead of just “an\nequation.”</em> <em>Definition delivered before first use: confirmed.\nBoth “weight” and “weighted sum” are fully defined before we use either\nterm in a worked example.</em> <em>Here is exactly why this renaming\nmatters. Every AI system you build for the rest of this course - today’s\nDesmos line, tomorrow’s neural network - uses the words weight and bias,\nnot slope and intercept. AI researchers use w and b because the same\ncalculation, w x plus b, gets used over and over inside much bigger\nsystems, and ‘slope’ and ‘intercept’ stop being the right words once you\nhave many inputs feeding into one output at once, which is exactly what\nyou’ll see on Day 3. The math you already know does not change. Only the\nname changes, starting today.</em></p>\n<h3 id=\"step-2.2---bias-keeps-its-name-3-min\">Step 2.2 - Bias Keeps Its\nName (3 min)</h3>\n<p><em>One important note: the intercept, the letter b, keeps almost the\nsame name in AI - it’s called bias, and we still write it as b.\n<strong>So</strong> weight, w, is the new name for slope. Bias, b, is\njust bias - same letter, very similar word, same job: it’s the starting\nvalue of the output before the input has any effect at all, exactly like\nthe intercept was yesterday.</em> So** our new full equation, the\nweighted sum, <strong>is:</strong> output equals weight times input,\nplus bias **- or, in symbols, y equals w x plus b. Compare that side by\nside with yesterday’s equation: y equals m x plus b. Same shape. Same\nsteps. New names for two of the four parts.</p>\n<h3 id=\"worked-example-1-full-in-this-segment\">Worked Example 1 (full,\nin this segment)</h3>\n<p>Let’s work through one example together, fully, out loud, using the\nnew vocabulary on purpose.</p>\n<p><em>Example: A model has a weight of 4 and a bias of 1. What is the\noutput when the input is 3?</em> <em>Step 1 - Identify each value using\nthe new names: w equals 4, b equals 1, x equals 3.</em> <em>Step 2 -\nSubstitute into the weighted sum: y equals 4 times 3, plus 1.</em>\n<em>Step 3 - Multiply first: y equals 12, plus 1.</em> <em>Step 4 - Add:\ny equals 13.</em> <em>Step 5 - State the answer in context: when the\ninput is 3, this model’s weighted sum predicts an output of 13. Notice\nevery single step is identical to yesterday’s y equals m x plus b\ncalculation - only the words w and bias replaced m and intercept in our\nspoken explanation.</em></p>\n<h3 id=\"step-2.3---student-activity-rename-the-parts-10-min\">Step 2.3 -\nStudent Activity: Rename the Parts (10 min)</h3>\n<p>Instructions given to students, exactly as written on the worksheet:\nFor each of the 5 equations below, first label each number using the OLD\nnames (slope, intercept) and then relabel the same numbers using the NEW\nnames (weight, bias). Then calculate the output (y) for the given input\n(x), showing the multiply-then-add steps. You have 8 minutes, then we\ncheck answers as a class.</p>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>#</strong></th>\n<th><strong>Equation / Find output when…</strong></th>\n<th><strong>Old name labels</strong></th>\n<th><strong>New name labels</strong></th>\n<th><strong>Calculation</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>y = 2x + 5, x = 3</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>y = -3x + 10, x = 2</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>y = 0.5x + 6, x = 8</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>y = 7x – 2, x = 1</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td>y = -1x + 4, x = 4</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>Answer key: 1) old: m=2, b=5; new: w=2, bias=5; y = (2)(3)+5 = 11. 2)\nold: m=-3, b=10; new: w=-3, bias=10; y = (-3)(2)+10 = 4. 3) old: m=0.5,\nb=6; new: w=0.5, bias=6; y = (0.5)(8)+6 = 10. 4) old: m=7, b=-2; new:\nw=7, bias=-2; y = (7)(1)-2 = 5. 5) old: m=-1, b=4; new: w=-1, bias=4; y\n= (-1)(4)+4 = 0.</p>\n<p>Expected completion behavior: All 5 rows show both the old-name\nlabels and new-name labels for the same two numbers, plus a correct\nmultiply-then-add calculation.</p>\n<p>Deliverable: Completed Rename the Parts worksheet, one per\nstudent.</p>\n<p>Segment 3: Break</p>\n<p><strong>Duration: </strong>5 minutes (0:35–0:40)</p>\n<p><em>Five-minute break. Be back in your seat at [state exact clock\ntime].</em></p>\n"}, {"id": "break3", "kind": "segment", "num": 3, "title": "Segment 3: Break", "html": "<p>Scheduled break. Students step away from screens; the timer on the slide counts it down. Durations are listed in the day timeline.</p>"}, {"id": "seg4", "kind": "segment", "num": 4, "title": "Segment 4: Plotting Data and Judging Fit by Eye", "html": "<p><strong>Duration: </strong>30 minutes (0:40–1:10) | <strong>Type:\n</strong>Lecture + Activity</p>\n<p><strong>Materials needed: </strong>Board or slide; printed\ngraph-paper coordinate grids; printed “Plot and Judge” worksheet, one\nper student.</p>\n<h3 id=\"step-4.1---define-data-point-scatterplot-and-fit-8-min\">Step 4.1\n- Define “Data Point,” “Scatterplot,” and “Fit” (8 min)</h3>\n<p><em>Three new definitions, all before we use them.</em> <em>Data\npoint: one single recorded example, made of an input value and its\nmatching output value, usually written as an ordered pair like (x, y).\nThis is the same word ‘data’ from Day 1 - a data point is just one\nindividual piece of that data, placed on a graph.</em> <em>Scatterplot:\na graph showing many individual data points as dots, with no line\nconnecting them yet.</em> <em>Fit: how closely a model’s line passes\nthrough a set of plotted data points. A model with a good fit has a line\nthat stays close to most of the dots. A model with a poor fit has a line\nthat is far away from many of the dots.</em> <em>Here is why\n<strong>this matters</strong>, connected directly to yesterday: on Day\n1, you watched a line <strong>try</strong> to get as close as possible\nto a set of dots on a screen. Today you’re going to plot the dots\nyourself, and then build the line yourself, and you’ll judge with your\nown eyes whether your line has a good fit or a poor fit.</em></p>\n<h3\nid=\"step-4.2---worked-example-2-plotting-and-judging-fit-by-eye-7-min\">Step\n4.2 - Worked Example 2: Plotting and Judging Fit by Eye (7 min)</h3>\n<p>Let’s do one fully, out loud, together, on the board.</p>\n<p><em>Example: Here are 4 data points: (1, 3), (2, 5), (3, 6), (4,\n9).</em> <em>Step 1 - Plot each point on the grid: find x first, then\nmove up to y. [Instructor plots all 4 points on the board grid.]</em>\n<em>Step 2 - Look at the pattern: as x increases by 1, does y increase\nby roughly the same amount each time? Here, y goes 3, 5, 6, 9 - the\nincreases are 2, 1, 3. Not perfectly even, but generally climbing as x\nclimbs. That’s a rough straight-line pattern, even though the points\ndon’t form a perfectly straight line.</em> <em>Step 3 - Now I draw a\ncandidate line: y equals 2x plus 1. [Instructor draws this line on the\nsame grid.] Check the fit: at x=1, the line predicts y=3 - matches the\ndot exactly. At x=2, the line predicts y=5 - matches exactly. At x=3,\nthe line predicts y=7, but the dot is at y=6 - close, off by 1. At x=4,\nthe line predicts y=9 - matches exactly.</em> <em>Step 4 - Conclusion:\nthis line has a good fit. Three of the four dots are touched exactly,\nand the fourth is off by only 1. A line like y equals 5x plus 1 would\nhave a poor fit here - at x=1 it would predict y=6, far from the actual\ndot at y=3.</em></p>\n<h3 id=\"step-4.3---student-activity-plot-and-judge-15-min\">Step 4.3 -\nStudent Activity: Plot and Judge (15 min)</h3>\n<p>Instructions given to students, exactly as written on the worksheet:\nFor Data Set A, plot all 5 points on your grid. Then, for each of the\ntwo candidate lines listed below it, calculate what the line predicts at\neach of the 5 x-values, and write ‘Good Fit’ or ‘Poor Fit’ with one\nsentence of justification. Work alone for the first 8 minutes, then\ncheck your answers with your table group for the last 7 minutes.</p>\n<p><strong>Data Set A: (1, 4), (2, 7), (3, 9), (4, 13), (5,\n15)</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Candidate line</strong></th>\n<th><strong>Predictions at x = 1,2,3,4,5</strong></th>\n<th><strong>Good Fit or Poor Fit?</strong></th>\n<th><strong>Justification (1 sentence)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>y = 3x + 1</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>y = 1x + 9</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>Sample correct answers (for instructor reference): Line 1, y=3x+1,\npredicts 4, 7, 10, 13, 16 - matches 4 of 5 points exactly, off by 1 on\nthe third - Good Fit. Line 2, y=1x+9, predicts 10, 11, 12, 13, 14 - far\nfrom every actual point except the fourth - Poor Fit, because the\npredicted values barely change while the actual data climbs much\nfaster.</p>\n<p>Expected completion behavior: All 5 predictions calculated correctly\nfor both lines, a fit judgment given for each line, and a justification\nsentence that references the size of the gap between prediction and\nactual data point, not just a guess.</p>\n<p>Deliverable: Completed Plot and Judge worksheet, one per student,\nincluding the plotted grid.</p>\n"}, {"id": "seg5", "kind": "segment", "num": 5, "title": "Segment 5: Hands-On Desmos - Building a Slider-Controlled Linear Model", "html": "<p><strong>Duration: </strong>40 minutes (1:10–1:50) | <strong>Type:\n</strong>Guided Hands-On Activity</p>\n<p><strong>Materials needed: </strong>One laptop or device per student\n(or per pair, if devices are limited), each with a browser open to\n<a href=\"https://www.desmos.com/calculator\" target=\"_blank\" rel=\"noopener\">desmos.com/calculator</a>; printed “Build Your Model” worksheet, one per\nstudent.</p>\n<p>Tool-familiarity note: this is the first day students use Desmos\nthemselves. A brief, plain-language walkthrough of where the input box\nand sliders appear is built into Step 5.1 below so that no prior Desmos\nexperience is assumed; if a student is still confused after Step 5.1,\nwalk to their seat and point at their screen rather than re-explaining\nto the whole room.</p>\n<h3 id=\"step-5.1---orientation-to-desmos-5-min\">Step 5.1 - Orientation\nto Desmos (5 min)</h3>\n<p><em>Everyone <strong>open</strong> your browser to\n<strong>desmos</strong> dot com slash calculator. You should see a blank\ngrid on the right side of your screen, and an empty list on the left\nside where you can type things.</em> <em>Here’s all you need to know to\n<strong>start:</strong> click into the first empty row on the left, and\nwhatever equation you type there gets drawn on the grid to the right.\nLet’s test that right now - everyone <strong>type:</strong> y equals 2x\nplus 1, then press enter. [Pause and check screens.] You should now see\na straight line on your grid. That line is the same kind of line you\ndrew on paper yesterday - Desmos is just drawing it for you instead of\nyou drawing it by hand.</em> <em>Now we’re going to make that line\ncontrollable. Delete what you just typed, and instead type: y equals w x\nplus b, then press enter. Desmos will offer to add sliders for w and b\nautomatically - click ‘all’ or click each ‘add slider’ button it shows\nyou. [Pause and check screens.] You should now see two sliders appear on\nyour screen, one labeled w and one labeled b, plus a line on the\ngrid.</em> <em>Those two sliders are exactly today’s weight and bias -\nthe same two numbers from Segment 2, except now you can drag them with\nyour mouse instead of writing them on paper.</em></p>\n<h3\nid=\"step-5.2---predict-then-test-moving-the-weight-slider-8-min\">Step\n5.2 - Predict-Then-Test: Moving the Weight Slider (8 min)</h3>\n<p><em>Before you touch anything: on your worksheet, write a prediction.\nIf you drag the w slider to make it a bigger positive number, what do\nyou think will happen to the line’s tilt? Write your answer now, in one\nsentence, before testing. [Pause for writing.]</em> <em>Now test it.\nDrag <strong>your w</strong> slider to a larger positive number, like 5.\nWhat happened? [Pause for student responses.] Correct - the line gets\nsteeper. A bigger weight means a bigger change in output for every\none-unit change in input, exactly like a bigger slope did\nyesterday.</em> <em>Now write a second prediction: what do you think\nwill happen if you drag w into negative numbers? Write it down before\ntesting. [Pause.] Now test it by dragging w below zero. [Pause for\nresponses.] Correct - the line now tilts downward instead of upward.\nThis is the exact same negative-slope idea from yesterday’s second\nworked example, where y equals negative 1x plus 10 meant y went down as\nx went up.</em> <em>Set <strong>your w slider</strong> back to a small\npositive number, like 1, before we move on.</em></p>\n<h3 id=\"step-5.3---predict-then-test-moving-the-bias-slider-7-min\">Step\n5.3 - Predict-Then-Test: Moving the Bias Slider (7 min)</h3>\n<p><em>Same process, different slider. Before touching anything: write a\nprediction. If you drag the b slider to a bigger positive number, what\ndo you think happens to the line? <strong>Write it</strong> now.\n[Pause.]</em> <em>Now test it. Drag b to a larger number, like 8. What\nhappened? [Pause for responses.] Correct - the whole line shifts upward,\nbut the tilt does not change. That matches exactly what we said\nyesterday: the intercept, now called bias, is the value of y when x\nequals zero - it sets the line’s starting height, and it does that no\nmatter what the weight is doing.</em> <em>Quick check before we\ncontinue: does changing b ever change how steep the line is? [Pause for\nclass answer.] No - only <strong>w changes</strong> steepness. b only\nmoves the line up or down without tilting it.</em></p>\n<h3\nid=\"step-5.4---fitting-a-line-to-real-data-points-in-desmos-12-min\">Step\n5.4 - Fitting a Line to Real Data Points in Desmos (12 min)</h3>\n<p>Now we’re going to do exactly what you did on paper in Segment 4, but\ninside Desmos, with your slider-controlled line. In a new row in Desmos,\ntype these 5 points exactly like this: open parenthesis 1 comma 4 close\nparenthesis, comma, open parenthesis 2 comma 7 close parenthesis, comma,\nopen parenthesis 3 comma 9 close parenthesis, comma, open parenthesis 4\ncomma 13 close parenthesis, comma, open parenthesis 5 comma 15 close\nparenthesis, then press enter. That is Data Set A from Segment 4. You\nshould now se<strong>e 5 dots appear on your grid </strong>- that’s your\nscatterplot, the same one you plotted by hand earlier. <em>Your job now:\ndrag your w and b sliders until your line passes as close as possible to\nall 5 dots at once - not perfectly through every single one, but as\nclose as you can get overall. This is exactly what Day 1’s visual demo\nshowed you happening automatically. Today, you are the one doing\n<strong>it,</strong> by hand, with sliders.</em> <em>You have 6 minutes\nto get the best fit you can. When you think you <strong>have a\ngood</strong> fit, write down your final w and b values on your\nworksheet.</em></p>\n<h3 id=\"step-5.5---class-check-comparing-fitted-values-8-min\">Step 5.5 -\nClass Check: Comparing Fitted Values (8 min)</h3>\n<p><em>Let’s compare. I’m going to cold-call students and ask for their\nfinal w and b values. [Call on students; write each pair of values on\nthe board.] Notice something: your numbers are probably not identical to\neach other, and that’s expected - different students may have found\nslightly different w and b combinations that all produce a reasonably\ngood fit.</em> <em>But here’s the test that <strong>matters:</strong>\nfrom Segment 4, we already calculated that y equals 3x plus 1 was a Good\nFit for this exact data set. If your final w is close to 3 and your\nfinal b is close to 1, your slider-based line should look very similar\nto that line. Check your own numbers now - how close are you to w equals\n3, b equals 1? [Pause for students to check.] If you’re far from those\nnumbers, drag your sliders closer now before we move to the next\nsegment.</em></p>\n<h3 id=\"student-activity-summary-build-your-model\">Student Activity\nSummary: Build Your Model</h3>\n<p>Instructions given to students, exactly as written on the worksheet:\nFollow along with the instructor to set up your Desmos graph with w and\nb sliders. Complete both predict-then-test boxes (weight slider, bias\nslider) by writing your prediction before you test it. Then plot Data\nSet A and adjust your sliders until your line fits the 5 points as\nclosely as possible. Record your final w and b values and compare them\nto the class target of w near 3, b near 1.</p>\n<p>Expected completion behavior: Both prediction boxes are filled in\nbefore the corresponding test was run (checked by handwriting order, not\njust presence of an answer), and a final w/b pair is recorded that is\nreasonably close to w=3, b=1 (within roughly 1 unit of either value,\ngiven slider precision).</p>\n<p>Deliverable: Completed Build Your Model worksheet, one per student,\nwith both predictions, both test results, and final w/b values\nrecorded.</p>\n<p>Segment 6: Break</p>\n<p><strong>Duration: </strong>10 minutes (1:50–2:00)</p>\n<p><em>Ten-minute break. Grab a snack if you’d like one. Be back in your\nseat at [state exact clock time].</em></p>\n"}, {"id": "break6", "kind": "segment", "num": 6, "title": "Segment 6: Break", "html": "<p>Scheduled break. Students step away from screens; the timer on the slide counts it down. Durations are listed in the day timeline.</p>"}, {"id": "seg7", "kind": "segment", "num": 7, "title": "Segment 7: Linear vs. Nonlinear - Where a Straight Line Breaks Down", "html": "<p><strong>Duration: </strong>30 minutes (2:00–2:30) | <strong>Type:\n</strong>Lecture + Activity</p>\n<p><strong>Materials needed: </strong>Devices still open to Desmos from\nSegment 5; printed “Linear or Nonlinear?” worksheet, one per\nstudent.</p>\n<h3 id=\"step-7.1---define-linear-and-nonlinear-6-min\">Step 7.1 - Define\n“Linear” and “Nonlinear” (6 min)</h3>\n<p><em>Two definitions before we use them.</em> <em>Linear relationship:\na relationship between input and output where the output changes by\nroughly the same amount for every equal step in the input - which is\nexactly why it can be fit well by a single straight line, the kind of\nline you’ve been building all day.</em> <em>Nonlinear relationship: a\nrelationship between input and output where the output does NOT change\nby a steady amount as the input changes - sometimes it changes slowly at\nfirst and then quickly, or it curves, or it changes direction. A single\nstraight line cannot follow this kind of pattern closely.</em>\n<em>Here’s the direct connection to everything we’ve done today: every\ndata set you’ve worked with so far - Segment <strong>4’s</strong>\npoints, Segment 5’s Data Set A - was linear on purpose, specifically so\nthat a single w and b could fit it well. Now we’re going to look at data\nthat is NOT linear, and watch what happens when you try to force a\nstraight line onto it.</em></p>\n<h3\nid=\"step-7.2---worked-example-3-trying-to-fit-a-straight-line-to-curved-data-8-min\">Step\n7.2 - Worked Example 3: Trying to Fit a Straight Line to Curved Data (8\nmin)</h3>\n<p>Let’s do this fully, out loud, together, in Desmos.</p>\n<p><em>Example: Here is Data Set B - (1, 1), (2, 4), (3, 9), (4, 16),\n(5, 25). Everyone <strong>type</strong> these 5 points into Desmos now,\nthe same way you typed Data Set A. [Pause for students to enter\npoints.]</em> <em>Step 1 - Look at the gaps between outputs as x\nincreases by 1 each time: 1, then 4, then 9, then 16, then 25. The gaps\nbetween those are 3, 5, 7, 9 - the gaps themselves keep growing. Compare\nthat to Data Set A earlier, where the gaps stayed roughly the same size\neach time. That growing-gap pattern is a sign of a nonlinear\nrelationship.</em> <em>Step 2 - Try to fit it anyway. Drag your w and b\nsliders and try to get your line as close as possible to all 5 of these\nnew dots. Take 90 seconds. [Pause.] Notice what’s happening: no matter\nhow you drag w and b, your straight line can touch maybe 2 dots closely,\nbut the others stay far away - the early dots and the late dots can’t\nboth be close to the same straight line at the same time.</em> Step 3 -\nConclusion: this is a poor fit, and it is not because you dragged the\nsliders wrong. It is because the underlying relationship is nonlinear,\nand no value of w and b can make a <strong>single straight line match a\ncurve. The model itself - not your slider skill </strong>- is the\nlimitation here.</p>\n<h3 id=\"step-7.3---why-this-matters-going-forward-4-min\">Step 7.3 - Why\nThis Matters Going Forward (4 min)</h3>\n<p><em>This is one of the most important things you’ll learn all week,\nso listen closely. A model built from a single weighted sum - w times x,\nplus b - can only ever draw a straight line. That means it can only ever\nfit data that is roughly linear. The instant the real-world pattern\ncurves or bends, a single weighted sum stops being good enough, no\nmatter how perfectly you tune w and b.</em> <em>Real-world AI problems\nare full of nonlinear patterns - the relationship between someone’s past\npurchases and what they’ll buy next, or between a photo’s pixels and\nwhether it shows a cat, almost never follows a straight line.\n<strong>So</strong> the question becomes: how do you build a model that\nCAN bend? You’ll start answering that question on Day 3.</em></p>\n<h3 id=\"step-7.4---student-activity-linear-or-nonlinear-12-min\">Step 7.4\n- Student Activity: Linear or Nonlinear? (12 min)</h3>\n<p>Instructions given to students, exactly as written on the worksheet:\nFor each of the 4 data sets below, first look at the gaps between\nconsecutive outputs and decide: Linear or Nonlinear? Then enter the\npoints into Desmos and try to fit a line using your w and b sliders for\n60 seconds. Record whether the fit was Good or Poor, and write one\nsentence connecting your gap-pattern observation to your fit result.\nWork alone for 8 minutes, then check with your table group for the last\n4 minutes.</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Data set</strong></th>\n<th><strong>Gap pattern (Linear/Nonlinear)</strong></th>\n<th><strong>Fit after 60 sec (Good/Poor)</strong></th>\n<th><strong>Justification (1 sentence)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>(1,5) (2,8) (3,11) (4,14)</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>(1,2) (2,6) (3,14) (4,30)</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>(1,10) (2,8) (3,6) (4,4)</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>(1,1) (2,8) (3,27) (4,64)</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>Answer key: Set 1 - gaps are 3,3,3 - Linear - Good fit expected. Set\n2 - gaps are 4,8,16 - Nonlinear (gaps growing rapidly) - Poor fit\nexpected. Set 3 - gaps are -2,-2,-2 - Linear (steady negative change) -\nGood fit expected. Set 4 - gaps are 7,19,37 - Nonlinear (gaps growing\nrapidly, this is x cubed) - Poor fit expected.</p>\n<p>Expected completion behavior: All 4 gap patterns correctly identified\nas Linear or Nonlinear before testing in Desmos, all 4 fit results match\nthe prediction (linear sets fit well, nonlinear sets do not), and each\njustification explicitly references the size or growth of the gaps.</p>\n<p>Deliverable: Completed Linear or Nonlinear? worksheet, one per\nstudent.</p>\n"}, {"id": "seg8", "kind": "segment", "num": 8, "title": "Segment 8: Connecting Today to Day 3 (Preview)", "html": "<p><strong>Duration: </strong>15 minutes (2:30–2:45) | <strong>Type:\n</strong>Lecture + Discussion</p>\n<p><strong>Materials needed: </strong>None beyond board/slide.</p>\n<h3 id=\"step-8.1---summarize-todays-vocabulary-chain-5-min\">Step 8.1 -\nSummarize Today’s Vocabulary Chain (5 min)</h3>\n<p><em>Let’s connect everything, start to finish. Yesterday: y equals m\nx plus b, with m as slope and b as intercept. Today: the exact same\ncalculation, renamed - y equals w x plus b, with <strong>w as</strong>\nweight and b as bias, now called a weighted sum. Same math, new name,\nbecause this is the name AI systems <strong>actually use</strong>.</em>\n<em>You <strong>plotted</strong> real data, built a slider-controlled\nline, and fit that line to data by adjusting w and b - the hands-on\nversion of what you only watched yesterday. And you discovered, by\ntrying it yourself, that one weighted sum can only ever produce one\nstraight line, which means it can only fit linear patterns\nwell.</em></p>\n<h3\nid=\"step-8.2---preview-what-a-single-weighted-sum-cannot-do-5-min\">Step\n8.2 - Preview: What a Single Weighted Sum Cannot Do (5 min)</h3>\n<p><em>Here’s the problem we’re leaving open on purpose: what do you do\nwhen your data is nonlinear, like Data Set B today, or like Question 4\non today’s last worksheet? You just proved to yourself that dragging w\nand b harder doesn’t fix it - the shape of a single weighted sum is\npermanently a straight line.</em> <em>Tomorrow, Day 3, you’ll meet the\nneural network. Here’s the one-sentence preview: a neural network takes\nmany weighted sums - the exact w x plus b calculation you used all day\ntoday - and connects them together, then bends each one using something\ncalled an activation function, so that the combined result can curve\ninstead of staying straight. Every single piece of that sentence -\nweight, bias, weighted sum - is something you already fully understand\nas of right now. The only truly new piece tomorrow is the activation\nfunction, the part that lets the line bend.</em></p>\n<h3 id=\"step-8.3---quick-discussion-5-min\">Step 8.3 - Quick Discussion\n(5 min)</h3>\n<p>Instructor asks the class, aloud:</p>\n<p><em>Turn to your neighbor: in your own words, why can’t one weighted\nsum fit Data Set B from today, no matter how you adjust w and\nb?</em></p>\n<p>Expected answer: Because a single weighted sum can only draw a\nstraight line, and Data Set B’s outputs change by growing amounts rather\nthan steady amounts, so no straight line can stay close to all of its\npoints at once.</p>\n"}, {"id": "seg9", "kind": "segment", "num": 9, "title": "Segment 9: Mini-Assessment and Wrap-Up", "html": "<p><strong>Duration: </strong>15 minutes (2:45–3:00) | <strong>Type:\n</strong>Assessment</p>\n<p><strong>Materials needed: </strong>Printed Mini-Assessment, one per\nstudent (see Section 9 of this module).</p>\n<h3 id=\"step-9.1---frame-the-assessment-1-min\">Step 9.1 - Frame the\nAssessment (1 min)</h3>\n<p><em>Take out a pencil. This is the same kind of check we did at the\nend of Day 1 - 8 questions, 10 minutes, on your own, show your work for\nany calculation.</em></p>\n<h3 id=\"step-9.2---administer-10-min\">Step 9.2 - Administer (10\nmin)</h3>\n<p>Distribute the Mini-Assessment (Section 10 below). Students work\nindependently and silently for 10 minutes.</p>\n<h3 id=\"step-9.3---close-the-day-4-min\">Step 9.3 - Close the Day (4\nmin)</h3>\n<p><em>Collect your assessment when you finish. One last thing before\nyou go: tomorrow, Day 3, you’re going to take everything from today -\nweight, bias, weighted sum - and connect many of them together into your\nfirst neural network. You already know every piece except one new word:\nactivation function. See you tomorrow.</em></p>\n"}, {"id": "gen7workedexamplesconsolida", "kind": "general", "num": null, "title": "7. Worked Examples (Consolidated Index)", "html": "<p>Three fully solved worked examples appear within the instructor\nscript above, each shown with complete step-by-step reasoning. This\nsatisfies the requirement of at least two fully solved examples; an\nindex is provided here for quick reference.</p>\n<ul>\n<li><p><strong>Worked Example 1 (Segment 2): </strong>Calculating a\nweighted sum (w=4, b=1, x=3) using the new weight/bias vocabulary, with\na direct side-by-side comparison to the same calculation under\nyesterday’s slope/intercept names.</p></li>\n<li><p><strong>Worked Example 2 (Segment 4): </strong>Plotting 4 data\npoints and judging the fit of a candidate line by calculating its\npredictions at each x-value and comparing them to the actual\npoints.</p></li>\n<li><p><strong>Worked Example 3 (Segment 7): </strong>Attempting to fit\na single straight line to nonlinear data (Data Set B), showing why a\nsingle weighted sum structurally cannot achieve a good fit on curved\ndata.</p></li>\n</ul>\n"}, {"id": "gen8checksforunderstandingc", "kind": "general", "num": null, "title": "8. Checks for Understanding (CFUs)", "html": "<h3 id=\"cfu-1-after-segment-2-step-2.1---weight-definition\">CFU 1 (after\nSegment 2, Step 2.1 - Weight Definition)</h3>\n<p><strong>Question: </strong>In the equation y = wx + b, what is the\nnew name for the number that used to be called the slope, and what job\ndoes it still do?</p>\n<p><strong>Expected correct answer: </strong>It’s now called the weight\n(w). It still does the exact same job as slope: it controls how much the\noutput changes for every one-unit increase in the input.</p>\n<p><strong>Common wrong answer: </strong>The weight and the slope are\ntwo different things / weight is a brand-new concept.</p>\n<p><strong>Correction: </strong>They are the same number, in the same\nposition in the equation, doing the same job - only the spoken name\nchanged, from ‘slope’ to ‘weight,’ because that’s the name used in AI\nsystems.</p>\n<h3 id=\"cfu-2-after-segment-2-step-2.2---bias-definition\">CFU 2 (after\nSegment 2, Step 2.2 - Bias Definition)</h3>\n<p><strong>Question: </strong>A model has weight = 0 and bias = 7. What\noutput does it produce no matter what the input is, and why?</p>\n<p><strong>Expected correct answer: </strong>It always outputs 7. Since\nweight is 0, the weight times input term always equals 0 regardless of\ninput, so the output is just the bias, 7, every time.</p>\n<p><strong>Common wrong answer: </strong>The output would be 0, because\nthe weight is 0.</p>\n<p><strong>Correction: </strong>Only the w times x part becomes 0 - the\nbias is added on its own, separately, and does not disappear just\nbecause the weight is 0. Substitute it: y = (0)(x) + 7 = 0 + 7 = 7.</p>\n<h3 id=\"cfu-3-after-segment-4-step-4.1---fit-definition\">CFU 3 (after\nSegment 4, Step 4.1 - Fit Definition)</h3>\n<p><strong>Question: </strong>What does it mean for a model to have a\n‘good fit’ to a set of data points?</p>\n<p><strong>Expected correct answer: </strong>The model’s line stays\nclose to most or all of the actual data points when you compare the\nline’s predicted output to each point’s actual output.</p>\n<p><strong>Common wrong answer: </strong>A good fit means the line looks\nnice or is easy to draw.</p>\n<p><strong>Correction: </strong>Fit is not about how the line looks -\nit’s a measurable comparison between predicted values (from the line)\nand actual values (the dots). You have to calculate the line’s\nprediction at each point and compare it to the real dot to judge\nfit.</p>\n<h3 id=\"cfu-4-after-segment-5-step-5.2---weight-slider-behavior\">CFU 4\n(after Segment 5, Step 5.2 - Weight Slider Behavior)</h3>\n<p><strong>Question: </strong>If you increase the weight slider from 2\nto 8, what happens to the line, and what stays the same?</p>\n<p><strong>Expected correct answer: </strong>The line gets steeper - it\ntilts upward more sharply. The bias (where the line crosses x = 0) stays\nthe same, because only the weight changed.</p>\n<p><strong>Common wrong answer: </strong>The whole line shifts upward,\nthe same way it does when you increase bias.</p>\n<p><strong>Correction: </strong>That’s what increasing bias does, not\nweight. Increasing weight changes the line’s steepness (tilt), not its\nstarting height. Only bias moves the line up or down without changing\nits tilt.</p>\n<h3 id=\"cfu-5-after-segment-5-step-5.4---fitting-sliders-to-data\">CFU 5\n(after Segment 5, Step 5.4 - Fitting Sliders to Data)</h3>\n<p><strong>Question: </strong>You drag your sliders and your line is far\nfrom 4 out of 5 data points. What should you conclude, and what should\nyou do?</p>\n<p><strong>Expected correct answer: </strong>This is a poor fit. You\nshould try different w and b values - keep adjusting the sliders, since\nthe data in this case (Segment 5’s Data Set A) is linear and a\ngood-fitting w and b combination does exist.</p>\n<p><strong>Common wrong answer: </strong>The data must be wrong, or\nDesmos is broken.</p>\n<p><strong>Correction: </strong>A poor fit during slider adjustment\nusually means you haven’t found the right w and b combination yet, not\nthat the tool or data is broken. Keep adjusting - for linear data, a\nmuch better fit is achievable.</p>\n<h3 id=\"cfu-6-after-segment-7-step-7.1---linear-vs.-nonlinear\">CFU 6\n(after Segment 7, Step 7.1 - Linear vs. Nonlinear)</h3>\n<p><strong>Question: </strong>A data set has outputs 2, 4, 8, 16 as the\ninput goes 1, 2, 3, 4. Is this linear or nonlinear, and how do you\nknow?</p>\n<p><strong>Expected correct answer: </strong>Nonlinear. The gaps between\nconsecutive outputs are 2, 4, 8 - the gaps themselves are growing, not\nstaying steady, which is the sign of a nonlinear relationship.</p>\n<p><strong>Common wrong answer: </strong>It’s linear because the numbers\nare increasing in a clear pattern.</p>\n<p><strong>Correction: </strong>Increasing in some pattern is not the\nsame as increasing by a steady amount. Check the actual size of each\ngap: 4-2=2, 8-4=4, 16-8=8. Since those gap sizes are not equal, the\nrelationship is nonlinear, even though there’s a recognizable\npattern.</p>\n<h3\nid=\"cfu-7-after-segment-7-step-7.3---why-linear-models-have-limits\">CFU\n7 (after Segment 7, Step 7.3 - Why Linear Models Have Limits)</h3>\n<p><strong>Question: </strong>Why can’t adjusting w and b ever produce a\ngood fit for a strongly nonlinear data set?</p>\n<p><strong>Expected correct answer: </strong>Because a single weighted\nsum (w times x plus b) can only ever produce a straight line. No\ncombination of w and b can make that line curve, so it cannot closely\nfollow data whose outputs change by growing or shrinking amounts.</p>\n<p><strong>Common wrong answer: </strong>You just haven’t found the\nright w and b values yet - keep trying different numbers.</p>\n<p><strong>Correction: </strong>This is different from the earlier\nlinear case. For nonlinear data, the limitation is structural, not a\nsearch problem - every possible w and b still only draws a straight\nline, and a straight line cannot bend to match a curve no matter how\nlong you search.</p>\n"}, {"id": "misconceptions", "kind": "general", "num": null, "title": "9. Common Misconceptions", "html": "<p><strong>1. Misconception: </strong>“Weight and slope are different\nconcepts, and weighted sum is a new kind of math.”</p>\n<p><strong>Why students develop it: </strong>Students are encountering\nnew vocabulary (weight, bias, weighted sum) on the same day, and new\nvocabulary often gets mentally filed as new content even when the\nunderlying calculation hasn’t changed.</p>\n<p><strong>Correction strategy: </strong>Explicitly write y = mx + b and\ny = wx + b side by side on the board every time the renaming is\nreviewed, and have students perform the same calculation once with each\nname to prove to themselves the numbers and steps are identical.</p>\n<p><strong>2. Misconception: </strong>“Increasing the bias makes the\nline steeper, the same way increasing the weight does.”</p>\n<p><strong>Why students develop it: </strong>Both sliders visibly move\nthe line, so without a clear distinction students may attribute the same\neffect (steepness) to both.</p>\n<p><strong>Correction strategy: </strong>Use Step 5.2 and 5.3’s\npredict-then-test sequence strictly in order - weight first, bias second\n- and explicitly ask the CFU-5 question (‘does changing b ever change\nsteepness?’) immediately after the bias test, before moving on.</p>\n<p><strong>3. Misconception: </strong>“A poor fit always means you need\nto keep adjusting the sliders - a better fit is always out there if you\nsearch harder.”</p>\n<p><strong>Why students develop it: </strong>This is true for the linear\ndata students saw first (Segment 4 and 5), so without an explicit\ncontrast, students generalize it to all data, including the nonlinear\ndata introduced later in Segment 7.</p>\n<p><strong>Correction strategy: </strong>In Segment 7, explicitly name\nthe distinction: for linear data, a poor fit usually means keep\nsearching; for nonlinear data, a poor fit can mean no w/b combination\nwill work, because the model itself (a single straight line) cannot\nbend. Use Worked Example 3 to make this concrete.</p>\n<p><strong>4. Misconception: </strong>“If a data set’s outputs are\nincreasing, the relationship must be linear.”</p>\n<p><strong>Why students develop it: </strong>Students may equate ‘going\nup’ with ‘linear’ because most linear examples they’ve seen so far also\nhappened to increase.</p>\n<p><strong>Correction strategy: </strong>Repeatedly anchor the actual\ntest to the SIZE of the gap between consecutive outputs, not the\ndirection. Use Segment 7’s Data Set B (1,1,4,9,16,25) as a standing\ncounterexample: it increases the whole time, but the growing gaps make\nit nonlinear.</p>\n<p><strong>5. Misconception: </strong>“The scatterplot dots and the\nmodel’s line have to touch every single dot exactly for the model to be\nconsidered good.”</p>\n<p><strong>Why students develop it: </strong>Students often default to\nan all-or-nothing standard of correctness from earlier math classes,\nwhere an answer is either exactly right or wrong.</p>\n<p><strong>Correction strategy: </strong>Return to Worked Example 2,\nwhere a line that is exact on 3 of 4 points and off by only 1 on the\nfourth is explicitly labeled a Good Fit. Emphasize that fit is a matter\nof overall closeness across all points, not a requirement of zero error\non every point.</p>\n<p><strong>6. Misconception: </strong>“Dragging the weight slider into\nnegative numbers means the model is now broken or making a mistake.”</p>\n<p><strong>Why students develop it: </strong>Negative numbers can read\nas an error state to students, especially right after they’ve only seen\npositive, ‘increasing’ examples.</p>\n<p><strong>Correction strategy: </strong>Directly tie this back to Day\n1’s second worked example (y = -1x + 10), where a negative slope was\nshown to be a normal, useful pattern (output decreases as input\nincreases), not an error. Repeat that connection explicitly during Step\n5.2.</p>\n"}, {"id": "assessment", "kind": "general", "num": null, "title": "10. Mini-Assessment (End of Day 2)", "html": "<p>Instructions to students, exactly as printed: Answer all 8 questions\non your own. You have 10 minutes. Show your work for any calculation\nquestion.</p>\n<ul>\n<li><p>(Conceptual) In your own words, explain how a weighted sum (w x +\nb) relates to yesterday’s y = mx + b. Are they the same calculation or\ndifferent calculations?</p></li>\n<li><p>(Conceptual) A model has weight = w and bias = b. Which one\ncontrols the steepness (tilt) of the line, and which one controls where\nthe line starts when the input is 0?</p></li>\n<li><p>(Applied/Calculation) For a model with weight = 6 and bias = -3,\ncalculate the output when the input is 2. Show your work.</p></li>\n<li><p>(Applied/Calculation) For a model with weight = -2 and bias = 5,\ncalculate the output when the input is 4. Show your work.</p></li>\n<li><p>(Conceptual) A data set has outputs that increase by 5 every time\nthe input increases by 1. Is this relationship linear or nonlinear?\nExplain how you know.</p></li>\n<li><p>(Conceptual) A data set has outputs 1, 3, 9, 27 as the input goes\n1, 2, 3, 4. Is this relationship linear or nonlinear? Explain how you\nknow, using the size of the gaps between outputs.</p></li>\n<li><p>(Applied) You build a model and drag your sliders for two full\nminutes, but the line still doesn’t get close to most of your data\npoints. What are two different possible explanations for this, based on\nwhat you learned today?</p></li>\n<li><p>(Conceptual) In one or two sentences, explain why a single\nweighted sum can only ever produce a straight line, and why that becomes\na limitation for some real-world data.</p></li>\n</ul>\n<h3 id=\"answer-key\">Answer Key</h3>\n<ul>\n<li><p>They are the same calculation. Weight (w) is the new name for\nslope (m), and bias keeps the name bias for what was called the\nintercept (b) - the math itself (multiply, then add) is\nunchanged.</p></li>\n<li><p>Weight (w) controls the steepness/tilt of the line. Bias (b)\ncontrols where the line starts when input is 0 (its starting\nheight).</p></li>\n<li><p>y = (6)(2) + (-3) = 12 - 3 = 9.</p></li>\n<li><p>y = (-2)(4) + 5 = -8 + 5 = -3.</p></li>\n<li><p>Linear. The gap between consecutive outputs is steady (always 5)\nas the input increases by steady steps, which is the defining sign of a\nlinear relationship.</p></li>\n<li><p>Nonlinear. The gaps between consecutive outputs are 2, 6, 18 -\nthe gaps themselves are growing rather than staying the same size, which\nis the sign of a nonlinear relationship.</p></li>\n<li><p>Accept any two of: (a) the right w and b combination for a good\nfit hasn’t been found yet and more searching is needed (if the data is\nlinear); (b) the data itself is nonlinear, and no w/b combination of a\nsingle weighted sum can fit it, because a single weighted sum can only\ndraw a straight line; (c) the data points may not have been entered\ncorrectly into Desmos.</p></li>\n<li><p>A weighted sum is always of the form w times x, plus b, which\ngraphs as exactly one straight line for any choice of w and b. This\nbecomes a limitation because many real-world relationships are nonlinear\n(the output changes by growing or shrinking amounts), and a straight\nline cannot bend to follow that kind of pattern.</p></li>\n</ul>\n"}, {"id": "gen11teachernotesoperationa", "kind": "general", "num": null, "title": "11. Teacher Notes (Operational Clarity)", "html": "<h3 id=\"what-to-watch-for-in-student-confusion\">What to watch for in\nstudent confusion</h3>\n<ul>\n<li><p>During Segment 2, watch for students who can perform the\ncalculation correctly but still call w ‘slope’ and b ‘intercept’ out\nloud without connecting them to the new names. Calculation accuracy does\nnot guarantee vocabulary transfer - ask at least one student per table\nto say ‘weight’ and ‘bias’ out loud during the Rename the Parts\nactivity.</p></li>\n<li><p>During Segment 5’s slider work, watch for students dragging both\nw and b at the same time when trying to isolate the effect of one. This\nproduces confusing results and undermines the predict-then-test\nstructure. Redirect immediately: move only one slider at a time during\nthe prediction steps.</p></li>\n<li><p>During Segment 5’s fitting task, watch for students who stop\nadjusting sliders as soon as the line touches even one dot, declaring\nsuccess prematurely. Remind them that fit is judged across all 5 points,\nnot just one - refer back to Worked Example 2’s standard.</p></li>\n<li><p>During Segment 7, watch for students who, after failing to fit\nData Set B, conclude they made a slider mistake rather than recognizing\nthe data itself is nonlinear. This is the single most important\nmisconception to catch in this module, because it is the one most likely\nto undermine Day 3’s motivation for activation functions if left\nuncorrected.</p></li>\n</ul>\n<h3 id=\"when-to-slow-down\">When to slow down</h3>\n<ul>\n<li><p>If, during Segment 1’s review (Step 1.2), more than a couple of\nstudents cannot correctly identify slope and intercept or cannot\ncomplete the sample calculation without help, stop and redo Step 1.2’s\ncalculation with a new, simpler equation before proceeding to Segment 2.\nSegment 2’s renaming only makes sense if the underlying calculation is\nalready solid.</p></li>\n<li><p>If, during Segment 5, multiple students cannot get their Desmos\nsliders to appear after typing y = wx + b, stop the whole-class activity\nand walk through Step 5.1 again on the projector, narrating each click,\nbefore allowing independent work to continue. Do not let students fall\nbehind silently during this step, since every later step in Segment 5\ndepends on having working sliders.</p></li>\n<li><p>If, during Segment 7’s Worked Example 3, the class does not\narrive at ‘this is a poor fit no matter what I do’ within the allotted\n90 seconds of dragging sliders, extend that step by 1–2 minutes rather\nthan moving on - the lived experience of failing to fit nonlinear data\nis more convincing than being told about it, and is the foundation Step\n7.3 and Segment 8 depend on.</p></li>\n</ul>\n<h3 id=\"what-not-to-skip\">What NOT to skip</h3>\n<ul>\n<li><p>Do not skip the side-by-side comparison of y = mx + b and y = wx\n+ b in Segment 2. This single comparison is what prevents the most\ncommon misconception of the day (that weight and weighted sum are\nbrand-new math rather than renamed Day 1 math).</p></li>\n<li><p>Do not skip the predict-before-test writing step in Segment 5\n(Steps 5.2 and 5.3), even under time pressure. This is a direct\ncontinuation of Day 1’s predict-before-calculate habit, and skipping it\nconverts an active discovery activity into a passive slider-dragging\nexercise with much weaker retention.</p></li>\n<li><p>Do not skip Segment 7’s attempt to fit nonlinear data, even\nthough it ends in a poor fit by design. The experience of failing to fit\nData Set B despite real effort is the single most important moment of\nDay 2 for Day 3’s success - it is what makes the need for activation\nfunctions feel necessary rather than arbitrary tomorrow.</p></li>\n<li><p>Do not skip Segment 8’s preview discussion (Step 8.3). It is the\nonly moment where students articulate, in their own words, why a single\nweighted sum has a limit - which is the exact sentence they will need to\nunderstand Day 3’s opening rationale for activation functions.</p></li>\n</ul>\n<h3 id=\"time-management-notes\">Time management notes</h3>\n<ul>\n<li><p>Segment 5 (40 minutes) is the longest and highest-risk segment\nfor running over time, since it depends on every student’s device and\nthe Desmos website functioning correctly. If technical issues arise,\nrecover time by shortening Step 5.5’s class comparison (cold-call 2\nstudents instead of 4) rather than cutting Steps 5.2 or 5.3’s\npredict-then-test sequence.</p></li>\n<li><p>The two breaks (Segment 3 at 5 minutes, Segment 6 at 10 minutes)\nare intentionally placed and sized to match Day 1’s rhythm and are built\ninto the 180-minute total. Do not extend them without cutting an\nequivalent amount of time elsewhere, and do not cut them\nentirely.</p></li>\n<li><p>Segment 9 (Mini-Assessment) must start no later than 2:45 to\nleave a full 15 minutes. If the day is running behind by this point,\nrecover time from Segment 7’s Step 7.4 student activity (which can be\nreduced from 4 data sets to 3, dropping the third row) rather than from\nthe assessment itself or from Segment 8’s Day 3 preview, which must not\nbe cut.</p></li>\n</ul>\n<h3 id=\"preparation-for-day-3\">Preparation for Day 3</h3>\n<ul>\n<li><p>By the end of Day 2, every student should be able to say, without\nprompting: weight controls steepness, bias controls starting height, a\nweighted sum is w times x plus b, and a single weighted sum can only\ndraw a straight line. Day 3 opens by immediately building on all four of\nthese statements without redefining them - confirm this fluency during\nSegment 10’s assessment before moving forward.</p></li>\n<li><p>Day 3 will introduce the activation function as the missing piece\nthat lets connected weighted sums bend instead of staying straight.\nEnsure Segment 7 and Segment 8 were not shortened or skipped, since Day\n3’s opening motivation script assumes students have personally\nexperienced a weighted sum failing to fit nonlinear data, not merely\nbeen told that it would.</p></li>\n</ul>\n<p>Page 1 of 2</p>\n"}, {"id": "genaddendumcurriculumrevisi", "kind": "general", "num": null, "title": "ADDENDUM - Curriculum Revision: Worksheet-Only Structure", "html": "<p><strong>This addendum is authoritative and supersedes any conflicting\ninstruction elsewhere in this module.</strong></p>\n<h2 id=\"the-change\">The change</h2>\n<p><strong>SAIL has no homework, on any day.</strong> All practice, all\nwritten reasoning, and all forward planning happen inside the 180-minute\nblock, on the Student Worksheet Packet. Every day of the course now\nfollows the identical structure:</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Position in the day</strong></th>\n<th><strong>What happens</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Concept segments</td>\n<td>Worksheets, completed <strong>in class</strong>, alongside the\nsegment that teaches the concept</td>\n</tr>\n<tr class=\"even\">\n<td>Every worksheet</td>\n<td><strong>Part A = guided practice</strong> (with the instructor),\n<strong>Part B = independent practice</strong>, then a\n<strong>reflection</strong>, and an <strong>extension</strong> for\nstudents who finish early</td>\n</tr>\n<tr class=\"odd\">\n<td>Final teaching segment</td>\n<td>A <strong>bridge worksheet</strong> (“Looking Ahead to Day N+1”),\ncompleted in class</td>\n</tr>\n<tr class=\"even\">\n<td>Final segment</td>\n<td>The <strong>Mini-Assessment</strong> (8 questions, 10 minutes, no\nnotes)</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"what-this-means-for-this-module\">What this means for this\nmodule</h2>\n<p>The worksheets referenced throughout this module are now consolidated\ninto a single printed <strong>Student Worksheet Packet</strong> for this\nday. The activities themselves are unchanged, with two structural\nadditions:</p>\n<ul>\n<li><p><strong>Every worksheet is now explicitly split into guided\npractice and independent practice</strong>, matching the pattern used on\nDays 3 and 4. Where this module says “student activity,” run the first\nitem with the class and let students complete the rest independently\nbefore checking with their table group.</p></li>\n<li><p><strong>A bridge worksheet has been added at the final teaching\nsegment.</strong> It is the last worksheet in the packet, and it\ncaptures - in the student’s own words, without notes - the specific\nstatements that the following day’s opening script assumes they already\nown. Give it the full time. Read the answers while students\nwrite.</p></li>\n</ul>\n<h2 id=\"the-bridge-worksheet-and-why-it-matters\">The bridge worksheet,\nand why it matters</h2>\n<p>The bridge worksheet is the single most useful diagnostic in the\npacket. Tomorrow’s module opens by building directly on a small number\nof statements from today, and it <strong>does not reteach them</strong>.\nThe bridge worksheet asks students to write exactly those statements,\nfrom memory, in the room, while you are standing there.</p>\n<p>A student who cannot fill in the bridge worksheet without their notes\nis a student who will not be able to follow tomorrow’s first segment.\n<strong>You now know that a full day in advance</strong>, which is\nprecisely what a take-home assignment could never reliably give you -\nbecause the students most likely to skip it are the students you most\nneeded to hear from.</p>\n<p><strong>Instructor action at the end of the day:</strong> Students\nkeep the packet and bring it back tomorrow. If you prefer to collect the\npackets overnight to review the bridge worksheet, that is acceptable and\nuseful - but <strong>you must return them at the start of the next\nday</strong>, since students reference their own completed work.</p>\n<p><strong>Do not assign anything to be completed at home, and do not\nmake any part of the following day contingent on work done outside of\nclass.</strong></p>\n<p>Page 1 of 2</p>\n"}], "worksheetsHtml": "<p><strong>STUDENT AI LAB (SAIL)</strong></p>\n<p><strong>DAY 2 — The Linear Prediction Model</strong></p>\n<p><em>Slope, Intercept, and Weighted Sums in Desmos — Student Worksheet\nPacket</em></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Name: ______________________</strong></th>\n<th><strong>Date: ______________________</strong></th>\n<th><strong>Table Group: ________________</strong></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>How to use this packet. </strong>Every worksheet in this\npacket is completed <strong>during class</strong>, alongside the segment\nit belongs to. There is no homework. Keep this packet open in front of\nyou all day. <strong>The SAIL rule: </strong>nothing gets calculated and\nno slider gets dragged until your prediction is written.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>What is in this packet</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Worksheet</strong></th>\n<th><strong>Title</strong></th>\n<th><strong>When you complete it</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1</strong></td>\n<td>Rename the Parts — from m and b to w and b</td>\n<td>Segment 2 — during the lesson</td>\n</tr>\n<tr class=\"even\">\n<td><strong>2</strong></td>\n<td>Plot and Judge — fitting a line by eye</td>\n<td>Segment 4 — during the lesson</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>3</strong></td>\n<td>Build Your Model — Desmos sliders</td>\n<td>Segment 5 — during the lesson</td>\n</tr>\n<tr class=\"even\">\n<td><strong>4</strong></td>\n<td>Linear or Nonlinear? — where a straight line breaks</td>\n<td>Segment 7 — during the lesson</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>5</strong></td>\n<td>Looking Ahead to Day 3</td>\n<td>Segment 8 — during the lesson</td>\n</tr>\n<tr class=\"even\">\n<td><strong>—</strong></td>\n<td>Day 2 Mini-Assessment (8 questions, no notes)</td>\n<td>Segment 9 — end of class</td>\n</tr>\n</tbody>\n</table>\n<h1 id=\"worksheet-1-rename-the-parts\">WORKSHEET 1 — Rename the\nParts</h1>\n<p><em>Complete during Segment 2, alongside the lesson.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Same math, new names.</strong> Old algebra: y = mx + b → m =\nslope, b = intercept <strong>AI weighted sum: y = wx + b → w = weight, b\n= bias</strong> <em>The calculation does not change. Only the vocabulary\nchanges.</em></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Part A — Guided Practice (do #1 with your\ninstructor)</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>#</strong></th>\n<th><strong>Equation / Input</strong></th>\n<th><strong>Old names (m = <strong>, b = </strong>)</strong></th>\n<th><strong>New names (w = <strong>, bias = </strong>)</strong></th>\n<th><strong>Calculation (multiply, then add)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>y = 2x + 5 x = 3</td>\n<td></td>\n<td></td>\n<td>y = ( __ )( __ ) + __ y = ______ + __ y = ______</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Part B — Independent Practice</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>#</strong></th>\n<th><strong>Equation / Input</strong></th>\n<th><strong>Old names (m = <strong>, b = </strong>)</strong></th>\n<th><strong>New names (w = <strong>, bias = </strong>)</strong></th>\n<th><strong>C twork's full output, one layer", "section": "seg5"}, {"n": 16, "label": "SEGMENT 7", "title": "Mapping the Diagram to Your Hand Calculation", "section": "seg7"}, {"n": 17, "label": "SEGMENT 5 · WORKED EXAMPLE 3, PART 2", "title": "A Complete Forward Pass - Output Layer", "section": "seg5"}, {"n": 18, "label": "SEGMENT 5 · WORKSHEET 3, PART A", "title": "The Forward Pass - Your Turn", "section": "seg5"}, {"n": 19, "label": "SEGMENT 5", "title": "Part A Answers", "section": "seg5"}, {"n": 20, "label": "SEGMENT 5 · WORKSHEET 3, PARTS B–C", "title": "Independent Forward Pass + Extension", "section": "seg5"}, {"n": 21, "label": "SEGMENT 6", "title": "10:00", "section": "break6"}, {"n": 22, "label": "SEGMENT 7", "title": "Instructor Demo: mlu-explain Neural Networks", "section": "seg7"}, {"n": 23, "label": "SEGMENT 5 · WORKED EXAMPLE 3, PART 1", "title": "A Complete Forward Pass - Hidden Layer", "section": "seg5"}, {"n": 24, "label": "SEGMENT 7 · WORKSHEET 4", "title": "Worksheet 4 + Quick Debrief", "section": "seg7"}, {"n": 25, "label": "SEGMENT 8", "title": "Three Days, One Vocabulary Chain", "section": "seg8"}, {"n": 26, "label": "SEGMENT 8", "title": "Preview: What Day 4 Will Let You Do", "section": "seg8"}, {"n": 27, "label": "SEGMENT 8 · WORKSHEET 5", "title": "Worksheet 5 - This Is Where Tomorrow Starts", "section": "seg8"}, {"n": 28, "label": "SEGMENT 9", "title": "Mini-Assessment - 8 Questions", "section": "assessment"}, {"n": 29, "label": null, "title": "Mini-Assessment - Answers", "section": "assessment"}, {"n": 30, "label": "SEGMENT 9", "title": "Common Misconceptions to Watch For", "section": "misconceptions"}, {"n": 31, "label": "END OF DAY 3", "title": "You Calculated a Full Forward Pass, By", "section": "seg9"}], "sections": [{"id": "overview", "kind": "general", "num": null, "title": "Overview", "html": "<p><strong>SAIL — Day 3 Instructional Module Student AI Lab</strong></p>\n<p><strong>STUDENT AI LAB (SAIL)</strong></p>\n<p><em>Day 3: Neural Network Foundations - Neurons, Layers, and the\nForward Pass</em></p>\n<p>Complete Instructional Module - Instructor Script, Student\nActivities, and Assessment</p>\n<p><strong>Total instructional time: </strong>180 minutes (3 hours)</p>\n<p><strong>Audience: </strong>4-H participants, ages 14-18. Students\nhave completed Days 1 and 2 of SAIL and possess only the knowledge\nestablished there.</p>\n<p><strong>Prerequisite materials: </strong>Completed Day 1 and Day 2\nmodules (AI definition; data/input/output vocabulary; AI ethics basics;\nslope-intercept algebra; weight, bias, and weighted sum vocabulary;\nlinear vs. nonlinear relationships). No knowledge beyond Days 1-2 is\nassumed.</p>\n<p><strong>Title: </strong>Day 3 - Neural Network Foundations: Neurons,\nLayers, and the Forward Pass</p>\n<h3 id=\"overview\">Overview</h3>\n<p>Day 2 ended with a discovery students made themselves: a single\nweighted sum (w times x, plus b) can only ever draw a straight line, and\nno amount of slider-dragging could make that line fit a nonlinear data\nset like Data Set B. Day 3 answers the question Day 2 deliberately left\nopen: how do you build a model that can bend? Students will learn that\nthe answer is not a new kind of math, but a new way of connecting the\nexact same weighted-sum calculation they already know - many weighted\nsums, each passed through an activation function, chained together into\nlayers. Today introduces the vocabulary of a neural network (neuron,\nlayer, activation function) and gives students hands-on practice\nperforming a full manual forward pass - calculating, step by step,\nexactly what a small network computes when it processes an input, using\nthe same multiply-then-add discipline established on Days 1 and 2.\nStudents will also watch a live, instructor-led demonstration of the\nmlu-explain Neural Network visual essay, connecting their hand\ncalculations to a dynamic, adjustable model. By the end of today,\nstudents will be able to label the parts of a small neural network,\ncalculate the output of the ReLU activation function, and correctly\nperform a complete forward pass through a two-input, two-hidden-neuron,\none-output network - the exact structure they will begin modifying with\ntheir own hands on Day 4.</p>\n"}, {"id": "objectives", "kind": "general", "num": null, "title": "2. Learning Objectives (Measurable)", "html": "<p>By the end of Day 3, students will be able to:</p>\n<ul>\n<li><p>Define a neuron as a single weighted sum plus an activation\nfunction, and explain that this is a direct extension of Day 2’s\nweighted sum, not a new calculation.</p></li>\n<li><p>Define layer, input layer, hidden layer, and output layer, and\ncorrectly label each in a diagram of a small neural network.</p></li>\n<li><p>Define activation function and explain, using Day 2’s\nlinear-vs-nonlinear vocabulary, why a network needs one in order to fit\nnonlinear data.</p></li>\n<li><p>State the rule for the ReLU activation function and calculate its\noutput for a given input value.</p></li>\n<li><p>Predict, before calculating, whether a given weighted sum will be\nzeroed out or passed through unchanged by ReLU.</p></li>\n<li><p>Perform a complete, correctly ordered manual forward pass through\na two-input, two-hidden-neuron, one-output network, given specific\nweights, biases, and inputs.</p></li>\n<li><p>Explain, in one or two sentences, why chaining multiple weighted\nsums with activation functions allows a network to fit patterns that a\nsingle weighted sum cannot.</p></li>\n<li><p>Identify, in the mlu-explain Neural Network visual essay, which\nvisual elements correspond to a neuron, a weight, a bias, and an\nactivation function.</p></li>\n</ul>\n"}, {"id": "gen3connectiontoday2", "kind": "general", "num": null, "title": "3. Connection to Day 2", "html": "<h3\nid=\"skills-students-already-possess-established-on-days-1-2-not-retaught-today\">Skills\nstudents already possess (established on Days 1-2, not retaught\ntoday)</h3>\n<ul>\n<li><p>The three-part vocabulary: data (what a system learned from),\ninput (what you give it right now), and output (what it gives back right\nnow).</p></li>\n<li><p>Full command of the weighted sum: y = w x + b, with w as weight\n(controls steepness), b as bias (controls starting height), and the\nability to calculate y by hand given w, b, and x, using the explicit\nmultiply-then-add step order.</p></li>\n<li><p>Direct hands-on experience building a slider-controlled linear\nmodel in Desmos and fitting it to data.</p></li>\n<li><p>The habit of writing a prediction before testing, practiced first\non paper (Day 1) and then with sliders (Day 2).</p></li>\n<li><p>The definitions of linear relationship and nonlinear\nrelationship, and the ability to identify which is which by checking\nwhether the gaps between consecutive outputs stay steady or\ngrow/shrink.</p></li>\n<li><p>First-hand experience (Day 2, Segment 7) of trying - and failing\n- to fit a single weighted sum to nonlinear Data Set B, and the\nconclusion that this failure is structural, not a search\nproblem.</p></li>\n<li><p>Passive, instructor-led exposure to a linear regression visual\nessay on <a href=\"https://mlu-explain.github.io\" target=\"_blank\" rel=\"noopener\">mlu-explain.github.io</a> (Day 1), including familiarity with the\nsite’s format: a scatterplot, a line, and interactive controls.</p></li>\n</ul>\n<h3 id=\"brief-review-plan-10-minutes-segment-1\">Brief review plan (10\nminutes, Segment 1)</h3>\n<p>Day 3 opens with a 10-minute review, not a reteach. The review is\nrestricted to exactly the two things today’s new content depends on: (1)\nthe weighted sum calculation, w x + b, and (2) the specific conclusion\nfrom the end of Day 2 - that a single weighted sum can only draw a\nstraight line and therefore cannot fit nonlinear data. The AI\ndefinition, the ethics vocabulary, and the mechanics of dragging Desmos\nsliders are not reviewed today, because no new content in Day 3 depends\non them.
