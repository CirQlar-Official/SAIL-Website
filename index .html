window.SAIL_DATA.days[1] = {"day": 1, "title": "Foundations of AI, Data, and Prediction", "tagline": "What makes an AI tick?", "minutes": 180, "slideCount": 31, "tools": [{"name": "mlu-explain · Linear Regression", "url": "https://mlu-explain.github.io/linear-regression/", "desc": "Interactive visual essay used for the live prediction-model demo.", "id": "mlu-lr", "segments": [5]}], "slides": [{"n": 1, "label": "STUDENT AI LAB · SAIL", "title": "Day 1: Foundations of", "section": "overview"}, {"n": 2, "label": "DAY 1 · ROADMAP", "title": "Schedule", "section": "timeline"}, {"n": 3, "label": "LEARNING OBJECTIVES", "title": "By the End of Today, You will be able to…", "section": "objectives"}, {"n": 4, "label": "SEGMENT 1", "title": "Welcome, Norms, and the Day 1 Roadmap", "section": "seg1"}, {"n": 5, "label": "SEGMENT 2", "title": "Artificial Intelligence: a computer system that improves", "section": "seg2"}, {"n": 6, "label": "SEGMENT 2", "title": "The Two-Step Test", "section": "seg2"}, {"n": 7, "label": null, "title": "AI or Not? Card Sort", "section": "seg2"}, {"n": 8, "label": "SEGMENT 2", "title": "AI or Not? - Answers", "section": "seg2"}, {"n": 9, "label": "SEGMENT 3", "title": "5:00", "section": "break3"}, {"n": 10, "label": "SEGMENT 4", "title": "Three Words, In Order", "section": "seg4"}, {"n": 11, "label": null, "title": "→", "section": "seg4"}, {"n": 12, "label": "SEGMENT 4", "title": "A Weather App Predicting Tomorrow", "section": "seg4"}, {"n": 13, "label": "SEGMENT 4", "title": "Data is the fuel for AI.", "section": "seg4"}, {"n": 14, "label": "SEGMENT 4", "title": "Map the System", "section": "seg4"}, {"n": 15, "label": "SEGMENT 4", "title": "Map the System - Sample Answers", "section": "seg4"}, {"n": 16, "label": "SEGMENT 5", "title": "Watching a Prediction Model Respond to Data", "section": "seg5"}, {"n": 17, "label": null, "title": "“That tilt has a name - slope. Where the line crosses", "section": "seg5"}, {"n": 18, "label": "SEGMENT 5", "title": "Turn to your neighbor: what was the input, and", "section": "seg5"}, {"n": 19, "label": "SEGMENT 6", "title": "10:00", "section": "break6"}, {"n": 20, "label": "SEGMENT 7", "title": "Three Terms Before We Discuss Anything", "section": "seg7"}, {"n": 21, "label": "SEGMENT 7", "title": "How Bias Happens: Resume Screening", "section": "seg7"}, {"n": 22, "label": "SEGMENT 7", "title": "Real-World Consequences", "section": "seg7"}, {"n": 23, "label": "SEGMENT 8", "title": "Four Definitions, Ground Up", "section": "seg8"}, {"n": 24, "label": "THE MODEL'S EQUATION", "title": "y", "section": "seg8"}, {"n": 25, "label": null, "title": "Calculate Output From an Equation", "section": "seg8"}, {"n": 26, "label": "SEGMENT 8", "title": "7", "section": "seg8"}, {"n": 27, "label": "SEGMENT 9", "title": "Mini-Assessment - 8 Questions", "section": "assessment"}, {"n": 28, "label": null, "title": "Mini-Assessment - Answers", "section": "assessment"}, {"n": 29, "label": "SEGMENT 9", "title": "Common Misconceptions to Watch For", "section": "misconceptions"}, {"n": 30, "label": "ENDING", "title": "No Homework. Ever. The Bridge Worksheet Closes", "section": "assessment"}, {"n": 31, "label": "END OF DAY 1", "title": "The Foundation Is Built.", "section": "assessment"}], "sections": [{"id": "overview", "kind": "general", "num": null, "title": "Overview", "html": "<p><strong>SAIL — Day 1 Instructional Module Student AI Lab</strong></p>\n<p><strong>STUDENT AI LAB (SAIL)</strong></p>\n<p><em>Day 1: Foundations of AI, Data, and Prediction</em></p>\n<p>Complete Instructional Module - Instructor Script, Student\nActivities, and Assessment</p>\n<p><strong>Total instructional time: </strong>180 minutes (3 hours)</p>\n<p><strong>Audience: </strong>4-H participants, ages 14-18. No prior AI\nor programming knowledge assumed.</p>\n<p><strong>Prerequisite materials: </strong>None - this module is fully\nself-contained.</p>\n<p><strong>Title: </strong>Day 1 - Foundations of AI, Data, and\nPrediction</p>\n<h3 id=\"overview\">Overview</h3>\n<p>This module introduces students to what artificial intelligence is,\nhow it differs from ordinary computer programs, and why data is the raw\nmaterial that makes AI systems work. Students will learn to identify the\ninput-output structure that underlies every AI system, from voice\nassistants to recommendation feeds, and will see a live visual\ndemonstration of information flowing through a simple predictive model.\nThe session also introduces foundational AI ethics concepts - bias,\nprivacy, and consequence - so students begin thinking critically about\nAI’s role in society from day one. Finally, students review the algebra\nconcept of slope-intercept form (y = mx + b), which is the mathematical\nbackbone of the linear prediction model they will build by hand and in\nDesmos on Day 2. By the end of the day, students will be able to define\nAI in their own words, identify inputs and outputs in real systems, and\nconnect an algebraic equation to the idea of a prediction.</p>\n"}, {"id": "objectives", "kind": "general", "num": null, "title": "2. Learning Objectives (Measurable)", "html": "<p>By the end of Day 1, students will be able to:</p>\n<ul>\n<li><p><strong>Define </strong>artificial intelligence in one or two\nsentences using the criteria of “learns from data” and “makes a decision\nor prediction.”</p></li>\n<li><p><strong>Distinguish </strong>between an AI system and a standard\nrule-based program when given an example.</p></li>\n<li><p><strong>Identify </strong>the input(s) and output of a given\neveryday AI system (e.g., spam filter, music recommendation).</p></li>\n<li><p><strong>Explain </strong>why data is necessary for an AI system\nto function.</p></li>\n<li><p><strong>Describe </strong>at least one way an AI system’s output\ncan be unfair or biased, and explain why this happens.</p></li>\n<li><p><strong>State </strong>the slope-intercept form of a linear\nequation (y = mx + b) and identify the slope and intercept in a given\nequation.</p></li>\n<li><p><strong>Calculate </strong>the output (y) of a linear equation\nwhen given specific values for slope, intercept, and input (x).</p></li>\n<li><p><strong>Predict</strong>, in writing, how changing the slope or\nintercept of a line will change its output, before testing the\nprediction.</p></li>\n</ul>\n"}, {"id": "timeline", "kind": "general", "num": null, "title": "3. Full Timeline (180 Minutes Total)", "html": "<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>#</strong></th>\n<th><strong>Segment</strong></th>\n<th><strong>Duration</strong></th>\n<th><strong>Time Block</strong></th>\n<th><strong>Type</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Welcome, Norms, and Day 1 Roadmap</td>\n<td>10 min</td>\n<td>0:00-0:10</td>\n<td>Lecture / Discussion</td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>What Is AI? (Definition + Examples)</td>\n<td>30 min</td>\n<td>0:10-0:40</td>\n<td>Lecture + Activity</td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>Break</td>\n<td>5 min</td>\n<td>0:40-0:45</td>\n<td>Break</td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>Data and the Input-Output Idea</td>\n<td>35 min</td>\n<td>0:45-1:20</td>\n<td>Lecture + Activity</td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td>Visual Demo: Watching a Prediction Model Respond to Data</td>\n<td>15 min</td>\n<td>1:20-1:35</td>\n<td>Instructor Demo</td>\n</tr>\n<tr class=\"even\">\n<td>6</td>\n<td>Break</td>\n<td>10 min</td>\n<td>1:35-1:45</td>\n<td>Break</td>\n</tr>\n<tr class=\"odd\">\n<td>7</td>\n<td>Introduction to AI Ethics</td>\n<td>30 min</td>\n<td>1:45-2:15</td>\n<td>Lecture + Discussion</td>\n</tr>\n<tr class=\"even\">\n<td>8</td>\n<td>Algebra Refresher: Slope-Intercept Form</td>\n<td>30 min</td>\n<td>2:15-2:45</td>\n<td>Lecture + Activity</td>\n</tr>\n<tr class=\"odd\">\n<td>9</td>\n<td>Mini-Assessment and Wrap-Up</td>\n<td>15 min</td>\n<td>2:45-3:00</td>\n<td>Assessment</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Total: 180 minutes.</strong></p>\n"}, {"id": "seg1", "kind": "segment", "num": 1, "title": "Segment 1: Welcome, Norms, and Day 1 Roadmap", "html": "<p><strong>Duration: </strong>10 minutes (0:00-0:10) | <strong>Type:\n</strong>Lecture / Discussion</p>\n<p><strong>Materials needed: </strong>None beyond the printed Day 1\npacket cover page for each student.</p>\n<h3 id=\"instructor-says\">Instructor says:</h3>\n<p><em>Welcome to the Student AI Lab. Over the next five days, you are\ngoing to build, by hand and on a computer, the same kind of system that\npowers things like voice assistants, recommendation\n<strong>feeds</strong>, and self-driving cars. You will not just learn\nabout AI - you will build small working versions of it\nyourself.</em></p>\n<p><em>Today is Day 1. Today has one job: build the foundation\neverything else stands on. By the end of today, you will be able to\ndefine what AI actually is, you’ll understand why AI systems need data,\nand you’ll refresh an algebra skill - slope and intercept - that you\nwill use tomorrow to build your first predictive model.</em></p>\n<p><em>Here’s the plan for today, in order: What AI Is, Data and\nInput-Output, a short visual demo, AI Ethics, an algebra refresher, and\na short check at the end to confirm you’ve got it.</em></p>\n<p><strong>Instructor action: </strong>Write the day’s six segment names\non the board/slide in order, left to right, so students have a visual\nroadmap they can refer to all day.</p>\n<h3 id=\"norms\">Norms</h3>\n<p><em>Three norms for this room. One: if you don’t understand a word I\nuse, say ‘define that’ out loud - that is not an interruption, that is\nthe job. Two: <strong>every</strong> definition I give you, I will give\nyou before I use the term in a sentence, not after. Three: wrong answers\nduring practice are expected and useful - I will never use them to\nembarrass anyone.</em></p>\n"}, {"id": "seg2", "kind": "segment", "num": 2, "title": "Segment 2: What Is AI? (Definition + Examples)", "html": "<p><strong>Duration: </strong>30 minutes (0:10-0:40) | <strong>Type:\n</strong>Lecture + Activity</p>\n<h3 id=\"step-2.1---define-artificial-intelligence-5-min\">Step 2.1 -\nDefine “Artificial Intelligence” (5 min)</h3>\n<p><em>Before we go further, here is our definition for the\nweek.</em></p>\n<p><em>Artificial Intelligence (AI): a computer system that improves at\na task by learning patterns from data, rather than by following a fixed\nlist of instructions written by a human.</em></p>\n<p><em>Let’s break that definition into its two required parts. Part\none: it learns patterns from data. Part two: it does this instead of\nfollowing a fixed list of instructions.</em></p>\n<p><em>That second part is the key difference most people miss. A\nmicrowave that runs for exactly the number of seconds you punch in is\nnot AI - a human wrote the exact instructions, and the microwave never\nchanges its behavior based on past microwaves. A system that looks at\nthousands of past emails and learns on its own which patterns mean\n‘spam’ - that’s AI, because no human wrote down every spam rule by hand.\nThe system found the patterns itself.</em></p>\n<h3 id=\"step-2.2---contrast-ai-vs.-rule-based-program-10-min\">Step 2.2 -\nContrast AI vs. Rule-Based Program (10 min)</h3>\n<p>Let’s test this definition with a comparison. I’m going to define one\nmore term first: a rule-based program, which is a computer program that\nfollows a fixed set of if-this-then-that instructions written entirely\nby a human, with no learning involved.</p>\n<p><em>Here is rule-based program: a program that says ‘if the user\ntypes 2+2, output 4.’ A human wrote that exact rule. The program will do\nthat forever, and it never gets better or worse - it just follows the\nrule.</em></p>\n<p><em>Here is AI: a program that is shown thousands of photos labeled\n‘cat’ or ‘not cat,’ and on its own, without a human writing ‘a cat has\npointy ears and whiskers,’ it learns which patterns of pixels tend to\nshow up in cat photos. Nobody <strong>hand-wrote</strong> that rule. The\nsystem extracted it from data.</em></p>\n<h3 id=\"worked-example-1-full-in-this-segment\">Worked Example 1 (full,\nin this segment)</h3>\n<p><em>Let’s work through one example together, fully, out\nloud.</em></p>\n<p><em>Example: A thermostat that turns on heat when the temperature\ndrops below 68 degrees.</em></p>\n<p>Step 1 - Ask: did a human write the exact rule it follows?\n<strong>Yes - ‘if temp <strong>&lt;</strong> 68, turn on heat’ is a rule\na person typed in. Step 2 - Ask: does the system learn or change its\nrule based on new data over time? No - it always uses 68, forever,\nregardless of what happens. Step 3 - Conclusion: this is a rule-based\nprogram, not AI, because it fails part two of our definition </strong>-\nit never learns patterns from data.</p>\n<p><em>Now compare: a thermostat that watches your behavior for two\nweeks, notices you always lower the heat at 10 PM, and starts doing it\nautomatically without being told 10 PM is the rule.</em></p>\n<p><em>Step 1 - Did a human write ‘10 PM, lower heat’ directly? No.</em>\n<em>Step 2 - Did the system find that pattern itself, from data about\nyour behavior? Yes.</em> <em>Step 3 - Conclusion: this is AI, because it\nlearned the pattern from data rather than following a human-written\nrule.</em></p>\n<h3 id=\"step-2.3---student-activity-ai-or-not-sort-15-min\">Step 2.3 -\nStudent Activity: AI or Not? Sort (15 min)</h3>\n<p><strong>Instructions given to students, exactly as written on the\nworksheet: </strong>You have 10 cards. Each card describes one system.\nFor each card, write ‘AI’ or ‘Rule-Based’ in the blank, and write one\nsentence explaining which part of the definition led you to that answer.\nUse the two-step test we just practiced: (1) Did a human write the exact\nrule, or (2) did the system learn the pattern from data? Work with the\npartner at your table. You have 10 minutes.</p>\n<p><strong>The 10 cards (printed on worksheet):</strong></p>\n<ul>\n<li><p>A vending machine that dispenses a snack when you insert the\ncorrect amount of money.</p></li>\n<li><p>A music app that learns which songs you skip and starts\nrecommending different songs.</p></li>\n<li><p>A traffic light that changes color every 45 seconds, no matter\nwhat.</p></li>\n<li><p>A photo app that learns to recognize your face in pictures after\nyou tag yourself a few times.</p></li>\n<li><p>A calculator that adds two numbers when you press “+”.</p></li>\n<li><p>An email inbox that learns from thousands of users marking\nmessages as “spam” and starts filtering similar messages\nautomatically.</p></li>\n<li><p>A washing machine with a dial you turn to select “delicate” or\n“heavy duty.”</p></li>\n<li><p>A video platform that learns what kind of videos keep you\nwatching longer and shows you more of them.</p></li>\n<li><p>An alarm clock that rings at the exact time you set it.</p></li>\n<li><p>A customer service chatbot that gets better at answering\nquestions the more conversations it has.</p></li>\n</ul>\n<p><strong>Answer key: </strong>1=Rule-Based, 2=AI, 3=Rule-Based, 4=AI,\n5=Rule-Based, 6=AI, 7=Rule-Based, 8=AI, 9=Rule-Based, 10=AI.</p>\n<p>Segment 3: Break</p>\n<p><strong>Duration: </strong>5 minutes (0:40-0:45)</p>\n<p><em>Five-minute break. Be back in your seat at [state exact clock\ntime].</em></p>\n"}, {"id": "break3", "kind": "segment", "num": 3, "title": "Segment 3: Break", "html": "<p>Scheduled break. Students step away from screens; the timer on the slide counts it down. Durations are listed in the day timeline.</p>"}, {"id": "seg4", "kind": "segment", "num": 4, "title": "Segment 4: Data and the Input-Output Idea", "html": "<p><strong>Duration: </strong>35 minutes (0:45-1:20) | <strong>Type:\n</strong>Lecture + Activity</p>\n<h3 id=\"step-4.1---define-data-input-and-output-8-min\">Step 4.1 - Define\n“Data,” “Input,” and “Output” (8 min)</h3>\n<p><em>Three more definitions, all before we use them.</em></p>\n<p><em>Data: recorded information that a system can use, made up of\nindividual examples called data points.</em></p>\n<p><em>Input: the information that is given to a system before it does\nanything.</em></p>\n<p><em>Output: the result a system produces after it processes the\ninput.</em></p>\n<p><em>Here is why this matters: every AI system you will ever encounter\ncan be described as taking an input, doing something with it using\npatterns it learned from data, and producing an output. If you can find\nthe input and the output, you can understand any AI system at a basic\nlevel, even one you’ve never seen before.</em></p>\n<p><em>Let’s apply this right now, to something simple. A spam filter.\nThe input is an incoming email. The output is a label: ‘spam’ or ‘not\n<strong>spam</strong>.’ The data the system learned from is the huge\npile of past emails that were already labeled spam or not spam by real\npeople.</em></p>\n<h3 id=\"step-4.2---worked-example-2-identifying-inputoutput-7-min\">Step\n4.2 - Worked Example 2: Identifying Input/Output (7 min)</h3>\n<p><em>Let’s do one fully, out loud, together.</em></p>\n<p><em>Example: A weather app that predicts tomorrow’s\ntemperature.</em></p>\n<p><em>Step 1 - What goes IN to the system? Today’s temperature,\nhumidity, wind speed, and recent weather patterns from sensors. That’s\nthe input.</em> <em>Step 2 - What comes OUT of the system? A single\npredicted number - tomorrow’s temperature. That’s the output.</em>\n<em>Step 3 - What DATA did the system learn from, before it ever made\nthis prediction? Years of past weather recordings, where the actual\nnext-day temperature was already known. The system studied those past\nexamples to find the pattern connecting today’s conditions to tomorrow’s\ntemperature.</em></p>\n<p><em>Notice the three are different: data is what it learned from in\nthe past, input is what you give it right now, and output is what it\ngives back right now.</em></p>\n<h3 id=\"step-4.3---why-data-is-necessary-5-min\">Step 4.3 - Why Data Is\nNecessary (5 min)</h3>\n<p>Here’s the direct connection back to our AI definition. Remember: AI\nlearns patterns from data instead of following a human-written rule. If\nthere is no data, there is nothing to learn the pattern <strong>from -\nwhich means there is no AI. This is why you’ll hear people\n</strong>say** ‘data is the fuel for AI.’ Without enough data, or\nwithout good-quality data, an AI system cannot find a real pattern, and\nits **outputs will be wrong or unreliable. We will come back to this\nidea directly when we talk about bias in the ethics section.</p>\n<h3 id=\"step-4.4---student-activity-map-the-system-15-min\">Step 4.4 -\nStudent Activity: Map the System (15 min)</h3>\n<p><strong>Instructions given to students, exactly as written on the\nworksheet: </strong>For each of the 5 systems below, fill in three\nblanks: INPUT, OUTPUT, and DATA IT LIKELY LEARNED FROM. Use full\nsentences. Work alone for the first 8 minutes, then check your answers\nwith your table group for the last 7 minutes.</p>\n<p><strong>The 5 systems (printed on worksheet):</strong></p>\n<ul>\n<li><p>A video game that adjusts its difficulty based on how well you’re\ndoing.</p></li>\n<li><p>A navigation app that suggests the fastest driving\nroute.</p></li>\n<li><p>A handwriting app that converts your handwritten notes into typed\ntext.</p></li>\n<li><p>A streaming service that shows you a “Recommended for You” row of\nshows.</p></li>\n<li><p>A photo app that automatically sorts your pictures into albums\nlike “Beach” or “Dogs.”</p></li>\n</ul>\n<p><strong>Sample correct answers (for instructor\nreference):</strong></p>\n<ul>\n<li><p>Input: your current performance (deaths, score, time). Output: a\nnew difficulty level. Data: records from many past players showing what\ndifficulty kept players engaged.</p></li>\n<li><p>Input: your starting point, destination, and current traffic.\nOutput: a suggested route. Data: historical and live traffic patterns\nfrom many past drivers.</p></li>\n<li><p>Input: the shape and stroke pattern of your handwriting. Output:\ntyped text. Data: thousands of labeled handwriting samples paired with\ntheir correct typed letters.</p></li>\n<li><p>Input: your past viewing history. Output: a list of suggested\nshows. Data: viewing patterns from many users with similar\nhabits.</p></li>\n<li><p>Input: the pixels of your photo. Output: an album label. Data:\nmillions of labeled photos showing what beaches, dogs, etc. look\nlike.</p></li>\n</ul>\n"}, {"id": "seg5", "kind": "segment", "num": 5, "title": "Segment 5: Visual Demo - Watching a Prediction Model Respond to Data", "html": "<p><strong>Duration: </strong>15 minutes (1:20-1:35) | <strong>Type:\n</strong>Instructor Demo (projected, instructor-driven)</p>\n<p><strong>Materials needed: </strong>One laptop/projector connection.\nWebsite: <a href=\"https://mlu-explain.github.io/linear-regression/\" target=\"_blank\" rel=\"noopener\">mlu-explain.github.io/linear-regression/</a> (pre-approved\ninstructor-driven site; students do not need individual devices for this\nsegment).</p>\n<p><strong>Setup note (read before delivering): </strong>This is\ninstructor-led only. Students watch the projected screen; no individual\nstudent laptops are used in this segment. This avoids any dependency on\nthe internet-safety training, which is addressed separately before\nstudents use devices independently later in the course.</p>\n<h3 id=\"step-5.1---frame-the-purpose-2-min\">Step 5.1 - Frame the Purpose\n(2 min)</h3>\n<p><em>You’ve now learned the AI definition and the input-output idea on\npaper. I’m going to show you what that <strong>actually looks</strong>\nlike in motion, using a visual tool built specifically to show how a\nprediction model behaves. You are not going to touch the controls today\n- that’s tomorrow’s job, on Day 2. Today, just watch what changes and\nwhat stays the same.</em></p>\n<h3 id=\"step-5.2---live-demo-walkthrough-10-min\">Step 5.2 - Live Demo\nWalkthrough (10 min)</h3>\n<p>Instructor projects the Linear Regression visual essay at\n<a href=\"https://mlu-explain.github.io/linear-regression/\" target=\"_blank\" rel=\"noopener\">mlu-explain.github.io/linear-regression/</a> and narrates using this exact\nscript structure:</p>\n<p><em>What you’re looking at is a scatter plot - each dot is one data\npoint, one past example, like the past emails or past weather days we\ntalked about earlier. The line you see is the model’s current\nprediction. Watch what I do now: I’m going to\nscroll/<strong>interact</strong> so the line moves. [Instructor scrolls\nor adjusts the visual per the site’s interactive controls.] Notice the\nline is trying to get as close as possible to all the dots at once -\nthat’s the model finding the pattern in the data, exactly like we\ndiscussed. The line is the output. Every position along that line, for a\ngiven input on the x-axis, is the model’s prediction.</em></p>\n<p><em>Watch what happens to the line’s tilt and position as the data\nchanges [continue scrolling through the essay’s built-in animations].\nThat tilt has a name - it’s called slope - and where the line crosses\nthe vertical axis has a name too - it’s called the intercept. You’ll\nwork with both of those words directly in the next segment, and you’ll\nbuild your own version of this exact kind of line tomorrow in a tool\ncalled Desmos.</em></p>\n<h3 id=\"step-5.3---quick-debrief-3-min\">Step 5.3 - Quick Debrief (3\nmin)</h3>\n<p>Instructor asks the class, aloud:</p>\n<p><em>In one sentence, turn to your neighbor and tell them: what was\nthe input, and what was the output, in what you just watched?</em></p>\n<p><strong>Expected answer: </strong>input = a position on the x-axis (a\nnew data point’s location), output = the predicted y-value the line\ngives at that position.</p>\n<p>Segment 6: Break</p>\n<p><strong>Duration: </strong>10 minutes (1:35-1:45)</p>\n<p><em>Ten-minute break. Grab a snack if you’d like one. Be back in your\nseat at [state exact clock time].</em></p>\n"}, {"id": "break6", "kind": "segment", "num": 6, "title": "Segment 6: Break", "html": "<p>Scheduled break. Students step away from screens; the timer on the slide counts it down. Durations are listed in the day timeline.</p>"}, {"id": "seg7", "kind": "segment", "num": 7, "title": "Segment 7: Introduction to AI Ethics", "html": "<p><strong>Duration: </strong>30 minutes (1:45-2:15) | <strong>Type:\n</strong>Lecture + Discussion</p>\n<h3 id=\"step-7.1---define-key-ethics-terms-8-min\">Step 7.1 - Define Key\nEthics Terms (8 min)</h3>\n<p><em>Three definitions before we discuss anything.</em></p>\n<p><em>Bias (in AI): a consistent, unfair pattern in an AI system’s\noutputs that disadvantages a specific group of people, usually because\nthe data it learned from was unbalanced or unrepresentative.</em></p>\n<p><em>Data privacy: the right of a person to control who can collect,\nsee, and use their personal information.</em></p>\n<p><em>Automated decision-making: a situation where an AI system’s\noutput directly causes a real decision about a person, without a human\nre-checking it first.</em></p>\n<p><em>Here’s why these connect directly to what we already covered. We\nsaid AI learns patterns from data. If the data only contains examples\nfrom one type of person, place, or situation, the system will learn a\npattern that only works well for that narrow group - and will perform\nworse, or unfairly, for everyone else. That is bias, and it comes\ndirectly from the data problem we <strong>already</strong>\ndiscussed.</em></p>\n<h3 id=\"step-7.2---worked-example-how-bias-happens-7-min\">Step 7.2 -\nWorked Example: How Bias Happens (7 min)</h3>\n<p><em>Here’s a concrete case, walked through step by step.</em></p>\n<p><em>Example: A company builds an AI system to screen job resumes,\ntrained only on resumes from people the company <strong>hired</strong>\nover the past 10 years.</em></p>\n<p><em>Step 1 - What’s the data? Past resumes of people who got\nhired.</em> <em>Step 2 - What pattern might the system learn? If the\ncompany mostly hired people from certain schools or backgrounds in the\npast, the system <strong>will</strong> learn ‘resumes like these get\nhired’ - even if that pattern has nothing to do with who’s\n<strong>actually qualified</strong>.</em> <em>Step 3 - What’s the\noutput? The system now downgrades <strong>resumes</strong> that don’t\nmatch the old pattern, even from equally or more qualified\ncandidates.</em> <em>Step 4 - Where did this go wrong? Not in\n<strong>the math</strong> - the system did exactly what it was trained\nto do. The problem is the data: it reflected the past, including any\nunfairness already in the past, and the system copied that pattern\nforward.</em></p>\n<h3 id=\"step-7.3---class-discussion-real-world-consequences-10-min\">Step\n7.3 - Class Discussion: Real-World Consequences (10 min)</h3>\n<p>Instructor asks the class these exact prompts, one at a time,\nallowing discussion after each:</p>\n<p><em>Prompt 1: Can you think of a situation where an AI system making\na wrong prediction would just be annoying, versus a situation where it\nwould seriously harm someone? What’s the difference between those two\ncases?</em></p>\n<p><em>Prompt 2: If a company won’t tell you why an AI system rejected\nyour loan application or job application, what problem does that create,\neven if the decision itself was correct?</em></p>\n<p><em>Prompt 3: Whose responsibility is it when an AI system causes\nharm - the people who built it, the people who supplied the data, the\ncompany that deployed it, or someone else? Why?</em></p>\n<p><strong>Instructor</strong> note within script: Do not resolve Prompt\n3 with a single “correct” answer. The goal is structured reasoning, not\nconsensus.</p>\n"}, {"id": "seg8", "kind": "segment", "num": 8, "title": "Segment 8: Algebra Refresher - Slope-Intercept Form", "html": "<p><strong>Duration: </strong>30 minutes (2:15-2:45) | <strong>Type:\n</strong>Lecture + Activity</p>\n<h3 id=\"step-8.1---define-terms-before-use-8-min\">Step 8.1 - Define\nTerms Before Use (8 min)</h3>\n<p><em>This is the math you’ll use tomorrow to build your first\nprediction model, so we are going to rebuild it from the ground up. Four\ndefinitions, in order, each one needed before the next.</em></p>\n<p><em>Variable: a letter that stands in for a number that can\nchange.</em></p>\n<p><em>Linear equation: an equation where, when graphed, the\nrelationship between the two variables forms a straight line.</em></p>\n<p><em>Slope: a number that tells you how much the output (y) changes\nfor every one-unit increase in the input (x). In the equation y = mx +\nb, slope is the letter m.</em></p>\n<p><em>Intercept: the value of y when x equals zero - in other words,\nwhere the line crosses the vertical axis. In the equation y = mx + b,\nintercept is the letter b.</em></p>\n<p><em>Put together, the full equation <strong>is:</strong> y = mx + b,\nwhere x is the input, y is the output, m is the slope, and b is the\nintercept. This is the exact same shape as the line you watched move in\nthe visual demo earlier today - the model’s prediction line is described\nby this exact equation.</em></p>\n<h3\nid=\"step-8.2---worked-example-calculating-output-from-an-equation-7-min\">Step\n8.2 - Worked Example: Calculating Output from an Equation (7 min)</h3>\n<p><em>Let’s calculate, fully, step by step.</em></p>\n<p><em>Example: y = 2x + 3. What is y when x = 4?</em></p>\n<p><em>Step 1 - Identify each value: m = 2, b = 3, x = 4.</em> <em>Step\n2 - Substitute the values into the equation: y = (2)(4) + 3.</em>\n<em>Step 3 - Multiply first: y = 8 + 3.</em> <em>Step 4 - Add: y =\n11.</em> <em>Step 5 - State the answer in context: when the input is 4,\nthis model predicts an output of 11.</em></p>\n<p><em>Second example: y = -1x + 10. What is y when x = 6?</em></p>\n<p><em>Step 1 - Identify each value: m = -1, b = 10, x = 6.</em>\n<em>Step 2 - Substitute: y = (-1)(6) + 10.</em> <em>Step 3 - Multiply\nfirst: y = -6 + 10.</em> <em>Step 4 - Add: y = 4.</em> <em>Step 5 -\nState in context: when the input is 6, this model predicts an output of\n4. Notice the negative slope means y goes down as x goes up - that’s a\nuseful pattern to recognize on sight.</em></p>\n<h3\nid=\"step-8.3---student-activity-predict-before-you-calculate-15-min\">Step\n8.3 - Student Activity: Predict Before You Calculate (15 min)</h3>\n<p><strong>Instructions given to students, exactly as written on the\nworksheet: </strong>For each equation below, first WRITE A PREDICTION in\nthe ‘Prediction’ box: will y be bigger or smaller than the previous row,\nand roughly what number do you expect? Only after writing your\nprediction, calculate the actual value of y using the steps from the\nworked examples. You have 12 minutes, then we will check answers as a\nclass.</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>#</strong></th>\n<th><strong>Equation / Find y when…</strong></th>\n<th><strong>Prediction (before calculating)</strong></th>\n<th><strong>Calculation (after predicting)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>y = 3x + 1, x = 2</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>y = 3x + 1, x = 5</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>y = -2x + 8, x = 3</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>y = 0.5x + 4, x = 10</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td>y = -4x - 1, x = 2</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Answer key: </strong>1) y=7. 2) y=16. 3) y=2. 4) y=9. 5)\ny=-9.</p>\n"}, {"id": "gen6checksforunderstandingc", "kind": "general", "num": null, "title": "6. Checks for Understanding (CFUs)", "html": "<p>Seven CFUs are provided for reflection at the end of each\nsegment.</p>\n<h3 id=\"cfu-1-after-segment-2-step-2.1---ai-definition\">CFU 1 (after\nSegment 2, Step 2.1 - AI Definition)</h3>\n<p><strong>Question: </strong>In your own words, what are the two parts\nof our definition of AI?</p>\n<p><strong>Expected correct answer: </strong>It learns patterns from\ndata, and it does this instead of following a fixed list of\nhuman-written instructions.</p>\n<p><strong>Common wrong answer: </strong>AI is a robot / AI is a\ncomputer that’s really smart.</p>\n<p><strong>Correction: </strong>That’s describing what AI might look\nlike, not what makes something AI. A robot could be entirely rule-based\nwith no learning at all. Go back to the two-part test: did it learn from\ndata, or did a human write the exact rule?</p>\n<h3 id=\"cfu-2-after-segment-2-step-2.2---ai-vs.-rule-based\">CFU 2 (after\nSegment 2, Step 2.2 - AI vs. Rule-Based)</h3>\n<p><strong>Question: </strong>A calculator gives the same answer to 2+2\nevery single time, no matter who uses it or how many times it’s used. Is\na calculator AI? Why or why not?</p>\n<p><strong>Expected correct answer: </strong>No - a human wrote the\nexact rule for addition, and the calculator never learns or changes that\nrule from data.</p>\n<p><strong>Common wrong answer: </strong>Yes, because it’s a computer\nprogram.</p>\n<p><strong>Correction: </strong>Being a computer program is necessary\nbut not sufficient - lots of computer programs aren’t AI. Apply the\ntest: did a human write the fixed rule, or did the system learn a\npattern from data? Here, a human wrote the rule, so it’s rule-based.</p>\n<h3 id=\"cfu-3-after-segment-4-step-4.1---inputoutput\">CFU 3 (after\nSegment 4, Step 4.1 - Input/Output)</h3>\n<p><strong>Question: </strong>For a navigation app suggesting a driving\nroute, what is the input and what is the output?</p>\n<p><strong>Expected correct answer: </strong>Input: your start point,\ndestination, and current traffic. Output: the suggested route.</p>\n<p><strong>Common wrong answer: </strong>Students confuse data (what it\nlearned from) with input (what you give it right now), saying ‘input is\nall the past traffic from other drivers.’</p>\n<p><strong>Correction: </strong>That’s the data it learned from, not the\ninput. The input is what YOU give the system right now, today, to get an\nanswer. The data is the huge pile of past examples it already studied\nbefore you ever opened the app.</p>\n<h3 id=\"cfu-4-after-segment-4-step-4.3---why-data-matters\">CFU 4 (after\nSegment 4, Step 4.3 - Why Data Matters)</h3>\n<p><strong>Question: </strong>If an AI weather app only had 3 days of\npast weather data to learn from instead of 10 years, what would you\nexpect, and why?</p>\n<p><strong>Expected correct answer: </strong>The predictions would\nlikely be much less accurate or unreliable, because there isn’t enough\ndata for the system to find a real, dependable pattern.</p>\n<p><strong>Common wrong answer: </strong>It would still work the same,\njust slower.</p>\n<p><strong>Correction: </strong>Amount of data doesn’t mainly affect\nspeed - it affects whether the system can find a real pattern at all.\nThree days isn’t enough examples to separate a real weather pattern from\nrandom chance.</p>\n<h3 id=\"cfu-5-after-segment-7-step-7.1---bias-definition\">CFU 5 (after\nSegment 7, Step 7.1 - Bias Definition)</h3>\n<p><strong>Question: </strong>Where does bias in an AI system usually\ncome from - the math equations, or something else? Explain.</p>\n<p><strong>Expected correct answer: </strong>It usually comes from the\ndata - if the data is unbalanced or doesn’t represent everyone fairly,\nthe system learns and repeats that imbalance, even though the math\nitself is working correctly.</p>\n<p><strong>Common wrong answer: </strong>The programmer secretly wrote\nunfair code on purpose.</p>\n<p><strong>Correction: </strong>That can happen, but it’s not the usual\ncause we’re focused on today. Most bias comes from unbalanced training\ndata, not from someone intentionally writing unfair rules - remember, AI\nsystems learn their own patterns, they’re often not given explicit rules\nat all.</p>\n<h3 id=\"cfu-6-after-segment-8-step-8.1---slopeintercept-definitions\">CFU\n6 (after Segment 8, Step 8.1 - Slope/Intercept Definitions)</h3>\n<p><strong>Question: </strong>In the equation y = −3x + 7, what is the\nslope and what is the intercept?</p>\n<p><strong>Expected correct answer: </strong>Slope (m) = −3. Intercept\n(b) = 7.</p>\n<p><strong>Common wrong answer: </strong>“Slope = 7, intercept = −3”\n(reversing the two) or “slope = 3” (dropping the negative sign).</p>\n<p><strong>Correction: </strong>Go back to the equation pattern y = mx +\nb. The number directly attached to x - including its sign - is always m,\nthe slope. The number by itself at the end is always b, the intercept.\nHere that’s −3 and 7, in that order, and the negative sign on the slope\nis part of the answer, not optional.</p>\n<h3 id=\"cfu-7-after-segment-8-step-8.2---calculation\">CFU 7 (after\nSegment 8, Step 8.2 - Calculation)</h3>\n<p><strong>Question: </strong>For y = 4x + 2, what is y when x = 0? What\ndoes this tell you about the relationship between x = 0 and the\nintercept?</p>\n<p><strong>Expected correct answer: </strong>y = 2. This shows that when\nx = 0, y always equals the intercept - that’s exactly what ‘intercept’\nmeans.</p>\n<p><strong>Common wrong answer: </strong>y = 0 (assuming any input of 0\nproduces an output of 0).</p>\n<p><strong>Correction: </strong>Only the slope term becomes 0 when x = 0\n- m times 0 is 0 - but the intercept, b, is still added on its own and\ndoesn’t disappear. y = (4)(0) + 2 = 0 + 2 = 2, not 0.</p>\n"}, {"id": "misconceptions", "kind": "general", "num": null, "title": "7. Common Misconceptions", "html": "<p>Seven common misconceptions are provided to clarify any\nuncertainty.</p>\n<p><strong>1. Misconception: </strong>“AI means a robot or a physical\nmachine.”</p>\n<p><strong>Correction strategy: </strong>Explicitly state that AI is\nsoftware - a pattern-learning system - and can run with no physical\nrobot at all (e.g., a spam filter, a recommendation feed). Show at least\none non-robot example immediately after the definition is given.</p>\n<p><strong>2. Misconception: </strong>“Any computer program that seems\nsmart or complicated is AI.”</p>\n<p><strong>Correction strategy: </strong>Re-apply the two-part test\n(human-written fixed rule vs. learned-from-data pattern) every time this\nsurfaces. Complexity is not the test; the source of the rule is the\ntest.</p>\n<p><strong>3. Misconception: </strong>“Input and data are the same\nthing.”</p>\n<p><strong>Correction strategy: </strong>Use the explicit three-part\nvocabulary every time: data (what it learned from, in the past), input\n(what you give it right now), output (what it gives back right now).\nRepeat this triplet aloud in every worked example until it’s\nautomatic.</p>\n<p><strong>4. Misconception: </strong>“AI bias means the programmer was\npersonally prejudiced or deliberately coded something unfair.”</p>\n<p><strong>Correction strategy: </strong>Walk through the\nresume-screening worked example again, emphasizing that the system\nperformed its math correctly - the unfairness entered through the data,\nnot through malicious code. Bias can occur with zero ill intent from\nanyone involved.</p>\n<p><strong>5. Misconception: </strong>“The slope is just ‘the number in\nthe equation,’ so students grab whichever number they see first\nregardless of position.”</p>\n<p><strong>Correction strategy: </strong>Anchor to position in the\nformula every time: the number multiplied by x is always slope; the\nnumber standing alone is always intercept. Have students point to and\nlabel both parts on at least 3 different equations before moving to\ncalculation.</p>\n<p><strong>6. Misconception: </strong>“A negative slope means the answer\n(y) will be negative.”</p>\n<p><strong>Correction strategy: </strong>Use Worked Example 4’s second\nequation (y = −1x + 10 at x = 6, giving y = 4, a positive result) to\nexplicitly show that negative slope means y decreases as x increases -\nit does not mean the output itself must be negative.</p>\n<p><strong>7. Misconception: </strong>“More data always means an AI\nsystem is automatically fair and accurate.”</p>\n<p><strong>Correction strategy: </strong>Clarify that data must also be\nrepresentative, not just plentiful - a huge dataset that still excludes\ncertain groups will still produce biased outputs for those groups.\nQuantity solves the ‘not enough pattern to learn from’ problem; it does\nnot by itself solve the ‘unbalanced data’ problem.</p>\n"}, {"id": "assessment", "kind": "general", "num": null, "title": "8. Mini-Assessment (End of Day 1)", "html": "<p><strong>Instructions to students, exactly as printed: </strong>Answer\nall 8 questions on your own. You have 10 minutes. Show your work for any\ncalculation question.</p>\n<ul>\n<li><p><em>(Conceptual) </em>In your own words, write the two-part\ndefinition of Artificial Intelligence we used today.</p></li>\n<li><p><em>(Applied) </em>A spam filter looks at the words in an email\nand learns, from thousands of past examples, which patterns mean “spam.”\nIs this AI or rule-based? Justify your answer using the two-part\ntest.</p></li>\n<li><p><em>(Conceptual) </em>For any AI system, define “input” and\ndefine “output” in your own words.</p></li>\n<li><p><em>(Applied) </em>A fitness app counts your steps using a fixed\nformula based on your phone’s motion sensor, and the formula never\nchanges no matter how many people use the app. Is this AI or rule-based?\nJustify your answer.</p></li>\n<li><p><em>(Conceptual) </em>Explain, in 1-2 sentences, why a lack of\ndata would prevent an AI system from working well.</p></li>\n<li><p><em>(Conceptual) </em>Explain, in 1-2 sentences, where bias in an\nAI system usually comes from.</p></li>\n<li><p><em>(Applied/Calculation) </em>For the equation y = 5x - 2,\ncalculate y when x = 3. Show your work.</p></li>\n<li><p><em>(Applied/Calculation) </em>For the equation y = −2x + 9,\ncalculate y when x = 4. Show your work.</p></li>\n</ul>\n<h3 id=\"answer-key\">Answer Key</h3>\n<ul>\n<li><p>AI is a system that learns patterns from data instead of\nfollowing a fixed list of human-written instructions. (Accept any answer\ncontaining both parts: learning-from-data AND\nnot-a-fixed-human-rule.)</p></li>\n<li><p>AI. The system learned the spam patterns itself from thousands of\npast examples; no human wrote out every exact spam rule by\nhand.</p></li>\n<li><p>Input: the information given to the system before it acts.\nOutput: the result the system produces after processing the\ninput.</p></li>\n<li><p>Rule-based. The formula is fixed and was written by a human; it\nnever learns or changes based on data from many users.</p></li>\n<li><p>Without enough data, there are not enough examples for the system\nto find a real, dependable pattern, so its predictions will be\nunreliable or inaccurate.</p></li>\n<li><p>Bias usually comes from the data the system learned from being\nunbalanced or unrepresentative, not from the math or from someone\nintentionally writing unfair rules.</p></li>\n<li><p>y = (5)(3) - 2 = 15 - 2 = 13.</p></li>\n<li><p>y = (−2)(4) + 9 = −8 + 9 = 1.</p></li>\n</ul>\n"}, {"id": "gen10teachernotesoperationa", "kind": "general", "num": null, "title": "10. Teacher Notes (Operational Clarity)", "html": "<h3 id=\"what-to-watch-for-in-student-confusion\">What to watch for in\nstudent confusion</h3>\n<ul>\n<li><p>During Segment 2 (AI vs. rule-based), watch for students\ndefaulting to “AI = smart/complicated, rule-based = simple.” This is the\nsingle most common error of the day. Redirect immediately to the\ntwo-part test by name every time it appears, rather than letting the\nshortcut go unaddressed.</p></li>\n<li><p>During Segment 4, watch worksheets for students writing the same\nanswer in both the “input” and “data” blanks. This signals the\nthree-part vocabulary (data/input/output) has not landed yet - pause and\nre-run the spam filter or weather app example verbally with that student\nor table before they continue.</p></li>\n<li><p>During Segment 8, watch for students who calculate b + m × x\ncorrectly but mislabel which number is the slope versus the intercept\nwhen asked to identify them separately. Calculation accuracy does not\nguarantee vocabulary accuracy - check both.</p></li>\n</ul>\n<h3 id=\"when-to-slow-down\">When to slow down</h3>\n<ul>\n<li><p>If more than a few pairs finish the Segment 2 “AI or Not?” card\nsort in under 7 minutes, do not move on early - use the remaining time\nto cold-call 2-3 pairs to justify their answer for one card out loud,\nsince fast completion often signals guessing rather than applying the\ntest.</p></li>\n<li><p>If, during Segment 8’s CFU 6 (identifying slope and intercept),\nmost of the room misses the question, stop and re-do Step 8.1’s labeling\nexplicitly on the board with a new equation before proceeding to Step\n8.2’s calculations. Do not move forward with calculation practice if the\nunderlying labeling is shaky - the worksheet in Step 8.3 depends on\nit.</p></li>\n</ul>\n<h3 id=\"what-not-to-skip\">What NOT to skip</h3>\n<ul>\n<li><p>Do not skip the “Quick Debrief” at the end of Segment 5 (Step\n5.3). It is the only moment in the visual demo where students actively\nretrieve the input/output vocabulary rather than passively watching, and\nit is what makes the demo connect back to Segment 4 rather than\nfunctioning as a standalone video.</p></li>\n<li><p>Do not skip Step 8 (connecting ethics to the students’ own\nupcoming internet safety training). This is the bridge that makes the\nethics segment feel relevant to the students themselves rather than\nabstract or theoretical.</p></li>\n<li><p>Do not shorten the “write a prediction before calculating”\ninstruction in Step 8.3. The prediction step is what builds the\nintuition needed for Day 2’s slider-based Desmos work; skipping straight\nto calculation produces correct arithmetic without the predictive\nintuition the rest of the course depends on.</p></li>\n</ul>\n<h3 id=\"time-management-warnings\">Time management warnings</h3>\n<ul>\n<li><p>Segment 2 has the most content density relative to its time\n(definition, contrast, worked example, and a 15-minute activity in 30\nminutes). If Step 2.1’s definition discussion runs long, compress\nnarration in Step 2.2 rather than cutting time from the Step 2.3 student\nactivity - the activity is where the definition actually gets tested and\nretained.</p></li>\n<li><p>The two breaks (Segment 3 at 5 minutes, Segment 6 at 10 minutes)\nare intentionally short and are built into the 180-minute total. Do not\nextend them without cutting an equivalent amount of time elsewhere, and\ndo not cut them entirely - Segment 7 (Ethics) and Segment 8 (Algebra)\nboth require focused attention and follow a long stretch of\ncontent.</p></li>\n<li><p>Segment 9 (Mini-Assessment) must start no later than 2:45 to\nleave a full 15 minutes; if the day is running behind by this point,\nrecover time from Segment 7’s Step 7.3 discussion (which can run with 2\nprompts instead of 3) rather than from the assessment itself.</p></li>\n</ul>\n<p>Page 1 of 2</p>\n"}, {"id": "genaddendumcurriculumrevisi", "kind": "general", "num": null, "title": "ADDENDUM - Curriculum Revision: Worksheet-Only Structure", "html": "<p><strong>This addendum is authoritative and supersedes any conflicting\ninstruction elsewhere in this module.</strong></p>\n<h2 id=\"the-change\">The change</h2>\n<p><strong>SAIL has no homework, on any day.</strong> All practice, all\nwritten reasoning, and all forward planning happen inside the 180-minute\nblock, on the Student Worksheet Packet. Every day of the course now\nfollows the identical structure:</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Position in the day</strong></th>\n<th><strong>What happens</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Concept segments</td>\n<td>Worksheets, completed <strong>in class</strong>, alongside the\nsegment that teaches the concept</td>\n</tr>\n<tr class=\"even\">\n<td>Every worksheet</td>\n<td><strong>Part A = guided practice</strong> (with the instructor),\n<strong>Part B = independent practice</strong>, then a\n<strong>reflection</strong>, and an <strong>extension</strong> for\nstudents who finish early</td>\n</tr>\n<tr class=\"odd\">\n<td>Final teaching segment</td>\n<td>A <strong>bridge worksheet</strong> (“Looking Ahead to Day N+1”),\ncompleted in class</td>\n</tr>\n<tr class=\"even\">\n<td>Final segment</td>\n<td>The <strong>Mini-Assessment</strong> (8 questions, 10 minutes, no\nnotes)</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"what-this-means-for-this-module\">What this means for this\nmodule</h2>\n<p>The worksheets referenced throughout this module are now consolidated\ninto a single printed <strong>Student Worksheet Packet</strong> for this\nday. The activities themselves are unchanged, with two structural\nadditions:</p>\n<ul>\n<li><p><strong>Every worksheet is now explicitly split into guided\npractice and independent practice</strong>, matching the pattern used on\nDays 3 and 4. Where this module says “student activity,” run the first\nitem with the class and let students complete the rest independently\nbefore checking with their table group.</p></li>\n<li><p><strong>A bridge worksheet has been added at the final teaching\nsegment.</strong> It is the last worksheet in the packet, and it\ncaptures - in the student’s own words, without notes - the specific\nstatements that the following day’s opening script assumes they already\nown. Give it the full time. Read the answers while students\nwrite.</p></li>\n</ul>\n<h2 id=\"the-bridge-worksheet-and-why-it-matters\">The bridge worksheet,\nand why it matters</h2>\n<p>The bridge worksheet is the single most useful diagnostic in the\npacket. Tomorrow’s module opens by building directly on a small number\nof statements from today, and it <strong>does not reteach them</strong>.\nThe bridge worksheet asks students to write exactly those statements,\nfrom memory, in the room, while you are standing there.</p>\n<p>A student who cannot fill in the bridge worksheet without their notes\nis a student who will not be able to follow tomorrow’s first segment.\n<strong>You now know that a full day in advance</strong>, which is\nprecisely what a take-home assignment could never reliably give you -\nbecause the students most likely to skip it are the students you most\nneeded to hear from.</p>\n<p><strong>Instructor action at the end of the day:</strong> Students\nkeep the packet and bring it back tomorrow. If you prefer to collect the\npackets overnight to review the bridge worksheet, that is acceptable and\nuseful - but <strong>you must return them at the start of the next\nday</strong>, since students reference their own completed work.</p>\n<p><strong>Do not assign anything to be completed at home, and do not\nmake any part of the following day contingent on work done outside of\nclass.</strong></p>\n<p>Page 1 of 2</p>\n"}], "worksheetsHtml": "<p><strong>STUDENT AI LAB (SAIL)</strong></p>\n<p><strong>DAY 1 — Foundations of AI, Data, and Prediction</strong></p>\n<p><em>Student Worksheet Packet — complete alongside the lesson</em></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Name: ______________________</strong></th>\n<th><strong>Date: ______________________</strong></th>\n<th><strong>Table Group: ________________</strong></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>How to use this packet. </strong>Every worksheet in this\npacket is completed <strong>during class</strong>, alongside the segment\nit belongs to. There is no homework. Keep this packet open in front of\nyou all day — your instructor will tell you when to turn to each\nworksheet. <strong>The SAIL rule: </strong>nothing gets calculated until\nyour prediction is written.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>What is in this packet</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Worksheet</strong></th>\n<th><strong>Title</strong></th>\n<th><strong>When you complete it</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1</strong></td>\n<td>AI or Not? — The Two-Step Sort</td>\n<td>Segment 2 — during the lesson</td>\n</tr>\n<tr class=\"even\">\n<td><strong>2</strong></td>\n<td>Map the System — Input, Output, Data</td>\n<td>Segment 4 — during the lesson</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>3</strong></td>\n<td>Predict Before You Calculate — y = mx + b</td>\n<td>Segment 5 — during the lesson</td>\n</tr>\n<tr class=\"even\">\n<td><strong>4</strong></td>\n<td>Bias, Data, and Consequences — Ethics Check</td>\n<td>Segment 7 — during the lesson</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>5</strong></td>\n<td>Looking Ahead to Day 2</td>\n<td>Segment 8 — during the lesson</td>\n</tr>\n<tr class=\"even\">\n<td><strong>—</strong></td>\n<td>Day 1 Mini-Assessment (8 questions, no notes)</td>\n<td>Segment 9 — end of class</td>\n</tr>\n</tbody>\n</table>\n<h1 id=\"worksheet-1-ai-or-not-the-two-step-sort\">WORKSHEET 1 — AI or\nNot? The Two-Step Sort</h1>\n<p><em>Complete during Segment 2, alongside the lesson.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Definition reminder. </strong>AI: a computer system that\nimproves at a task by learning patterns from data, rather than by\nfollowing a fixed list of instructions written by a human.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>The Two-Step Test</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Step</strong></th>\n<th><strong>Ask yourself</strong></th>\n<th><strong>If YES…</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1</strong></td>\n<td>Did a human write the exact rule the system follows?</td>\n<td>likely RULE-BASED</td>\n</tr>\n<tr class=\"even\">\n<td><strong>2</strong></td>\n<td>Did the system learn the pattern itself, from data?</td>\n<td>likely AI</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Part A — Guided Practice (do these two with your\ninstructor)</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>#</strong></th>\n<th><strong>System description</strong></th>\n<th><strong>AI or Rule-Based?</strong></th>\n<th><strong>Which part of the definition told you? (1\nsentence)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>A vending machine that dispenses a snack when you insert the correct\namount of money.</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>A music app that learns which songs you skip and starts recommending\ndifferent songs.</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Part B — Independent Practice (work alone, then check with\nyour table group)</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>#</strong></th>\n<th><strong>System description</strong></th>\n<th><strong>AI or Rule-Based?</strong></th>\n<th><strong>Which part of the definition told you? (1\nsentence)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>3</td>\n<td>A traffic light that changes color every 45 seconds, no matter\nwhat.</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>A photo app that learns to recognize your face after you tag\nyourself a few times.</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td>A calculator that adds two numbers when you press “+”.</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>6</td>\n<td>An email inbox that learns from thousands of users marking messages\nas “spam” and filters similar messages automatically.</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>7</td>\n<td>A washing machine with a dial you turn to select “delicate” or\n“heavy duty.”</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>8</td>\n<td>A video platform that learns what kind of videos keep you watching\nlonger and shows you more of them.</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>9</td>\n<td>An alarm clock that rings at the exact time you set it.</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td>A customer service chatbot that gets better at answering questions\nthe more conversations it has.</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Reflection — answer in one sentence</strong></p>\n<p><em>Which of the ten was hardest to decide, and what made it\nhard?</em></p>\n<h1 id=\"worksheet-2-map-the-system-input-output-data\">WORKSHEET 2 — Map\nthe System: Input, Output, Data</h1>\n<p><em>Complete during Segment 4, alongside the lesson.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Vocabulary reminder. Data: </strong>recorded information the\nsystem studied <em>before</em> it ever made a prediction. <strong>Input:\n</strong>the information given to the system right now, before it acts.\n<strong>Output: </strong>the result the system produces after processing\nthe input.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Part A — Guided Practice (do System 1 with your\ninstructor)</strong></p>\n<p><strong>System 1. </strong>A video game that adjusts its difficulty\nbased on how well you’re doing.*</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Field</strong></th>\n<th><strong>Your answer (full sentence)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>INPUT</strong></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>OUTPUT</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>DATA IT LIKELY LEARNED FROM</strong></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Part B — Independent Practice (work alone 8 minutes, then\ncheck with your table group)</strong></p>\n<p><strong>System 2. </strong>A navigation app that suggests the fastest\ndriving route.*</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Field</strong></th>\n<th><strong>Your answer (full sentence)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>INPUT</strong></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>OUTPUT</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>DATA IT LIKELY LEARNED FROM</strong></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>System 3. </strong>A handwriting app that converts your\nhandwritten notes into typed text.*</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Field</strong></th>\n<th><strong>Your answer (full sentence)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>INPUT</strong></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>OUTPUT</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>DATA IT LIKELY LEARNED FROM</strong></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>System 4. </strong>A streaming service that shows you a\n“Recommended for You” row of shows.*</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Field</strong></th>\n<th><strong>Your answer (full sentence)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>INPUT</strong></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>OUTPUT</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>DATA IT LIKELY LEARNED FROM</strong></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>System 5. </strong>A photo app that automatically sorts your\npictures into albums like “Beach” or “Dogs.”*</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Field</strong></th>\n<th><strong>Your answer (full sentence)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>INPUT</strong></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>OUTPUT</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>DATA IT LIKELY LEARNED FROM</strong></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Reflection</strong></p>\n<p><em>In one sentence, explain the difference between a system’s DATA\nand its INPUT. They are not the same thing.</em></p>\n<h1 id=\"worksheet-3-predict-before-you-calculate\">WORKSHEET 3 — Predict\nBefore You Calculate</h1>\n<p><em>Complete during Segment 5, alongside the lesson.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Formula: </strong>y = mx + b** slope = m (the number\nmultiplied by x) │ intercept = b (the number added at the end) <em>Order\nof operations, every time: identify → substitute → multiply →\nadd.</em></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Part A — Guided Practice</strong></p>\n<p><strong>Problem 1. </strong>y = 2x + 3, find y when x = 4** (guided —\nwith your instructor)*</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Stage</strong></th>\n<th><strong>Your work</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Identify</strong></td>\n<td>Slope (m) = ________ Intercept (b) = ________</td>\n</tr>\n<tr class=\"even\">\n<td><strong>My prediction (write BEFORE calculating)</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Step 1 — Substitute</strong></td>\n<td>y = ( ______ )( ______ ) + ______</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Step 2 — Multiply</strong></td>\n<td>y = ______________ + ______</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Step 3 — Add</strong></td>\n<td>y = ______________</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Part B — Independent Practice</strong></p>\n<p><strong>Problem 2. </strong>y = −1x + 10, find y when x = 6**</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Stage</strong></th>\n<th><strong>Your work</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Identify</strong></td>\n<td>Slope (m) = ________ Intercept (b) = ________</td>\n</tr>\n<tr class=\"even\">\n<td><strong>My prediction (write BEFORE calculating)</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Step 1 — Substitute</strong></td>\n<td>y = ( ______ )( ______ ) + ______</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Step 2 — Multiply</strong></td>\n<td>y = ______________ + ______</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Step 3 — Add</strong></td>\n<td>y = ______________</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Problem 3. </strong>y = 5x − 2, find y when x = 3**</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Stage</strong></th>\n<th><strong>Your work</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Identify</strong></td>\n<td>Slope (m) = ________ Intercept (b) = ________</td>\n</tr>\n<tr class=\"even\">\n<td><strong>My prediction (write BEFORE calculating)</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Step 1 — Substitute</strong></td>\n<td>y = ( ______ )( ______ ) + ______</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Step 2 — Multiply</strong></td>\n<td>y = ______________ + ______</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Step 3 — Add</strong></td>\n<td>y = ______________</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Problem 4. </strong>y = −2x + 9, find y when x = 4**</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Stage</strong></th>\n<th><strong>Your work</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Identify</strong></td>\n<td>Slope (m) = ________ Intercept (b) = ________</td>\n</tr>\n<tr class=\"even\">\n<td><strong>My prediction (write BEFORE calculating)</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Step 1 — Substitute</strong></td>\n<td>y = ( ______ )( ______ ) + ______</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Step 2 — Multiply</strong></td>\n<td>y = ______________ + ______</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Step 3 — Add</strong></td>\n<td>y = ______________</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Problem 5. </strong>y = 0.5x + 6, find y when x = 8**</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Stage</strong></th>\n<th><strong>Your work</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Identify</strong></td>\n<td>Slope (m) = ________ Intercept (b) = ________</td>\n</tr>\n<tr class=\"even\">\n<td><strong>My prediction (write BEFORE calculating)</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Step 1 — Substitute</strong></td>\n<td>y = ( ______ )( ______ ) + ______</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Step 2 — Multiply</strong></td>\n<td>y = ______________ + ______</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Step 3 — Add</strong></td>\n<td>y = ______________</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Reflection — Prediction vs. Reality</strong></p>\n<p>Circle one. Looking back, my predictions were generally:</p>\n<p>* A) Higher than the actual answer B) Lower C) About right D)\nMixed**</p>\n<p><em>What pattern do you notice about how the SLOPE affects the size\nof the output?</em></p>\n<p><strong>Extension — if you finish early</strong></p>\n<p>Write your own equation in the form y = mx + b with a NEGATIVE slope.\nPick any x. Predict, then calculate. Then explain in one sentence what a\nnegative slope does to the output as x gets bigger.</p>\n<h1 id=\"worksheet-4-bias-data-and-consequences\">WORKSHEET 4 — Bias,\nData, and Consequences</h1>\n<p><em>Complete during Segment 7, alongside the lesson.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>The core idea. </strong>An AI system learns its patterns\nfrom data. If the data it learned from is incomplete, unbalanced, or\nunfair, the system will confidently reproduce that unfairness — and it\nwill still look like it is working.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Part A — Guided Practice: Trace the Bias</strong></p>\n<p><em>Scenario (read with your instructor): A company builds an AI to\nscreen job applications. It trains the system on the résumés of people\nthe company has already hired — and almost everyone the company has ever\nhired came from three specific universities.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Question</strong></th>\n<th><strong>Your answer</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>What DATA did this system learn from?</strong></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>What pattern will it learn about “good”\napplicants?</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Who gets harmed by this, and how?</strong></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>Where did the bias actually come from — the code, or the\ndata?</strong></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Part B — Independent Practice: Three More\nSystems</strong></p>\n<p>For each system, name one way the DATA could be biased, and one real\nconsequence of that bias.</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>System</strong></th>\n<th><strong>How the data could be biased</strong></th>\n<th><strong>One real consequence</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>A voice assistant trained mostly on recordings of adult male\nspeakers.</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>A medical AI trained on patient records from one wealthy\nhospital.</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>A photo app trained mostly on pictures taken in bright\ndaylight.</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Reflection</strong></p>\n<p><em>In two sentences: why is it dangerous that a biased AI system can\nstill appear to be working perfectly?</em></p>\n<h1 id=\"worksheet-5-looking-ahead-to-day-2\">WORKSHEET 5 — Looking Ahead\nto Day 2</h1>\n<p><em>Complete during Segment 8, alongside the lesson.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Why this worksheet exists. </strong>Day 2 begins by assuming\nyou already own four things from today. Write them down now, in your own\nwords, so tomorrow starts at full speed. This page is your bridge into\nDay 2 — bring it with you.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Part A — The Four Things I Own After Today</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>#</strong></th>\n<th><strong>In my own words</strong></th>\n<th><strong>My answer</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1</strong></td>\n<td>What is Artificial Intelligence? (two-part definition)</td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>2</strong></td>\n<td>What is the difference between data, input, and output?</td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>3</strong></td>\n<td>In y = mx + b, what does m control? What does b control?</td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>4</strong></td>\n<td>Where does bias in an AI system usually come from?</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Part B — Tomorrow’s Question</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>MY PREDICTION — write this BEFORE you test.</strong>\n<em>Tomorrow you will drag a slider that changes m, and watch a line\nmove on a screen in real time. Before you ever touch it: if you make m\nBIGGER, what do you predict happens to the line? If you make b bigger,\nwhat do you predict happens? Write both predictions now.</em></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><em>One thing I want to find out tomorrow that I do not know\nyet:</em></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Bring this packet to Day 2. </strong>Worksheet 5 is your\nnotes, your evidence, and where Day 2 starts.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<h1 id=\"day-1-mini-assessment\">DAY 1 MINI-ASSESSMENT</h1>\n<p><em>Segment 9 • 8 questions • 10 minutes • On your own. Notes\nclosed.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Name: ______________________</strong></th>\n<th><strong>Date: ______________________</strong></th>\n<th><strong>Table Group: ________________</strong></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Answer all 8 questions independently. Show your work for any\ncalculation question.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Question 1. </strong>(Conceptual) In your own words, write\nthe two-part definition of Artificial Intelligence we used today.</p>\n<p><strong>Question 2. </strong>(Applied) A spam filter looks at the\nwords in an email and learns, from thousands of past examples, which\npatterns mean “spam.” Is this AI or rule-based? Justify your answer\nusing the two-step test.</p>\n<p><strong>Question 3. </strong>(Conceptual) For any AI system, define\n“input” and define “output” in your own words.</p>\n<p><strong>Question 4. </strong>(Applied) A fitness app counts your\nsteps using a fixed formula that never changes, no matter how many\npeople use the app. Is this AI or rule-based? Justify your answer.</p>\n<p><strong>Question 5. </strong>(Conceptual) Explain, in 1–2 sentences,\nwhy a lack of data would prevent an AI system from working well.</p>\n<p><strong>Question 6. </strong>(Conceptual) Explain, in 1–2 sentences,\nwhere bias in an AI system usually comes from.</p>\n<p><strong>Question 7. </strong>(Calculation — show your work) For the\nequation y = 5x − 2, calculate y when x = 3.</p>\n<p><strong>Question 8. </strong>(Calculation — show your work) For the\nequation y = −2x + 9, calculate y when x = 4.</p>\n<p>Page 1 of 2</p>\n"};
