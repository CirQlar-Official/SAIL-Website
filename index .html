head>\n<tr class=\"header\">\n<th><strong>The ReLU rule — memorize this.</strong> If z ≥ 0 → ReLU(z) =\nz (neuron is ON — the value passes through UNCHANGED) If z &lt; 0 →\nReLU(z) = 0 (neuron is OFF — the value is erased to zero) <em>There is\nno third case. ReLU never changes a positive number, and always erases a\nnegative one.</em></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Part A — Predict First, Then Calculate</strong></p>\n<p><em>Write your ON/OFF prediction BEFORE you write the output. Your\nprediction is part of the work.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>#</strong></th>\n<th><strong>Weighted-sum result (z)</strong></th>\n<th><strong>My prediction: ON or OFF? (write FIRST)</strong></th>\n<th><strong>ReLU output</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1</strong></td>\n<td>z = 6</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>2</strong></td>\n<td>z = −4</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>3</strong></td>\n<td>z = −0.5</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>4</strong></td>\n<td>z = 12</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>5</strong></td>\n<td>z = −9</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>6</strong></td>\n<td>z = 0</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>7</strong></td>\n<td>z = 15</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>8</strong></td>\n<td>z = −100</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Watch out for #6. </strong>z = 0 is the ON case, not the OFF\ncase — even though the output happens to be 0 either way. The rule says\nReLU erases only NEGATIVE numbers. Zero is not negative.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Part B — Calculate the Weighted Sum, Then Apply\nReLU</strong></p>\n<p><em>For each neuron: FIRST calculate z = wx + b (show your\nmultiply-then-add steps), THEN apply ReLU.</em></p>\n<p><strong>Neuron 1. </strong>w = 3, x = 2, b = −8** (guided — with your\ninstructor)*</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Stage</strong></th>\n<th><strong>Your work</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Step 1 — Calculate z</strong></td>\n<td>z = ( ____ )( ____ ) + ____ = ______ + ____ = ______</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Step 2 — My prediction</strong></td>\n<td>ON / OFF (circle one)</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Step 3 — Apply ReLU</strong></td>\n<td>ReLU output = ______</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Neuron 2. </strong>w = −2, x = 4, b = 10**</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Stage</strong></th>\n<th><strong>Your work</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Step 1 — Calculate z</strong></td>\n<td>z = ( ____ )( ____ ) + ____ = ______ + ____ = ______</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Step 2 — My prediction</strong></td>\n<td>ON / OFF (circle one)</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Step 3 — Apply ReLU</strong></td>\n<td>ReLU output = ______</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Neuron 3. </strong>w = 5, x = 0, b = −3**</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Stage</strong></th>\n<th><strong>Your work</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Step 1 — Calculate z</strong></td>\n<td>z = ( __ a(B) = 1, bias = −3, no\nactivation function</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Step</strong></th>\n<th><strong>What you calculate</strong></th>\n<th><strong>Your work (show multiply, then add)</strong></th>\n<th><strong>Result</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1</strong></td>\n<td>z(A) = (w₁)(x₁) + (w₂)(x₂) + bias</td>\n<td>z(A) = ( __ )( __ ) + ( __ )( __ ) + __</td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>2</strong></td>\n<td>ReLU on A. My prediction: ON / OFF</td>\n<td>a(A) = ReLU( z(A) ) =</td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>3</strong></td>\n<td>z(B) = (w₁)(x₁) + (w₂)(x₂) + bias</td>\n<td>z(B) = ( __ )( __ ) + ( __ )( __ ) + __</td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>4</strong></td>\n<td>ReLU on B. My prediction: ON / OFF</td>\n<td>a(B) = ReLU( z(B) ) =</td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>5</strong></td>\n<td>z(C) = (w)(a(A)) + (w)(a(B)) + bias</td>\n<td>z(C) = ( __ )( __ ) + ( __ )( __ ) + __</td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>6</strong></td>\n<td>FINAL NETWORK OUTPUT</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Part C — Reflection: Tracing a Zero Forward</strong></p>\n<p><em>In one of your two forward passes, a hidden neuron’s ReLU turned\nit OFF (output = 0). When you multiplied that 0 by its weight in the\noutput neuron’s calculation, what did it contribute? Did the weight on\nthat connection still matter? Explain in 2–3 sentences.</em></p>\n<p><strong>Extension — if you finish early</strong></p>\n<p>Go back to Part B. Change Neuron A’s bias from 4 to −10, and re-run\nonly the steps that change. Does Neuron A flip from ON to OFF? What\nhappens to the final output? Show your work.</p>\n<h1 id=\"work ctions": [{"id": "overview", "kind": "general", "num": null, "title": "Overview", "html": "<p><strong>SAIL - Day 4 Instructional Module Student AI Lab</strong></p>\n<p><strong>STUDENT AI LAB (SAIL)</strong></p>\n<p><em>Day 4: Training a Neural Network — Loss, Learning, and Live\nModification in the SAIL Architect Lab</em></p>\n<p>Complete Instructional Module - Instructor Script, Student\nActivities, and Assessment</p>\n<p><strong>Total instructional time:</strong> 180 minutes (3 hours)</p>\n<p><strong>Audience:</strong> 4-H participants, ages 14-18. Students\nhave completed Days 1, 2, and 3 of SAIL and possess only the knowledge\nestablished there.</p>\n<p><strong>Prerequisite materials:</strong> Completed Day 1, Day 2, and\nDay 3 modules (AI definition; data/input/output vocabulary; AI ethics\nbasics; slope-intercept algebra; weight, bias, and weighted sum\nvocabulary; linear vs. nonlinear relationships; neuron, layer, hidden\nlayer, activation function, ReLU, and the manual forward pass). No\nknowledge beyond Days 1-3 is assumed.</p>\n<p><strong>Title:</strong> Day 4 - Training a Neural Network: Loss,\nLearning, and Live Modification in the SAIL Architect Lab</p>\n<h2 id=\"overview\">Overview</h2>\n<p>On Day 3, students performed a complete forward pass by hand: they\ntook an input, pushed it through a hidden layer of neurons, applied\nReLU, and calculated a final output. But every single weight and bias in\nthat network was simply handed to them on a worksheet. Nobody ever asked\nwhere those numbers came from. Day 4 answers that question, and it is\nthe last major conceptual milestone of the course.</p>\n<p>Today students learn that a neural network is not given its weights -\nit finds them, by being wrong on purpose, measuring exactly how wrong it\nwas, and adjusting. Students first learn to measure wrongness with a\nsingle number called loss, calculating it by hand for a tiny data set\nusing the same arithmetic discipline they have used since Day 1. They\nthen learn that training is nothing more than a loop: forward pass,\nmeasure loss, nudge every weight in the direction that lowers loss,\nrepeat. Once that loop is concrete, students open the <strong>SAIL\nArchitect Lab</strong> - the first live, training neural network they\nhave ever controlled - and use their own webcam to capture pictures of\ntwo hand gestures they choose. They watch loss fall in real time as the\nnetwork teaches itself to tell those gestures apart, using the exact\nsame kind of nonlinear, curved pattern-finding that defeated their\nstraight line on Day 2 - except today the “curve” lives inside a picture\ninstead of on a graph, and the data is real, and it is theirs.</p>\n<p>The second half of the day is structured, prediction-first\nexperimentation. Students run a series of controlled modifications -\nchanging the activation function, adding and removing hidden layers,\nchanging the learning rate - and for every single change, they write a\nprediction before they press train, then record what actually happened\nand explain why. By the end of today, students will be able to define\nloss, explain training as an iterative loss-reduction loop, read a live\nloss curve, and document a modification-prediction-outcome cycle in\nwriting. That documentation habit is the exact skill Day 5 requires: on\nDay 5, students will choose their own network, modify it purposefully,\nand present what they found.</p>\n"}, {"id": "objectives", "kind": "general", "num": null, "title": "2. Learning Objectives (Measurable)", "html": "<p>By the end of Day 4, students will be able to:</p>\n<ul>\n<li><p><strong>Define</strong> loss as a single number that measures how\nfar a model’s predictions are from the correct answers, and state that a\nlower loss means a better model.</p></li>\n<li><p><strong>Calculate</strong> the loss of a simple model by hand for\na small data set, using the error-square-average procedure, and\ncorrectly identify which of two models is better by comparing their loss\nvalues.</p></li>\n<li><p><strong>Explain</strong> training as a repeated loop - forward\npass, measure loss, adjust the weights and biases, repeat - and state\nthat this loop is where the weights on the Day 3 worksheet actually came\nfrom.</p></li>\n<li><p><strong>Read</strong> a live Training Loss chart in the SAIL\nArchitect Lab and state, from the chart alone, whether a network is\nstill learning, has finished learning, or is failing to learn.</p></li>\n<li><p><strong>Predict</strong> in writing, before training the model,\nhow a specific change to a network (activation function, hidden-layer\ncount, or learning rate) will affect its loss and its ability to tell\ntwo gestures apart, then verify the prediction by training the\nmodel.</p></li>\n<li><p><strong>Modify</strong> a working neural network in the SAIL\nArchitect Lab by changing its activation function, adding or removing\nhidden layers, and adjusting the learning rate, and describe the effect\nof each change using Day 3 vocabulary.</p></li>\n<li><p><strong>Document</strong> a complete modification cycle in\nwriting - what was changed, what was predicted, what happened, and why -\nfor at least four separate modifications.</p></li>\n<li><p><strong>Explain</strong> in one or two sentences why adding more\nhidden layers does not automatically produce a better model, using\nevidence from their own experiments.</p></li>\n</ul>\n"}, {"id": "gen3connectiontoday3", "kind": "general", "num": null, "title": "3. Connection to Day 3", "html": "<h3\nid=\"skills-students-already-possess-established-on-days-1-3-not-retaught-today\">Skills\nstudents already possess (established on Days 1-3, not retaught\ntoday)</h3>\n<ul>\n<li><p>Full command of the weighted sum: z = w x + b, with w as weight,\nb as bias, x as input, and the explicit multiply-then-add step order\nused since Day 1.</p></li>\n<li><p>The definition of a neuron as a weighted sum plus an activation\nfunction, and the definitions of input layer, hidden layer, and output\nlayer.</p></li>\n<li><p>The ReLU rule (if z is zero or positive, pass it through\nunchanged - the neuron is On; if z is negative, output 0 - the neuron is\nOff), including the z = 0 boundary case.</p></li>\n<li><p>The ability to perform a complete manual forward pass through a\n2-input, 2-hidden-neuron, 1-output network, calculating one layer at a\ntime in order.</p></li>\n<li><p>The lived experience, from Day 2, of a single straight line\nfailing to fit a curved data set no matter how the sliders were\ndragged.</p></li>\n<li><p>The habit of writing a prediction before testing, practiced on\nevery single day of the course so far.</p></li>\n<li><p>Basic AI ethics vocabulary (bias, data privacy, automated\ndecision-making), which returns today in Segment 8 in a new and more\nconcrete form.</p></li>\n</ul>\n<h3 id=\"brief-review-plan-10-minutes-segment-1\">Brief review plan (10\nminutes, Segment 1)</h3>\n<p>Day 4 opens with a 10-minute review, not a reteach. The review is\nrestricted to exactly the two things today’s new content depends on: (1)\nthe ability to perform a forward pass and produce an output, and (2) the\nunanswered question of where the weights and biases in that forward pass\ncame from. The AI definition, the input/output vocabulary, and the\nmechanics of the ReLU boundary case are not re-explained today, because\nSegment 1’s single review calculation will confirm them in passing.</p>\n<p>If Day 3’s Mini-Assessment showed widespread difficulty\n<strong>on</strong> Questions 3, 4, or 7 (the calculation questions),\nDay 3’s own instructor notes direct you to spend 10-15 extra minutes\nhere on a fresh guided forward-pass example before beginning new\ncontent. If you must do this, take the time from Segment 7 (reduce the\nStructure Lab from four modifications to three, dropping Modification 3)\n- never from Segment 5, and never from Segment 9.</p>\n<h3 id=\"how-todays-lesson-builds-on-that-foundation\">How today’s lesson\nbuilds on that foundation</h3>\n<p>Day 3 was entirely hand-calculation with pre-supplied numbers: the\nnetwork existed, it worked, and it produced an output - but it never\nchanged and it never improved. Day 4 is the first day students see a\nnetwork improve itself. Every new concept today is a direct extension of\na Day 3 skill, never a brand-new starting point:</p>\n<ul>\n<li><p>Loss is introduced as one more arithmetic step performed on the\noutput students already know how to calculate: run the forward pass,\ncompare the output to the correct answer, and square the difference.\nStudents do not learn a new kind of math today; they learn what to do\nwith the number the forward pass gives them.</p></li>\n<li><p>Training is introduced as the Day 3 forward pass, repeated, with\na small adjustment to the weights between each repetition. The forward\npass is not replaced - it becomes the first step of a larger\nloop.</p></li>\n<li><p>Every control in the SAIL Architect Lab is a control over\nsomething students can already name. The Activation Function dropdown\nchanges the ReLU step from Day 3. The hidden-layer buttons change the\nhidden-layer structure from Day 3. The percentage bars that update live\nwhen a student holds a gesture up to the camera are the nonlinear\nfitting problem from Day 2, finally being solved - on a real picture\ninstead of a dot on a graph.</p></li>\n<li><p>The predict-before-testing structure used in every SAIL Architect\nLab modification today is the same structure used in Day 3’s ReLU On/Off\ncheck and Day 2’s slider work, now applied to a network that trains\nitself.</p></li>\n</ul>\n<h3 id=\"why-todays-lesson-comes-before-day-5\">Why today’s lesson comes\nbefore Day 5</h3>\n<p>On Day 5, students will independently choose a gesture pair and a\nnetwork, modify it purposefully, evaluate what happened, and present\ntheir reasoning in plain language to an audience. Day 5 provides the\nfreedom; Day 4 must provide the discipline that makes that freedom\nproductive. A student who has never written a prediction before pressing\ntrain will, on Day 5, click buttons at random and report “it got better”\nwith no explanation of why. Today’s Modification Log - the written cycle\nof change, predict, observe, explain, repeated at least four times under\ninstructor supervision - is the load-bearing piece. It is the rehearsal\nfor Day 5’s independent work, and the Day 5 presentation is simply a\nspoken version of a log entry students will have already written eight\nor more times today.</p>\n"}, {"id": "timeline", "kind": "general", "num": null, "title": "4. Full Timeline (180 Minutes Total)", "html": "<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>#</strong></th>\n<th><strong>Segment</strong></th>\n<th><strong>Duration</strong></th>\n<th><strong>Time Block</strong></th>\n<th><strong>Type</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Review of Day 3 + The Unanswered Question</td>\n<td>10 min</td>\n<td>0:00–0:10</td>\n<td>Lecture / Discussion</td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>Loss: Measuring How Wrong a Model Is</td>\n<td>30 min</td>\n<td>0:10–0:40</td>\n<td>Lecture + Activity</td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>Break</td>\n<td>5 min</td>\n<td>0:40–0:45</td>\n<td>Break</td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>Training: The Loop That Finds the Weights</td>\n<td>25 min</td>\n<td>0:45–1:10</td>\n<td>Lecture + Activity</td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td>Guided Hands-On: First Contact with the SAIL Architect Lab</td>\n<td>40 min</td>\n<td>1:10–1:50</td>\n<td>Guided Hands-On Activity</td>\n</tr>\n<tr class=\"even\">\n<td>6</td>\n<td>Break</td>\n<td>10 min</td>\n<td>1:50–2:00</td>\n<td>Break</td>\n</tr>\n<tr class=\"odd\">\n<td>7</td>\n<td>Structure Lab: Predict-Modify-Explain</td>\n<td>30 min</td>\n<td>2:00–2:30</td>\n<td>Guided Hands-On Activity</td>\n</tr>\n<tr class=\"even\">\n<td>8</td>\n<td>Connecting Today to Day 5 (Preview)</td>\n<td>15 min</td>\n<td>2:30–2:45</td>\n<td>Lecture + Discussion</td>\n</tr>\n<tr class=\"odd\">\n<td>9</td>\n<td>Mini-Assessment and Wrap-Up</td>\n<td>15 min</td>\n<td>2:45–3:00</td>\n<td>Assessment</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Total: 180 minutes.</strong></p>\n<h2 id=\"materials\">Materials</h2>\n<h3 id=\"instructor-materials\">Instructor materials</h3>\n<ul>\n<li><p>One instructor laptop with a reliable internet connection and a\nworking webcam, connected to a projector.</p></li>\n<li><p>The <strong>SAIL Architect Lab</strong> loaded and confirmed\nworking, with camera permission already granted, before students arrive:\n<strong>https://<a href=\"https://cirqlar-official.github.io/SAIL-project-lab/\" target=\"_blank\" rel=\"noopener\">cirqlar-official.github.io/SAIL-project-lab/</a></strong></p></li>\n<li><p>Whiteboard or chalkboard with markers/chalk, used in Segments 1,\n2, 4, and 8.</p></li>\n<li><p>The Day 4 Answer Key (contained in this module - Segments 2, 5,\n7, and 9).</p></li>\n<li><p>A printed copy of this module, or the module open on a second\nscreen.</p></li>\n</ul>\n<h3 id=\"student-materials-per-student-or-per-pair\">Student materials\n(per student, or per pair)</h3>\n<ul>\n<li><p>One internet-connected device with a <strong>built-in or attached\nwebcam</strong> and a modern browser (Chrome or Edge recommended). The\nSAIL Architect Lab requires no login, no account, and no installation -\nbut it does require the student to grant the browser camera permission\nwhen prompted, and it needs a device with a working camera to be\nuseful.</p></li>\n<li><p>Day 4 Student Worksheet Packet, containing: Worksheet 1\n(Measuring Loss by Hand), Worksheet 2 (SAIL Architect Lab Field Guide\nand Guided Run), Worksheet 3 (Modification Log), Worksheet 4 (My Day 5\nProject Plan), and the Day 4 Mini-Assessment. <strong>There is no\nhomework component.</strong></p></li>\n<li><p>Pencil and scratch paper.</p></li>\n<li><p>The student’s completed Day 3 forward-pass worksheet, brought to\nclass (used in Segment 1 and Segment 4).</p></li>\n</ul>\n<h3 id=\"room-and-grouping\">Room and grouping</h3>\n<ul>\n<li><p>Students seated in table groups of 3-4, as on Days 1-3. Table\ngroups are used for peer-checking in Segments 2, 5, and 7.</p></li>\n<li><p><strong>Because today’s activity uses a live webcam, plan for one\ndevice per pair rather than one per student wherever possible.</strong>\nTwo students can capture more varied, higher-quality data together than\none student alone - one holds the gesture, the other reads the settings\nand operates the capture button, and they switch roles between classes.\nThis also solves the practical problem of a student needing both hands\nfree to make a gesture while also needing a hand on the mouse.</p></li>\n<li><p>Devices should be closed or turned face-down during Segments 1,\n2, 4, and 8. Open devices during lecture are the single largest source\nof lost attention in this module. State this expectation aloud at the\nstart of Segment 1.</p></li>\n<li><p>Confirm the room has consistent, adequate lighting before class.\nInconsistent lighting across the room (some stations near a bright\nwindow, others in shadow) will make some groups’ training data\nnoticeably messier than others’ - which is a real and useful thing to be\nable to point at in Segment 8, but should not be a surprise to you as\nthe instructor.</p></li>\n<li><p>Snacks available at the two breaks, per standing SAIL\npractice.</p></li>\n</ul>\n<h2 id=\"instructor-preparation\">Instructor Preparation</h2>\n<p><strong>This module assumes an instructor who has never seen the SAIL\nArchitect Lab before.</strong> The preparation steps below are written\nfor that instructor and take approximately 30 minutes. Do not skip them\n- Segment 5 cannot be delivered by an instructor who has not personally\nperformed the steps in it.</p>\n<h3 id=\"step-a---do-the-whole-thing-yourself-20-min\">Step A - Do the\nwhole thing yourself (20 min)</h3>\n<ul>\n<li><p>Open\n<strong>https://<a href=\"https://cirqlar-official.github.io/SAIL-project-lab/\" target=\"_blank\" rel=\"noopener\">cirqlar-official.github.io/SAIL-project-lab/</a></strong>\nand grant camera permission when the browser asks. You will see a webcam\npreview and a <strong>Capture</strong> panel on the left, a\n<strong>network diagram</strong> in the center (with buttons to add or\nremove hidden layers in the top-left corner of that panel), and a\ndiagnostics column on the right showing <strong>Live Inference\nData</strong>, a <strong>Training Loss</strong> chart, and a <strong>Lab\nJournal</strong> text box. At the bottom of the left panel are the\n<strong>Learning Rate</strong> slider and the <strong>Activation\nFunction</strong> dropdown.</p></li>\n<li><p>By default, the tool has two classes, named “Target Alpha” and\n“Target Beta.” Click into each name and rename them to a concrete pair\nof hand gestures you plan to use with students (see the gesture-pair\nguidance below - this choice matters more than it looks like it\nshould).</p></li>\n<li><p>Switch to the <strong>Capture</strong> tab if it is not already\nactive. Hold down the <strong>HOLD TO RECORD</strong> button under each\nclass name while you make that gesture in front of your camera, moving\nslightly - closer, farther, tilted - so you capture roughly 20-30 varied\nframes per class. This is exactly the activity students will do in Step\n5.1.</p></li>\n<li><p>Press <strong>TRAIN MODEL</strong>. Watch the <strong>Epoch\nLoop</strong> counter climb in the header and the <strong>Training\nLoss</strong> chart fall on the right. After the loss visibly flattens\n(usually well under a minute), press the button again - it will now read\n<strong>HALT COMPILATION</strong> - to stop training.</p></li>\n<li><p>Hold each gesture up to the camera in turn and watch the\n<strong>Live Inference Data</strong> percentage bars on the right\nrespond live. This is the direct replacement for TensorFlow Playground’s\noutput square, and it is the moment students will find most\nconvincing.</p></li>\n<li><p>Now personally perform all four modifications from Segment 7\n(change Activation Function to Linear; add hidden layers up toward the\nmaximum of five; remove hidden layers down to the minimum of one; push\nthe Learning Rate slider to its maximum, 0.100). Write down what you see\neach time. You must have seen each result with your own eyes, on your\nown gesture pair, in your own room’s lighting, before you can facilitate\nstudents seeing it - unlike TensorFlow Playground’s canned datasets,\nthis is a live classifier trained on real data you just captured, and\nits exact behavior will depend on your gesture pair, your camera, and\nyour lighting.</p></li>\n<li><p><strong>Choosing your gesture pair matters.</strong> Pick two\nhand poses that differ in <strong>shape</strong> - for example, an open\nflat palm versus a closed fist, or a thumbs-up versus a flat palm -\nrather than two poses that differ mainly in <strong>overall brightness\nor how much of the frame is filled</strong>, such as a hand covering the\ncamera versus a hand held away from it. A brightness-based pair can\noften be told apart by a single straight-line rule on pixel values -\nexactly Day 2’s Data Set A situation - and will not demonstrate today’s\nModification 1 failure convincingly. A shape-based pair needs a\ngenuinely bent decision boundary across the picture’s 784 pixel values,\nwhich is Day 2’s Data Set B problem, just with far more dimensions.\n<strong>Open hand vs. closed fist</strong> is the recommended default\npair for this module and is used throughout the rest of this document;\nsubstitute your own pair if you prefer, but test it yourself first using\nthis same standard.</p></li>\n<li><p>The single most important thing to internalize: with Activation\nFunction set to <strong>Linear</strong>, the network’s ability to\nreliably tell your two gestures apart should degrade noticeably compared\nto ReLU - the Training Loss chart should flatten at a visibly higher\nvalue, and the Live Inference Data bars should hover closer to\nfifty-fifty or flip unpredictably when you hold up a gesture. This is\nDay 2’s straight-line failure, reappearing inside a real, trained image\nclassifier. It is the intellectual center of the entire course, and\nSegment 7 Modification 1 is where students meet it.</p></li>\n</ul>\n<p><strong>A quick-reference cheat sheet:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Control</strong></th>\n<th><strong>What it does</strong></th>\n<th><strong>Resets the network’s learned weights?</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>TRAIN MODEL / HALT COMPILATION button</td>\n<td>Starts or stops training on the data currently captured.</td>\n<td>No - pressing TRAIN MODEL again continues training from wherever the\nnetwork left off.</td>\n</tr>\n<tr class=\"even\">\n<td>Activation Function dropdown</td>\n<td>Changes the activation function used in every hidden layer.</td>\n<td>Yes, automatically. Selecting a new option instantly throws away all\nlearned weights and rebuilds the network from scratch.</td>\n</tr>\n<tr class=\"odd\">\n<td>Add / remove hidden layer buttons (top-left of the network\npanel)</td>\n<td>Adds a new 4-neuron hidden layer, or removes the last one (minimum\n1, maximum 5).</td>\n<td>Yes, automatically, for the same reason as above.</td>\n</tr>\n<tr class=\"even\">\n<td>Learning Rate slider</td>\n<td>Changes the step size used the next time the network trains.</td>\n<td>No. This is the one control that does NOT rebuild the network - see\nthe “reset trick” below.</td>\n</tr>\n<tr class=\"odd\">\n<td>+ button next to Data Streams / class name</td>\n<td>Adds a new class (up to 6 total).</td>\n<td>Yes, automatically.</td>\n</tr>\n</tbody>\n</table>\n<p><em>The “reset trick.” Because changing only the Learning Rate does\nNOT give you a fresh, <strong>freshly-random</strong> network, any\nmodification that changes the learning rate alone needs one extra step\nto be a fair comparison: flip the Activation Function dropdown to a\ndifferent option and <strong>immediately</strong> back to\n<strong>ReLU</strong>. Since the network rebuilds itself from scratch\nevery time the activation function changes, this two-click move throws\naway everything the network has learned and hands you a fresh random\nstart - functionally identical to TensorFlow Playground’s reset button,\njust reached one click differently. Teach this to students explicitly in\nStep 5.1 and post it on the board alongside the standing procedure in\nSegment 7.</em></p>\n<h3 id=\"step-b---vocabulary-translation-5-min\">Step B - Vocabulary\ntranslation (5 min)</h3>\n<p>The SAIL Architect Lab uses a few words SAIL has not taught. You will\nsee them on screen and students will ask. Use these translations and\nnothing more. <strong>Do not introduce vocabulary students do not\nneed.</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>On-screen word</strong></th>\n<th><strong>What to say to students</strong></th>\n<th><strong>What NOT to say</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Epoch Loop (the counter in the header)</td>\n<td>One trip through the loop. One epoch means the network has looked at\nall your captured pictures once and adjusted once.</td>\n<td>Do not discuss batches, batch size, or iterations.</td>\n</tr>\n<tr class=\"even\">\n<td>Learning Rate</td>\n<td>The size of the adjustment the network makes each time it is wrong.\nBig number, big steps. Small number, small steps.</td>\n<td>Do not discuss gradients, derivatives, or optimizers.</td>\n</tr>\n<tr class=\"odd\">\n<td>Data Streams / the two class names</td>\n<td>The two answers the network is trying to sort your pictures into.\nSame idea as the two colors from Day 3’s diagram - except today, you\nchoose what the two answers are, and you supply the pictures.</td>\n<td>Do not discuss softmax, one-hot encoding, or output probability\nmath.</td>\n</tr>\n<tr class=\"even\">\n<td>The picture itself (784 numbers)</td>\n<td>The inputs. Instead of the two numbers, x1 and x2, from Day 3,\ntoday’s input is an entire small picture - a 28-by-28 grid of pixels,\neach one a brightness number, flattened into 784 numbers total. Same\nidea as Day 3’s inputs. A lot more of them, because a picture carries\nmore information than two numbers do.</td>\n<td>Do not discuss convolutional networks or image-specific\narchitectures - this network treats the picture as 784 plain numbers,\nexactly like Day 3’s weighted sums, just more of them.</td>\n</tr>\n<tr class=\"odd\">\n<td>Live Inference Data (the percentage bars)</td>\n<td>What the network currently thinks it’s looking at, updated live.\nThis is today’s version of the output square from Day 3’s forward\npass.</td>\n<td>Do not open the topic of confidence calibration.</td>\n</tr>\n<tr class=\"even\">\n<td>Synthetic Override / Neuron Bias Injection</td>\n<td>An extra feature this tool has that a plain drawing on paper\ndoesn’t: click a neuron in the diagram, and you can type in a new bias\nnumber by hand. (See the brief demonstration note below - this is not a\nfull segment today.)</td>\n<td>Do not build a dedicated activity around this today; a 60-90 second\ndemonstration is enough.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>A brief, optional demonstration of Neuron Bias\nInjection:</strong> If a spare minute appears anywhere in Segment 5 or 7\n(it often will not, and that is fine), click any neuron in the network\ndiagram, type a large bias number into the box that appears, and press\n<strong>Inject Bias Parameter</strong>. The Live Inference Data bars\nwill jump immediately - a visceral, direct demonstration that changing\none number really does change the network’s behavior. If you then press\nTRAIN MODEL again, students can watch the network’s own training process\nfight to correct the number you just forced in. This is genuinely worth\n60-90 seconds if the moment presents itself, but do not carve time out\nof the standing schedule to build a full activity around it.</p>\n<h3 id=\"step-c---technical-contingency-5-min\">Step C - Technical\ncontingency (5 min)</h3>\n<ul>\n<li><p>Confirm the site is not blocked by the site’s network filter, and\nconfirm camera access is not blocked at the device or school-network\nlevel (some school device-management policies restrict camera\npermissions by default). Do this the day before, not the morning\nof.</p></li>\n<li><p>The site runs entirely in the browser after loading and needs no\nfurther internet access once open, but it does need the camera\npermission grant to persist for the session - tell students not to\nrefresh the page once class begins, since a refresh will re-prompt for\ncamera access and discard any captured pictures.</p></li>\n<li><p>If a student’s device has no webcam, pair them with a working\ndevice. Segment 5 and Segment 7 work at a pair level; Worksheet 3 is\nstill completed individually.</p></li>\n<li><p>If cameras fail for the entire class (a school-wide policy block,\nfor instance), deliver Segments 5 and 7 as an instructor-led projected\ndemo using your own pre-tested gesture pair, cold-calling students to\nsupply the predictions before each run. Students still complete\nWorksheet 3 individually from the projected screen. The day survives\nthis; do not cancel the segments.</p></li>\n</ul>\n"}, {"id": "gen56instructorscriptandstu", "kind": "general", "num": null, "title": "5-6. Instructor Script and Student Activities", "html": "<p>Each segment below includes the instructor script, step-by-step\nexplanation flow, worked examples where applicable, and full student\nactivity instructions with deliverables. Script text is set off in the\nbordered boxes and is intended to be spoken close to verbatim.</p>\n"}, {"id": "seg1", "kind": "segment", "num": 1, "title": "Segment 1: Review of Day 3 + The Unanswered Question", "html": "<p><strong>Duration: 10 minutes (0:00–0:10) | Type: Lecture /\nDiscussion</strong></p>\n<p><strong>Materials needed:</strong> Board or slide. Students’\ncompleted Day 3 forward-pass worksheets. Devices closed.</p>\n<p><strong>Purpose:</strong> To re-activate the forward-pass skill, and\nthen to expose the one question Day 3 deliberately left unanswered -\ncreating the need for today’s content before any of it is delivered.</p>\n<h3 id=\"step-1.1---roadmap-2-min\">Step 1.1 - Roadmap (2 min)</h3>\n<p><em>Welcome back. Yesterday you built a neural network out of parts\nyou already knew. A neuron turned out to be a weighted sum - the same w\nx plus b from Day 2 - with one new step glued onto the end, the\nactivation function. A layer turned out to be a group of those neurons\nside by side. And a forward pass turned out to be nothing more than\ndoing those calculations in order, one layer at a time, carrying each\nanswer forward into the next.</em></p>\n<p><em>You did it by hand. It worked. You got a number out the other\nend. But I want you to notice something about yesterday that nobody said\nout loud. Today’s plan, in order: a quick review of the forward pass, a\nbrand-new idea called loss, the loop called training that actually finds\nthe weights, your first hands-on time inside a live neural network that\nteaches itself, a structured lab where you break things on purpose, and\na short connection to the final project on Day 5.</em></p>\n<p><strong>Instructor action:</strong> Show today’s six segment names on\nthe board/slide in order, left to right, exactly as done on Days 1, 2,\nand 3.</p>\n<h3 id=\"step-1.2---forward-pass-warm-up-5-min\">Step 1.2 - Forward Pass\nWarm-Up (5 min)</h3>\n<p><strong>Instructor action:</strong> Write this network on the board.\nGive students 3 minutes on scratch paper, working alone, then take the\nanswer from a cold-called student who walks the room through it step by\nstep.</p>\n<p><strong>Warm-Up Network.</strong> Input: x = 3. Hidden Neuron A: w =\n2, b = -8, with <strong>ReLU</strong>. Hidden Neuron B: w = -1, b = 5,\nwith <strong>ReLU</strong>. Output Neuron: weight on a(A) = 4, weight on\na(B) = 2, bias = 1, no activation function. Find the network’s\noutput.</p>\n<p><strong>Worked solution (instructor reference):</strong></p>\n<ul>\n<li><p>z(A) = (2)(3) + (-8) = 6 - 8 = -2. Negative → ReLU Off → a(A) =\n0.</p></li>\n<li><p>z(B) = (-1)(3) + 5 = -3 + 5 = 2. Positive → ReLU On → a(B) =\n2.</p></li>\n<li><p>z(out) = (4)(0) + (2)(2) + 1 = 0 + 4 + 1 = 5. <strong>Final\noutput = 5.</strong></p></li>\n</ul>\n<p><strong>Expected student responses:</strong> Most students should\nproduce 5 within 3 minutes. The most common error is applying ReLU to\nthe output neuron (producing 5 anyway, since 5 is positive - so ask the\nstudent who answers whether they applied ReLU at the end, and correct it\neven though the number is right).</p>\n<p><strong>Assessment Checkpoint 1 (informal, whole-class).</strong> Ask\nfor a show of hands: who got 5? If fewer than roughly three-quarters of\nthe room got it, stop and re-do the calculation on the board with a\nfresh set of numbers before Step 1.3. Do not proceed into loss on a\nshaky forward pass - every calculation in Segment 2 sits directly on top\nof this one.</p>\n<h3 id=\"step-1.3---the-unanswered-question-3-min\">Step 1.3 - The\nUnanswered Question (3 min)</h3>\n<p><em>Everybody <strong>look</strong> at the network on the board.\nWeight 2. Bias negative 8. Weight negative 1. Bias 5. Weight 4. Weight\n2. Bias 1. Now - hands up if you can tell me where those seven numbers\ncame from.</em></p>\n<p><em>[Pause. Let the silence sit. Someone will say “you made them up”\nor “the worksheet.”] That’s right. I made them up. I made them up\nyesterday too, and on Day 2 I let you drag sliders until the line looked\nright <strong>to</strong> your eye. Every weight and every bias you have\never used <strong>in</strong> this course was either handed to you or\nfound by you, by hand, by eyeball.</em></p>\n<p>Real neural networks have thousands of weights. Some have billions.\nNobody hands those out. Nobody drags billions of sliders. So here is the\nquestion today answers, and it is the last big idea of this course:\n<strong>how does a network find its own weights?</strong> The answer has\ntwo parts. First, the network needs a way to know how wrong it is -\nthat’s a number called loss. Second, it needs a way to use that number\nto get less wrong - that’s a loop called training. Loss first.</p>\n<p><strong>Transition to Segment 2:</strong> Write the word\n<strong>LOSS</strong> on the board, large, and leave it there for the\nrest of the day.</p>\n"}, {"id": "seg2", "kind": "segment", "num": 2, "title": "Segment 2: Loss - Measuring How Wrong a Model Is", "html": "<p><strong>Duration: 30 minutes (0:10–0:40) | Type: Lecture +\nActivity</strong></p>\n<p><strong>Materials needed:</strong> Board. Worksheet 1 (Measuring Loss\nby Hand), one per student. Devices closed.</p>\n<p><strong>Purpose:</strong> To give students a concrete,\nhand-calculable definition of loss, so that the falling loss number they\nwill watch in Segment 5 is a quantity they personally understand rather\nthan a number on a screen.</p>\n<h3 id=\"step-2.1---why-we-need-a-number-5-min\">Step 2.1 - Why We Need a\nNumber (5 min)</h3>\n<p><em>Back on Day 2, you dragged sliders until the line looked good. I\nwant you to think about what “looked good” <strong>actually\nmeant</strong>. You were looking at the gaps between the line and the\ndots, and you were trying to make those gaps small. You were measuring -\nyou just weren’t writing the measurement down.</em></p>\n<p>A computer has no eyes. It cannot look at a graph and\n<strong>say</strong> “close enough.” If we want a network to improve\nitself, we <strong>have to</strong> hand it a single number that says\nexactly how bad it currently is. That number is called\n<strong>loss</strong>. Write this down: <strong>loss is one number that\nmeasures how far a model’s predictions are from the correct\nanswers.</strong> And here is the rule that matters most: lower loss is\nbetter. Loss of zero would mean perfect.</p>\n<p><strong>Instructor action:</strong> Write on the board and leave up:\n<strong>LOSS = how wrong the model is, as one number. LOWER IS BETTER.\nZERO IS PERFECT.</strong></p>\n<h3 id=\"step-2.2---building-the-loss-calculation-8-min\">Step 2.2 -\nBuilding the Loss Calculation (8 min)</h3>\n<p><strong>Instructor action:</strong> Build the table below on the\nboard one column at a time, asking the class for each value before\nwriting it. Do not present the finished table.</p>\n<p><em>Here is a model: y equals 2x plus 1. A weighted sum. Weight 2,\nbias 1. And here is our data - three points we know the right answer\nfor.</em></p>\n<p><strong>Data:</strong> (1, 4), (2, 5), (3, 8).\n<strong>Model:</strong> prediction = 2x + 1.</p>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>x</strong></th>\n<th><strong>Correct answer</strong></th>\n<th><strong>Model prediction (2x + 1)</strong></th>\n<th><strong>Error (prediction - correct)</strong></th>\n<th><strong>Error squared</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>4</td>\n<td>3</td>\n<td>-1</td>\n<td>1</td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>5</td>\n<td>5</td>\n<td>0</td>\n<td>0</td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>8</td>\n<td>7</td>\n<td>-1</td>\n<td>1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Average of the squared errors:</strong> (1 + 0 + 1) / 3 = 2 /\n3 = <strong>0.67</strong>. That is the loss.</p>\n<p>Three steps, and you already know all three. <strong>One:</strong>\nrun the model to get a prediction - that’s a weighted sum, Day 2. Two:\nsubtract to find the error - how far off you were on that one point.\nThree: square each error, then average them. That average is the\nloss.</p>\n<p><em>Why square? Two reasons, and both are practical. First, look at\nrow one - the error was negative one. If I just averaged the raw errors,\na model that guessed way too high on one point and way too low on\nanother would average out to zero and look perfect, when\n<strong>actually it</strong> was terrible on both. Squaring makes every\nerror positive, so mistakes can never cancel each other out. Second,\nsquaring punishes big misses much harder than small ones - an error of 1\ncontributes 1, but an error of 10 contributes 100. That’s what we want.\nA model that is a little off on everything is better than a model that\nis wildly off on one thing.</em></p>\n<h3 id=\"step-2.3---guided-comparison-which-model-is-better-5-min\">Step\n2.3 - Guided Comparison: Which Model Is Better? (5 min)</h3>\n<p><strong>Instructor action:</strong> This is the key move of the\nsegment - loss is only useful because it lets you compare two models.\nUse the same three data points.</p>\n<p><em>Now here’s a second model. y equals 3x, no bias. Same three data\npoints. Before we calculate: predict. Show of hands - who thinks this\nnew model has a lower loss than 0.67? Who thinks higher? [Take the vote.\nRecord the split on the board.] Now let’s find out.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>x</strong></th>\n<th><strong>Correct answer</strong></th>\n<th><strong>Model B prediction (3x)</strong></th>\n<th><strong>Error</strong></th>\n<th><strong>Error squared</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>4</td>\n<td>3</td>\n<td>-1</td>\n<td>1</td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>5</td>\n<td>6</td>\n<td>+1</td>\n<td>1</td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>8</td>\n<td>9</td>\n<td>+1</td>\n<td>1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Loss of Model B:</strong> (1 + 1 + 1) / 3 = 3 / 3 =\n<strong>1.00</strong>.</p>\n<p><em>Model A: loss of 0.67. Model B: loss of 1.00. Lower is better -\nso <strong>Model A is the better model</strong>, and we did not have to\nlook at a single graph to <strong>know</strong> it. We compared two\nnumbers. That is the whole reason loss exists. Hold onto that, because\nin about an hour you are going to watch a computer\n<strong>compare</strong> millions of models this way, in about ten\nseconds.</em></p>\n<p><strong>Assessment Checkpoint 2 (informal, whole-class).\nCold-call</strong>: “Which model is better, and how do you know?” A\ncorrect answer must contain both parts - Model A, because its loss is\nlower. A student who says “Model A” without citing the loss number has\nnot yet connected the number to the judgment. Push for the second\nhalf.</p>\n<h3\nid=\"step-2.4---student-activity-worksheet-1-measuring-loss-by-hand-12-min\">Step\n2.4 - Student Activity: Worksheet 1, Measuring Loss by Hand (12\nmin)</h3>\n<p><strong>Purpose:</strong> Independent practice with the three-step\nloss calculation, and independent practice with the comparison judgment\nthat loss enables.</p>\n<p><strong>Estimated time:</strong> 12 minutes (8 minutes alone, 4\nminutes checking with table group).</p>\n<p><strong>Materials:</strong> Worksheet 1, pencil.</p>\n<p><strong>Instructions given to students, exactly as written on the\nworksheet:</strong> For each of the two models below, fill in the\nprediction column, the error column, and the error-squared column for\nall four data points. Then average the squared errors to get the loss.\nShow your subtraction. Finally, circle which model is better and write\none sentence saying how you know. Work alone for the first 8 minutes,\nthen compare with your table group for the last 4.</p>\n<p><strong>Data set (printed on worksheet):</strong> (1, 3), (2, 5), (3,\n9), (4, 11).</p>\n<p><strong>Model A:</strong> prediction = 3x. <strong>Model B:</strong>\nprediction = 2x + 2.</p>\n<p><strong>Answer key - Model A (prediction = 3x):</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>x</strong></th>\n<th><strong>Correct</strong></th>\n<th><strong>Prediction</strong></th>\n<th><strong>Error</strong></th>\n<th><strong>Error squared</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>3</td>\n<td>3</td>\n<td>0</td>\n<td>0</td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>5</td>\n<td>6</td>\n<td>+1</td>\n<td>1</td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>9</td>\n<td>9</td>\n<td>0</td>\n<td>0</td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>11</td>\n<td>12</td>\n<td>+1</td>\n<td>1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Loss of Model A</strong> = (0 + 1 + 0 + 1) / 4 = 2 / 4 =\n<strong>0.5</strong>.</p>\n<p><strong>Answer key - Model B (prediction = 2x + 2):</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>x</strong></th>\n<th><strong>Correct</strong></th>\n<th><strong>Prediction</strong></th>\n<th><strong>Error</strong></th>\n<th><strong>Error squared</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>3</td>\n<td>4</td>\n<td>+1</td>\n<td>1</td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>5</td>\n<td>6</td>\n<td>+1</td>\n<td>1</td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>9</td>\n<td>8</td>\n<td>-1</td>\n<td>1</td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>11</td>\n<td>10</td>\n<td>-1</td>\n<td>1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Loss of Model B</strong> = (1 + 1 + 1 + 1) / 4 = 4 / 4 =\n<strong>1.0</strong>.</p>\n<p><strong>Correct final judgment:</strong> Model A is better, because\nits loss (0.5) is lower than Model B’s loss (1.0).</p>\n<p><strong>Expected student responses:</strong> Both loss values\ncalculated correctly with subtraction shown; Model A circled; a\njustification sentence that explicitly names the lower loss value. A\nsentence such as “Model A is better because 0.5 is less than 1.0 and\nlower loss means the predictions were closer” is a full-credit\nresponse.</p>\n<h3 id=\"common-misconceptions---segment-2\">Common misconceptions -\nSegment 2</h3>\n<ul>\n<li><p><strong>“Higher loss means the model is doing more, so it must be\nbetter.”</strong> Students are used to school metrics where bigger is\nbetter (scores, grades, points). Loss inverts this. Correct it\nexplicitly and repeatedly today: loss is a measure of badness, like a\ngolf score. Every time you say the word loss for the rest of the day,\nsay “lower is better” in the same breath until it stops being\nnecessary.</p></li>\n<li><p><strong>Averaging the raw errors instead of the squared\nerrors.</strong> A student who skips the squaring step on Model B will\ncompute (1 + 1 - 1 - 1) / 4 = 0 and conclude Model B is perfect. This is\na genuinely instructive error - if it occurs, put it on the board and\nuse it as the answer to “why do we square?” Do not treat it as a\ncareless mistake; treat it as a discovery.</p></li>\n<li><p><strong>Squaring the prediction instead of the error.</strong>\nPurely mechanical. Catch it by requiring the error column to be filled\nin and shown before the squared column.</p></li>\n<li><p><strong>“Loss of zero is impossible, so why bother?”</strong>\nCorrect framing: loss of zero is the target, not the expectation. The\ngoal of training is to make loss as small as it can get, not to reach\nzero. Preview that in Segment 5 they will watch loss fall and then\nflatten out - and where it flattens is the model’s best.</p></li>\n</ul>\n<h3 id=\"differentiation-strategies---segment-2\">Differentiation\nstrategies - Segment 2</h3>\n<ul>\n<li><p><strong>Students needing support:</strong> Allow calculators. The\nmathematical content is the three-step procedure, not the arithmetic.\nProvide a partially completed Model A table (first row filled in) so the\nstudent starts from a worked example. Pair with a table-group peer for\nthe error column specifically, as signed subtraction is the most common\nsticking point.</p></li>\n<li><p><strong>Students needing extension:</strong> Ask them to find, by\ntrial and error on scratch paper, a model of the form y = wx + b that\nachieves a <strong>lower</strong> loss than 0.5 on the worksheet data\nset. (A model close to y = 2.8x + 0.5 gets there.) This makes them do by\nhand, for two parameters, exactly what training does automatically for\nthousands - which is the perfect primer for Segment 4. Have them report\ntheir best loss aloud during Step 4.1.</p></li>\n<li><p><strong>Students who finish early:</strong> Have them write, in\none sentence, what a loss of exactly 0 would mean about the model’s\npredictions. (Answer: every prediction exactly matched every correct\nanswer.)</p></li>\n</ul>\n<h3 id=\"assessment-criteria---segment-2\">Assessment criteria - Segment\n2</h3>\n<ul>\n<li><p><strong>Proficient:</strong> Both loss values correct (0.5 and\n1.0), error column filled in with correct signs, correct model circled,\njustification sentence cites the loss numbers.</p></li>\n<li><p><strong>Developing:</strong> Loss values correct but\njustification does not reference the numbers, or one arithmetic slip\nwith correct procedure throughout.</p></li>\n<li><p><strong>Needs support:</strong> Squaring step omitted, or “higher\nis better” reasoning. Both require direct intervention before Segment 5,\nsince the entire SAIL Architect Lab experience is read through the loss\nnumber.</p></li>\n</ul>\n<p><strong>Transition to Segment 3:</strong> “You now have a number that\ntells you how bad a model is. Take five minutes, and when you come back,\nI’ll show you what a network does with that number.”</p>\n<p>Segment 3: Break</p>\n<p><strong>Duration: 5 minutes (0:40–0:45)</strong></p>\n<p><em>Five-minute break. Devices stay closed. Be back in your seat at\n[state exact clock time].</em></p>\n"}, {"id": "break3", "kind": "segment", "num": 3, "title": "Segment 3: Break", "html": "<p>Scheduled break. Students step away from screens; the timer on the slide counts it down. Durations are listed in the day timeline.</p>"}, {"id": "seg4", "kind": "segment", "num": 4, "title": "Segment 4: Training - The Loop That Finds the Weights", "html": "<p><strong>Duration: 25 minutes (0:45–1:10) | Type: Lecture +\nActivity</strong></p>\n<p><strong>Materials needed:</strong> Board. Students’ Day 3\nforward-pass worksheets. Devices closed until Step 4.4.</p>\n<p><strong>Purpose:</strong> To define training as a four-step loop\nbuilt entirely out of things students can already do, and to establish\nthe learning rate as a real, consequential control before students ever\nsee it on screen.</p>\n<h3 id=\"step-4.1---the-loop-6-min\">Step 4.1 - The Loop (6 min)</h3>\n<p>Somebody in this room spent the last part of Segment 2 trying to\nfind a model with a loss lower than 0.5. [If you assigned the extension,\ncall on that student: what was your best loss, and how did you find it?]\nListen to how they did it. They picked some numbers. They calculated the\nloss. It wasn’t good enough. <strong>So</strong> they <strong>changed\nthe numbers a little and calculated again.</strong> And they kept doing\nthat until the loss stopped getting better.</p>\n<p><em>Congratulations - you just described <strong>training</strong>.\nThat is the entire algorithm. A neural network trains itself by doing\nexactly what your classmate just did by hand, except it does\n<strong>it</strong> thousands of times a second and it does it to every\nweight in the network at once.</em></p>\n<p><strong>Instructor action:</strong> Write the four-step loop on the\nboard as a numbered cycle, with an arrow from step 4 back to step 1.\nLeave it up for the rest of the day. This diagram is referenced in\nSegments 5, 7, 8, and 9.</p>\n<p><strong>THE TRAINING LOOP</strong></p>\n<p><strong>1. Forward pass.</strong> Push the inputs through the\nnetwork. Get an output. (You did this yesterday, by hand.)</p>\n<p><strong>2. Measure loss.</strong> Compare that output to the correct\nanswer. Get one number. (You did this 30 minutes ago, by hand.)</p>\n<p><strong>3. Adjust.</strong> Nudge every weight and every bias a\nlittle, in whatever direction makes the loss smaller.</p>\n<p><strong>4. Repeat.</strong> Go back to step 1. Do it again. And\nagain. And again. → back to step 1*</p>\n<p>Look hard at that list. You already know how to do step one - you\ndid it on <strong>the board</strong> this morning. You already know how\nto do step two - you did it on the worksheet. Steps three and four are\nthe only new things in this entire day, and step four is just the word\n“again.” The only genuinely new idea on this board is step three:\n<strong>nudge the weights in whatever direction makes the loss\nsmaller.</strong></p>\n<h3 id=\"step-4.2---what-nudge-means-6-min\">Step 4.2 - What “Nudge” Means\n(6 min)</h3>\n<p><em>So how does the network know which direction makes the loss\nsmaller? Here is the honest answer, and it is enough for this course: it\nchecks. Imagine you have one weight, currently set to 2, and your loss\nis 0.8. The network asks: what if I made it 2.1? It works out that the\nloss would go to 0.75. Better. <strong>So</strong> it\n<strong>moves</strong> that direction. What if instead it had gone to\n1.9 and the loss went up to 0.9? Then it moves the other way.</em></p>\n<p>Every weight, every time through the loop, gets that same treatment:\nwhich way makes the loss go down, and go that way a little. The\nmathematics for doing that efficiently is called calculus, and you will\nmeet it in a few years. You do not need it today. What you need is the\nidea, and the idea is: <strong>downhill.</strong> Loss is a hill. The\nnetwork is always walking downhill.</p>\n<p>Now - one more control, and this is the one that\n<strong>trips</strong> people up, so we’re going to talk about it before\nyou ever see it. When the network takes that step downhill, how\n<strong>big</strong> a step should it take? That step size has a name:\nthe learning rate. Big learning rate, big steps. Small learning rate,\nsmall steps.</p>\n<p><strong>Instructor action:</strong> Draw a simple U-shaped curve on\nthe board. Label the vertical axis “Loss” and put a dot high on the left\nside of the U. Label the bottom of the U “lowest loss - the best model.”\nUse this drawing for the discussion below and leave it up.</p>\n<h3 id=\"step-4.3---guided-discussion-the-goldilocks-problem-7-min\">Step\n4.3 - Guided Discussion: The Goldilocks Problem (7 min)</h3>\n<p><strong>Purpose:</strong> To make the learning rate a concept\nstudents reason about, not a slider they discover by accident in Segment\n7. This discussion is where the misconception “bigger learning rate =\nlearns faster = better” is killed before it can form.</p>\n<p><strong>Instructor action:</strong> Pose each question, take 30\nseconds of table-group talk, then take answers. Use the U-curve on the\nboard throughout, physically tracing the steps with your finger.</p>\n<p><strong>Guided Question 1.</strong> “Our dot is up here on the side\nof the hill, and it takes a tiny step downhill, then another, then\nanother. It will get to the bottom eventually. What is the\ndownside?”</p>\n<p><strong>Expected student responses:</strong> “It takes forever.”\n“You’d need a huge number of steps.” Both are correct. <strong>Reframe\nfor the class:</strong> a learning rate that is too small still works -\nit is just slow. In the SAIL Architect Lab, this will look like a\nTraining Loss number that falls, but so slowly you get bored watching\nit.</p>\n<p><strong>Guided Question 2.</strong> “Okay - so make the steps\nenormous. Giant leaps. We’ll get to the bottom in three steps instead of\nthree thousand. What goes wrong?” (Trace an enormous step with your\nfinger: from high on the left side of the U, clear over the bottom, to\nhigh on the right side. Then trace an even bigger one back over to the\nleft, higher than where you started.)</p>\n<p><strong>Expected student responses:</strong> “You jump over the\nbottom.” “You miss it.” “You end up on the other side.” Some students\nwill see that the next giant step overshoots back the other way, even\nhigher. Draw that out - it is the whole point.</p>\n<p>Exactly. With <strong>steps that big</strong>, you don’t settle at\nthe bottom - you bounce back and forth across the valley, and you can\nend up <strong>worse</strong> than where you started. The loss doesn’t\ngo down. It jumps around, or it explodes upward. This is real, it is\ncommon, and you are going to make it happen on purpose in about an\nhour.</p>\n<p><strong>Guided Question 3 (the one that matters).</strong>\n“<strong>So</strong> which is better - a big learning rate or a small\nlearning rate?”</p>\n<p><strong>Expected student responses:</strong> The trap answer is “big,\nbecause it learns faster.” Some students will say it. <strong>Do not\ncorrect them harshly - this is exactly the intuition the question is\ndesigned to surface.</strong> Let the class argue for a moment, then\nland the answer: <strong>neither is better. There is no “better.” There\nis only “right for this problem.”</strong> Too small is slow. Too big is\nunstable. The learning rate is a dial you tune, not a dial you\nmaximize.</p>\n<p><strong>Instructor action:</strong> Write on the board under the\nU-curve: <strong>LEARNING RATE = step size. Too small → slow. Too big →\novershoots and gets worse. There is no “best” setting - only the right\none for the problem.</strong></p>\n<h3 id=\"step-4.4---predict-before-you-test-setup-6-min\">Step 4.4 -\nPredict-Before-You-Test Setup (6 min)</h3>\n<p><strong>Instructor</strong> action: Devices may now be opened. Have\nstudents open the SAIL Architect Lab and grant camera permission, then\n<strong>leave it alone</strong> - no clicking beyond that. The point of\nopening now is to remove the “getting the site loaded and the camera\ngranted” delay from Segment 5, and to let students write predictions\nwhile looking at the real controls.</p>\n<p>Everybody <strong>open</strong> your browser and <strong>go</strong>\nto the SAIL Architect Lab - the link is on the board. Say yes when it\nasks for camera permission; that’s the network’s eyes, and it needs them\nto see what you show it. Hands off the mouse once it loads. Look at the\nbottom-left of the screen. You’ll see a slider labeled Learning Rate.\nRight above it, a dropdown labeled Activation <strong>Function. That\nword should look familiar - that is Day 3’s activation function, and one\nof the options in that dropdown is </strong>ReLU, which you now know\ncold.</p>\n<p>In the middle of the <strong>screen</strong> you’ll see a network\ndiagram - a picture of the same kind of neurons and layers you built by\nhand yesterday. And on the right side of the screen, a chart labeled\n<strong>Training Loss.</strong> That is the number you calculated by\nhand thirty minutes ago, graphed over time. Everything on this screen is\nsomething you already know. Before you touch anything else, turn to\nWorksheet 2 and write your prediction in the first box.</p>\n<p><strong>Worksheet 2, Prediction Box 1 (students write before Segment\n5):</strong> “When I train the network, the Training Loss number will:\n(circle one) GO UP / GO DOWN / STAY THE SAME. In one sentence, why?”</p>\n<p><strong>Expected student responses:</strong> Nearly all students\nshould circle GO DOWN, with reasoning along the lines of “because\ntraining means nudging the weights to make the loss smaller.” A student\nwho circles GO UP or STAY THE SAME has not connected the loop to the\nloss number - address it individually while circulating, before Segment\n5 begins.</p>\n<h3 id=\"common-misconceptions---segment-4\">Common misconceptions -\nSegment 4</h3>\n<ul>\n<li><p><strong>“A bigger learning rate is better because the model\nlearns faster.”</strong> The single most common and most consequential\nmisconception of the day. Addressed head-on in Step 4.3, Guided Question\n3, and then experienced directly in Segment 7, Modification 4. If a\nstudent still holds it after Step 4.3, do not argue - tell them they\nwill get to test it themselves in an hour, and hold them to it.</p></li>\n<li><p><strong>“The network already knows the right weights and is just\nrevealing them.”</strong> Students often imagine training as uncovering\na hidden correct answer. Correct it: the network starts with random\nnumbers - genuinely random - and is genuinely bad at the start. There is\nno answer key inside the network. Point out that this is exactly why the\nloss starts high.</p></li>\n<li><p><strong>“Training changes the network’s structure.”</strong> It\ndoes not. Training changes only the <strong>numbers</strong> - the\nweights and the biases. The number of hidden layers, and the activation\nfunction, are all chosen by a human before training starts, and they do\nnot change while it runs (in the SAIL Architect Lab, changing either of\nthose actually rebuilds the network from scratch - a fact worth knowing\nfor Segment 5, but not one you need to state to students yet). This\ndistinction is the entire organizing principle of today: Segment 5\nchanges numbers, Segment 7 changes structure. State it explicitly\nhere.</p></li>\n<li><p><strong>“Loss going down means the model is right.”</strong> Loss\ngoing down means the model is <strong>less wrong than it was.</strong> A\nloss that falls from 0.9 to 0.4 is real progress and still a mediocre\nmodel. Reserve judgment about “good” until Segment 5, when students see\nwhat a genuinely low loss looks like.</p></li>\n</ul>\n<h3 id=\"differentiation-strategies---segment-4\">Differentiation\nstrategies - Segment 4</h3>\n<ul>\n<li><p><strong>Students needing support:</strong> The U-curve drawing\ndoes the heavy lifting. Return to it physically every time the learning\nrate comes up for the rest of the day, and trace the step size with a\nfinger rather than restating the definition verbally.</p></li>\n<li><p><strong>Students needing extension:</strong> Ask: “In our loop,\nstep 3 says nudge <strong>every</strong> weight. Our warm-up network had\nseven numbers in it. Today’s network has thousands, because every one of\nits 784 inputs connects to every neuron in the first hidden layer. If a\nreal network has a billion, what does that tell you about how much\ncomputing this loop takes?” This is an honest,\nunresolvable-in-this-course question that connects directly to why AI is\nexpensive and energy-intensive - a thread that returns in Segment\n8.</p></li>\n<li><p><strong>Students with strong math background:</strong> A student\nmay ask how the network knows the downhill direction without testing\nevery value. Answer honestly and briefly: “There is a calculus technique\nthat computes the direction directly instead of guessing. It’s called\ngradient descent. That name is all you need today.” Then move on - do\nnot open the topic to the room.</p></li>\n</ul>\n<h3 id=\"assessment-criteria---segment-4\">Assessment criteria - Segment\n4</h3>\n<ul>\n<li><p><strong>Proficient:</strong> Student can restate the four-step\nloop in order without looking at the board, and can explain that\ntoo-large a learning rate makes loss worse rather than better.</p></li>\n<li><p><strong>Developing:</strong> Student can state the loop but\ncannot yet explain why a large learning rate is risky.</p></li>\n<li><p><strong>Needs support:</strong> Student believes training reveals\npre-existing correct weights, or believes bigger learning rate is\nunambiguously better. Both are directly falsified in Segments 5 and 7 -\nflag these students to yourself and check in with them at Modification 4\nspecifically.</p></li>\n</ul>\n<p><strong>Transition to Segment 5:</strong> “You have a loop, you have\na loss, and you have a prediction written down. Cameras on. Let’s find\nout.”</p>\n"}, {"id": "seg5", "kind": "segment", "num": 5, "title": "Segment 5: Guided Hands-On - First Contact with the SAIL Architect Lab", "html": "<p><strong>Duration: 40 minutes (1:10–1:50) | Type: Guided Hands-On\nActivity</strong></p>\n<p><strong>Materials needed:</strong> One device per pair, camera\npermission already granted. Worksheet 2 (SAIL Architect Lab Field Guide\nand Guided Run). Instructor laptop projected. Board (the training loop\nand U-curve should still be visible from Segment 4).</p>\n<p><strong>Purpose:</strong> This is the longest and highest-content\nsegment of the day, and it carries the module’s central experience:\nwatching a neural network teach itself, using real pictures students\ncaptured themselves, and connecting every element of what is on screen\nto a calculation the student has already performed by hand. Everything\nin Segment 7 depends on the fluency built here.</p>\n<p><strong>Format note:</strong> Every step in this segment is\n<strong>projected first, then student-executed.</strong> The instructor\nperforms each action on the projector, students then perform it on their\nown device, and the instructor confirms every screen matches before\nmoving on. Do not let the class fragment - a pair whose configuration or\ngesture pair silently differs from the projected one will draw\ndifferent, harder-to-compare conclusions from the rest of the day.</p>\n<h3 id=\"step-5.1---setting-up-and-capturing-your-data-12-min\">Step 5.1 -\nSetting Up and Capturing Your Data (12 min)</h3>\n<p><strong>Instructor action:</strong> Project your own screen, already\nloaded with your two gestures pre-tested from your prep work. Walk the\nclass through each setting one at a time, stating it aloud, changing it\non the projector, and then waiting - visibly - while every pair does the\nsame on their own screen. Circulate. This step is slow on purpose.</p>\n<p><strong>The starting configuration (every pair must match this\nexactly):</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Control</strong></th>\n<th><strong>Where it is</strong></th>\n<th><strong>Set it to</strong></th>\n<th><strong>Why (say this aloud)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Camera permission</td>\n<td>Browser prompt on page load</td>\n<td>Allow</td>\n<td>“The network’s eyes. It cannot learn from a gesture it cannot\nsee.”</td>\n</tr>\n<tr class=\"even\">\n<td>Class names (“Target Alpha” / “Target Beta”)</td>\n<td>Top of the Data Streams panel, left side</td>\n<td>Rename to your two chosen gestures - the whole class uses the same\npair (recommended default: <strong>Open Hand</strong> / <strong>Closed\nFist</strong>)</td>\n<td>“Two categories, exactly like the two colors in yesterday’s diagram.\nExcept today, we choose what the two categories are, and we supply the\npictures.”</td>\n</tr>\n<tr class=\"odd\">\n<td>Hidden layers</td>\n<td>Top-left of the network panel, layer icon and minus icon</td>\n<td>Leave at the default: 2 hidden layers</td>\n<td>“Same neuron-and-layer idea as yesterday. Just more of it, because a\npicture has a lot more to look at than two numbers.”</td>\n</tr>\n<tr class=\"even\">\n<td>Activation Function</td>\n<td>Bottom of the left panel, dropdown</td>\n<td>ReLU (Non-Linear)</td>\n<td>“You know this one cold.”</td>\n</tr>\n<tr class=\"odd\">\n<td>Learning Rate</td>\n<td>Bottom of the left panel, slider</td>\n<td>0.01 (the default)</td>\n<td>“A small, safe step size. We will break this on purpose later.”</td>\n</tr>\n</tbody>\n</table>\n<p><em>Look at what you just set up. Two categories. Two hidden layers.\n<strong>ReLU</strong>. That is the same kind of network you did a\nforward pass on by hand yesterday - same weighted-sum-plus-activation\nneurons, same idea of layers passing information forward. Except for one\ndifference, and it is the whole point of today. Yesterday I gave you the\nweights. Today, nobody has. This network currently knows nothing. It is\nabout to be very, very bad at its job.</em></p>\n<p><em>But first, it needs something to learn from - and that something\nis pictures, and you are about to go get them.</em></p>\n<p><strong>Student action - capturing data:</strong> Switch to the\n<strong>Capture</strong> tab. For each class, hold down the <strong>HOLD\nTO RECORD</strong> button under that class’s name while making the\nmatching gesture in front of the camera. Move a little while recording -\ncloser, farther, tilted, slightly rotated - so the pictures are varied\nrather than identical copies of one pose. Capture <strong>at least 20-25\nframes per class</strong> (roughly 10-15 seconds of holding the button\nper class is plenty). One partner holds the gesture; the other watches\nthe frame count and confirms both classes have enough.</p>\n<p><em>This is data - the same word from Day 1. On Day 1 I told\n<strong>you</strong> AI systems <strong>learn</strong> from data. Today\nyou are the one collecting it. And notice what you’re doing right now,\nbecause it matters later: you’re choosing how many pictures, from what\nangles, in what lighting, of whose hand. Every one of those choices is\nabout to shape what this network learns. Hold onto that thought - we\ncome back to it this afternoon.</em></p>\n<p><strong>Assessment Checkpoint 3 (visual, whole-class).</strong>\nBefore pressing TRAIN MODEL, walk the room. Every screen should show:\nyour two gesture names, at least ~20 frames captured for each (visible\nas a frame count if you check the Inspect tab, or simply confirm by\nwatching each pair record), 2 hidden layers, Activation Function\n<strong>ReLU</strong>, Learning Rate 0.01. Do not proceed until every\nscreen matches. This takes a couple of minutes and prevents 40 minutes\nof confusion.</p>\n<h3 id=\"step-5.2---the-first-run-7-min\">Step 5.2 - The First Run (7\nmin)</h3>\n<p><strong>Instructor action:</strong> Have students look at their\nPrediction Box 1 from Step 4.4 before pressing anything. Then run it on\nthe projector first, narrating, before releasing students to run their\nown.</p>\n<p><em>Before anybody touches the button - read your prediction out loud\nto your table. You wrote down what the Training Loss would do. In a few\nseconds you find out if you were right.</em></p>\n<p><em>Watch the Epoch Loop counter in the header, and the Training Loss\nchart on the right. Right <strong>now</strong> the loss is probably\nstarting somewhere <strong>high, and</strong> remember what that means -\nthe network is currently wrong, by a lot, and that number is exactly how\nwrong. Here we go. [Press TRAIN MODEL. Narrate live.] Loss is falling.\nWatch the chart bend downward. Watch the Live Inference Data bars on the\nright start to separate instead of sitting near fifty-fifty. [After\n20-40 seconds, or once the chart visibly flattens, press the button\nagain to HALT COMPILATION.]</em></p>\n<p><em>Stop. Look at what just happened. Nobody told it which pixels\nmattered. Nobody handed it a weight. That network started with random\nnumbers and a high loss, and it walked itself downhill until it could\ntell your two gestures apart. It did the loop - forward pass, measure\nloss, nudge, repeat - a few thousand times, and it found its own\nweights. That is training. Now do it yourself.</em></p>\n<p><strong>Student action:</strong> Pairs press TRAIN MODEL on their own\ndevice, watch until the Training Loss chart visibly flattens (usually\nwell under a minute), and press HALT COMPILATION. They then hold each\ngesture up to the camera in turn and watch the Live Inference Data bars\nrespond, before completing Worksheet 2, Box 2.</p>\n<p><strong>Worksheet 2, Box 2:</strong> “Starting Training Loss\n(approximate): _____ Final Training Loss (approximate): _____ Was my\nprediction (Box 1) correct? YES / NO. When I held up each gesture, what\ndid the Live Inference Data bars do? Describe in one sentence.”</p>\n<p><strong>Expected student responses:</strong> Starting loss visibly\nhigh; final loss noticeably lower and roughly flat. Prediction confirmed\n(GO DOWN). Bars described as clearly favoring the correct gesture with a\nconfident percentage split. <strong>Note:</strong> exact numbers, and\nexactly how confident the bars get, will differ between pairs, because\nthe starting weights are random and every pair captured slightly\ndifferent pictures. This is not an error, and it is worth stating\naloud.</p>\n<p><strong>Say this aloud when students notice their results differ from\ntheir neighbors’:</strong> “Your numbers are different from your\nneighbor’s, and your bars might be more or less confident than theirs,\nand that is correct. Your network started from random weights, and it\nlearned from pictures only your pair captured. You each walked downhill\nfrom a different starting point, using slightly different data, to\nroughly the same kind of result. Different journey, similar\ndestination.”</p>\n<h3 id=\"step-5.3---reading-the-training-loss-chart-8-min\">Step 5.3 -\nReading the Training Loss Chart (8 min)</h3>\n<p><strong>Purpose:</strong> Loss is a number, but the\n<strong>chart</strong> is where the diagnosis lives. This step teaches\nstudents to read a training run at a glance - a skill they use for every\nremaining minute of the course, including Day 5.</p>\n<p><strong>Instructor action:</strong> Project the Training Loss chart.\nPoint at each region as you describe it. Then have students identify\neach region on their own chart.</p>\n<p><em>Look at the Training Loss chart on the right. That is a picture\nof your network’s whole training run so far. Read it left to right, and\nit tells you three things.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>What the chart looks like</strong></th>\n<th><strong>What it means</strong></th>\n<th><strong>What you should do about it</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Falling steeply</td>\n<td>“The network is learning fast. It is well up the hill and every step\nis helping.”</td>\n<td>Let it run.</td>\n</tr>\n<tr class=\"even\">\n<td>Falling slowly, or flat and low</td>\n<td>“The network has finished learning. It has found the bottom of the\nhill. Running longer will not help much.”</td>\n<td>Press HALT COMPILATION. This is done.</td>\n</tr>\n<tr class=\"odd\">\n<td>Flat and HIGH, never falling</td>\n<td>“The network is failing to learn. It is stuck. Something about its\nsetup is wrong - the wrong activation function, or the problem is\ngenuinely hard for this network.”</td>\n<td>Stop and change something. Running longer will NOT fix this.</td>\n</tr>\n<tr class=\"even\">\n<td>Jumping up and down wildly</td>\n<td>“The network is unstable. It is taking steps that are too big and\nbouncing across the valley.”</td>\n<td>Lower the Learning Rate.</td>\n</tr>\n</tbody>\n</table>\n<p>Memorize the third row, because it is the one people get wrong. If\nyour loss is flat and high, <strong>waiting longer will not\nhelp.</strong> The network is not thinking. It is <strong>not\nalmost</strong> there. It is stuck, and it will stay stuck for a million\nmore epochs. A flat, high loss chart is not patience - it is a bug\nreport. Something in your setup <strong>has to</strong> change.</p>\n<p><strong>Student action:</strong> Students complete Worksheet 2, Box\n3.</p>\n<p><strong>Worksheet 2, Box 3:</strong> “Look at your own Training Loss\nchart. Sketch its shape in the box. Then circle which of the four\ndescriptions above it matches, and write one sentence explaining what\nthat tells you about your network.”</p>\n<p><strong>Assessment Checkpoint 4 (individual, circulate).</strong>\nLook at three or four students’ <strong>Box</strong> 3 sketches. A\ncorrect sketch shows a steep drop followed by a flat low tail,\nidentified as “finished learning.” A student who sketches this correctly\nbut circles “still learning” <strong>has</strong> not connected the\nshape to the meaning - stop and point at the flat part with them. This\nis the exact skill they need in Modification 1, twenty minutes from\nnow.</p>\n<h3\nid=\"step-5.4---guided-modification-change-a-number-not-the-structure-10-min\">Step\n5.4 - Guided Modification: Change a Number, Not the Structure (10\nmin)</h3>\n<p><strong>Purpose:</strong> A first, fully guided modification cycle,\nperformed together as a class, that models exactly the\npredict-modify-observe-explain routine students will perform\nindependently in Segment 7. This is the “we do it together” step of\ngradual release; Segment 7 is the “you do it” step.</p>\n<p><strong>Instructor action:</strong> Do this one entirely together,\nout loud, with the whole class in lockstep. Every student writes the\nprediction. Nobody trains until everybody has written.</p>\n<p>One modification, all together, and then in the second half you’ll\ndo these on your own. Here is the change: first, do the <strong>reset\ntrick</strong> - flip the Activation Function dropdown to Linear, then\nimmediately back to <strong>ReLU</strong>. That throws out everything\nyour network learned and gives you a fresh, random start, the same as\npressing a reset button. Then, and only then, change your Learning Rate\nfrom 0.01 down to 0.001. That is ten times smaller. Do not press TRAIN\nMODEL yet.</p>\n<p>Before you press it: <strong>predict.</strong> Look at the U-curve\non the board. We just made every step ten times smaller. Write, in\nWorksheet 2 Box 4: what will happen to how fast the loss falls,
