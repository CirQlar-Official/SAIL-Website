and how\nconfident do you think the Live Inference Data bars will look if I let\nit run the same amount of time as before?</p>\n<p><strong>Expected student predictions:</strong> “It will fall much\nmore slowly.” “It won’t get as low in the same amount of time.” “It will\nstill work but it’ll take forever.” All are correct. A student\npredicting “it will fail completely” is close but should be gently\nredirected - it does not fail, it crawls. Do not correct this before the\nrun; let the run correct it.</p>\n<p><strong>Student action:</strong> Press TRAIN MODEL. Watch for roughly\nthe same amount of time as the first run. Press HALT COMPILATION. Hold\nup both gestures and note how confident the bars look.</p>\n<p><strong>Expected observation:</strong> The loss falls, but visibly\nand noticeably more slowly than the first run, and after the same amount\nof training time it is still meaningfully higher than where the first\nrun ended. The Live Inference Data bars are typically less confident -\ncloser to an even split, or slower to commit clearly to the right\nanswer.</p>\n<p>There it is. It is not broken. It is not stuck - look at the chart,\nit <strong>is</strong> falling. It is just crawling. Every step downhill\nis tiny, so after the same amount of time, it has barely made it partway\ndown the hill. This is what “too small” looks like. Remember it, because\nin twenty minutes you are going to see what “too big” looks like, and it\nis going to look completely different.</p>\n<p><strong>Student action:</strong> Complete Worksheet 2, Box 5 - the\nfirst full log entry, using the same four-column structure as Worksheet\n3: <strong>What I changed / What I predicted / What actually\nhappened</strong> / Why it happened.</p>\n<p><strong>Model answer for Box 5 (project this after students have\nwritten their own, so they can see the standard):</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>What I changed</strong></th>\n<th><strong>What I predicted</strong></th>\n<th><strong>What actually happened</strong></th>\n<th><strong>Why it happened</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Learning Rate from 0.01 down to 0.001, after resetting.</td>\n<td>Loss would fall more slowly and would not get as low in the same\namount of time.</td>\n<td>Loss fell but much more slowly. After the same run time, the bars\nwere much less confident than the first run’s had been.</td>\n<td>The learning rate is the size of each downhill step. Making it 10x\nsmaller means the network takes 10x smaller steps toward lower loss, so\nin the same time it gets much less far down the hill.</td>\n</tr>\n</tbody>\n</table>\n<p>That table is the format for everything you do after the break. Four\ncolumns. What you changed, what you predicted, what happened, and why.\n<strong>The “why” column is the one that matters</strong> - and it is\nthe one you will be presenting on Day 5. Anybody can press a button. The\nwhole skill is being able to say why the button did what it did.</p>\n<h3 id=\"step-5.5---reset-and-restore-2-min\">Step 5.5 - Reset and Restore\n(2 min)</h3>\n<p><strong>Instructor action:</strong> Before the break, have every pair\nrestore the starting configuration exactly: do the reset trick (flip\nActivation Function to a different option and back to ReLU), set\nLearning Rate back to 0.01, and confirm hidden layers are still at the\ndefault of 2. Their captured pictures do not need to be recaptured -\nonly the trained weights and hyperparameters need to be restored.\nConfirm visually. Segment 7 begins from this configuration, and a pair\nthat returns from break with a modified setup will produce results that\nare harder to compare with the rest of the class.</p>\n<h3 id=\"common-misconceptions---segment-5\">Common misconceptions -\nSegment 5</h3>\n<ul>\n<li><p><strong>“My numbers are different from my neighbor’s, so one of\nus did it wrong.”</strong> Neither did. Starting weights are random and\nevery pair captured different pictures, so every run is a different\njourney to a similar destination. Address this proactively in Step 5.2\nrather than waiting for it to surface as anxiety.</p></li>\n<li><p><strong>“The network is drawing my hand.”</strong> It is not\ndrawing - it is <strong>classifying.</strong> The Live Inference Data\nbars show how confident the network is that the current camera image\nmatches each class it has learned. This distinction matters for Day 5\npresentations; state it plainly.</p></li>\n<li><p><strong>“A flat loss chart means the network is thinking hard and\nneeds more time.”</strong> Directly addressed in Step 5.3 and reinforced\nin Segment 7, Modification 1, where students will watch a flat, high\nloss chart stay flat and high. If a student says “just give it more\nepochs,” let Modification 1 answer them.</p></li>\n<li><p><strong>“Low loss means the model is finished and\nperfect.”</strong> Low loss means the model fits <strong>the pictures it\nwas trained on, from the people who supplied them.</strong> It is a\nmeasurement, not a certificate. Segment 8 returns to this with the\nethics thread from Day 1 - and today it has extra force, because the\ndata really is theirs.</p></li>\n</ul>\n<h3 id=\"differentiation-strategies---segment-5\">Differentiation\nstrategies - Segment 5</h3>\n<ul>\n<li><p><strong>Students needing support:</strong> Assign explicit roles\nwithin the pair - one student holds the gesture and drives the mouse,\nthe other reads the settings aloud from the Step 5.1 table and confirms\neach one. Both students complete their own worksheet. The role-reading\nis not busywork; it is what keeps the supported student attending to the\nsettings rather than watching someone else click.</p></li>\n<li><p><strong>Students needing extension:</strong> Direct them to click\non individual neurons in the network diagram to open the node editor -\neach click reveals that neuron’s current bias number. Ask: “Watch one\nneuron’s bias before training and after training. Write down both\nnumbers. What does that tell you about what training actually changed?”\nThis is the most direct possible evidence that training changes numbers,\nand it makes an excellent contribution to the Segment 8 discussion. Call\non them there.</p></li>\n<li><p><strong>Students who finish early:</strong> Have them try adding\na <strong>third class</strong> (a third gesture) using the + button,\ncapturing a few frames for it, and retraining. Ask them to describe, in\nwriting, whether the Live Inference Data bars behave differently with\nthree categories instead of two.</p></li>\n<li><p><strong>Students moving</strong> too fast and clicking randomly:\nThe most common classroom-management problem in this segment. Redirect\nfirmly to the worksheet: nothing gets trained until the prediction is\nwritten. If a pair has produced results they cannot explain, have them\ndo the reset trick and redo the run properly. Speed is not the goal; the\nlog is.</p></li>\n</ul>\n<h3 id=\"assessment-criteria---segment-5\">Assessment criteria - Segment\n5</h3>\n<ul>\n<li><p><strong>Proficient:</strong> Boxes 1-5 complete. Training Loss\nchart sketched and correctly identified. Box 5 log entry has all four\ncolumns filled, and the “why” column references step size or the\ntraining loop rather than restating what happened.</p></li>\n<li><p><strong>Developing:</strong> All boxes complete but the “why”\ncolumn paraphrases the “what happened” column (“it was slower because it\nwent slower”). This is the most common gap and it must be closed before\nSegment 7 - circulate specifically for it and push those students with\nthe question “yes, but what is the learning rate actually\ncontrolling?”</p></li>\n<li><p><strong>Needs</strong> support: Configuration does not match, or\nthe Training Loss chart is misread. Both are visible at a glance while\ncirculating and both must be fixed inside this segment, not after\nit.</p></li>\n</ul>\n<p><strong>Transition to Segment 6:</strong> “Ten-minute break. When you\ncome back, you get to break things on purpose.”</p>\n<p>Segment 6: Break</p>\n<p><strong>Duration: 10 minutes (1:50–2:00)</strong></p>\n<p><em>Ten-minute break. Grab a snack if you’d like one. Leave your\ndevice open on the SAIL Architect Lab tab - do not close it and do not\nrefresh it, or you will need to re-grant camera\n<strong>permission</strong> and your captured pictures will be gone. Be\nback in your seat at [state exact clock time].</em></p>\n"}, {"id": "break6", "kind": "segment", "num": 6, "title": "Segment 6: Break", "html": "<p>Scheduled break. Students step away from screens; the timer on the slide counts it down. Durations are listed in the day timeline.</p>"}, {"id": "seg7", "kind": "segment", "num": 7, "title": "Segment 7: Structure Lab - Predict, Modify, Explain", "html": "<p><strong>Duration: 30 minutes (2:00–2:30) | Type: Guided Hands-On\nActivity</strong></p>\n<p><strong>Materials needed:</strong> Devices (SAIL Architect Lab open,\nrestored to the Step 5.1 starting configuration, captured pictures\nintact). Worksheet 3 (Modification Log). Instructor laptop\nprojected.</p>\n<p><strong>Purpose:</strong> Four structured experiments in which\nstudents change the network’s <strong>structure</strong> rather than its\nnumbers, and document every change with a prediction made in advance.\nSegment 5 was “we do it together”; this is “you do it.” This segment is\nthe direct rehearsal for Day 5, and Worksheet 3 is the artifact that\nproves students can do independently what Day 5 asks of them.</p>\n<p><strong>Format note:</strong> Roughly 7 minutes per modification. The\ninstructor states the modification and starts the clock; students\npredict, train, observe, and log. The instructor calls the class back\ntogether for 60-90 seconds after each modification to take one or two\nstudent explanations aloud before starting the next. <strong>Do not let\nstudents race ahead to Modification 2 while their neighbors are still on\nModification 1</strong> - the class debrief after each one is where the\nlearning consolidates.</p>\n<p><strong>Standing procedure for all four modifications (post this on\nthe board):</strong></p>\n<p><strong>FOR EVERY MODIFICATION:</strong></p>\n<p><em>1. If you are changing ONLY the Learning Rate, do the reset trick\nfirst (flip Activation Function to a different option, then back to\n<strong>ReLU</strong>) so you start from fresh weights. If you are\nchanging the Activation Function or the hidden layers, the network\nresets itself automatically the moment you make the change.</em></p>\n<p><em>2. Make the change.</em></p>\n<p>3. <strong>Write your prediction in the log - before you press TRAIN\nMODEL.</strong></p>\n<p><em>4. Press TRAIN MODEL. Watch for about 30-45 seconds. Press HALT\nCOMPILATION.</em></p>\n<p><em>5. Hold up both gestures in front of the camera and watch the\nLive Inference Data bars.</em></p>\n<p><em>6. Write what <strong>actually happened</strong>.</em></p>\n<p>7. Write <strong>why.</strong></p>\n<p><em>8. Hands up when the “why” column is filled in.</em></p>\n<h3\nid=\"modification-1---change-the-activation-function-to-linear-8-min\">Modification\n1 - Change the Activation Function to Linear (8 min)</h3>\n<p><strong>This is the most important seven minutes of the day. Do not\nshorten it, and do not skip it.</strong></p>\n<p><strong>The change:</strong> Activation Function dropdown: change\nfrom <strong>ReLU</strong> to <strong>Linear</strong>. (This\nautomatically resets the network - no separate reset trick needed.)\nEverything else stays exactly as it was.</p>\n<p><em>Before you predict, think back two days. On Day 2 you had a\nweighted sum - one weight, one bias, a straight line - and I gave you a\ncurved data set, and you dragged those sliders until you were sick of\nit, and you could not fit it. Then yesterday I told you the fix was the\nactivation function, the thing that lets a model bend.</em></p>\n<p>Setting Activation Function to <strong>Linear</strong> means “no\nbending.” It means every neuron just passes its weighted sum straight\nthrough, unchanged - no <strong>ReLU</strong>, no On, no Off. The\nbending is gone. And this network still has two hidden layers, so it is\nstill a real neural network. Predict, in your log, right now: will this\nnetwork, with no activation function, still be able to reliably tell\nyour two gestures apart? What will its Training Loss chart do?</p>\n<p><strong>Expected student predictions:</strong> A well-taught class\nsplits. Some students say no, correctly citing Day 2. Others say yes,\nreasoning that it is still a neural network with two hidden layers, so\nsurely all those neurons add up to something. <strong>Both predictions\nmust be written down before anyone presses TRAIN MODEL.</strong> The\nsplit is the point. Do not resolve it verbally.</p>\n<p><strong>Expected observation:</strong> The Training Loss typically\nfalls a little and then <strong>flattens out at a noticeably higher\nvalue</strong> than students saw with ReLU in Segment 5. Holding up the\ntwo gestures tends to produce Live Inference Data bars that hover close\nto an even split or flip unpredictably, rather than confidently favoring\nthe correct class.</p>\n<p><em>Because this is a real classifier trained on real pictures your\ngroup captured, exact numbers will vary. What should NOT vary is the\ndirection of the effect: Linear should perform noticeably worse than\n<strong>ReLU</strong> did in Segment 5. If a pair’s Linear run still\nlooks confident, that usually means their gesture pair (or the pictures\nthey happened to capture) leaned more on overall brightness than on\nshape - ask them to test holding each gesture at a fresh angle they\ndidn’t capture, and watch the bars get shakier.</em></p>\n<p>Look at your Training Loss <strong>chart, and</strong> look at your\nLive Inference Data bars. Two days <strong>ago</strong> you failed to\nfit curved data with one straight line, by hand, with sliders. Today a\nfull neural network - with two hidden layers, with thousands of training\nsteps and a computer doing the work - is struggling to tell your two\ngestures apart in <strong>exactly the same</strong> way, for\n<strong>exactly the same</strong> reason. And it will keep struggling\nfor a million more epochs. That is not a network that needs more time.\nThat is a network that is <strong>stuck.</strong></p>\n<p>And this is the whole reason the activation function exists. It is\nnot decoration. Without it, you can stack five layers and hundreds of\nneurons and every one of them still just multiplies and adds - and\nmultiplying and adding, no matter how many times you do it, only ever\ngets you a straight-line rule. The activation function is the\n<strong>only</strong> thing in the entire network that lets it bend.\nThat is Day 3’s answer to Day 2’s problem, and you just watched it fail\non purpose so you could see it.</p>\n<p><strong>Instructor action:</strong> Have students switch Activation\nFunction back to ReLU (this auto-resets), press TRAIN MODEL again for\n30-45 seconds - watching the exact same pictures, immediately produce\nconfident, correctly-separated Live Inference Data bars. The\nbefore-and-after, seen back to back on their own screen, is what makes\nthis permanent.</p>\n<p><strong>Model log entry (project after students have written their\nown):</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>What I changed</strong></th>\n<th><strong>What I predicted</strong></th>\n<th><strong>What actually happened</strong></th>\n<th><strong>Why it happened</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Activation Function from ReLU to Linear.</td>\n<td>It would fail, because with no activation function the network\ncannot bend.</td>\n<td>Training Loss dropped a little then went flat at a noticeably higher\nvalue than before. The Live Inference Data bars stayed close to\nfifty-fifty no matter which gesture was held up.</td>\n<td>With Linear activation, every neuron only multiplies and adds.\nStacking multiplications and additions still only produces a\nstraight-line rule across the 784 pixel values. Telling apart two hand\nshapes needs a bent rule, so the network is stuck no matter how long it\ntrains.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Assessment Checkpoint 5 (the most important of the\nday).</strong> Cold-call two students for their “why.” A proficient\nanswer contains the causal chain: no activation → only multiply and add\n→ only a straight-line rule → the gesture pair needs a bent rule →\nstuck. A student who <strong>says</strong> “it broke” or\n“<strong>ReLU</strong> is better” has observed correctly but explained\nnothing. Push: “Why is <strong>ReLU</strong> better here? What can it do\nthat Linear cannot?” This exact question, in this exact form, appears\n<strong>on</strong> the Mini-Assessment.</p>\n<h3 id=\"modification-2---add-a-hidden-layer-7-min\">Modification 2 - Add\na Hidden Layer (7 min)</h3>\n<p><strong>The change:</strong> Reset trick, then Activation back to\n<strong>ReLU</strong>. Use the layer-add button (top-left of the network\npanel) to go from 2 hidden layers up to <strong>4</strong>.</p>\n<p><em>Predict first. More hidden layers <strong>means</strong> more\nweighted sums, more <strong>ReLUs</strong>, more of everything, stacked\ndeeper. Will the loss get lower? Will it get there faster? Will the Live\nInference Data bars look more confident? Write it down before you\ntrain.</em></p>\n<p><strong>Expected student predictions:</strong> The overwhelming\nmajority will predict “better” and “faster.” A few may predict no\nchange. Let both stand.</p>\n<p><strong>Expected observation:</strong> Typically a modest improvement\n- similar or slightly faster convergence and similar or slightly more\nconfident bars than the 2-layer version. The improvement is usually real\nbut not dramatic, since a 2-layer ReLU network can often already tell a\nshape-based gesture pair apart reasonably well, leaving less room to\nimprove. <strong>This is a genuinely important observation and should be\ndrawn out in the debrief.</strong></p>\n<p>Maybe a little better - but be honest about how much better. Two\n<strong>layers</strong> could probably already do this job. Adding two\nmore didn’t necessarily unlock anything the network couldn’t already do;\nit may have just made it a bit quicker, or a bit more confident.\n<strong>Hold onto that,</strong> because in the next experiment we are\ngoing to test the reverse, and then I want to ask you a hard question\nabout it.</p>\n<h3\nid=\"modification-3---remove-hidden-layers-down-to-one-7-min\">Modification\n3 - Remove Hidden Layers Down to One (7 min)</h3>\n<p><strong>The change:</strong> Use the layer-remove button to reduce\nall the way down to <strong>1 hidden layer</strong> (the minimum this\ntool allows).</p>\n<p><em>One hidden layer. Still five neurons in it, still with\n<strong>ReLU</strong> - so it does still have an activation function,\nit’s just shallower. Predict: can one hidden layer still tell your two\ngestures apart? Write it down.</em></p>\n<p><strong>Expected student predictions:</strong> After Modification 1,\nstudents now know activation functions enable bending, and many will\nover-generalize to “it has ReLU, so it’ll be fine.” Others will reason\nthat a single layer is simply less powerful. Both should be written.</p>\n<p><strong>Expected observation:</strong> This is the modification most\nlikely to surprise the room, and it should be presented as an open\nexperiment rather than a guaranteed failure. With five ReLU neurons in a\nsingle layer, many shape-based gesture pairs can still be learned\nreasonably well - a single layer is often more capable than students\nexpect. If your class’s one-layer run still performs confidently, that\nis a real and useful result, not a broken experiment.</p>\n<p><em>Look at what <strong>actually happened</strong>, whichever way it\nwent. If the one-layer network still worked about as well as the\ntwo-layer one, that tells you something real: today’s gesture problem\ndidn’t <strong>actually need</strong> the second layer. The extra depth\nfrom Modification 2 bought you a little polish, not a capability the\nnetwork couldn’t live without. If instead the one-layer network got\nnoticeably less confident, that also tells you something real: some of\nwhat the second layer was doing mattered.</em></p>\n<p>Either result<strong> answers the same question: how much structure\ndoes this particular problem</strong> actually need? That is a real\nengineering question, and you just ran a real experiment to answer it -\nwhich is exactly what Day 5 is going to ask you to do on a problem of\nyour own choosing.</p>\n<p><strong>Assessment Checkpoint 6 (whole-class, 60 seconds).</strong>\nAsk: “Compare Modification 1 and Modification 3. Both changed something\nabout the network’s structure. Why was Modification 1’s change so much\nmore damaging than Modification 3’s?” A proficient answer distinguishes\nremoving the ability to bend at all (Modification 1) from reducing how\nmuch capacity is available while still being able to bend (Modification\n3). If the class cannot make this distinction, put the two Training Loss\ncharts <strong>up side</strong> by side on the projector before moving\non.</p>\n<h3 id=\"modification-4---break-the-learning-rate-8-min\">Modification 4 -\nBreak the Learning Rate (8 min)</h3>\n<p><strong>The change:</strong> Reset trick (flip Activation away and\nback to ReLU). Restore hidden layers to <strong>2</strong>. Learning\nRate: drag the slider all the way to its maximum, <strong>0.100</strong>\n(ten times bigger than the 0.01 you have been using, and one hundred\ntimes bigger than the 0.001 you tested in Step 5.4).</p>\n<p><em>Back in Segment 4, some of you said a bigger learning rate would\nbe better, because it learns faster. That was a completely reasonable\nthing to think. Now you get to test it. Learning Rate 0.1 - the biggest\nstep size this tool allows. Look at the U-curve on the board and picture\nthat step size. Predict, in your log: what happens to the Training Loss\nchart?</em></p>\n<p><strong>Expected student predictions:</strong> A well-prepared class\nwill predict instability or overshoot, citing Step 4.3. Students who did\nnot internalize the Goldilocks discussion will predict “faster.”\n<strong>This modification exists specifically to test that prediction\nwith the student’s own eyes.</strong> Make sure they have written it\ndown first, so the test actually lands.</p>\n<p><strong>Expected observation:</strong> The Training Loss chart\ntypically becomes noticeably jumpier and less smooth than the 0.01 run,\nand it may plateau at a worse (higher) loss, bounce around, or take\nlonger to settle than a well-tuned run would. It may not thrash quite as\ndramatically as an unstable run would in a simpler training setup,\nbecause this tool’s training method (called Adam) includes some built-in\nadjustments that make it a bit more forgiving of a too-large learning\nrate than the raw “walk downhill” idea from Segment 4 alone would\nbe.</p>\n<p><em>Faster? Look at your Training Loss chart. Is it a smooth slide\ndownward, or is it jumpy and uneven? For most of you it should look\nnoticeably rougher than your 0.01 run, and it may end up worse instead\nof better. This is the same picture we drew on the board: steps big\nenough that the network leaps clear over the bottom of the valley and\n<strong>has to</strong> fight its way back.</em></p>\n<p><em>One honest note: this tool’s training method has some built-in\nsmarts - called the Adam optimizer - that make it somewhat more\nforgiving of a <strong>too-large</strong> learning rate than the\nsimplest possible “walk downhill” approach would be. If your chart looks\nrough but not catastrophic, that is not a failed experiment - it’s a\nreal result, and it’s a preview of something true about real AI systems:\nengineers build smarter training methods specifically because a learning\nrate that would break a simple system needs to be survivable in a real\none.</em></p>\n<p><em>Either way: this is not a slider where more is better - it is a\ndial you tune. Too small and you crawl. Too big and you get rough,\nunpredictable results. The right value is the one that <strong>actually\ngets</strong> you down this <strong>particular hill</strong> smoothly,\nand finding it is a real part of the job of building an AI\nsystem.</em></p>\n<p><strong>Instructor action:</strong> If time permits (roughly 90\nseconds), have students set Learning Rate to 0.03 and train once more -\na “just right” value, faster than 0.01 and still smooth. Ending the\nsegment on a successful run rather than a rough one is worth the time if\nyou have it.</p>\n<h3 id=\"common-misconceptions---segment-7\">Common misconceptions -\nSegment 7</h3>\n<ul>\n<li><p><strong>“More layers always make the model better.”</strong> This\nis the misconception this entire segment is built to correct.\nModification 2 shows a real but modest improvement; Modification 3 shows\nthat a network can sometimes do the job with much less than it started\nwith; and taken together they establish that structure must\n<strong>match the problem</strong>, not simply be maximized. If a\nstudent still claims “bigger is always better,” ask them why the 4-layer\nnetwork was only slightly better than the 2-layer one, and why\nprofessionals building real AI systems do not simply use a hundred\nlayers for everything.</p></li>\n<li><p><strong>“A network that struggles just needs more training\ntime.”</strong> Falsified in Modification 1: the failure there is\nstructural, and no amount of additional epochs fixes it. This is why\nStep 5.3’s loss-chart reading matters: a flat, high chart is a\nstructural diagnosis, not a request for patience.</p></li>\n<li><p><strong>“Linear activation means the network is broken.”</strong>\nIt is not broken - it is <strong>limited.</strong> A Linear network\nworks perfectly well; it simply can only ever produce a straight-line\nrule. If your two gestures happened to differ mainly by overall\nbrightness (a rule a straight line CAN express), Linear activation might\nwork fine on them - it fails on a shape-based pair because a shape-based\ndistinction is not a straight-line problem. Precision here matters, and\nit is a direct callback to Day 2’s Data Set A versus Data Set\nB.</p></li>\n<li><p><strong>Overfitting (advanced students may raise this).</strong>\nA sharp student may notice the network gets very confident on the exact\npictures it was trained on but less confident on a fresh pose it has not\nseen before. This is real, it is called overfitting, and it is beyond\ntoday’s scope. Acknowledge it honestly and briefly: “You found something\nreal - the network can memorize its training pictures instead of\nlearning the general pattern. That has a name, overfitting, and it is\none of the biggest problems in real AI. We are not covering it today,\nbut that is a genuinely excellent thing to have noticed.” Do not open it\nto the class, and do not pretend it does not exist.</p></li>\n</ul>\n<h3 id=\"differentiation-strategies---segment-7\">Differentiation\nstrategies - Segment 7</h3>\n<ul>\n<li><p><strong>Students needing support:</strong> Reduce to three\nmodifications, dropping Modification 2 (adding a layer), which is the\nleast conceptually load-bearing of the four. Modifications 1, 3, and 4\nmust all be completed by every student. Provide a partially completed\nlog with the “What I changed” column pre-filled so the student’s effort\ngoes entirely into predicting and explaining.</p></li>\n<li><p><strong>Students needing extension:</strong> Add a <strong>third\nand fourth class</strong> (up to six total are allowed) using the +\nbutton, capture a few frames for each, and try to get the network to\nconfidently tell four different gestures apart at once. This is a\ngenuinely difficult problem that requires real experimentation with\nlayers and learning rate, and it is exactly the kind of open-ended\nchallenge Day 5 is built around. Tell them explicitly: “If you get four\ngestures working confidently, that is your Day 5 project.”</p></li>\n<li><p><strong>Students who finish all four early:</strong> Have them\nreturn to Modification 1 and answer, in writing: “Could a\nLinear-activation network ever succeed at telling two categories apart,\nfor ANY pair of gestures? What kind of pair would work, and why?”\n(Answer: yes - a pair that differs mainly in overall brightness or how\nmuch of the frame is filled, such as hand-covering-camera versus\nhand-away-from-camera, is close to a straight-line-solvable problem.\nThis is Day 2’s Data Set A, and it is a beautiful closing of the loop.)\nCall on these students in Segment 8.</p></li>\n<li><p><strong>Pairs where one student dominates the mouse:</strong>\nEnforce a mouse handoff after every modification. The non-driving\nstudent reads the standing procedure aloud from the board and confirms\nthe prediction is written before TRAIN MODEL is pressed. Both students\ncomplete their own log.</p></li>\n</ul>\n<h3 id=\"assessment-criteria---segment-7\">Assessment criteria - Segment\n7</h3>\n<ul>\n<li><p><strong>Proficient:</strong> All four modifications logged with\nall four columns complete. Predictions were written\n<strong>before</strong> the run (check for erasure marks or\nafter-the-fact rewriting - if you see it, address it, because it\ndestroys the entire purpose of the exercise). The “why” column for\nModification 1 correctly cites the inability to bend without an\nactivation function.</p></li>\n<li><p><strong>Developing:</strong> All four logged, but one or more\n“why” columns restate the observation rather than explaining it.\nIdentify these students before Segment 8 and make sure they hear the\nmodel explanations during the debrief.</p></li>\n<li><p><strong>Needs support:</strong> Fewer than three modifications\ncompleted, or predictions written after the fact. The second problem is\nmore serious than the first. A student who is not predicting is not\ndoing the activity - they are just watching a screen change.</p></li>\n<li><p><strong>Worksheet 3 (Modification Log) is the single most\nimportant deliverable of Day 4 and should be collected, reviewed before\nDay 5, and returned to students at the start of Day 5</strong> - it is\ntheir reference document for the final project.</p></li>\n</ul>\n<p><strong>Transition to Segment 8:</strong> “Devices closed. Let’s talk\nabout what you just did, and what you’re doing tomorrow.”</p>\n"}, {"id": "seg8", "kind": "segment", "num": 8, "title": "Segment 8: Connecting Today to Day 5 (Preview)", "html": "<p><strong>Duration: 15 minutes (2:30–2:45) | Type: Lecture +\nDiscussion</strong></p>\n<p><strong>Materials needed:</strong> Board (training loop and U-curve\nstill visible). Devices <strong>closed.</strong> Worksheet 3 in front of\neach student.</p>\n<p><strong>Purpose:</strong> To consolidate today’s vocabulary, to\nsurface the ethical implications of what students have just personally\nexperienced, and to make Day 5’s expectations completely concrete before\nstudents leave the room.</p>\n<h3 id=\"step-8.1---vocabulary-consolidation-4-min\">Step 8.1 - Vocabulary\nConsolidation (4 min)</h3>\n<p><strong>Instructor action:</strong> Cold-call for each definition. Do\nnot supply them; extract them. Write each on the board as it is produced\ncorrectly.</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>The definition students should produce</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Loss</td>\n<td>One number that measures how far the model’s predictions are from\nthe correct answers. Lower is better; zero would be perfect.</td>\n</tr>\n<tr class=\"even\">\n<td>Training</td>\n<td>The loop: forward pass, measure loss, nudge the weights to make loss\nsmaller, repeat. This is where a network’s weights actually come\nfrom.</td>\n</tr>\n<tr class=\"odd\">\n<td>Learning rate</td>\n<td>The size of the step the network takes each time it adjusts. Too\nsmall is slow; too big overshoots and gets worse.</td>\n</tr>\n<tr class=\"even\">\n<td>Training Loss chart</td>\n<td>A picture of the loss over time. Falling steeply means learning.\nFlat and low means finished. Flat and high means stuck. Jumping around\nmeans the learning rate is too big.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"step-8.2---discussion-what-you-actually-proved-today-6-min\">Step\n8.2 - Discussion: What You Actually Proved Today (6 min)</h3>\n<p><strong>Purpose:</strong> The single richest discussion of the day.\nIt closes the loop on Day 2, closes the loop on Day 3, and reopens Day\n1’s ethics thread with a concreteness that was impossible before\nstudents had trained a model themselves - and today that concreteness is\nstronger than ever, because the training data was not a canned demo. It\nwas pictures of them.</p>\n<p><strong>Discussion Question 1.</strong> “Modification 2: you added a\nhidden <strong>layer</strong> and the model got a little better. Suppose\nI now tell you to make the model as good as possible. Why can’t you just\nadd five layers and walk away?”</p>\n<p><strong>Expected student responses:</strong> “It didn’t help that\nmuch.” “Two layers already worked.” “It would be slower to train.” A\nstrong student may reference the extension question, or the sheer amount\nof computation implied by the training loop. <strong>Land the\npoint:</strong> structure has to fit the problem. A bigger network is\nnot a better network; it is a bigger network. Every layer you add is\nmore weights to train, more computation, more electricity, and more time\n- and if two layers already solved it, all of that bought you almost\nnothing.</p>\n<p><strong>Discussion Question 2 (the ethics callback).</strong> “Every\nweight in the network you trained today came from one place: the\npictures you captured. The network looked at those pictures, measured\nhow wrong it was about those pictures, and adjusted itself to be less\nwrong about those pictures. Now think back to Day 1, when we talked\nabout bias in AI systems. You didn’t use a canned dataset today - you\nbuilt the training set yourselves, by hand, in this room, in this\nlighting, with your own hands making the gestures. Given that, where do\nyou think bias in a real AI system comes from?”</p>\n<p><strong>Expected student responses:</strong> “From the data.” “If the\ndata is biased, the model learns the bias.” A strong response will\nconnect it mechanically: the loss function only measures error against\nthe pictures it was given, so a network will faithfully, precisely, and\nenthusiastically learn whatever is in that data - including things\nnobody wanted it to learn. Push further with a concrete version of the\nquestion: “If every picture your pair captured was your own hand, in\nthis room’s lighting, facing the camera straight-on - what happens if a\nnew person, with different skin tone, different lighting, or a different\ncamera angle, tries your trained model?” <strong>This is the payoff of\nan entire week of scaffolding, and it should be named as\nsuch:</strong></p>\n<p>On Day 1, I told you AI systems can be biased, and you took my word\nfor it. Today you built the evidence yourself, with your own hands. That\nnetwork did not have opinions. It did not have goals. It had one number\n- loss - and it made that number smaller, using exactly the pictures you\ngave it and nobody else’s. It got very good at exactly what your data\n<strong>told it</strong> to be good at, and it had no way of knowing\nwhether that data was varied, or fair, or represented anyone who wasn’t\nin this room. If your data had been <strong>narrow</strong>, the network\nwould have learned that narrowness perfectly, and its loss would have\ngone down beautifully while it did. <strong>A low loss does not mean a\ngood model. It means a model that fits the data it was given.</strong>\nThat is the most important sentence in this entire course, and you\nneeded all four days - and your own hands on the camera today - to earn\nit.</p>\n<h3 id=\"step-8.3---day-5-preview-5-min\">Step 8.3 - Day 5 Preview (5\nmin)</h3>\n<p><em>Tomorrow, nobody <strong>tells</strong> you what to change. You\nwill pick a gesture pair, or something new entirely - maybe two facial\nexpressions, maybe two objects, maybe three or four categories if you’re\nfeeling brave. You will pick what to modify: activation function, hidden\nlayers, learning rate, or several of them. You will get it working as\nwell as you can. And then you will stand up and tell everybody what you\ndid and why it worked.</em></p>\n<p>Here is the good news: you have already done the entire assignment.\nLook down at Worksheet 3 in front of you. Four columns. What you\nchanged, what you predicted, what happened, and why. Tomorrow’s\npresentation is one of those log entries, out loud. That is the whole\nthing. <strong>Bring this packet with you tomorrow</strong> - it is your\nnotes, it is your evidence, and it is where your project starts.</p>\n<p><em>And you are not going to walk out of here without a plan, either.\nTurn to Worksheet 4. You are going to fill it out right now, in this\nroom, while everything you just did is still in your hands. Nobody\nleaves today with a blank plan for tomorrow.</em></p>\n<p><strong>Instructor action:</strong> State explicitly what Day 5 will\nask for. Put these four bullets on the board and leave them there for\nthe rest of the segment - students will copy them into Worksheet 4 as\nthey plan:</p>\n<ul>\n<li><p>Choose one gesture pair (or a new pair of categories) in the SAIL\nArchitect Lab.</p></li>\n<li><p>Make at least three deliberate modifications, with a written\nprediction before each one.</p></li>\n<li><p>Get the network as confident as reasonably possible, and know\n<strong>why</strong> your final configuration works.</p></li>\n<li><p>Present for 2-3 minutes: here is what I tried, here is what I\npredicted, here is what happened, and here is why.</p></li>\n</ul>\n<p><strong>Worksheet 4 connection:</strong> Students will sketch their\nDay 5 project plan in class today, during Segment 8, on Worksheet 4. Say\nso explicitly here - “you are going to plan tomorrow’s project before\nyou leave today, and you are going to do it in this room” - so that\nstudents spend Segments 5 and 7 noticing which modifications they might\nwant to reuse. <strong>Nothing is assigned to be done at home. There is\nno homework on any day of SAIL.</strong></p>\n<h3 id=\"step-8.2---worksheet-4-my-day-5-project-plan-10-min\">Step 8.2 -\nWorksheet 4: My Day 5 Project Plan (10 min)</h3>\n<p><strong>This is the segment’s deliverable and it replaces what was\npreviously assigned as a take-home planning sheet.</strong> The\nrationale for moving it is simple and worth stating plainly: a planning\ndocument is only useful if it actually gets done, and the students most\nlikely to skip a take-home plan are exactly the students most likely to\nspend the first thirty minutes of Day 5 staring at a blank screen. Doing\nit here guarantees a 100% completion rate on the one artifact that\ndetermines whether Day 5 starts fast or slow.</p>\n<p><strong>Worksheet 4, Part A - My Plan (7 min).</strong> Six rows:\nwhich gesture pair they will use, their first, second, and third planned\nmodifications with reasons, one thing they want to find out, and their\nfirst two moves if the network gets stuck. Students work individually.\n<strong>Circulate and read the “if my network gets stuck” row\nspecifically</strong> - a student who writes “ask the teacher” has not\ninternalized Segment 7 and should be sent back to their own Worksheet 3,\nwhere they have already personally documented what a flat, high loss\nchart means and what to do about it.</p>\n<p><strong>Worksheet 4, Part B - My Strongest Log Entry (3\nmin).</strong> Students look back at their four Worksheet 3 “why”\ncolumns, pick their best one, and copy it into Worksheet 4. This does\ntwo things at once: it forces a self-assessment of their own explanatory\nwriting, and it gives them a concrete model of their own voice to\nimitate during tomorrow’s spoken presentation. A student who cannot find\na single “why” column worth copying has just discovered - safely, today,\nwhile you are standing there - that they have been button-pressing.\n<strong>This is the highest-value three minutes in the segment. Do not\ncut it.</strong></p>\n<p><strong>Assessment criteria - Worksheet 4</strong></p>\n<ul>\n<li><p><strong>Proficient: </strong>All six Part A rows are filled with\nspecific, committed choices (“add a third hidden layer, because Mod 2\nlowered my loss and I want to see if more helps or if it plateaus”).\nPart B quotes a “why” column that explains a mechanism.</p></li>\n<li><p><strong>Developing: </strong>Part A rows are filled but vague\n(“try changing stuff, see what happens”). Push for specificity now - a\nvague plan is a slow Day 5.</p></li>\n<li><p><strong>Needs support: </strong>Blank rows, or Part B cannot be\ncompleted because no Worksheet 3 “why” column contains an actual\nexplanation. <strong>Pair this student for Day 5 and give them a\nstarting gesture pair and a first modification before they leave the\nroom today.</strong></p></li>\n</ul>\n<p><strong>Deliverable: </strong>Completed Worksheet 4, one per student.\n<strong>Every student leaves the room with a written plan for tomorrow.\nThis is non-negotiable and it is the entire reason this worksheet\nexists.</strong></p>\n<p><strong>Time management note: </strong>Segment 8 is 15 minutes and\nnow carries a 10-minute worksheet. Step 8.1’s spoken preview must\ntherefore be delivered briskly - roughly 5 minutes. If you find yourself\nrunning long on 8.1, cut it, not the worksheet. The spoken preview is a\nnice-to-have; the completed plan is the artifact Day 5 runs on.</p>\n"}, {"id": "seg9", "kind": "segment", "num": 9, "title": "Segment 9: Mini-Assessment and Wrap-Up", "html": "<p><strong>Duration: 15 minutes (2:45–3:00) | Type:\nAssessment</strong></p>\n<p><strong>Materials needed:</strong> Day 4 Mini-Assessment (in student\npacket). Devices <strong>closed.</strong> Worksheets may\n<strong>not</strong> be consulted.</p>\n<p><strong>This segment must start no later than 2:45.</strong> See the\ntime-management notes below for where to recover time if the day is\nrunning behind.</p>\n<h3 id=\"step-9.1---mini-assessment-10-min\">Step 9.1 - Mini-Assessment\n(10 min)</h3>\n<p><strong>Instructions given to students, exactly as written:</strong>\nAnswer all 8 questions on your own. You have 10 minutes. Devices closed,\nnotes closed. Show your work for any calculation question.</p>\n<p><strong>Question 1</strong> (Conceptual) In your own words, what is\nloss? Your answer must say whether a higher or a lower loss is\nbetter.</p>\n<p><strong>Question 2</strong> (Conceptual) In order, name the four\nsteps of the training loop.</p>\n<p><strong>Question 3</strong> (Applied) A model predicts 5, 8, and 10.\nThe correct answers were 6, 8, and 12. Calculate the loss using the\nerror-square-average method. Show your work.</p>\n<p><strong>Question 4</strong> (Applied) Model A has a loss of 0.9.\nModel B has a loss of 0.2. Which model is better, and how do you\nknow?</p>\n<p><strong>Question 5</strong> (Conceptual) A network is training. Its\nTraining Loss chart is flat and high, and it has been that way for a\nlong time. Should the student wait longer, or change something? Explain\nyour answer in one or two sentences.</p>\n<p><strong>Question 6</strong> (Conceptual) You set the Activation\nFunction to Linear and the network could not reliably tell your two\ngestures apart, no matter how long it trained. Explain\n<strong>why</strong> in one or two sentences. Use the word “straight”\nsomewhere in your answer.</p>\n<p><strong>Question 7</strong> (Conceptual) Explain what the learning\nrate controls, and describe what goes wrong when it is set much too\nlarge.</p>\n<p><strong>Question 8</strong> (Conceptual) A classmate says: “My model\nis very confident on my own pictures, so it must be a good, fair model.”\nUsing what you learned today, explain in two or three sentences why that\nconfidence alone does not guarantee this.</p>\n<h3 id=\"answer-key\">Answer Key</h3>\n<ul>\n<li><p><strong>1.</strong> Loss is one number that measures how far the\nmodel’s predictions are from the correct answers. <strong>Lower loss is\nbetter</strong> (zero would be perfect). <em>Accept any answer\ncontaining both parts: the measurement of error, AND the statement that\nlower is better. An answer missing the “lower is better” clause receives\n0.5.</em></p></li>\n<li><p><strong>2.</strong> (1) Forward pass - push the input through and\nget an output. (2) Measure loss - compare the output to the correct\nanswer. (3) Adjust - nudge the weights and biases to make loss smaller.\n(4) Repeat. <em>All four <strong>required</strong>, in order, for full\ncredit.</em></p></li>\n<li><p><strong>3.</strong> Errors: 5 - 6 = -1; 8 - 8 = 0; 10 - 12 = -2.\nSquared: 1, 0, 4. Sum = 5. Loss = 5 / 3 = <strong>1.67</strong> (accept\n5/3 or approximately 1.7). <em>A student who averages the raw errors and\ngets -1 has omitted the squaring step - this is a 0, and it is the\nsingle most diagnostic error on the assessment.</em></p></li>\n<li><p><strong>4.</strong> Model B, because its loss (0.2) is lower than\nModel A’s (0.9), and lower loss means the predictions are closer to the\ncorrect answers. <em>Both the answer and the reason are\nrequired.</em></p></li>\n<li><p><strong>5.</strong> Change something. A Training Loss chart that\nis flat and high means the network is <strong>stuck</strong>, not that\nit is slow - it is failing to learn, and waiting longer will not fix it.\nSomething about the setup must change (activation function, hidden-layer\ncount, or learning rate).</p></li>\n<li><p><strong>6.</strong> With Linear activation, every neuron only\nmultiplies and adds, which can only ever produce a\n<strong>straight</strong>-line rule between the two classes’ pixel\npatterns. Stacking more layers of this together still only produces a\nstraight-line rule. Telling apart two hand shapes needs a bent rule, so\nthe network cannot do it no matter how long it trains. <em>The causal\nchain matters more than the wording. Full credit requires the link from\n“no activation” to “only a straight-line rule.”</em></p></li>\n<li><p><strong>7.</strong> The learning rate controls the <strong>size\nof the step</strong> the network takes each time it adjusts its weights.\nIf it is much too large, the network overshoots the lowest-loss point,\nbounces back and forth, and the loss chart gets rough or gets worse\ninstead of settling down.</p></li>\n<li><p><strong>8.</strong> Confidence on the model’s own training\npictures only shows that the model fits <strong>the pictures it was\ntrained on, from the people who supplied them.</strong> The network\nmakes its loss smaller by learning whatever patterns are in that data -\nit has no way to know whether the data represents everyone who might use\nit. If the training pictures were narrow (one person, one lighting\nsetup, one angle), the model would learn that narrowness perfectly and\nstill look very confident while doing it. <em>Accept any answer that\nseparates “fits the training data” from “is a good, fair\nmodel.”</em></p></li>\n</ul>\n<h3 id=\"scoring-guidance\">Scoring guidance</h3>\n<p>Score each of the 8 questions as <strong>1 point</strong> for a fully\ncorrect answer, <strong>0.5 points</strong> for an answer that is\ndirectionally correct but missing a required part (e.g., naming the\nbetter model without citing the loss values, or defining loss without\nstating that lower is better), and <strong>0 points</strong> for an\nincorrect or blank answer.</p>\n<ul>\n<li><p>A score of <strong>6/8 or higher</strong> indicates readiness for\nDay 5.</p></li>\n<li><p>A score <strong>below 5/8</strong>, or an incorrect answer on\n<strong>Question 3</strong> (the calculation) or <strong>Question\n6</strong> (the activation-function explanation), indicates the core of\nDay 4 has not landed. Question 6 in particular is the intellectual\ncenter of the entire course - a student who misses it should be given\nten minutes of individual re-explanation at the start of Day 5, using\ntheir own Modification 1 log entry as the material.</p></li>\n</ul>\n<h3 id=\"instructor-interpretation-notes\">Instructor interpretation\nnotes</h3>\n<ul>\n<li><p><strong>Question 3 is the only calculation on the assessment, and\nit is diagnostic.</strong> A student who averages raw errors instead of\nsquared errors has missed the single most important “why” of Segment 2.\nThis is not a careless arithmetic slip; it is a conceptual gap, and it\nwill make the SAIL Architect Lab’s Training Loss chart meaningless to\nthem.</p></li>\n<li><p><strong>Question 6 is the load-bearing question.</strong> It is\nthe only question that requires students to connect Day 2 (straight\nlines fail on curves), Day 3 (activation functions enable bending), and\nDay 4 (a real network, trained on real pictures, still fails without\none) into a single causal chain. A class that scores well on everything\nexcept Question 6 has learned the mechanics of today without the\nmeaning.</p></li>\n<li><p><strong>Question 8 is intentionally the hardest.</strong> It\nrequires students to hold two ideas at once: that confidence is the\ngoal, and that confidence is not sufficient. Do not penalize imprecise\nwording here - reward any answer that recognizes the model is faithful\nto its data rather than faithful to the truth.</p></li>\n<li><p><strong>Questions 1, 2, and 4 check vocabulary and procedure\nindependent of reasoning ability.</strong> A student can get these right\nwhile missing Questions 5, 6, and 8 entirely - which signals memorized\nprocedure without conceptual understanding, and is the specific pattern\nto watch for going into a Day 5 that requires independent\njudgment.</p></li>\n</ul>\n<h3 id=\"step-9.2---wrap-up-5-min\">Step 9.2 - Wrap-Up (5 min)</h3>\n<p>Look at where you started this week. On Monday you calculated y\nequals m x plus b on a piece of paper. Today, a neural network that\nstarted out knowing absolutely nothing - random numbers, pure noise -\ntaught itself to recognize a gesture you invented, using pictures you\ncaptured yourself, and you can explain <strong>exactly</strong> how it\ndid it, step by step, because every single step was something you had\nalready done by hand.</p>\n<p><em>There is nothing else. That’s it. That loop on the board -\nforward pass, measure loss, nudge, repeat - is what every AI system you\nhave ever used is doing. The ones with billions of weights are doing the\nsame four steps. They are just doing them a lot more times, with a lot\nmore numbers, on a lot more data. You now know what is inside the\nbox.</em></p>\n<p><em>Nothing goes home tonight. Your log is done, your plan is done,\nand both of them are in the packet in your hand. Bring it back tomorrow\nand you start immediately. See you then.</em></p>\n<p><strong>Instructor action:</strong> Students keep the Day 4 Student\nWorksheet Packet and bring it back on Day 5. <strong>There is no\nhomework.</strong> If you prefer to collect the packets in order to\nreview the class’s Worksheet 3 “why” columns and Worksheet 4 plans\novernight, that is acceptable and genuinely useful - but <strong>you\nmust return them at the start of Day 5</strong>, since students cannot\nbegin their projects without Worksheet 3 (their evidence) and Worksheet\n4 (their plan).</p>\n"}, {"id": "gen7noteonhomework", "kind": "general", "num": null, "title": "7. Note on Homework", "html": "<p><strong>There is no homework in SAIL - on Day 4 or on any other\nday.</strong> All practice, all written reasoning, and all forward\nplanning happen inside the 180-minute block, on the Student Worksheet\nPacket.</p>\n<p>The content that was previously assigned as the Day 4 take-home has\nnot been discarded. It has been relocated into the class period, at the\npoint in the day where it is most useful:</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Former homework part</strong></th>\n<th><strong>Where it lives now</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Part 1 - Loss practice on a second data set</td>\n<td><strong>Worksheet 1, Part B</strong> (Segment 2). Students now do a\nguided loss calculation and an independent one, back to back, while the\nprocedure is fresh and you are in the room to catch sign errors. The\n“tied models” trap is preserved intact - see the Worksheet 1 answer key\nbelow.</td>\n</tr>\n<tr class=\"even\">\n<td>Part 2 - Read the loss chart</td>\n<td><strong>Worksheet 2, Box 3</strong> (Segment 5). Chart-reading is\nnow done against the student’s <em>own</em> live Training Loss chart,\nnot a printed sketch. This is strictly better: they diagnose a real\nchart they produced themselves.</td>\n</tr>\n<tr class=\"odd\">\n<td>Part 3 - Explain the structural changes</td>\n<td><strong>Worksheet 3, Reflection</strong> (Segment 7). The two\nstrongest questions (Linear vs. removing layers; “more layers is always\nbetter”) are now answered immediately after the modifications that\nmotivate them, while the results are still on screen.</td>\n</tr>\n<tr class=\"even\">\n<td>Part 4 - The Day 5 plan</td>\n<td><strong>Worksheet 4</strong> (Segment 8), completed in class. This\nis the most important of the four relocations - see Step 8.2.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Answer key - Worksheet 1, Part B (the independent loss\npractice).</strong> Data set: (1, 5), (2, 6), (3, 10), (4, 12).</p>\n<ul>\n<li><p><strong>Model C (3x + 1):</strong> predictions 4, 7, 10, 13.\nErrors -1, +1, 0, +1. Squared: 1, 1, 0, 1. Sum = 3. <strong>Loss = 3/4 =\n0.75.</strong></p></li>\n<li><p><strong>Model D (2x + 3):</strong> predictions 5, 7, 9, 11.\nErrors 0, +1, -1, -1. Squared: 0, 1, 1, 1. Sum = 3. <strong>Loss = 3/4 =\n0.75.</strong></p></li>\n<li><p><strong>Correct judgment: the two models have exactly the same\nloss.</strong> Neither is better by this measurement.</p></li>\n</ul>\n<p><em>This is deliberate, and it is the most valuable item in the\nworksheet. Students expect a winner and there isn’t one. A full-credit\nanswer states that the losses are tied and that loss alone cannot\nseparate these two models. A student who forces a winner has applied the\nprocedure without thinking about what it means.</em></p>\n<p><strong>Because this is now done in class rather than at home, you\nget to have the conversation immediately.</strong> When you review Part\nB as a class, ask directly: “who circled a winner?” Hands will go up.\nThen ask: “what did the numbers actually say?” This exchange takes\nninety seconds and it breaks exactly the reflex Day 5 needs broken - the\nhabit of reporting a conclusion the data does not support. Previously\nthis discussion had to wait until the following morning, if it happened\nat all.</p>\n"}, {"id": "gen8teachernotesoperational", "kind": "general", "num": null, "title": "8. Teacher Notes (Operational Clarity)", "html": "<h2 id=\"when-to-slow-down\">When to slow down</h2>\n<ul>\n<li><p>If, during Segment 1’s warm-up, more than roughly a quarter of\nthe room cannot complete the forward pass, stop and re-do it on the\nboard with fresh numbers before proceeding to Segment 2. Every loss\ncalculation today sits directly on top of a forward pass - if the\nforward pass is shaky, loss will be meaningless.</p></li>\n<li><p>If, during Segment 2’s Worksheet 1, multiple students average the\nraw errors instead of the squared errors, stop the room. Put the\nerroneous calculation on the board and let the class discover that it\nmakes a bad model look perfect. This is the best possible answer to “why\ndo we square?” and it is worth 3 extra minutes - take them from Step\n2.3, not from the worksheet.</p></li>\n<li><p>If, during Segment 5’s Step 5.1, a pair’s configuration or\ncaptured data does not match the class, <strong>do not proceed.</strong>\nA pair training on a different setup or a poor-quality data capture will\nobserve confusing results and draw wrong conclusions from them for the\nnext 80 minutes. Help them recapture cleanly before moving on.</p></li>\n<li><p>If, during Segment 7’s Modification 1, the class cannot\narticulate <strong>why</strong> the Linear network struggled - if the\nbest they can produce is “it broke” - stop the lab and re-teach it at\nthe board using Day 2’s Data Set B before moving to Modification 2. This\nis the single most important idea of the day and possibly of the course,\nand it is worth sacrificing Modification 2 entirely to secure\nit.</p></li>\n</ul>\n<h2 id=\"what-not-to-skip\">What NOT to skip</h2>\n<ul>\n<li><p><strong>Do not skip the “why do we square?” explanation in Step\n2.2.</strong> Without it, loss is an unmotivated recipe. With it,\nstudents understand that loss is designed to prevent errors from\ncancelling out and to punish large misses - which is what makes them\ntrust the number when they see it falling on screen.</p></li>\n<li><p><strong>Do not skip the Goldilocks discussion in Step\n4.3.</strong> It is where the “bigger learning rate is better”\nmisconception is surfaced and made testable. If you skip it, students\nwill still discover the effect in Modification 4 - but they will\nexperience it as a random malfunction rather than as the test of a\nprediction, and they will not retain it.</p></li>\n<li><p><strong>Do not skip Step 5.4’s guided modification.</strong> It\nis the “we do it together” rung of the gradual-release ladder, and\nSegment 7 is a straight drop into independent work without it. Students\nreleased into the Structure Lab without having done one complete\npredict-modify-explain cycle under supervision will click buttons and\nlog nothing usable.</p></li>\n<li><p><strong>Do not skip Modification 1, and do not shorten\nit.</strong> It is the moment where Day 2’s failure, Day 3’s solution,\nand Day 4’s training loop collapse into a single observation on the\nstudent’s own screen. Everything else today can be compressed. This\ncannot.</p></li>\n<li><p><strong>Do not skip Step 8.2’s second discussion question (the\nethics callback).</strong> It is the only place in the entire course\nwhere students can prove, rather than accept on authority, that a model\nlearns whatever is in its data - and today it lands harder than it ever\nhas before, because the data is a picture of the student’s own hand. Day\n1 planted this; today is the harvest, and it only works after students\nhave trained a model themselves, on their own data.</p></li>\n<li><p><strong>Do not let students write predictions after the\nrun.</strong> This is the failure mode that silently destroys the value\nof Segment 7. Circulate specifically for it. A prediction written after\nthe fact is not a prediction - it is a transcription, and it builds none\nof the judgment Day 5 requires.</p></li>\n<li><p><strong>Do not skip capturing your own gesture pair the day\nbefore class.</strong> Unlike TensorFlow Playground’s canned datasets,\nthe SAIL Architect Lab is a live classifier trained on data collected in\nthe room, on the day. An instructor who has not personally captured,\ntrained, and tested the exact gesture pair students will use cannot\nreliably predict what the class will see, and cannot troubleshoot a pair\nwhose training run looks ambiguous.</p></li>\n</ul>\n<h2 id=\"time-management-notes\">Time management notes</h2>\n<ul>\n<li><p>Segment 5 (40 minutes) is the longest and highest-risk segment of\nthe day, since it depends on every device’s camera, every pair’s data\ncapture, and the site loading correctly. If technical issues consume\ntime, recover it by shortening Step 5.3’s loss-chart discussion (deliver\nthe four-row table directly rather than eliciting it) rather than by\ncutting Step 5.4’s guided modification, which is structurally necessary\nfor Segment 7.</p></li>\n<li><p>Segment 7 is the natural place to recover time if the day is\nrunning long. Drop <strong>Modification 2</strong> (adding a layer) - it\nis the least conceptually load-bearing of the four.\n<strong>Modifications 1, 3, and 4 must all be run.</strong> Never drop\nModification 1.</p></li>\n<li><p>The two breaks (Segment 3 at 5 minutes, Segment 6 at 10 minutes)\nare intentionally placed and sized to match the rhythm established on\nDays 1, 2, and 3 and are built into the 180-minute total. Do not extend\nthem without cutting an equivalent amount of time elsewhere, and do not\ncut them entirely - Segment 7 requires sustained focus and follows the\nlongest stretch of the day.</p></li>\n<li><p>Segment 9 (Mini-Assessment) must start no later than 2:45 to\nleave a full 15 minutes. If the day is running behind by this point,\nrecover time from Segment 8’s Step 8.1 vocabulary consolidation (which\nis a recap and can be delivered briskly) rather than from the assessment\nitself or from Step 8.2’s discussion, which must not be cut.</p></li>\n<li><p>Devices open during lecture segments will cost you 10-15 minutes\nacross the day. Enforce the closed-device expectation in Segments 1, 2,\n4, 8, and 9 from the first minute, and the rest of the timeline\nholds.</p></li>\n<li><p>Camera setup and data capture (Step 5.1) is a new time risk this\nversion of the module did not have before. Budget the full 12 minutes\nfor it and do not compress it below 10 - rushed data capture produces\nmessy training runs that undermine every later observation in Segments 5\nand 7.</p></li>\n</ul>\n<h2 id=\"preparation-for-day-5\">Preparation for Day 5</h2>\n<ul>\n<li><p>By the end of Day 4, every student should be able to say, without\nprompting: <strong>loss is how wrong the model is and lower is better;\ntraining is the loop of forward pass, measure loss, nudge, repeat; a\nflat high loss chart means the network is stuck, not slow; and without\nan activation function a network can only ever draw a straight-line\nrule.</strong> Day 5 opens by immediately building on all four of these\nstatements without redefining them - confirm this fluency during Segment\n9’s assessment before releasing students to independent project\nwork.</p></li>\n<li><p>Day 5 will require students to independently choose, modify,\nevaluate, and <strong>explain</strong> a network. Ensure Segment 7 (the\nStructure Lab) and its Worksheet 3 log were completed in full, since Day\n5’s presentation format is literally a spoken log entry. A student who\nhas not written four log entries under supervision cannot produce a\nfifth one independently. <strong>Ensure Segment 8’s Worksheet 4 was also\ncompleted in full</strong> - it is the plan Day 5 runs on, and unlike a\nhomework sheet, there is no excuse for it being missing.</p></li>\n<li><p>Review the Worksheet 3 logs overnight if you collected the\npackets, reading only the <strong>“why” columns.</strong> They tell you\nin five minutes exactly who understands and who is button-pressing.\nStudents whose “why” columns restate their observations rather than\nexplaining them need a partner assignment or an instructor check-in\nscheduled into Day 5’s first twenty minutes. <strong>Worksheet 4, Part B\nis a shortcut here:</strong> it asks students to self-select their own\nstrongest “why” column, so reading Part B alone gives you each student’s\nbest work in one place.</p></li>\n<li><p><strong>Every student now leaves Day 4 with a completed Worksheet\n4 project plan</strong>, because it is done in class rather than\nassigned as homework. As students set up on Day 5, walk the room and\nglance at Worksheet 4, Part A. Any student whose plan is vague (“try\nstuff”) should be given a specific first modification within the first\nfive minutes - do not let a student spend the project period deciding\nwhat to do. There should be no blank plans; if there is one, that\nstudent was absent, and they need a gesture pair and a first\nmodification handed to them immediately.</p></li>\n<li><p>If Day 4’s Mini-Assessment reveals widespread difficulty with\n<strong>Question 6</strong> (the activation-function explanation),\nbudget 10 minutes at the start of Day 5 to re-teach it using students’\nown Modification 1 log entries as the evidence. Day 5 projects will be\nshallow if students do not understand why their configuration choices\nmatter, and Question 6 is the clearest signal of whether they\ndo.</p></li>\n<li><p>Have the SAIL Architect Lab loaded and camera permission granted\non the Day 5 instructor laptop before students arrive, exactly as on Day\n4 - the setup cost does not go away just because students are now\nworking independently.</p></li>\n</ul>\n<p>Page 1 of 2</p>\n"}], "worksheetsHtml": "<p><strong>STUDENT AI LAB (SAIL)</strong></p>\n<p><strong>DAY 4 — Training a Neural Network</strong></p>\n<p><em>Loss, Learning, and Live Modification — Student Worksheet\nPacket</em></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Name: ______________________</strong></th>\n<th><strong>Date: ______________________</strong></th>\n<th><strong>Table Group: ________________</strong></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>How to use this packet. </strong>Every worksheet in this\npacket is completed <strong>during class</strong>, alongside the segment\nit belongs to. There is no homework. Devices close during lecture\nsegments. <strong>The SAIL rule: </strong>nothing gets trained until\nyour prediction is written.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>What is in this packet</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Worksheet</strong></th>\n<th><strong>Title</strong></th>\n<th><strong>When you complete it</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1</strong></td>\n<td>Measuring Loss by Hand</td>\n<td>Segment 2 — during the lesson</td>\n</tr>\n<tr class=\"even\">\n<td><strong>2</strong></td>\n<td>SAIL Architect Lab — Field Guide and Guided Run</td>\n<td>Segments 4–5 — during the lesson</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>3</strong></td>\n<td>Modification Log — predict, modify, explain</td>\n<td>Segment 7 — during the lesson</td>\n</tr>\n<tr class=\"even\">\n<td><strong>4</strong></td>\n<td>My Day 5 Project Plan</td>\n<td>Segment 8 — during the lesson</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>—</strong></td>\n<td>Day 4 Mini-Assessment (8 questions, no notes)</td>\n<td>Segment 9 — end of class</td>\n</tr>\n</tbody>\n</table>\n<h1 id=\"worksheet-1-measuring-loss-by-hand\">WORKSHEET 1 — Measuring Loss\nby Hand</h1>\n<p><em>Complete during Segment 2, alongside the lesson. Devices\nclosed.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>The three-step loss procedure.</strong> 1 — Predict: plug x\ninto the model to get a predicted output. 2 — Find the error: error =\nprediction − correct answer. KEEP THE SIGN. 3 — Square and average:\nsquare each error, add them up, divide by the number of points. That is\nthe loss. <strong>LOWER loss = better model. A loss of zero would mean\nevery prediction was exactly right.</strong></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Part A — Guided Practice (with your instructor)</strong></p>\n<p><strong>Data set: (1, 3) (2, 5) (3, 9) (4, 11)</strong></p>\n<p><strong>Model A — prediction = 3x</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>x</strong></th>\n<th><strong>Correct answer</strong></th>\n<th><strong>Prediction</strong></th>\n<th><strong>Error (pred − correct)</strong></th>\n<th><strong>Error squared</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>2</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>3</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>4</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Loss of Model A = ( ____ + ____ + ____ + ____ ) ÷ 4 = ______\n÷ 4 = __________</strong></p>\n<p><strong>Model B — prediction = 2x + 2</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>x</strong></th>\n<th><strong>Correct answer</strong></th>\n<th><strong>Prediction</strong></th>\n<th><strong>Error (pred − correct)</strong></th>\n<th><strong>Error squared</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>2</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>3</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>4</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Loss of Model B = ( ____ + ____ + ____ + ____ ) ÷ 4 = ______\n÷ 4 = __________</strong></p>\n<p><strong>Circle the better model: MODEL A MODEL B</strong></p>\n<p><em>In one sentence, explain how you know — use the word\n“loss”:</em></p>\n<p><strong>Part B — Independent Practice (work alone, then check with\nyour table group)</strong></p>\n<p><strong>New data set: (1, 5) (2, 6) (3, 10) (4, 12)</strong></p>\n<p><strong>Model C — prediction = 3x + 1</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>x</strong></th>\n<th><strong>Correct answer</strong></th>\n<th><strong>Prediction</strong></th>\n<th><strong>Error (pred − correct)</strong></th>\n<th><strong>Error squared</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>2</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>3</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>4</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Loss of Model C = ( ____ + ____ + ____ + ____ ) ÷ 4 =\n__________</strong></p>\n<p><strong>Model D — prediction = 2x + 3</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>x</strong></th>\n<th><strong>Correct answer</strong></th>\n<th><strong>Prediction</strong></th>\n<th><strong>Error (pred − correct)</strong></th>\n<th><strong>Error squared</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>2</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>3</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>4</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Loss of Model D = ( ____ + ____ + ____ + ____ ) ÷ 4 =\n__________</strong></p>\n<p><strong>Which model is better — circle one: MODEL C MODEL D NEITHER —\nTHEY ARE TIED</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Careful. </strong>There may not be a winner. A full-credit\nanswer states whatever the numbers actually show — even if that answer\nis “loss alone cannot separate these two models.” Do not force a\nwinner.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><em>Justify your choice in one sentence, using the word\n“loss”:</em></p>\n<h1\nid=\"worksheet-2-sail-architect-lab-field-guide-and-guided-run\">WORKSHEET\n2 — SAIL Architect Lab: Field Guide and Guided Run</h1>\n<p><em>Complete during Segments 4–5, alongside the lesson.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Lab URL:\n</strong>https://<a href=\"https://cirqlar-official.github.io/SAIL-project-lab/\" target=\"_blank\" rel=\"noopener\">cirqlar-official.github.io/SAIL-project-lab/</a> Say YES\nto camera permission. Do NOT refresh once class begins — refreshing\nclears your captured pictures.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Starting Configuration Checklist</strong></p>\n<p><em>Match every setting below exactly. Check each box when\nconfirmed.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Setting</strong></th>\n<th><strong>Value to use</strong></th>\n<th><strong>✓</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Class names</strong></td>\n<td>Rename to your chosen gesture pair — whole class uses the same pair\n(default: Open Hand / Closed Fist)</td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>Hidden layers</strong></td>\n<td>2 (default)</td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Activation Function</strong></td>\n<td>ReLU (Non-Linear) (default)</td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>Learning Rate</strong></td>\n<td>0.01 (default)</td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Captured frames per class</strong></td>\n<td>At least 20–25 frames each. Move a little while recording.</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>My gesture pair: Class 1 = _______________________ Class 2 =\n_______________________</strong></p>\n<p><strong>Box 1 — Prediction Before the First Training Run</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>MY PREDICTION — write this BEFORE you test.</strong>\n<em>When I press TRAIN MODEL, the Training Loss number will: GO UP / GO\nDOWN / STAY THE SAME (circle one). In one sentence, why?</em></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Box 2 — Results of the First Training Run</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Item</strong></th>\n<th><strong>Your answer</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Starting Training Loss (approximate)</strong></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>Final Training Loss (approximate)</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Was my Box 1 prediction correct?</strong></td>\n<td>YES / NO</td>\n</tr>\n<tr class=\"even\">\n<td><strong>When I held each gesture up to the camera, what did the Live\nInference Data bars do? (one sentence)</strong></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Box 3 — Reading My Training Loss Chart</strong></p>\n<p><em>Sketch the shape of your Training Loss chart in the box:</em></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>My Training Loss chart</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>My chart matches — circle one:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Chart shape</strong></th>\n<th><strong>What it means</strong></th>\n<th><strong>What I would do about it</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Falling STEEPLY</strong></td>\n<td>Still learning fast</td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>Falling slowly / flat and LOW</strong></td>\n<td>Finished learning</td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Flat and HIGH — never falls</strong></td>\n<td>Stuck — change something</td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>Jumping up and down wildly</strong></td>\n<td>Learning rate too big</td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Slowly, gently falling — still going down</strong></td>\n<td>Learning, but very slowly</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><em>In one sentence, what does YOUR chart tell you about YOUR\nnetwork?</em></p>\n<p><strong>Box 4 — Guided Modification: Learning Rate →\n0.001</strong></p>\n<p><em>Before any changes: do the reset trick (flip Activation Function\nto Linear, then back to ReLU). Then set Learning Rate to 0.001.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>MY PREDICTION — write this BEFORE you test.</strong>\n<em>Compared to the first run, what will happen to how FAST the loss\nfalls? How confident will the bars look after the same amount of\ntraining time?</em></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Box 5 — Guided Modification Log Entry</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>What I changed</strong></th>\n<th><strong>What I predicted</strong></th>\n<th><strong>What actually happened</strong></th>\n<th><strong>Why it happened</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<h1 id=\"worksheet-3-modification-log\">WORKSHEET 3 — Modification\nLog</h1>\n<p><em>Complete during Segment 7, alongside the lesson.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Standing procedure — every single time.</strong> (1) Apply\nthe change. (2) WRITE YOUR PREDICTION. (3) Press TRAIN MODEL. (4) Watch\n30–45 sec. (5) HALT COMPILATION. (6) Hold up both gestures. (7) Fill in\n“What happened” and “Why.” <strong>The “Why” column is the one that\ncounts. Do not restate what happened — explain it.</strong></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Modification 1 — Change Activation Function to\nLinear</strong></p>\n<p><strong>The change: Activation Function dropdown → Linear. (Network\nresets automatically — no reset trick needed.)</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>MY PREDICTION — write this BEFORE you test.</strong>\n<em>Will this network still be able to reliably tell your two gestures
