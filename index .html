</p>\n<h3 id=\"how-todays-lesson-builds-on-that-foundation\">How today’s lesson\nbuilds on that foundation</h3>\n<p>Day 2 was entirely single-weighted-sum work: one w, one b, one\nstraight line, tested against both linear and nonlinear data. Day 3 is\nthe first day students work with more than one weighted sum at a time,\nand every new concept today is a direct extension of a Day 2 skill,\nnever a brand-new starting point:</p>\n<ul>\n<li><p>A neuron is defined explicitly as “a weighted sum plus an\nactivation function” - the exact w x + b calculation from Day 2, with\none new step added at the end.</p></li>\n<li><p>A layer is defined as a group of neurons that all receive the\nsame input at the same time - an extension of the idea that a single\nweighted sum takes an input and produces an output, now applied to\nseveral weighted sums side by side.</p></li>\n<li><p>The activation function is introduced as the direct answer to the\nexact problem Day 2 ended on: a tool that lets a weighted sum’s output\nbend instead of staying perfectly proportional to its input.</p></li>\n<li><p>The forward pass is introduced as nothing more than several\nDay-2-style calculations performed in a specific order, where the output\nof one calculation becomes the input to the next - the same\nmultiply-then-add arithmetic, repeated and connected.</p></li>\n</ul>\n<h3 id=\"why-todays-lesson-comes-before-day-4\">Why today’s lesson comes\nbefore Day 4</h3>\n<p>Day 4 will have students modify a live, working neural network in\nTeachable Machine, changing weights, biases, activation functions, and\nstructure, and predicting and explaining the effects. None of that is\npossible without today’s foundation: a student cannot meaningfully\npredict the effect of changing a weight inside a hidden layer if they do\nnot yet know what a hidden layer is, what a weight does inside a neuron,\nor what an activation function does to a neuron’s output. Today’s manual\nforward pass is the load-bearing piece - by calculating a small\nnetwork’s output by hand, students build the same kind of concrete,\ncheckable understanding of “neuron, layer, activation function” that Day\n2’s hand calculations built for “weight, bias, weighted sum.” Without\ntoday’s forward pass, Day 4’s exploration would be button-pressing\nwithout comprehension; with it, every change a student makes on Day 4\ncan be traced back to a calculation they have personally performed.</p>\n"}, {"id": "timeline", "kind": "general", "num": null, "title": "4. Full Timeline (180 Minutes Total)", "html": "<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>#</strong></th>\n<th><strong>Segment</strong></th>\n<th><strong>Duration</strong></th>\n<th><strong>Time Block</strong></th>\n<th><strong>Type</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Review of Day 2 + Day 3 Roadmap</td>\n<td>10 min</td>\n<td>0:00–0:10</td>\n<td>Lecture / Discussion</td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>Neurons, Layers, and the Structure of a Neural Network</td>\n<td>25 min</td>\n<td>0:10–0:35</td>\n<td>Lecture + Activity</td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>Break</td>\n<td>5 min</td>\n<td>0:35–0:40</td>\n<td>Break</td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>The Activation Function: Letting a Model Bend</td>\n<td>30 min</td>\n<td>0:40–1:10</td>\n<td>Lecture + Activity</td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td>Manual Forward Pass Through a Small Network</td>\n<td>40 min</td>\n<td>1:10–1:50</td>\n<td>Guided Hands-On Activity</td>\n</tr>\n<tr class=\"even\">\n<td>6</td>\n<td>Break</td>\n<td>10 min</td>\n<td>1:50–2:00</td>\n<td>Break</td>\n</tr>\n<tr class=\"odd\">\n<td>7</td>\n<td>Instructor Demo: mlu-explain Neural Network Visual Essay</td>\n<td>25 min</td>\n<td>2:00–2:25</td>\n<td>Instructor Demo</td>\n</tr>\n<tr class=\"even\">\n<td>8</td>\n<td>Connecting Today to Day 4 (Preview)</td>\n<td>20 min</td>\n<td>2:25–2:45</td>\n<td>Lecture + Discussion</td>\n</tr>\n<tr class=\"odd\">\n<td>9</td>\n<td>Mini-Assessment and Wrap-Up</td>\n<td>15 min</td>\n<td>2:45–3:00</td>\n<td>Assessment</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Total: 180 minutes.</strong></p>\n"}, {"id": "gen56instructorscriptandstu", "kind": "general", "num": null, "title": "5-6. Instructor Script and Student Activities", "html": "<p>Each segment below includes the exact instructor script, step-by-step\nexplanation flow, worked examples where applicable, and full student\nactivity instructions with deliverables. Script text is set off in the\nbordered boxes and is intended to be spoken close to verbatim.</p>\n"}, {"id": "seg1", "kind": "segment", "num": 1, "title": "Segment 1: Review of Day 2 + Day 3 Roadmap", "html": "<p><strong>Duration: 10 minutes (0:00-0:10) | Type: Lecture /\nDiscussion</strong></p>\n<p><strong>Materials needed: </strong>Board or slide. No printed\nmaterials for this segment.</p>\n<h3 id=\"step-1.1---roadmap-2-min\">Step 1.1 - Roadmap (2 min)</h3>\n<p><em>Welcome back. Yesterday you took the exact same calculation from\nDay 1 - y equals m x plus b - and renamed it a weighted sum: y equals w\nx plus b, with w as weight and b as bias. You plotted data, built a\nslider-controlled line in Desmos, and fit that line to a data set. Then\nyou tried to fit that same kind of line to a curved data set, and no\nmatter how you dragged your sliders, you couldn’t do it. You discovered,\nyourselves, that one weighted sum can only ever draw one straight\nline.</em> <em>Today, you’re going to find out how to fix that. Today’s\nplan, in order: a quick review of yesterday’s weighted sum and the\nstraight-line problem, a new structure called a neural network, a new\ntool called an activation function, a hands-on manual calculation called\na forward pass, a live demo of a neural network in motion, and a short\nconnection to what’s coming on Day 4.</em></p>\n<p>Instructor action: Show today’s six segment names on the board/slide\nin order, left to right, exactly as done on Days 1 and 2.</p>\n<h3\nid=\"step-1.2---targeted-review-weighted-sum-and-the-straight-line-problem-8-min\">Step\n1.2 - Targeted Review: Weighted Sum and the Straight-Line Problem (8\nmin)</h3>\n<p>This review covers only the two Day 2 skills that today’s new content\ndepends on. Do not review the AI definition, the ethics vocabulary, or\nDesmos mechanics - nothing new today depends on those.</p>\n<p><em>Quick review, three questions, out loud, as a class.</em>\n<em>Question one: in the weighted sum y equals w x plus b, what does w\ncontrol, and what does b control? [Pause for class answer.] Correct - w,\nthe weight, controls the steepness of the line. b, the bias, controls\nwhere the line starts when the input is zero.</em> <em>Question two, a\nquick calculation: a model has weight equals 3 and bias equals negative\n2. What is the output when the input is 4? [Pause, cold-call one\nstudent.] Step one, identify: w equals 3, b equals negative 2, x equals\n4. Step two, substitute: y equals 3 times 4, plus negative 2. Step\nthree, multiply first: y equals 12, plus negative 2. Step four, add: y\nequals 10.</em> <em>Question three: yesterday you tried to fit a single\nweighted sum to a curved data set, and it didn’t work no matter how you\nadjusted w and b. In one sentence, why not? [Pause for class answer.]\nCorrect - because a single weighted sum can only ever produce one\nstraight line, and a straight line cannot bend to match a curve.</em>\n<em>Hold onto that last answer. Everything we do for the rest of today\nis the direct solution to that exact problem.</em></p>\n<h3 id=\"cfu-check-embedded---review-confirmation\">CFU Check (Embedded) -\nReview Confirmation</h3>\n<p>Before moving to Segment 2, confirm the room is ready: ask one more\nstudent to state, without notes, what a single weighted sum cannot do\nand why. If the student cannot answer without notes, repeat Question\nthree above with a new example before proceeding - Segment 2’s\nmotivation depends on this being solid.</p>\n"}, {"id": "seg2", "kind": "segment", "num": 2, "title": "Segment 2: Neurons, Layers, and the Structure of a Neural Network", "html": "<p><strong>Duration: 25 minutes (0:10-0:35) | Type: Lecture +\nActivity</strong></p>\n<p><strong>Materials needed: </strong>Board or slide; Day 3 Student\nWorksheet Packet (Worksheet 1 - Label the Network), one per student.</p>\n<h3 id=\"step-2.1---define-neuron-layer-and-neural-network-10-min\">Step\n2.1 - Define “Neuron,” “Layer,” and “Neural Network” (10 min)</h3>\n<p><em>Four new definitions. Write these down exactly as I say\nthem.</em> <em>Neuron: one single weighted sum, w x plus b, with one\nadditional step attached to the end - the result is passed through an\nactivation function before it becomes the neuron’s output. We will\ndefine activation function fully in the next segment; for right now,\njust know that a neuron is a weighted sum with one extra step at the\nend.</em> <em>Layer: a group of neurons that all receive the same set of\ninputs at the same time, side by side, each with its own separate\nweights and bias.</em> <em>Input layer: the very first layer - not made\nof neurons, just the raw input values themselves, exactly like the x\nyou’ve used since Day 1.</em> <em>Output layer: the very last layer -\nthe neuron or neurons whose result is the model’s final answer.</em>\n<em>Hidden layer: any layer that sits between the input layer and the\noutput layer. It’s called “hidden” because its values are intermediate\nsteps in the calculation, not the model’s final answer - you don’t read\nthem off as the answer, but the model cannot work without them.</em>\n<em>Put together: a neural network is a set of neurons arranged in\nlayers, where the output of every neuron in one layer becomes part of\nthe input to every neuron in the next layer.</em> <em>Definition\ndelivered before first use: confirmed. All four terms are fully defined\nbefore we look at a single example.</em> <em>Here is exactly why this\nmatters, connected directly to yesterday. Yesterday you had exactly one\nweighted sum, doing exactly one job, all by itself. Today, instead of\none weighted sum working alone, we’re going to connect several of them\ntogether. Nothing about the individual calculation changes - you still\nmultiply, then add, exactly like yesterday. What changes is that now the\nresult of one calculation feeds into another calculation, instead of\nbeing the final answer by itself.</em></p>\n<h3\nid=\"worked-example-1-labeling-a-small-network-full-in-this-segment\">Worked\nExample 1: Labeling a Small Network (full, in this segment)</h3>\n<p>Let’s look at one small network together, fully, out loud, and label\nevery part using our new vocabulary.</p>\n<p><em>Example: A network has 2 input values. Those 2 inputs both\nconnect to 2 separate neurons, sitting side by side. The output of both\nof those neurons then connects to 1 final neuron, which produces the\nmodel’s answer.</em> <em>Step 1 - Count the layers. There are 3 layers\ntotal: the 2 raw inputs form the input layer, the 2 side-by-side neurons\nform one hidden layer, and the 1 final neuron forms the output\nlayer.</em> <em>Step 2 - Label each layer by name. Input layer: the 2\ninputs. Hidden layer: the 2 neurons in the middle. Output layer: the 1\nneuron at the end.</em> <em>Step 3 - Confirm the connection rule. Every\nvalue in the input layer connects to every neuron in the hidden layer -\nboth inputs feed both hidden neurons. Both hidden neurons’ outputs then\nfeed the one output neuron.</em> <em>Step 4 - Conclusion: this is a\nneural network with 2 inputs, 1 hidden layer containing 2 neurons, and\nan output layer containing 1 neuron. This exact structure - 2 inputs, 2\nhidden neurons, 1 output - is the structure we will hand-calculate\ntogether in Segment 5.</em></p>\n<h3\nid=\"step-2.2---student-activity-worksheet-1---label-the-network-15-min\">Step\n2.2 - Student Activity: Worksheet 1 - Label the Network (15 min)</h3>\n<p><strong>Worksheet 1, Part A - Vocabulary in My Own Words (5\nmin).</strong> Before students label anything, have them turn to\nWorksheet 1, Part A and write each of today’s five structural terms -\nneuron, layer, input layer, hidden layer, output layer - in their own\nwords. Do not let them copy the board verbatim; the point of this box is\nto surface fuzzy understanding while it is still cheap to fix.</p>\n<p><strong>Circulate specifically for this:</strong> a student who\nwrites “a neuron is a circle” or “a hidden layer is the middle one” has\ndescribed the picture, not the definition. Push them with a single\nquestion - “yes, but what does it DO?” - and move on. This 5-minute box\nreplaces what was previously assigned as take-home vocabulary work, and\nit is more valuable here because you are in the room to correct it.</p>\n<p><strong>Worksheet 1, Parts B and C - Label the Network (10\nmin).</strong></p>\n<p><strong>Instructions given to students, exactly as written on the\nworksheet: </strong>Below are written descriptions of 4 small networks.\nFor each one, state how many layers it has, and label each layer as\n“input layer,” “hidden layer,” or “output layer.” Then state how many\nneurons are in each hidden layer and each output layer. Work with the\npartner at your table. You have 10 minutes.</p>\n<p><strong>The 4 network descriptions (printed on\nworksheet):</strong></p>\n<ul>\n<li><p>Network A: 3 inputs connect to 1 neuron, which produces the final\nanswer.</p></li>\n<li><p>Network B: 2 inputs connect to 3 side-by-side neurons; those 3\nneurons’ outputs connect to 1 final neuron.</p></li>\n<li><p>Network C: 2 inputs connect to 2 side-by-side neurons; those 2\nneurons’ outputs connect to 2 more side-by-side neurons; those 2\nneurons’ outputs connect to 1 final neuron.</p></li>\n<li><p>Network D: 4 inputs connect to 2 side-by-side neurons; those 2\nneurons’ outputs connect to 2 final, side-by-side output\nneurons.</p></li>\n</ul>\n<p><strong>Answer key:</strong></p>\n<ul>\n<li><p>Network A: 2 layers total - input layer (3 inputs), output layer\n(1 neuron, no hidden layer at all).</p></li>\n<li><p>Network B: 3 layers total - input layer (2 inputs), hidden layer\n(3 neurons), output layer (1 neuron).</p></li>\n<li><p>Network C: 4 layers total - input layer (2 inputs), hidden layer\n1 (2 neurons), hidden layer 2 (2 neurons), output layer (1\nneuron).</p></li>\n<li><p>Network D: 3 layers total - input layer (4 inputs), hidden layer\n(2 neurons), output layer (2 neurons).</p></li>\n</ul>\n<p><strong>Expected completion behavior: </strong>All 4 networks\ncorrectly counted by layer, with every layer correctly labeled\ninput/hidden/output and correct neuron counts given for each hidden and\noutput layer.</p>\n<p><strong>Deliverable: </strong>Completed Label the Network worksheet,\none per student (each student fills out their own sheet even when\nworking with a partner).</p>\n<p>Segment 3: Break</p>\n<p><strong>Duration: 5 minutes (0:35-0:40)</strong></p>\n<p><em>Five-minute break. Be back in your seat at [state exact clock\ntime].</em></p>\n"}, {"id": "break3", "kind": "segment", "num": 3, "title": "Segment 3: Break", "html": "<p>Scheduled break. Students step away from screens; the timer on the slide counts it down. Durations are listed in the day timeline.</p>"}, {"id": "seg4", "kind": "segment", "num": 4, "title": "Segment 4: The Activation Function - Letting a Model Bend", "html": "<p><strong>Duration: 30 minutes (0:40-1:10) | Type: Lecture +\nActivity</strong></p>\n<p><strong>Materials needed: </strong>Board or slide; Day 3 Student\nWorksheet Packet (Worksheet 2 - ReLU Practice), one per student.</p>\n<h3 id=\"step-4.1---define-activation-function-and-relu-10-min\">Step 4.1\n- Define “Activation Function” and “ReLU” (10 min)</h3>\n<p><em>Two new definitions before we use them.</em> <em>Activation\nfunction: a rule applied to a weighted sum’s result that can change that\nresult in a way that is not just multiplying and adding - this is the\none new ingredient that lets a network bend instead of staying a\nstraight line.</em> <em>Here’s the specific activation function we’ll\nuse today, called ReLU, short for “Rectified Linear Unit.” Write down\nthe rule exactly: if the weighted sum’s result is negative, ReLU outputs\nzero. If the weighted sum’s result is zero or positive, ReLU outputs\nthat exact same number, unchanged.</em> <em>In symbols, if we call the\nweighted sum’s result z, then ReLU of z equals zero when z is less than\nzero, and ReLU of z equals z itself when z is zero or greater.</em>\n<em>Definition delivered before first use: confirmed. Both “activation\nfunction” and “ReLU” are fully defined before we calculate a single\nexample.</em> Here is exactly why this matters, connected directly to\nyesterday’s straight-line problem. A weighted sum by itself, w x plus b,\nis always a straight line - for every one-unit increase in x, y changes\nby exactly the same amount, every single time, forever. ReLU breaks that\nrule on <strong>purpose: for negative inputs, ReLU flattens the result\nto zero no matter what; for positive inputs, ReLU leaves it alone. That\nmeans the overall relationship between input and output is no longer one\nsteady straight line </strong>- it has a bend in it, right at the point\nwhere the weighted sum crosses zero. One bend from one ReLU isn’t very\npowerful by itself, but connect several neurons, each with their own\nbend, and you can build shapes far more complex than any single straight\nline could ever produce. That’s the whole idea behind today’s\nlesson.</p>\n<h3 id=\"worked-example-2-applying-relu-full-in-this-segment\">Worked\nExample 2: Applying ReLU (full, in this segment)</h3>\n<p>Let’s calculate a few, fully, step by step.</p>\n<p><em>Example: A weighted sum produces z equals negative 5. What does\nReLU output?</em> <em>Step 1 - Check the sign of z: negative 5 is less\nthan zero.</em> <em>Step 2 - Apply the rule: since z is negative, ReLU\noutputs zero.</em> <em>Step 3 - State the answer in context: ReLU of\nnegative 5 equals 0. This neuron is “turned off” for this particular\ninput - its output contributes nothing to the next layer.</em>\n<em>Second example: A weighted sum produces z equals 7. What does ReLU\noutput?</em> <em>Step 1 - Check the sign of z: 7 is greater than\nzero.</em> <em>Step 2 - Apply the rule: since z is zero or positive,\nReLU outputs z unchanged.</em> <em>Step 3 - State the answer in context:\nReLU of 7 equals 7. This neuron is “turned on” - its output passes\nthrough exactly as calculated, with no change at all.</em> <em>Notice\nthe pattern: ReLU never changes a positive number, and it always erases\na negative number down to zero. There is no other case.</em></p>\n<h3\nid=\"step-4.2---predict-before-calculate-will-it-turn-on-or-off-5-min\">Step\n4.2 - Predict-Before-Calculate: Will It Turn On or Off? (5 min)</h3>\n<p><em>Before I show you the next four weighted-sum results, predict,\nout loud as a class, whether ReLU will “turn on” (pass the number\nthrough) or “turn off” (zero it out) for each one. I’ll show you the\nnumber, you shout “on” or “off” before I calculate.</em> <em>z equals 3.\n[Pause for shouted answers.] On - 3 is positive, ReLU passes it through\nunchanged: output is 3.</em> <em>z equals negative 1. [Pause.] Off -\nnegative 1 is negative, ReLU zeroes it: output is 0.</em> <em>z equals\n0. [Pause.] On - zero counts as “zero or positive” in our rule, so ReLU\npasses it through unchanged: output is 0. Notice the output happens to\nbe 0 either way here, but the reason matters: this is the “on” case\nlanding on 0, not the “off” case.</em> <em>z equals negative 20.\n[Pause.] Off - output is 0, regardless of how negative the number is.\nReLU doesn’t care how negative - any negative number becomes exactly\n0.</em></p>\n<h3\nid=\"step-4.3---student-activity-worksheet-2---relu-practice-15-min\">Step\n4.3 - Student Activity: Worksheet 2 - ReLU Practice (15 min)</h3>\n<p><strong>Instructions given to students, exactly as written on the\nworksheet: </strong>For each weighted-sum result (z) below, first write\nyour PREDICTION: will ReLU turn this value “on” (pass it through) or\n“off” (zero it out)? Then calculate the actual ReLU output. You have 10\nminutes, then we check answers as a class.</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>#</strong></th>\n<th><strong>Weighted sum result (z)</strong></th>\n<th><strong>Prediction (On / Off)</strong></th>\n<th><strong>ReLU output</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>z = 6</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>z = -4</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>z = -0.5</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>z = 12</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td>z = -9</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Answer key: </strong>1) On, output = 6. 2) Off, output = 0.\n3) Off, output = 0. 4) On, output = 12. 5) Off, output = 0. 6) On (zero\ncounts as “zero or positive”), output = 0.</p>\n<p><strong>Expected completion behavior: </strong>A written On/Off\nprediction appears before every calculated ReLU output, and all 6\noutputs are correct, including row 6, where students must recognize that\nz = 0 is the “On” case even though the resulting output is also 0.</p>\n<p><strong>Worksheet 2, Part B - Calculate the Weighted Sum, Then Apply\nReLU (added).</strong> After the class checks Part A’s answers together,\nstudents continue directly into Part B without stopping. Part B gives\nfour full neurons (w, x, and b supplied) and requires students to\ncalculate z themselves before applying ReLU - the two-step motion that\nSegment 5’s forward pass depends on entirely. This practice was\npreviously assigned as homework; it is now done here, in the room, where\na student who reverses the multiply-then-add order can be corrected on\nthe spot instead of practicing the error alone at home.</p>\n<p><strong>Answer key - Worksheet 2, Part B:</strong></p>\n<ul>\n<li><p>Neuron 1: w = 3, x = 2, b = -8. z = (3)(2) + (-8) = 6 - 8 =\n<strong>-2</strong>. Negative, so <strong>OFF</strong>. ReLU output =\n<strong>0</strong>.</p></li>\n<li><p>Neuron 2: w = -2, x = 4, b = 10. z = (-2)(4) + 10 = -8 + 10 =\n<strong>2</strong>. Positive, so <strong>ON</strong>. ReLU output =\n<strong>2</strong>.</p></li>\n<li><p>Neuron 3: w = 5, x = 0, b = -3. z = (5)(0) + (-3) = 0 - 3 =\n<strong>-3</strong>. Negative, so <strong>OFF</strong>. ReLU output =\n<strong>0</strong>.</p></li>\n<li><p>Neuron 4: w = 1, x = 7, b = -6. z = (1)(7) + (-6) = 7 - 6 =\n<strong>1</strong>. Positive, so <strong>ON</strong>. ReLU output =\n<strong>1</strong>.</p></li>\n</ul>\n<p><strong>Note on Neuron 3:</strong> this is the deliberately\ninstructive one. Because x = 0, the weight is multiplied away entirely\nand the bias alone decides the neuron’s fate. Students who believe “the\nweight is what matters” are surprised here. The Worksheet 2 reflection\nquestion asks them to explain exactly this - do not skip it, and\ncold-call one student for the answer before moving to Segment 5.</p>\n<p><strong>Expected completion behavior (Part B): </strong>Each neuron\nshows the multiply-then-add steps written out, an explicit ON/OFF\nprediction recorded before the ReLU output, and a correct final\noutput.</p>\n<p><strong>Deliverable: </strong>Completed Worksheet 2 (Parts A and B,\nplus reflection), one per student.</p>\n"}, {"id": "seg5", "kind": "segment", "num": 5, "title": "Segment 5: Manual Forward Pass Through a Small Network", "html": "<p><strong>Duration: 40 minutes (1:10-1:50) | Type: Guided Hands-On\nActivity</strong></p>\n<p><strong>Materials needed: </strong>Board or slide; Day 3 Student\nWorksheet Packet (Worksheet 3 - The Forward Pass), one per student;\ncalculators optional but permitted.</p>\n<h3 id=\"step-5.1---define-forward-pass-5-min\">Step 5.1 - Define “Forward\nPass” (5 min)</h3>\n<p><em>One new definition before we use it.</em> <em>Forward pass: the\nprocess of calculating a neural network’s full output by moving through\nthe network one layer at a time, in order - starting at the input layer,\ncalculating every neuron in the first hidden layer, using those results\nto calculate every neuron in the next layer, and continuing until you\nreach the output layer.</em> <em>Definition delivered before first use:\nconfirmed.</em> <em>Here is exactly why this matters, connected directly\nto what you already know. A forward pass is not a new kind of math. It\nis the exact same weighted-sum calculation from yesterday, and the exact\nsame ReLU calculation from twenty minutes ago, performed several times\nin a row, in a specific order, where one neuron’s output becomes the\nnext neuron’s input. If you can calculate one weighted sum and apply\nReLU to it - and you already can - you can perform a full forward pass.\nThe only new skill is keeping track of the order and carrying each\nresult forward correctly.</em></p>\n<h3\nid=\"worked-example-3-a-complete-forward-pass-full-in-this-segment---15-min\">Worked\nExample 3: A Complete Forward Pass (full, in this segment - 15 min)</h3>\n<p>Let’s calculate one complete forward pass together, fully, out loud,\nthrough the exact network structure from Worked Example 1: 2 inputs, 1\nhidden layer with 2 neurons, 1 output neuron.</p>\n<p><em>Example: Inputs are x1 equals 2 and x2 equals 3.</em> <em>Hidden\nNeuron A has weights w equals 1 (for x1) and w equals negative 1 (for\nx2), and bias b equals 0.</em> <em>Hidden Neuron B has weights w equals\n2 (for x1) and w equals 1 (for x2), and bias b equals negative 3.</em>\n<em>The Output Neuron has weights w equals 3 (for Neuron A’s output) and\nw equals 2 (for Neuron B’s output), and bias b equals 1.</em> <em>Step 1\n- Calculate Hidden Neuron A’s weighted sum: z(A) equals (1 times 2) plus\n(negative 1 times 3) plus 0. That’s 2 plus negative 3 plus 0, which\nequals negative 1.</em> <em>Step 2 - Apply ReLU to Neuron A: z(A) is\nnegative 1, which is negative, so ReLU turns it off. Neuron A’s output,\na(A), equals 0.</em> <em>Step 3 - Calculate Hidden Neuron B’s weighted\nsum: z(B) equals (2 times 2) plus (1 times 3) plus negative 3. That’s 4\nplus 3 plus negative 3, which equals 4.</em> <em>Step 4 - Apply ReLU to\nNeuron B: z(B) is 4, which is positive, so ReLU passes it through\nunchanged. Neuron B’s output, a(B), equals 4.</em> <em>Step 5 - Move to\nthe output layer. The output neuron’s inputs are no longer x1 and x2 -\nthey are now a(A) and a(B), the two numbers we just calculated. This is\nthe key idea of a forward pass: one layer’s outputs become the next\nlayer’s inputs.</em> <em>Step 6 - Calculate the output neuron’s weighted\nsum: z(output) equals (3 times a(A)) plus (2 times a(B)) plus 1.\nSubstituting: (3 times 0) plus (2 times 4) plus 1, which is 0 plus 8\nplus 1, which equals 9.</em> <em>Step 7 - Check whether the output\nneuron uses an activation function. In this network, the output neuron\ndoes not use ReLU - it reports its weighted sum directly, the same way\nDay 2’s single weighted sum reported its result directly. This is a\ncommon design for a model whose final answer is a number, like a\nprediction, rather than an on/off decision.</em> <em>Step 8 - State the\nfinal answer in context: for inputs x1 equals 2 and x2 equals 3, this\nnetwork’s forward pass produces a final output of 9.</em> <em>Notice\nevery single step used only two skills you already had before today:\ncalculate a weighted sum, then apply ReLU. The only new part was doing\nit three times in the correct order and carrying each result\nforward.</em></p>\n<h3\nid=\"step-5.2---student-activity-worksheet-3---the-forward-pass-20-min\">Step\n5.2 - Student Activity: Worksheet 3 - The Forward Pass (20 min)</h3>\n<p><strong>Instructions given to students, exactly as written on the\nworksheet: </strong>You will calculate a complete forward pass through\nthe same network shape as the worked example: 2 inputs, 1 hidden layer\nwith 2 neurons (A and B), and 1 output neuron with no activation\nfunction. Fill in every blank, showing the multiply-then-add steps for\neach weighted sum, and clearly circle each ReLU decision (On or Off).\nWork alone for the first 12 minutes, then check your answers with your\ntable group for the last 8 minutes.</p>\n<p><strong>Given values (printed on worksheet):</strong></p>\n<ul>\n<li><p>Inputs: x1 = 4, x2 = 1</p></li>\n<li><p>Hidden Neuron A: weight on x1 = 2, weight on x2 = -3, bias =\n1</p></li>\n<li><p>Hidden Neuron B: weight on x1 = -1, weight on x2 = 2, bias =\n-2</p></li>\n<li><p>Output Neuron: weight on Neuron A’s output = 1, weight on Neuron\nB’s output = 4, bias = -2 (no activation function on the output\nneuron)</p></li>\n</ul>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Step</strong></th>\n<th><strong>Calculation</strong></th>\n<th><strong>Your work</strong></th>\n<th><strong>Result</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Neuron A weighted sum: z(A) = (2)(x1) + (-3)(x2) + 1</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>Neuron A ReLU: On or Off? Neuron A output a(A)</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>Neuron B weighted sum: z(B) = (-1)(x1) + (2)(x2) + (-2)</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>Neuron B ReLU: On or Off? Neuron B output a(B)</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td>Output weighted sum: z(out) = (1)(a(A)) + (4)(a(B)) + (-2)</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Answer key:</strong></p>\n<ul>\n<li><p>Step 1: z(A) = (2)(4) + (-3)(1) + 1 = 8 - 3 + 1 = 6.</p></li>\n<li><p>Step 2: z(A) = 6 is positive → On. a(A) = 6.</p></li>\n<li><p>Step 3: z(B) = (-1)(4) + (2)(1) + (-2) = -4 + 2 - 2 =\n-4.</p></li>\n<li><p>Step 4: z(B) = -4 is negative → Off. a(B) = 0.</p></li>\n<li><p>Step 5: z(out) = (1)(6) + (4)(0) + (-2) = 6 + 0 - 2 = 4.</p></li>\n<li><p>Step 6: Final network output = 4.</p></li>\n</ul>\n<p><strong>Expected completion behavior: </strong>All 6 steps completed\nin order with multiply-then-add work shown, both ReLU decisions\nexplicitly marked On/Off before the neuron output is recorded, and a\ncorrect final output of 4.</p>\n<p><strong>Worksheet 3, Part B - Independent Forward Pass\n(added).</strong> Students who complete Part A and have it checked by\ntheir table group proceed immediately to Part B, a second complete\nforward pass through the same network shape with entirely new numbers\nand no scaffolding in the “your work” column. This second pass was\npreviously assigned as homework. It is now done here, and this is the\nsingle most important structural change to Day 3: the forward pass is\nthe load-bearing skill of the entire week, and a student who can only do\nit once, with help, cannot do it at all. The second repetition must\nhappen under supervision.</p>\n<p><strong>Answer key - Worksheet 3, Part B:</strong> Inputs x1 = 3, x2\n= 2.</p>\n<ul>\n<li><p>Step 1: z(A) = (1)(3) + (-2)(2) + 4 = 3 - 4 + 4 =\n<strong>3</strong>.</p></li>\n<li><p>Step 2: z(A) = 3 is positive, so ReLU is <strong>ON</strong>.\na(A) = <strong>3</strong>.</p></li>\n<li><p>Step 3: z(B) = (3)(3) + (1)(2) + (-5) = 9 + 2 - 5 =\n<strong>6</strong>.</p></li>\n<li><p>Step 4: z(B) = 6 is positive, so ReLU is <strong>ON</strong>.\na(B) = <strong>6</strong>.</p></li>\n<li><p>Step 5: z(C) = (2)(3) + (1)(6) + (-3) = 6 + 6 - 3 =\n<strong>9</strong>.</p></li>\n<li><p>Step 6: Final network output = <strong>9</strong>.</p></li>\n</ul>\n<p><strong>Note:</strong> unlike Part A, both hidden neurons turn ON in\nPart B. This is deliberate. Students who pattern-matched “one neuron\nalways turns off” from Part A will now discover that the ReLU decision\ngenuinely depends on the numbers, not on a rule of thumb about the\nnetwork’s shape.</p>\n<p><strong>Worksheet 3, Part C - Reflection and Extension.</strong> Part\nC asks students to explain what a ReLU output of 0 contributes to the\nnext layer and whether the weight on that connection still matters. Any\nstudent who finishes early moves to the Extension, which changes Neuron\nA’s bias to -10 and asks them to re-run only the affected steps. The\nExtension is a preview of Day 4’s entire premise - change one number,\ntrace the effect forward - and students who complete it arrive at Day 4\nalready fluent in the motion.</p>\n<p><strong>Extension answer key:</strong> With Neuron A’s bias changed\nfrom 4 to -10, z(A) = (1)(3) + (-2)(2) + (-10) = 3 - 4 - 10 =\n<strong>-11</strong>. Negative, so Neuron A flips from <strong>ON to\nOFF</strong>, and a(A) = <strong>0</strong>. Then z(C) = (2)(0) + (1)(6)\n+ (-3) = 0 + 6 - 3 = <strong>3</strong>. The final output drops from 9\nto <strong>3</strong> - one changed bias, traced all the way to the\nnetwork’s answer.</p>\n<p><strong>Time management within Segment 5: </strong>Part A (guided)\ntakes roughly 8 minutes with the instructor. Part B (independent) takes\nroughly 9 minutes alone plus 3 minutes of table-group checking. If a\nclass is slow, protect Part B and shorten the table-group check - Part B\nis the repetition that matters, and it cannot be sent home.</p>\n<p><strong>Deliverable: </strong>Completed Worksheet 3 (Parts A, B, and\nC), one per student.</p>\n<p>Segment 6: Break</p>\n<p><strong>Duration: 10 minutes (1:50-2:00)</strong></p>\n<p><em>Ten-minute break. Grab a snack if you’d like one. Be back in your\nseat at [state exact clock time].</em></p>\n"}, {"id": "break6", "kind": "segment", "num": 6, "title": "Segment 6: Break", "html": "<p>Scheduled break. Students step away from screens; the timer on the slide counts it down. Durations are listed in the day timeline.</p>"}, {"id": "seg7", "kind": "segment", "num": 7, "title": "Segment 7: Instructor Demo - mlu-explain Neural Network Visual Essay", "html": "<p><strong>Duration: 25 minutes (2:00-2:25) | Type: Instructor Demo\n(projected, instructor-driven)</strong></p>\n<p><strong>Materials needed: </strong>One laptop/projector connection.\nWebsite: <a href=\"https://mlu-explain.github.io/neural-networks/\" target=\"_blank\" rel=\"noopener\">mlu-explain.github.io/neural-networks/</a> (the same site used for\nDay 1’s Linear Regression essay; students do not need individual devices\nfor this segment). Day 3 Student Worksheet Packet, open to Worksheet 4\n(Watch the Network Move).</p>\n<p><strong>Setup note (read before delivering): </strong>This is\ninstructor-led only, matching Day 1’s approach to this site. Students\nwatch the projected screen; no individual student laptops are used in\nthis segment. This is the Neural Networks essay on\n<a href=\"https://mlu-explain.github.io\" target=\"_blank\" rel=\"noopener\">mlu-explain.github.io</a>, which Day 1 explicitly reserved for today.</p>\n<h3 id=\"step-7.1---frame-the-purpose-3-min\">Step 7.1 - Frame the Purpose\n(3 min)</h3>\n<p><em>You’ve now calculated a full forward pass by hand, twice - once\nwith me, once on your own. I’m going to show you what that same process\nlooks like in motion, using a visual tool built specifically to show a\nneural network processing data. Just like Day 1’s demo, you are not\ngoing to touch the controls today - you’re watching, and connecting what\nyou see to the exact calculation you already know how to do by\nhand.</em></p>\n<h3 id=\"step-7.2---live-demo-walkthrough-15-min\">Step 7.2 - Live Demo\nWalkthrough (15 min)</h3>\n<p>Instructor projects the Neural Network visual essay at\n<a href=\"https://mlu-explain.github.io/neural-networks/\" target=\"_blank\" rel=\"noopener\">mlu-explain.github.io/neural-networks/</a> and narrates using this exact\nscript structure:</p>\n<p><em>What you’re looking at is a diagram of a neural network - the\nsame shape of thing you just labeled on your worksheet and calculated by\nhand. Find the circles on the far left. Those are the input layer,\nexactly like x1 and x2 in the forward pass you just did. Find the\ncircles in the middle. Those are the hidden layer - the neurons, each\none doing its own weighted sum and its own activation function, exactly\nlike Neuron A and Neuron B a few minutes ago. Find the circle or circles\non the right. That’s the output layer, exactly like the final output\nneuron in your worksheet.</em> <em>Watch the lines connecting the\ncircles. [Instructor points to connections between layers.] Each of\nthose lines represents one weight - one multiplication, exactly like the\nw values you used in every single one of your calculations today. Notice\nhow many lines there are: every input connects to every hidden neuron,\nand every hidden neuron connects to the output, exactly like the\nfully-connected structure you labeled in Segment 2.</em> <em>Now watch\nwhat happens as I adjust or step through the visual. [Instructor\ninteracts with the essay’s built-in controls, per the site’s interface.]\nNotice the network is doing exactly what you did on paper: taking the\ninput values, multiplying by weights, adding a bias, and - for the\nhidden neurons - applying an activation function, before passing the\nresult to the next layer. The site may show this as color, thickness, or\nanimation, but underneath every visual change is the exact same\nmultiply-then-add-then-activate sequence you already performed by\nhand.</em> <em>This is the direct answer to the problem you found\nyesterday. One weighted sum could only draw a straight line. This - many\nweighted sums, each with their own activation function, connected in\nlayers - can bend, curve, and fit patterns a single straight line never\ncould.</em></p>\n<h3 id=\"step-7.3---worksheet-4-and-quick-debrief-7-min\">Step 7.3 -\nWorksheet 4 and Quick Debrief (7 min)</h3>\n<p><strong>Students complete Worksheet 4 while the demo is still\nprojected on screen - not afterward from memory.</strong> Worksheet 4,\nPart A is a two-column mapping table: for each thing they can see on the\nprojected screen (the circles on the left, the circles in the middle,\nthe lines between them), they write what it corresponded to in the\nforward pass they calculated by hand thirty minutes ago. Leave the essay\nup on the projector for the full seven minutes so students can look up\nat it while they write.</p>\n<p><strong>Worksheet 4 answer key - Part A:</strong> Circles on the far\nleft = the input layer, the x1 and x2 values. Circles in the middle =\nthe hidden layer neurons, equivalent to Neuron A and Neuron B. Circle(s)\non the right = the output layer, equivalent to Neuron C. Each line\nconnecting two circles = one weight, one multiplication. The number\nadded inside each circle before ReLU = the bias.</p>\n<p><strong>Worksheet 4, Parts B and C.</strong> Part B is the day’s\ncentral question in writing (“why can THIS network fit shapes that a\nsingle weighted sum could not?”). Part C asks for one thing that\nsurprised them - it is low-stakes, it takes thirty seconds, and it is\nthe single best source of material for the Segment 8 discussion. Skim a\nfew Part C answers while students pack up and open Segment 8 with one of\nthem.</p>\n<p>Instructor asks the class these prompts, one at a time, allowing\nbrief discussion after each:</p>\n<p><em>Prompt 1: Point to a part of the diagram we just watched and tell\nyour neighbor, in your own words, what it corresponds to in the forward\npass you calculated on paper - is it an input, a weight, a neuron, or\nthe output?</em> <em>Prompt 2: In one sentence, why can this network fit\nshapes that yesterday’s single weighted sum could not?</em></p>\n<p><strong>Expected answer to Prompt 2: </strong>Because this network\nchains together multiple weighted sums, each passed through an\nactivation function, instead of relying on just one - the activation\nfunctions let the combined result bend instead of staying a single\nstraight line.</p>\n"}, {"id": "seg8", "kind": "segment", "num": 8, "title": "Segment 8: Connecting Today to Day 4 (Preview)", "html": "<p><strong>Duration: 20 minutes (2:25-2:45) | Type: Lecture + Discussion\n+ Worksheet</strong></p>\n<p><strong>Materials needed: </strong>Board/slide. Day 3 Student\nWorksheet Packet, open to Worksheet 5 (Looking Ahead to Day 4).</p>\n<p><strong>Purpose (revised): </strong>This segment previously ended\nwith a spoken preview and a take-home assignment. It now ends with\nWorksheet 5, completed in class. Worksheet 5 is the bridge document: it\ncaptures the four statements Day 4 assumes students already own, it\nholds the written reasoning questions that used to be homework, and it\nends with a prediction about a change students will actually make with\ntheir own hands tomorrow. <strong>Every day of SAIL now ends with a\nbridge worksheet in this same position</strong> - Day 1’s Worksheet 5,\nDay 2’s Worksheet 5, this one, and Day 4’s Worksheet 4 (the Day 5\nproject plan). Students should recognize the pattern by now, and the\nphrase to use is the same every day: “this is where tomorrow\nstarts.”</p>\n<h3 id=\"step-8.1---summarize-todays-vocabulary-chain-7-min\">Step 8.1 -\nSummarize Today’s Vocabulary Chain (7 min)</h3>\n<p><em>Let’s connect everything, start to finish, across all three days.\nDay 1: y equals m x plus b, with m as slope and b as intercept. Day 2:\nthe exact same calculation, renamed - y equals w x plus b, with w as\nweight and b as bias, now called a weighted sum. Today, Day 3: that same\nweighted sum, with one new step added - passed through an activation\nfunction, specifically ReLU - becomes a neuron. Groups of neurons,\narranged side by side, become a layer. Layers connected in sequence,\nfrom input layer to hidden layer or layers to output layer, become a\nneural network. And calculating a network’s full output, one layer at a\ntime, in order, is called a forward pass.</em> <em>You performed a\ncomplete forward pass by hand today, through a real 2-input,\n2-hidden-neuron, 1-output network. Every number you calculated used only\ntwo skills: a weighted sum, and ReLU. Nothing about today’s math was new\n- only the structure connecting your existing skills together was\nnew.</em></p>\n<h3 id=\"step-8.2---preview-what-day-4-will-let-you-do-7-min\">Step 8.2 -\nPreview: What Day 4 Will Let You Do (7 min)</h3>\n<p><em>Here’s the problem we’re leaving open on purpose: today, I gave\nyou every weight and every bias already chosen for you, and your job was\nto calculate what the network would do. Tomorrow, Day 4, you get to\nchoose the weights and biases yourself - and change the network’s\nstructure - inside a tool that runs the forward pass for you, instantly,\nover and over, so you can see the effect of your changes in real time\ninstead of recalculating by hand each time.</em> <em>Here’s the\none-sentence preview: on Day 4, you will modify a live neural network -\nchanging weights, biases, activation functions, and even the number of\nneurons or layers - predicting the effect of each change before you make\nit, and then explaining, using today’s vocabulary, why the network’s\nbehavior changed the way it did. Every single word in that sentence -\nweight, bias, activation function, neuron, layer - is something you\nalready fully understand as of right now.</em></p>\n<h3 id=\"step-8.3---worksheet-5-and-quick-discussion-6-min\">Step 8.3 -\nWorksheet 5 and Quick Discussion (6 min)</h3>\n<p><strong>Students complete Worksheet 5 now, in class.</strong> Give\nthem the full six minutes and circulate. Worksheet 5 has three\nparts:</p>\n<ul>\n<li><p><strong>Part A - The Four Things I Own After Today.</strong> Four\nboxes: what two things make a neuron, what ReLU does to negative and\npositive numbers, what a hidden layer is, and what moves in a forward\npass and in what order. This is the fluency check that Day 4’s opening\nscript depends on. <strong>Read these four boxes while students\nwork.</strong> A student who cannot fill them in without their notes\nwill not be able to follow Day 4’s Segment 1, which reteaches none of\nit.</p></li>\n<li><p><strong>Part B - Thinking Questions.</strong> Three\nwritten-reasoning questions, previously assigned as homework: whether\nmore neurons always makes a network better, why a network without an\nactivation function is no more powerful than one weighted sum, and how a\nReLU network could fit Day 2’s curved data set. These are the questions\nthat separate students who understand today from students who executed\ntoday. They are worth far more here, where you can read them and\nintervene, than they were as homework you would not see until\ntomorrow.</p></li>\n<li><p><strong>Part C - Tomorrow’s Prediction.</strong> The\npredict-before-you-test box, aimed squarely at Day 4’s first hands-on\nmove.</p></li>\n</ul>\n<p><strong>Instructor action: </strong>While students write, ask the\nclass aloud:</p>\n<p><em>Turn to your neighbor: if you increased the bias on Hidden Neuron\nA in today’s worked example, what part of the calculation would change\nfirst, and could that change whether ReLU turns that neuron on or\noff?</em></p>\n<p><strong>Expected answer: </strong>The weighted sum z(A) would change\nfirst, since bias is added directly into that calculation. A big enough\nincrease in bias could push a previously negative z(A) up to zero or\npositive, which would flip that neuron from Off to On - showing that a\nsingle changed number can ripple forward through the rest of the\nnetwork.</p>\n<p><strong>This is exactly the Worksheet 3 Extension</strong>, and it is\nexactly Worksheet 5’s Part C prediction. Students who did the Extension\nhave already proven this with their own arithmetic. Call on one of\nthem.</p>\n<p><strong>Assessment criteria - Worksheet 5</strong></p>\n<ul>\n<li><p><strong>Proficient: </strong>All four Part A boxes are answerable\nwithout notes. The Part B answers explain a cause rather than restating\na fact - the “why” is present, not just the “what.” Part C contains a\nspecific, committed prediction.</p></li>\n<li><p><strong>Developing: </strong>Part A is complete but Part B\nanswers restate the definitions instead of reasoning with them (“a\nnetwork needs an activation function because without one it can’t bend”\nis a restatement, not an explanation). Push these students with: “yes -\nbut WHY can’t it bend?”</p></li>\n<li><p><strong>Needs support: </strong>Part A cannot be completed\nwithout notes. <strong>This student is not ready for Day 4 and you now\nknow it a full day early - which is the entire point of moving this\nworksheet into class.</strong> Schedule them for a check-in during Day\n4’s first ten minutes.</p></li>\n</ul>\n"}, {"id": "seg9", "kind": "segment", "num": 9, "title": "Segment 9: Mini-Assessment and Wrap-Up", "html": "<p><strong>Duration: 15 minutes (2:45-3:00) | Type:\nAssessment</strong></p>\n<p><strong>Materials needed: </strong>Printed Mini-Assessment, one per\nstudent (see Section 10 of this module).</p>\n<h3 id=\"step-9.1---frame-the-assessment-1-min\">Step 9.1 - Frame the\nAssessment (1 min)</h3>\n<p><em>Take out a pencil. Same format as Days 1 and 2 - 8 questions, 10\nminutes, on your own, show your work for any calculation.</em></p>\n<h3 id=\"step-9.2---administer-10-min\">Step 9.2 - Administer (10\nmin)</h3>\n<p>Distribute the Mini-Assessment (Section 10 below). Students work\nindependently and silently for 10 minutes.</p>\n<h3 id=\"step-9.3---close-the-day-4-min\">Step 9.3 - Close the Day (4\nmin)</h3>\n<p><em>Collect your assessment when you finish. One last thing before\nyou go: today you learned that connecting weighted sums with activation\nfunctions lets a model bend instead of staying a straight line. You\ncalculated a full forward pass by hand - twice. You wrote down what you\npredicted before you ever checked it. Everything you needed to do today,\nyou did in this room, and it is all in the packet in front of you.</em>\n<em>There is nothing to take home. Bring the packet back tomorrow.\nTomorrow, Day 4, you take the controls yourself - changing weights,\nbiases, activation functions, and structure inside a real, running\nneural network, and explaining what happens and why. Worksheet 5 in your\npacket is where that starts. See you tomorrow.</em></p>\n<p><strong>Instructor action - end of day: </strong>Students keep their\nDay 3 Student Worksheet Packet and bring it back on Day 4. <strong>There\nis no homework on any day of SAIL.</strong> If you prefer to collect the\npackets to review Worksheet 5’s Part A fluency boxes overnight, that is\nacceptable and useful - but <strong>you must return them at the start of\nDay 4</strong>, since Day 4’s Segment 1 and Segment 4 both reference the\ncompleted forward pass in Worksheet 3.</p>\n"}, {"id": "gen7workedexamplesconsolida", "kind": "general", "num": null, "title": "7. Worked Examples (Consolidated Index)", "html": "<ul>\n<li><p>Worked Example 1 (Segment 2): Labeling a small network’s layers\n(input, hidden, output) and identifying its connection pattern.</p></li>\n<li><p>Worked Example 2 (Segment 4): Applying the ReLU activation\nfunction to a negative and a positive weighted-sum result, showing the\non/off pattern.</p></li>\n<li><p>Worked Example 3 (Segment 5): A complete forward pass through a\n2-input, 2-hidden-neuron, 1-output network, shown in eight explicit\nsteps, from raw inputs to final output.</p></li>\n</ul>\n"}, {"id": "gen8checksforunderstandingc", "kind": "general", "num": null, "title": "8. Checks for Understanding (CFUs)", "html": "<h3 id=\"cfu-1-after-segment-2-step-2.1---neuron-definition\">CFU 1 (after\nSegment 2, Step 2.1 - Neuron Definition)</h3>\n<p><strong>Question: </strong>In your own words, what two things is a\nneuron made of?</p>\n<p><strong>Expected correct answer: </strong>A weighted sum (w x plus\nb), followed by an activation function applied to that result.</p>\n<p><strong>Common wrong answer: </strong>A neuron is just a fancy name\nfor a single number, or: a neuron is a tiny computer inside the\ncomputer.</p>\n<p><strong>Correction: </strong>A neuron isn’t a number by itself and it\nisn’t a separate little computer - it’s a specific two-step calculation:\nfirst the same weighted sum from Day 2, then one new step, an activation\nfunction, applied to that result.</p>\n<h3 id=\"cfu-2-after-segment-2-step-2.1---layers\">CFU 2 (after Segment 2,\nStep 2.1 - Layers)</h3>\n<p><strong>Question: </strong>A network has 3 inputs, then 4\nside-by-side neurons, then 1 final neuron. How many layers does it have,\nand what is each one called?</p>\n<p><strong>Expected correct answer: </strong>3 layers: the input layer\n(the 3 inputs), the hidden layer (the 4 neurons), and the output layer\n(the 1 final neuron).</p>\n<p><strong>Common wrong answer: </strong>4 layers, counting the inputs\nas their own separate thing plus each neuron individually.</p>\n<p><strong>Correction: </strong>A layer is a group of values or neurons\nthat sit at the same stage, not one layer per individual value. The 3\ninputs together are one layer, the 4 side-by-side neurons together are\none layer, and the 1 final neuron is its own layer - 3 layers total.</p>\n<h3 id=\"cfu-3-after-segment-4-step-4.1---relu-rule\">CFU 3 (after Segment\n4, Step 4.1 - ReLU Rule)</h3>\n<p><strong>Question: </strong>A weighted sum produces a result of\nexactly 0. Does ReLU turn this neuron on or off, and what is the\noutput?</p>\n<p><strong>Expected correct answer: </strong>On. Our rule says ReLU\npasses the value through unchanged when the result is zero OR positive -\nzero is included in the “on” case. The output is 0.</p>\n<p><strong>Common wrong answer: </strong>Off, because 0 isn’t a real\nnumber the neuron is doing anything with.</p>\n<p><strong>Correction: </strong>Re-read the exact rule: ReLU outputs\nzero only when the input is negative. Zero itself is not negative, so it\nfalls into the “pass it through unchanged” case - it just happens that\npassing 0 through unchanged still gives 0.</p>\n<h3\nid=\"cfu-4-after-segment-4-step-4.1---why-activation-functions-matter\">CFU\n4 (after Segment 4, Step 4.1 - Why Activation Functions Matter)</h3>\n<p><strong>Question: </strong>Why can’t a network made only of weighted\nsums, with no activation function anywhere, do anything a single\nweighted sum couldn’t already do?</p>\n<p><strong>Expected correct answer: </strong>Because chaining plain\nweighted sums together with no activation function in between still just\nproduces one combined straight-line relationship - without a step like\nReLU that breaks the steady multiply-and-add pattern, the whole network\nstill behaves like one big weighted sum.</p>\n<p><strong>Common wrong answer: </strong>It can already do more, because\nthere are more numbers and more calculations happening.</p>\n<p><strong>Correction: </strong>More calculations is not the same as\nmore capability. Without an activation function, every step is still\njust multiply-then-add, and combining several multiply-then-add steps\nstill produces a straight-line relationship overall. The activation\nfunction is the one ingredient that breaks the straight line.</p>\n<h3 id=\"cfu-5-after-segment-5-step-5.1---forward-pass-order\">CFU 5\n(after Segment 5, Step 5.1 - Forward Pass Order)</h3>\n<p><strong>Question: </strong>In a forward pass, can you calculate the\noutput neuron before you calculate the hidden neurons? Why or why\nnot?</p>\n<p><strong>Expected correct answer: </strong>No. The output neuron’s\ninputs are the hidden neurons’ outputs, so the hidden layer must be\nfully calculated first, in order, before the output layer’s calculation\ncan even begin.</p>\n<p><strong>Common wrong answer: </strong>Yes, as long as you have all\nthe weights and biases written down ahead of time.</p>\n<p><strong>Correction: </strong>Having the weights and biases isn’t\nenough - the output neuron’s calculation needs actual numbers for a(A)\nand a(B), and those numbers don’t exist until the hidden layer’s\nweighted sum and ReLU steps have both been completed. Order matters\nbecause each layer depends on the layer before it.</p>\n<h3\nid=\"cfu-6-after-segment-5-worked-example-3---tracing-a-value-forward\">CFU\n6 (after Segment 5, Worked Example 3 - Tracing a Value Forward)</h3>\n<p><strong>Question: </strong>In Worked Example 3, Hidden Neuron A’s\nReLU output was 0. What effect did that 0 have on the final output\ncalculation, and why?</p>\n<p><strong>Expected correct answer: </strong>In the output neuron’s\nweighted sum, a(A) was multiplied by its weight, 3. Since a(A) was 0,\nthat whole term became 0, so Neuron A contributed nothing to the final\noutput that time - the final output came entirely from Neuron B’s\ncontribution plus the output neuron’s bias.</p>\n<p><strong>Common wrong answer: </strong>It had no effect at all, since\n0 usually means “nothing happened.”</p>\n<p><strong>Correction: </strong>It did have an effect - it’s exactly why\nthe final answer wasn’t higher. If Neuron A had been “on” instead of\n“off,” its output would have been multiplied by 3 and added into the\nfinal sum, changing the answer. A 0 from ReLU actively removes that\nneuron’s contribution rather than simply doing nothing.</p>\n<h3\nid=\"cfu-7-after-segment-7-step-7.2---connecting-the-demo-to-the-forward-pass\">CFU\n7 (after Segment 7, Step 7.2 - Connecting the Demo to the Forward\nPass)</h3>\n<p><strong>Question: </strong>In the mlu-explain diagram, what does one\nconnecting line between two circles represent, in terms of what you\ncalculated by hand today?</p>\n<p><strong>Expected correct answer: </strong>One connecting line\nrepresents one weight - one of the numbers multiplied against a value on\nits way into the next neuron, exactly like the w values used in every\nweighted sum calculated today.</p>\n<p><strong>Common wrong answer: </strong>It represents the whole neuron,\nor the whole calculation happening at once.</p>\n<p><strong>Correction: </strong>A single line is only one multiplication\n- one weight - not the whole neuron. The neuron itself is the circle:\nit’s where all of its incoming lines’ results get added together, plus a\nbias, and then passed through an activation function.</p>\n"}, {"id": "misconceptions", "kind": "general", "num": null, "title": "9. Common Misconceptions", "html": "<p><strong>1. Misconception: </strong>”A neuron is a brand-new kind of\nmath that has nothing to do with yesterday’s weighted sum.”</p>\n<p><strong>Why students develop it: </strong>Students are hearing new,\nbiology-sounding vocabulary (neuron, layer, network) on the same day,\nand unfamiliar words often get mentally filed as unfamiliar math, even\nwhen the underlying calculation hasn’t changed.</p>\n<p><strong>Correction strategy: </strong>Explicitly write “neuron =\nweighted sum + activation function” on the board every time the term is\nused in the first half of the day, and have students perform a weighted\nsum calculation and immediately apply ReLU to it, back to back, to prove\nto themselves it’s the same two skills they already had, just done in\nsequence.</p>\n<p><strong>2. Misconception: </strong>”Every neuron in a network uses\nthe same weights and bias.”</p>\n<p><strong>Why students develop it: </strong>Students have only worked\nwith one w and one b at a time through Day 2, so when they suddenly see\nmultiple neurons at once, they may assume the numbers are shared rather\nthan separate.</p>\n<p><strong>Correction strategy: </strong>In Worked Example 1 and Worked\nExample 3, explicitly point out that Hidden Neuron A and Hidden Neuron B\nhave completely different weights and a different bias from each other,\neven though they receive the exact same inputs. Have students circle\neach neuron’s own w and b values in a different color on their\nforward-pass worksheet.</p>\n<p><strong>3. Misconception: </strong>”ReLU makes a neuron’s output\nsmaller, like a filter that reduces every number.”</p>\n<p><strong>Why students develop it: </strong>Because ReLU’s most\nmemorable behavior is zeroing out negative numbers, students often\ngeneralize that ReLU always shrinks or reduces values, including\npositive ones.</p>\n<p><strong>Correction strategy: </strong>Return to Worked Example 2’s\nsecond calculation (z = 7 stays 7) and explicitly state that ReLU never\nchanges a positive number in any way - not smaller, not bigger, not\ndifferent. Ask a CFU-style question with a large positive z (e.g., z =\n100) and confirm students say the output is still exactly 100.</p>\n<p><strong>4. Misconception: </strong>”A hidden layer’s neurons are\n‘hidden’ because the network is keeping secrets or hiding its work from\nthe user.”</p>\n<p><strong>Why students develop it: </strong>The everyday meaning of\n“hidden” (concealed on purpose) is a natural but incorrect association\nfor students encountering the term for the first time.</p>\n<p><strong>Correction strategy: </strong>Restate the definition\nprecisely: hidden layers are called hidden only because their values are\nintermediate steps you don’t read as the final answer - not because\nanything is being deliberately concealed. Point out that students\ncalculated every hidden neuron’s value by hand today; nothing was\nwithheld from them.</p>\n<p><strong>5. Misconception: </strong>”You can calculate the layers of a\nnetwork in any order you want, as long as you get to all of them\neventually.”</p>\n<p><strong>Why students develop it: </strong>Students who are\ncomfortable with the individual weighted-sum and ReLU calculations may\nnot immediately see why order matters, since each single calculation\nfeels self-contained.</p>\n<p><strong>Correction strategy: </strong>Use CFU 5 directly: ask\nstudents to try calculating the output neuron first, using placeholder\nor made-up values for a(A) and a(B), and show that this produces a\ndifferent, wrong answer than the real forward pass - order isn’t a\nstylistic choice, it’s required because later layers depend on earlier\nlayers’ actual results.</p>\n<p><strong>6. Misconception: </strong>”More neurons or more layers\nalways makes a network’s answer more correct.”</p>\n<p><strong>Why students develop it: </strong>Students are told today\nthat networks can do more than a single weighted sum, and may\nover-extend that into believing bigger is unconditionally better,\nwithout yet having a concept of a network being trained on data.</p>\n<p><strong>Correction strategy: </strong>Clarify directly: today’s\nnetwork structure is entirely hand-designed, with weights and biases\nchosen by the instructor, not learned from data. More neurons only helps\nif the weights and biases are actually set well for the problem at hand\n- a concept students will explore hands-on during Day 4, not today. For\ntoday, simply state this limit exists and defer the full explanation to\nDay 4.</p>\n<p><strong>7. Misconception: </strong>”The output layer always needs an\nactivation function too, just like the hidden layers.”</p>\n<p><strong>Why students develop it: </strong>Since every hidden neuron\nin today’s worked examples used ReLU, students may assume activation\nfunctions are a universal requirement for every neuron in a network,\nincluding the output.</p>\n<p><strong>Correction strategy: </strong>Point directly to Step 5’s\nWorked Example 3, Step 7, where the output neuron reports its weighted\nsum with no activation function at all. Explain that this is a normal\nand common design when the network’s job is to output a number (a\nprediction) rather than a decision - and that different layers can make\ndifferent choices about whether to use an activation function.</p>\n"}, {"id": "assessment", "kind": "general", "num": null, "title": "10. Mini-Assessment (End of Day 3)", "html": "<p><strong>Instructions to students, exactly as printed: </strong>Answer\nall 8 questions on your own. You have 10 minutes. Show your work for any\ncalculation question.</p>\n<ul>\n<li><p>(Conceptual) In your own words, define a neuron using the two\nparts it’s made of.</p></li>\n<li><p>(Conceptual) Define hidden layer, and explain why it is called\n“hidden.”</p></li>\n<li><p>(Applied/Calculation) A neuron has weight = 2 (on x1), weight = 3\n(on x2), and bias = -10. The inputs are x1 = 1 and x2 = 2. Calculate the\nneuron’s weighted sum, then apply ReLU. Show your work and state whether\nthe neuron is On or Off.</p></li>\n<li><p>(Applied/Calculation) A neuron has weight = -1 (on x1), weight =\n1 (on x2), and bias = 5. The inputs are x1 = 2 and x2 = 1. Calculate the\nneuron’s weighted sum, then apply ReLU. Show your work and state whether\nthe neuron is On or Off.</p></li>\n<li><p>(Conceptual) In one or two sentences, explain why a network built\nentirely of weighted sums, with no activation function anywhere, could\nnot do anything a single weighted sum couldn’t already do.</p></li>\n<li><p>(Conceptual) In a forward pass, why must the hidden layer be\ncalculated before the output layer?</p></li>\n<li><p>(Applied) A hidden layer has 2 neurons. After ReLU, Neuron A’s\noutput is 0 and Neuron B’s output is 5. The output neuron has weight = 4\n(on Neuron A), weight = 2 (on Neuron B), and bias = 1, with no\nactivation function. Calculate the final network output. Show your\nwork.</p></li>\n<li><p>(Conceptual) In one or two sentences, explain what a connecting\nline in a neural network diagram, like the one shown in today’s demo,\nrepresents.</p></li>\n</ul>\n<h3 id=\"answer-key\">Answer Key</h3>\n<ul>\n<li><p>A neuron is a weighted sum (w x + b) followed by an activation\nfunction applied to that result. (Accept any answer containing both\nparts: the weighted sum calculation AND the activation function\nstep.)</p></li>\n<li><p>A hidden layer is any layer between the input layer and the\noutput layer. It’s called “hidden” because its values are intermediate\nsteps in the calculation, not the model’s final answer - not because\nanything is being concealed.</p></li>\n<li><p>z = (2)(1) + (3)(2) + (-10) = 2 + 6 - 10 = -2. Since -2 is\nnegative, ReLU outputs 0. The neuron is Off.</p></li>\n<li><p>z = (-1)(2) + (1)(1) + 5 = -2 + 1 + 5 = 4. Since 4 is positive,\nReLU passes it through unchanged. The neuron is On, with output\n4.</p></li>\n<li><p>Without an activation function, chaining weighted sums together\nstill just produces one combined straight-line relationship, because\nevery step is still only multiplying and adding - there is nothing to\nmake the combined result bend.</p></li>\n<li><p>Because the output layer’s calculation uses the hidden layer’s\noutputs as its inputs; those numbers don’t exist yet until the hidden\nlayer’s weighted-sum-and-ReLU steps are fully completed.</p></li>\n<li><p>z(out) = (4)(0) + (2)(5) + 1 = 0 + 10 + 1 = 11. Final output =\n11.</p></li>\n<li><p>A connecting line represents one weight - one multiplication\napplied to a value as it moves from one neuron (or input) into the next\nneuron on its way through the network.</p></li>\n</ul>\n<h3 id=\"scoring-guidance\">Scoring guidance</h3>\n<p>Score each of the 8 questions as 1 point for a fully correct answer,\n0.5 points for an answer that is directionally correct but missing a\nrequired part (e.g., a calculation question with the correct final\nnumber but a missing or incorrect ReLU On/Off statement), and 0 points\nfor an incorrect or blank answer. A score of 6/8 or higher indicates\nreadiness for Day 4. A score below 5/8, or any incorrect answer on\nQuestions 3, 4, or 7 (the three calculation questions), indicates the\nforward-pass mechanic itself is not yet solid and should be revisited\nbriefly at the start of Day 4 before new content begins.</p>\n<h3 id=\"instructor-interpretation-notes\">Instructor interpretation\nnotes</h3>\n<p>Questions 1 and 2 check vocabulary transfer independent of\ncalculation ability - a student can get the math right on Questions 3-4\nwhile still missing these, which signals memorized procedure without\nconceptual understanding. Questions 3, 4, and 7 check the mechanical\nforward-pass skill directly and are the strongest predictor of Day 4\nreadiness. Questions 5, 6, and 8 check whether students can explain the\nreasoning behind the mechanics, not just execute it; weakness here\nspecifically, paired with strength on 3/4/7, suggests a student who can\ncalculate but has not yet connected the calculation to why it matters -\nworth a brief individual check-in before Day 4.</p>\n"}, {"id": "gen11teachernotesoperationa", "kind": "general", "num": null, "title": "11. Teacher Notes (Operational Clarity)", "html": "<h3 id=\"what-to-watch-for-in-student-confusion\">What to watch for in\nstudent confusion</h3>\n<ul>\n<li><p>During Segment 2, watch for students who can recite the\ndefinitions of neuron and layer but cannot point to the input layer,\nhidden layer, and output layer in a new diagram they haven’t seen\nbefore. Definition recall does not guarantee diagram-reading ability -\ncheck both directly during the Label the Network activity.</p></li>\n<li><p>During Segment 4, watch worksheets for students marking a\nprediction of “Off” for z = 0. This is the single most common ReLU error\nand directly signals the boundary case (z = 0 counts as On) has not\nlanded - address it individually before Segment 5 begins, since Segment\n5’s worked example depends on this being correct.</p></li>\n<li><p>During Segment 5, watch for students who calculate both hidden\nneurons’ weighted sums correctly but then plug the pre-ReLU z-values\n(instead of the post-ReLU a-values) into the output neuron’s\ncalculation. This is the most consequential Day 3 error, since it\nsilently produces a wrong final answer while every individual step looks\nlocally correct.</p></li>\n<li><p>During Segment 5, watch for students who lose track of which\nweight belongs to which input when a neuron has two incoming\nconnections. Encourage students to physically label each weight with the\ninput it multiplies (e.g., “w-on-x1”) rather than relying on position\nalone.</p></li>\n</ul>\n<h3 id=\"when-to-slow-down\">When to slow down</h3>\n<ul>\n<li><p>If, during Segment 1’s review, more than a couple of students\ncannot correctly calculate a simple weighted sum without help, stop and\nredo the Question Two calculation with a new, simpler example before\nproceeding to Segment 2. Segment 2’s neuron definition only makes sense\nif the underlying weighted-sum calculation is already solid.</p></li>\n<li><p>If, during Segment 4’s Predict-Before-Calculate check (Step 4.2),\nthe class gets the z = 0 case wrong as a group, stop and re-state the\nReLU rule explicitly on the board with the exact boundary language\n(“zero or positive”) before moving into the timed worksheet - this\nboundary case reappears inside Segment 5’s worked example and must be\nsolid first.</p></li>\n<li><p>If, during Segment 5’s guided worked example, students are not\ncorrectly carrying a(A) and a(B) forward into the output neuron’s\ncalculation, stop the whole-class walkthrough and re-do Steps 5 through\n8 on the board with a new set of numbers before releasing students to\nthe independent worksheet - do not let this error propagate into\nindependent work.</p></li>\n</ul>\n<h3 id=\"what-not-to-skip\">What NOT to skip</h3>\n<ul>\n<li><p>Do not skip the Predict-Before-Calculate On/Off check in Step\n4.2. It is the direct continuation of the predict-before-testing habit\nbuilt on Days 1 and 2, and it is what catches the z = 0 boundary-case\nmisconception before it reaches the forward-pass worksheet, where it is\nmuch harder to isolate and correct.</p></li>\n<li><p>Do not skip explicitly stating, during Worked Example 3, that the\noutput neuron does not use ReLU. If this is left ambiguous, students\nwill default to applying ReLU everywhere, including the output, which\nproduces a wrong final answer that looks procedurally correct.</p></li>\n<li><p>Do not skip Segment 7’s Quick Debrief (Step 7.3). It is the only\nmoment in the visual demo where students actively map the visual diagram\nback onto their own hand calculations, and it is what makes the demo\nfunction as reinforcement of today’s forward pass rather than a\ndisconnected video, mirroring the role Day 1’s Step 5.3 debrief played\nfor that day’s demo.</p></li>\n<li><p>Do not skip Segment 8’s discussion question (Step 8.3). It is the\nonly moment where students trace a single changed number (bias) forward\nthrough a multi-step calculation in their own words, which is the exact\nreasoning skill Day 4’s prediction-based activities will require of\nthem.</p></li>\n</ul>\n<h3 id=\"time-management-notes\">Time management notes</h3>\n<ul>\n<li><p>Segment 5 (40 minutes) is the longest and highest-content segment\nof the day, since it carries the module’s central new skill. If time is\ntight, recover minutes from Segment 8’s Step 8.1 vocabulary summary\n(which can be delivered more briskly, since it is a recap rather than\nnew content) rather than from Segment 5’s guided worked example or\nindependent practice.</p></li>\n<li><p>The two breaks (Segment 3 at 5 minutes, Segment 6 at 10 minutes)\nare intentionally placed and sized to match the rhythm established on\nDays 1 and 2 and are built into the 180-minute total. Do not extend them\nwithout cutting an equivalent amount of time elsewhere, and do not cut\nthem entirely.</p></li>\n<li><p>Segment 9 (Mini-Assessment) must start no later than 2:45 to\nleave a full 15 minutes. If the day is running behind by this point,\nrecover time from Segment 7’s demo (Step 7.2 can be shortened by walking\nthrough fewer of the essay’s built-in interactive controls) rather than\nfrom the assessment itself or from Segment 5’s forward-pass work, which\nmust not be cut.</p></li>\n</ul>\n<h3 id=\"connections-to-day-4\">Connections to Day 4</h3>\n<ul>\n<li><p>By the end of Day 3, every student should be able to say, without\nprompting: a neuron is a weighted sum plus an activation function, a\nlayer is a group of neurons receiving the same inputs, ReLU zeroes out\nnegative results and passes through zero-or-positive results unchanged,\nand a forward pass calculates a network’s output one layer at a time, in\norder. Day 4 opens by immediately building on all four of these\nstatements without redefining them - confirm this fluency during Segment\n9’s assessment before moving forward.</p></li>\n<li><p>Day 4 will have students change weights, biases, activation\nfunctions, and network structure inside a live tool and predict the\neffects before testing them. Ensure Segment 5 (the forward pass) and\nSegment 8 (the Day 4 preview discussion) were not shortened or skipped,\nsince Day 4’s opening activities assume students have personally traced\na changed number through a multi-step calculation, not merely been told\nthat changes propagate forward.</p></li>\n<li><p>If Day 3’s Mini-Assessment reveals widespread difficulty with\nQuestions 3, 4, or 7 (the calculation questions), budget 10-15 minutes\nat the start of Day 4 for a fresh guided forward-pass example before\nintroducing the live modification tool, since Day 4 cannot succeed if\nthe forward-pass mechanic itself is still shaky.</p></li>\n<li><p><strong>Read Worksheet 5, Part A (“The Four Things I Own After\nToday”) before Day 4 begins.</strong> These four boxes take about five\nminutes to skim for an entire class and they tell you precisely who is\nready for Day 4 and who is not. This is the diagnostic that a take-home\nassignment could never reliably give you, because it was written in the\nroom, without notes, under your supervision.</p></li>\n<li><p><strong>There is no homework on any day of SAIL.</strong> All\npractice, all written reasoning, and all forward planning happen inside\nthe 180-minute block, on the student worksheet packet. Do not assign\nanything to be completed at home, and do not make any part of Day 4\ncontingent on work done outside of class.</p></li>\n</ul>\n<p>Page 1 of 5</p>\n<p>Page 1 of 2</p>\n"}], "worksheetsHtml": "<p><strong>STUDENT AI LAB (SAIL)</strong></p>\n<p><strong>DAY 3 — Neural Network Foundations</strong></p>\n<p><em>Neurons, Layers, and the Forward Pass — Student Worksheet\nPacket</em></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Name: ______________________</strong></th>\n<th><strong>Date: ______________________</strong></th>\n<th><strong>Table Group: ________________</strong></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>How to use this packet. </strong>Every worksheet in this\npacket is completed <strong>during class</strong>, alongside the segment\nit belongs to. There is no homework. Keep this packet open in front of\nyou all day. <strong>The SAIL rule: </strong>nothing gets calculated\nuntil your prediction is written.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>What is in this packet</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Worksheet</strong></th>\n<th><strong>Title</strong></th>\n<th><strong>When you complete it</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1</strong></td>\n<td>Label the Network — neurons and layers</td>\n<td>Segment 2 — during the lesson</td>\n</tr>\n<tr class=\"even\">\n<td><strong>2</strong></td>\n<td>ReLU Practice — turning neurons on and off</td>\n<td>Segment 4 — during the lesson</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>3</strong></td>\n<td>The Forward Pass — guided and independent</td>\n<td>Segment 5 — during the lesson</td>\n</tr>\n<tr class=\"even\">\n<td><strong>4</strong></td>\n<td>Watch the Network Move — demo observation log</td>\n<td>Segment 7 — during the lesson</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>5</strong></td>\n<td>Looking Ahead to Day 4</td>\n<td>Segment 8 — during the lesson</td>\n</tr>\n<tr class=\"even\">\n<td><strong>—</strong></td>\n<td>Day 3 Mini-Assessment (8 questions, no notes)</td>\n<td>Segment 9 — end of class</td>\n</tr>\n</tbody>\n</table>\n<h1 id=\"worksheet-1-label-the-network\">WORKSHEET 1 — Label the\nNetwork</h1>\n<p><em>Complete during Segment 2, alongside the lesson.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Today’s four definitions — write them as your instructor\nsays them.</strong></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Part A — Vocabulary in My Own Words</strong></p>\n<p><em>Do not copy from the board. Write each definition in words you\nwould actually use.</em></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>My definition, in my own words</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>NEURON (what TWO things make it up?)</strong></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>LAYER (what makes a group of neurons a layer?)</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>INPUT LAYER</strong></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>HIDDEN LAYER (why is it called “hidden”?)</strong></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>OUTPUT LAYER</strong></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Part B — Guided Practice (do Network A with your\ninstructor)</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Network</strong></th>\n<th><strong>Description</strong></th>\n<th><strong>How many layers? Name each one.</strong></th>\n<th><strong>Neurons in each hidden layer / output layer</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>A</strong></td>\n<td>3 inputs connect to 1 neuron, which produces the final answer.</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Part C — Independent Practice (work with your partner — each\nof you fills out your own sheet)</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Network</strong></th>\n<th><strong>Description</strong></th>\n<th><strong>How many layers? Name each one.</strong></th>\n<th><strong>Neurons in each hidden layer / output layer</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>B</strong></td>\n<td>2 inputs connect to 3 side-by-side neurons; those 3 neurons’ outputs\nconnect to 1 final neuron.</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td><strong>C</strong></td>\n<td>2 inputs connect to 2 side-by-side neurons; those 2 outputs connect\nto 2 MORE side-by-side neurons; those outputs connect to 1 final\nneuron.</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>D</strong></td>\n<td>4 inputs connect to 2 side-by-side neurons; those 2 outputs connect\nto 2 final, side-by-side output neurons.</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Reflection</strong></p>\n<p><em>A classmate says: “The input layer is just neurons like all the\nothers.” In one sentence, explain why that is not correct.</em></p>\n<h1 id=\"worksheet-2-relu-practice\">WORKSHEET 2 — ReLU Practice</h1>\n<p><em>Complete during Segment 4, alongside the lesson.</em></p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n</colgroup>\n<t
