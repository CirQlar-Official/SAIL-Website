<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAIL — Student AI Lab</title>
<meta name="description" content="Student AI Lab (SAIL): a five-day artificial intelligence curriculum for 4-H students ages 14–18. Slides, instructor script, worksheets, and lab links for every day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Anybody:wght@700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SAIL — design tokens
   Palette, type, and texture are lifted directly from the
   Figma Slides source (variables Color 1–4, 28E99F, Accent set).
   ============================================================ */
:root {
  /* palette (from the deck's own variables) */
  --navy-900: #101d33;
  --navy-800: #16263f;
  --navy-700: #1d3557;   /* deck "Color 4" */
  --navy-600: #274468;
  --steel:    #457b9d;
  --peri:     #8fa8ff;   /* deck accent */
  --blue:     #5882ff;   /* deck "Color 3" */
  --mint:     #28e99f;   /* deck "28E99F" */
  --lemon:    #ecffa3;   /* deck accent */
  --paper:    #f5f4f0;   /* deck accent (light surface) */
  --cloud:    #e9e8e2;
  --ink:      #14213a;
  --dim:      rgba(245, 244, 240, 0.62);
  --dimmer:   rgba(245, 244, 240, 0.38);
  --line:     rgba(245, 244, 240, 0.14);
  --line-strong: rgba(245, 244, 240, 0.26);

  /* type */
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Anybody", "Inter", system-ui, sans-serif;

  /* rhythm */
  --radius: 10px;
  --radius-sm: 6px;
  --gutter: clamp(20px, 4vw, 56px);
  --shadow-1: 0 2px 10px rgba(6, 12, 24, 0.35);
  --shadow-2: 0 10px 34px rgba(6, 12, 24, 0.45);

  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
}

body {
  background: var(--navy-900);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.app { min-height: 100%; }

/* the deck's dotted halftone field, as a CSS texture */
.dotfield {
  background-image: radial-gradient(rgba(245,244,240,0.10) 1.1px, transparent 1.1px);
  background-size: 14px 14px;
}

a { color: var(--peri); }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--mint);
  outline-offset: 2px;
  border-radius: 4px;
}

/* the signature bracket tag from the slides */
.tag {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mint);
  white-space: nowrap;
}
.tag::before { content: "[ "; color: var(--dimmer); }
.tag::after  { content: " ]"; color: var(--dimmer); }
.tag--quiet { color: var(--dim); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  color: var(--paper);
  text-decoration: none;
  background: rgba(245,244,240,0.04);
  transition: border-color 160ms var(--ease), background 160ms var(--ease),
              transform 160ms var(--ease);
}
.chip:hover {
  border-color: var(--mint);
  background: rgba(40, 233, 159, 0.08);
  transform: translateY(-1px);
}
.chip .ext { color: var(--mint); font-weight: 700; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 14px;
  border: 1px solid var(--line-strong);
  color: var(--paper);
  transition: background 160ms var(--ease), border-color 160ms var(--ease),
              transform 160ms var(--ease), color 160ms var(--ease);
}
.btn:hover { border-color: var(--mint); transform: translateY(-1px); }
.btn--primary {
  background: var(--mint);
  border-color: var(--mint);
  color: var(--navy-900);
}
.btn--primary:hover { background: #3df0ac; }
.btn--icon {
  width: 38px;
  height: 38px;
  padding: 0;
  font-size: 16px;
}
.btn[disabled] { opacity: 0.35; cursor: default; transform: none; }
.btn[disabled]:hover { border-color: var(--line-strong); }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ============================================================
   SAIL — landing (course dashboard)
   ============================================================ */
.landing {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.landing__inner {
  width: min(1120px, 100%);
  margin: 0 auto;
  padding: 0 var(--gutter);
  flex: 1;
}

.landing__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 26px 0 0;
}
.landing__meta { color: var(--dim); font-size: 13px; letter-spacing: 0.06em; }

.hero {
  padding: clamp(48px, 9vh, 96px) 0 clamp(30px, 5vh, 56px);
  max-width: 780px;
}
.hero h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(44px, 7vw, 84px);
  line-height: 0.98;
  letter-spacing: -0.015em;
  margin: 18px 0 20px;
}
.hero h1 .accent { color: var(--mint); }
.hero p {
  color: var(--dim);
  font-size: clamp(16px, 1.6vw, 19px);
  max-width: 620px;
  margin: 0 0 30px;
}
.hero__actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.hero__resume { color: var(--dim); font-size: 13px; }

/* ---- course map (styled after the deck's schedule table) ---- */
.map { padding-bottom: 26px; }
.map__head {
  display: grid;
  grid-template-columns: 56px 1fr 150px 170px;
  gap: 18px;
  padding: 0 22px 10px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dimmer);
}

.daycard {
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  display: grid;
  grid-template-columns: 56px 1fr 150px 170px;
  gap: 18px;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 20px 22px;
  margin-bottom: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(180deg, rgba(245,244,240,0.045), rgba(245,244,240,0.02));
  transition: transform 180ms var(--ease), border-color 180ms var(--ease),
              box-shadow 180ms var(--ease), background 180ms var(--ease);
}
.daycard:hover {
  transform: translateY(-2px);
  border-color: var(--line-strong);
  box-shadow: var(--shadow-2);
  background: linear-gradient(180deg, rgba(245,244,240,0.07), rgba(245,244,240,0.03));
}
.daycard--current { border-color: rgba(40,233,159,0.55); }

.daycard__num {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 30px;
  color: var(--accent, var(--mint));
  line-height: 1;
}
.daycard__title {
  display: block;
  font-weight: 700;
  font-size: 17px;
  margin: 0 0 4px;
}
.landing__reset {
  color: var(--dim);
  text-decoration: underline;
  text-underline-offset: 2px;
  padding: 0;
}
.landing__reset:hover { color: var(--paper); }
.daycard__tagline {
  display: block;
  color: var(--dim);
  font-size: 13.5px;
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.daycard__facts { color: var(--dim); font-size: 12.5px; line-height: 1.7; }

.daycard__status { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.daycard__state { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.daycard__state--done { color: var(--mint); }
.daycard__state--current { color: var(--lemon); }
.daycard__state--todo { color: var(--dimmer); }
.daycard__bar {
  width: 130px;
  height: 4px;
  border-radius: 999px;
  background: rgba(245,244,240,0.12);
  overflow: hidden;
}
.daycard__bar i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--mint);
  transition: width 400ms var(--ease);
}

/* ---- self-paced / resources ---- */
.landing__grid {
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  gap: 12px;
  padding-bottom: 60px;
}
.panelcard {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 24px 22px;
  background: rgba(245,244,240,0.03);
}
.panelcard h2 {
  font-size: 15px;
  font-weight: 700;
  margin: 12px 0 10px;
}
.panelcard p, .panelcard li { color: var(--dim); font-size: 13.5px; }
.panelcard ul { margin: 0; padding-left: 18px; }
.panelcard li { margin-bottom: 7px; }
.panelcard li strong { color: var(--paper); }
.toolstack { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.toolstack a { justify-content: space-between; }
.toolstack .toolname { font-weight: 700; font-size: 13px; }
.toolstack .tooldesc { color: var(--dim); font-weight: 400; font-size: 12px; }

.landing__footer {
  border-top: 1px solid var(--line);
  color: var(--dimmer);
  font-size: 12.5px;
  padding: 18px var(--gutter);
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

@media (max-width: 860px) {
  .map__head { display: none; }
  .daycard { grid-template-columns: 44px 1fr; grid-template-rows: auto auto; }
  .daycard__num { font-size: 24px; }
  .daycard__facts { grid-column: 2; }
  .daycard__status { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; }
  .landing__grid { grid-template-columns: 1fr; }
}

/* ============================================================
   SAIL — day viewer
   ============================================================ */
.viewer {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---- top bar ---- */
.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--navy-800);
  flex: none;
  min-height: 58px;
}
.topbar__day {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
}
.topbar__title {
  font-weight: 700;
  font-size: 14.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar__section {
  font-size: 12px;
  color: var(--lemon);
  border: 1px solid rgba(236,255,163,0.35);
  border-radius: 999px;
  padding: 3px 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 300px;
}
.topbar__spacer { flex: 1; }
.topbar__tools { display: flex; gap: 8px; }
.topbar .chip { padding: 5px 11px; font-size: 12.5px; }
.topbar__btns { display: flex; gap: 8px; }
.topbar .btn--icon[aria-pressed="true"] {
  background: rgba(40,233,159,0.14);
  border-color: var(--mint);
  color: var(--mint);
}

/* ---- body: stage + notes ---- */
.viewer__body {
  flex: 1;
  display: flex;
  min-height: 0;
}

.stagewrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(10px, 2.4vh, 26px) clamp(12px, 2.4vw, 30px);
  min-height: 0;
}

.viewer { --chrome: 216px; }
.viewer[data-thumbs="on"] { --chrome: 342px; }
.slide {
  position: relative;
  width: 100%;
  max-width: calc((100dvh - var(--chrome)) * 16 / 9);
  aspect-ratio: 16 / 9;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow-2);
  background: #fff;
  outline: 1px solid rgba(245,244,240,0.08);
}
.slide svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.slide__canvas {
  position: absolute;
  inset: 0;
  margin: auto;
  display: block;
  /* let the canvas keep its intrinsic rendered size and aspect ratio;
     constrain it inside the .slide box so it letterboxes instead of
     being force-stretched. */
  max-width: 100%;
  max-height: 100%;
}
.slide__error {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  color: var(--ink-2, #666);
  font-size: 14px;
}
.slide--enter { animation: slide-in 240ms var(--ease); }
.slide--enter-back { animation: slide-in-back 240ms var(--ease); }
@keyframes slide-in {
  from { opacity: 0; transform: translateX(14px); }
  to   { opacity: 1; transform: none; }
}
@keyframes slide-in-back {
  from { opacity: 0; transform: translateX(-14px); }
  to   { opacity: 1; transform: none; }
}

/* contextual tool callout (height reserved to avoid layout shift) */
.stage__callout {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 8px;
  padding: 0 16px;
  min-height: 38px;
}
.stage__callout .chip { margin-bottom: 4px; }

/* ---- bottom bar ---- */
.controls {
  flex: none;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 16px 14px;
}
.controls__nav { display: flex; gap: 8px; }
.controls__counter {
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  color: var(--dim);
  min-width: 86px;
  text-align: center;
}
.controls__counter strong { color: var(--paper); font-weight: 700; }
.controls__progress {
  flex: 1;
  height: 4px;
  background: rgba(245,244,240,0.12);
  border-radius: 999px;
  overflow: hidden;
}
.controls__progress i {
  display: block;
  height: 100%;
  background: var(--mint);
  border-radius: 999px;
  transition: width 260ms var(--ease);
}
.controls__hint { color: var(--dimmer); font-size: 12px; white-space: nowrap; }

/* ---- thumbnails drawer ---- */
.thumbs {
  flex: none;
  border-top: 1px solid var(--line);
  background: var(--navy-800);
  overflow-x: auto;
  overflow-y: hidden;
  display: flex;
  gap: 10px;
  padding: 12px 16px;
  scrollbar-width: thin;
}
.thumbs[hidden] { display: none; }
.thumb {
  flex: none;
  width: 148px;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
  border: 2px solid transparent;
  padding: 0;
  background: #fff;
  transition: border-color 140ms var(--ease), transform 140ms var(--ease);
}
.thumb:hover { transform: translateY(-2px); }
.thumb--active { border-color: var(--mint); }
.thumb__img { aspect-ratio: 16 / 9; display: block; position: relative; }
.thumb__img svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.thumb__img canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.thumb__n {
  position: absolute;
  left: 6px;
  bottom: 6px;
  background: rgba(16,29,51,0.85);
  color: var(--paper);
  border-radius: 4px;
  font-size: 10.5px;
  font-weight: 700;
  padding: 2px 6px;
  font-variant-numeric: tabular-nums;
}
.thumb--seen .thumb__n::after { content: " ✓"; color: var(--mint); }

/* ---- shortcuts overlay ---- */
.shortcuts {
  position: fixed;
  inset: 0;
  background: rgba(10, 18, 33, 0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 60;
}
.shortcuts[hidden] { display: none; }
.shortcuts__card {
  background: var(--navy-800);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  padding: 26px 30px;
  width: min(420px, calc(100vw - 40px));
  box-shadow: var(--shadow-2);
}
.shortcuts__card h2 { margin: 10px 0 16px; font-size: 16px; }
.shortcuts__row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13.5px;
  color: var(--dim);
}
.shortcuts__row:last-child { border-bottom: 0; }
kbd {
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 700;
  color: var(--paper);
  background: rgba(245,244,240,0.08);
  border: 1px solid var(--line-strong);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 2px 8px;
}

@media (max-width: 780px) {
  .topbar__section, .topbar__tools, .controls__hint { display: none; }
  .controls { gap: 10px; }
  .slide { max-width: 100%; }
}

/* ============================================================
   SAIL — instructor notes panel
   ============================================================ */
.notes {
  flex: none;
  width: min(430px, 40vw);
  border-left: 1px solid var(--line);
  background: var(--navy-800);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.notes[hidden] { display: none; }

.notes__head {
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px 0;
}
.notes__tab {
  padding: 8px 12px 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--dim);
  border-bottom: 2px solid transparent;
  border-radius: 0;
}
.notes__tab[aria-selected="true"] {
  color: var(--mint);
  border-bottom-color: var(--mint);
}
.notes__head .notes__print {
  margin-left: auto;
  font-size: 12px;
  color: var(--dim);
  padding: 6px 8px;
}
.notes__head .notes__print:hover { color: var(--paper); }

.notes__scroll {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px 40px;
  scrollbar-width: thin;
  scroll-behavior: smooth;
}
@media (prefers-reduced-motion: reduce) {
  .notes__scroll { scroll-behavior: auto; }
}

/* section blocks */
.notesec {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  overflow: hidden;
  transition: border-color 200ms var(--ease);
}
.notesec--active { border-color: rgba(40, 233, 159, 0.6); }
.notesec__head {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  text-align: left;
  padding: 12px 14px;
  font-size: 13px;
  font-weight: 700;
  background: rgba(245,244,240,0.04);
}
.notesec--active .notesec__head { color: var(--mint); }
.notesec__head::after { content: "+"; color: var(--dimmer); font-weight: 400; }
.notesec--open .notesec__head::after { content: "–"; }
.notesec__now {
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--navy-900);
  background: var(--mint);
  border-radius: 3px;
  padding: 2px 6px;
  font-weight: 800;
  margin-left: auto;
}
.notesec__body { display: none; padding: 4px 16px 14px; }
.notesec--open .notesec__body { display: block; }

/* long-form content typography */
.prose { font-size: 13.5px; color: rgba(245,244,240,0.86); }
.prose h1, .prose h2, .prose h3, .prose h4 {
  font-size: 13px;
  letter-spacing: 0.02em;
  color: var(--lemon);
  margin: 18px 0 6px;
}
.prose p { margin: 8px 0; }
.prose em { color: var(--paper); }
.prose strong { color: var(--paper); }
.prose ul, .prose ol { padding-left: 20px; margin: 8px 0; }
.prose li { margin: 4px 0; }
.prose a { color: var(--mint); font-weight: 600; text-decoration-color: rgba(40,233,159,0.5); }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.prose table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  margin: 10px 0;
  display: block;
  overflow-x: auto;
}
.prose th, .prose td {
  border: 1px solid var(--line-strong);
  padding: 6px 8px;
  text-align: left;
  vertical-align: top;
}
.prose th { background: rgba(245,244,240,0.06); color: var(--paper); }
.prose blockquote {
  margin: 10px 0;
  padding: 2px 14px;
  border-left: 3px solid var(--steel);
  color: var(--dim);
}

/* mobile: overlay sheet */
@media (max-width: 1000px) {
  .notes {
    position: fixed;
    top: 58px;
    right: 0;
    bottom: 0;
    width: min(430px, 92vw);
    z-index: 50;
    box-shadow: var(--shadow-2);
  }
}

/* ---- print: only the open notes/worksheets content ---- */
@media print {
  body { background: #fff; color: #111; }
  .topbar, .controls, .thumbs, .stagewrap, .landing, .shortcuts { display: none !important; }
  .viewer { height: auto; overflow: visible; }
  .viewer__body { display: block; }
  .notes {
    position: static;
    width: auto;
    border: 0;
