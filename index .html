 them a first\nmodification and a starting gesture pair at the start of Studio Block A\n(flagged from Segment 1). For the Showcase, the passing floor is two of\nthe three standard points — a specific change and what happened —\ndelivered aloud. Everyone presents; nobody is exempted.</p></li>\n<li><p><strong>Students needing extension: </strong>Challenge them to\ntrain a three- or four-category classifier (the + button adds classes,\nup to six) and present the harder experimental question that raises: how\nmuch structure does telling four things apart actually need? This is the\nopen-ended challenge Day 4’s extension pointed toward.</p></li>\n<li><p><strong>Pairs where one student dominates the device:\n</strong>Enforce a role handoff between Studio Block A and B — the\nstudent who drove the controls now makes the gestures, and vice versa.\nBoth students build and rehearse their own talk; the network is shared,\nthe explanation is not.</p></li>\n</ul>\n"}, {"id": "gen7noteonhomework", "kind": "general", "num": null, "title": "7. Note on Homework", "html": "<p><strong>There is no homework in SAIL — on Day 5 or on any other day.\n</strong>All practice, all written reasoning, and all planning happen\ninside the 180-minute block, on the Student Worksheet Packet.</p>\n<p>Day 5 is the final day of the course, so there is nothing to plan\nforward to and no bridge worksheet. The day’s two deliverables — a\nworking network the student designed and a spoken technical explanation\nof it — are both produced and completed in class, during the two Studio\nBlocks and the Showcase. Every worksheet in the Day 5 packet (the\nExperiment Design Sheet, the Modification Log, the Presentation Builder,\nthe Peer-Feedback Cards, and the Mini-Assessment) is completed in the\nroom.</p>\n<p>Students keep their full packet at the end of the day as a record of\nthe week. There is nothing to bring back, because the course is\ncomplete.</p>\n<p><strong>Instructor action at the end of the day: </strong>Collect\nonly the Day 5 Mini-Assessment and the Peer-Feedback Cards for your\nrecords. Return or let students keep everything else. Do not assign\nanything to be completed at home.</p>\n<p>Page of</p>\n"}], "worksheetsHtml": "<p><strong>STUDENT AI LAB (SAIL)</strong></p>\n<p><strong>Day 5 — Independent Build </strong>&amp;** Showcase**</p>\n<p><em>Designing, Running, and Presenting Your Own Network — Student\nWorksheet Packet</em></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Name:</strong> ____________________</th>\n<th><strong>Date:</strong> ____________________</th>\n<th><strong>Table Group:</strong> ______________</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>How to use this packet. </strong>Every worksheet in this\npacket is completed <strong>during class</strong>, alongside the segment\nit belongs to. There is no homework. Devices close during lecture\nsegments. Today you run the lab yourself — the instructor is your studio\ncoach, not your driver.</p>\n<p><strong>The SAIL rule: </strong>nothing gets trained until your\nprediction is written.</p>\n<p><strong>What is in this packet</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Worksheet</strong></th>\n<th><strong>Title</strong></th>\n<th><strong>When you complete it</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Design a Controlled Experiment</td>\n<td>Segment 2 — during the lesson</td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>Studio Log A — Build &amp; Baseline</td>\n<td>Segment 4 — during the lesson</td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>Modification Log — change, predict, observe, explain</td>\n<td>Segments 4 &amp; 7 — during the lesson</td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>Build Your Talk — the four-part frame</td>\n<td>Segment 7 — during the lesson</td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td>Showcase — Peer Feedback Cards</td>\n<td>Segment 8 — during the lesson</td>\n</tr>\n<tr class=\"even\">\n<td>—</td>\n<td>Day 5 Mini-Assessment (8 questions, no notes)</td>\n<td>Segment 9 — end of class</td>\n</tr>\n</tbody>\n</table>\n<h1 id=\"worksheet-1-design-a-controlled-experiment\">Worksheet 1 — Design\na Controlled Experiment</h1>\n<p><em>Complete during Segment 2, alongside the lesson.</em></p>\n<p><strong>Definition reminder. </strong>Controlled experiment: a test\nin which you change exactly one thing, hold everything else fixed, and\nwrite down what you expect to happen before you run it.</p>\n<h3 id=\"the-three-micro-steps\">The three micro-steps</h3>\n<ul>\n<li><p><strong>Name the one variable </strong>— the single setting you\nwill change (activation function, number of hidden layers, or learning\nrate).</p></li>\n<li><p><strong>Fix the controls </strong>— write down every other\nsetting so it stays exactly the same.</p></li>\n<li><p><strong>Predict, then run </strong>— write one sentence saying\nwhat you expect, then train.</p></li>\n</ul>\n<h3 id=\"my-experiment-plan\">My experiment plan</h3>\n<p><strong>1. The one variable I will change: </strong></p>\n<p><strong>2. The controls I will hold fixed (list them): </strong></p>\n<p><strong>3. My prediction </strong>(before I train) — write one\nsentence starting with “If my network…”:</p>\n<h1 id=\"worksheet-2-studio-log-a-build-baseline\">Worksheet 2 — Studio\nLog A: Build &amp; Baseline</h1>\n<p><em>Complete during Segment 4 (Studio Block A), at your\ndevice.</em></p>\n<p><strong>Studio procedure </strong>(keep this open all block): 1 —\nCapture your data. 2 — Write your prediction. 3 — Train and record.\nNothing gets trained until your prediction is written.</p>\n<h3 id=\"step-1-capture\">Step 1 — Capture</h3>\n<p><strong>What two classes (gestures) did you capture? </strong></p>\n<p><strong>Class A: </strong>____________________ <strong>Class B:\n</strong>____________________</p>\n<p><strong>About how many pictures per class? </strong>____________</p>\n<h3 id=\"step-2-baseline-settings-and-prediction\">Step 2 — Baseline\nsettings and prediction</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Setting</strong></th>\n<th><strong>My baseline value</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Activation function</td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>Number of hidden layers</td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>Learning rate</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>My prediction for the baseline run </strong>(what will the\nloss do?):</p>\n<h3 id=\"step-3-train-and-record-the-baseline\">Step 3 — Train and record\nthe baseline</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>What I observed</strong></th>\n<th><strong>My answer</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Did the Training Loss fall, stay flat, or bounce?</td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>Roughly where did the loss settle (low / medium / high)?</td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>Can the network tell my two classes apart? (yes / no /\nsometimes)</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<h1 id=\"worksheet-3-modification-log\">Worksheet 3 — Modification\nLog</h1>\n<p><em>Complete during Studio Blocks A and B (Segments 4\n<strong>&amp;</strong> 7). One row per change.</em></p>\n<p><strong>The discipline: </strong>change <strong>one</strong> thing →\n<strong>predict</strong> → <strong>observe</strong> →\n<strong>explain</strong>. Keep every other setting fixed so you know\nwhat caused the change.</p>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>#</strong></th>\n<th><strong>The one thing I changed</strong></th>\n<th><strong>My prediction (before)</strong></th>\n<th><strong>What actually happened</strong></th>\n<th><strong>Why (one sentence)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<h1 id=\"worksheet-4-build-your-talk\">Worksheet 4 — Build Your Talk</h1>\n<p><em>Complete during Segment 7 (Studio Block B).</em></p>\n<p><strong>The four-part frame. </strong>A good technical talk says, in\norder: (1) the change you made, (2) what you predicted, (3) what\nactually happened, and (4) why — in plain language anyone could\nfollow.</p>\n<h3 id=\"draft-your-23-minute-talk\">Draft your 2–3 minute talk</h3>\n<p><strong>Part 1 — The change. </strong>“The one thing I changed\nwas…”*</p>\n<p><strong>Part 2 — The prediction. </strong>“Before I ran it, I\nexpected…”*</p>\n<p><strong>Part 3 — What happened. </strong>“When I trained it, the\nloss…”*</p>\n<p><strong>Part 4 — Why, in plain words. </strong>“The reason is…”\n(Define any term a newcomer wouldn’t know — for example, ReLU.)*</p>\n<p><strong>Jargon check: </strong>circle any word in your talk a person\nwho never took this course wouldn’t know, and write a one-line plain\ndefinition to say right after it.</p>\n<h1 id=\"worksheet-5-showcase-peer-feedback\">Worksheet 5 — Showcase Peer\nFeedback</h1>\n<p><em>Complete during Segment 8, as you listen to each talk in your\npod.</em></p>\n<p><strong>The three-point standard. </strong>For each talk, mark\nwhether the speaker: (1) named the one thing they changed, (2) gave a\nprediction and what happened, and (3) explained the why without\nundefined jargon.</p>\n<h3 id=\"speaker-1-name-______________________\">Speaker 1 — Name:\n______________________</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Did the speaker…</strong></th>\n<th><strong>Yes</strong></th>\n<th><strong>Not yet</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Name the one thing they changed?</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>Give a prediction and what actually happened?</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>Explain the why with no undefined jargon?</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>One thing they did well: </strong></p>\n<h3 id=\"speaker-2-name-______________________\">Speaker 2 — Name:\n______________________</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Did the speaker…</strong></th>\n<th><strong>Yes</strong></th>\n<th><strong>Not yet</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Name the one thing they changed?</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>Give a prediction and what actually happened?</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>Explain the why with no undefined jargon?</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>One thing they did well: </strong></p>\n<h3 id=\"speaker-3-name-______________________\">Speaker 3 — Name:\n______________________</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Did the speaker…</strong></th>\n<th><strong>Yes</strong></th>\n<th><strong>Not yet</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Name the one thing they changed?</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>Give a prediction and what actually happened?</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>Explain the why with no undefined jargon?</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>One thing they did well: </strong></p>\n<h1 id=\"day-5-mini-assessment\">Day 5 Mini-Assessment</h1>\n<p><em>Complete during Segment 9. 8 questions, no notes, devices closed.\nAnswer in the space provided.</em></p>\n<p><strong>Question 1 (Conceptual) </strong>What are the three rules of\na controlled experiment in the SAIL Architect Lab? (One variable;\neverything else fixed; and…?)</p>\n<p><strong>Question 2 (Applied) </strong>A classmate switches to Linear\nactivation and raises the learning rate at the same time, then trains\nonce. Why can’t they conclude anything from this run? State the fix.</p>\n<p><strong>Question 3 (Applied / Calculation) </strong>A tiny model\npredicts 3, 7, and 8. The correct answers were 4, 7, and 10. Calculate\nthe loss using the error-square-average method. Show your work.</p>\n<p><strong>Question 4 (Conceptual) </strong>Your Training Loss chart has\nbeen flat and high for a long time. Name one specific thing you should\nchange, and say why waiting longer will not help.</p>\n<p><strong>Question 5 (Conceptual) </strong>Name the four parts of a\ngood spoken technical explanation, in order.</p>\n<p><strong>Question 6 (Conceptual) </strong>You are about to say the\nword “ReLU” to someone who never took this course. Write the short\nplain-language definition you would say right after it.</p>\n<p><strong>Question 7 (Conceptual) </strong>A network is trained only on\nReLU activation with two hidden layers. You switch it to Linear and it\ncan no longer tell your two hand shapes apart. Explain why, using the\nword “straight.”</p>\n<p><strong>Question 8 (Conceptual) </strong>Your network reaches a very\nlow loss and is extremely confident on your own captured pictures.\nExplain in two or three sentences why that alone does not make it a\ngood, fair model for everyone.</p>\n<p>Page 1 of 2</p>\n"};

<script>
/* SAIL — tiny DOM helpers (no framework, file://-safe). */
window.SAIL = window.SAIL || {};

SAIL.dom = (function () {
  "use strict";

  /** Create an element: el("button.btn--icon", {onclick}, children...) */
  function el(spec, attrs, ...children) {
    const [tagPart, ...classes] = spec.split(".");
    const node = document.createElement(tagPart || "div");
    if (classes.length) node.className = classes.join(" ");
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null) continue;
        if (k === "class") node.className += (node.className ? " " : "") + v;
        else if (k === "html") node.innerHTML = v;
        else if (k === "text") node.textContent = v;
        else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
        else if (k === "dataset") Object.assign(node.dataset, v);
        else node.setAttribute(k, v);
      }
    }
    for (const c of children.flat()) {
      if (c == null) continue;
      node.append(c.nodeType ? c : document.createTextNode(c));
    }
    return node;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
    return node;
  }

  return { el, clear };
})();

/* SAIL — progress + preferences store.
   Persists to localStorage when available; degrades to in-memory
   (e.g. sandboxed previews) without any behavioral errors. */
window.SAIL = window.SAIL || {};

SAIL.store = (function () {
  "use strict";

  const KEY = "sail-progress-v1";
  const memory = {};

  function read() {
    try {
      const raw = window.localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* storage unavailable — fall through */ }
    return memory[KEY] ? JSON.parse(memory[KEY]) : null;
  }

  function write(state) {
    const raw = JSON.stringify(state);
    memory[KEY] = raw;
    try { window.localStorage.setItem(KEY, raw); } catch (e) { /* in-memory only */ }
  }

  function blank() {
    return { seen: {}, last: null, prefs: { notes: true, thumbs: false } };
  }

  let state = read() || blank();
  state.seen = state.seen || {};
  state.prefs = Object.assign({ notes: true, thumbs: false }, state.prefs);

  function markSeen(day, slide) {
    const k = String(day);
    state.seen[k] = state.seen[k] || [];
    if (!state.seen[k].includes(slide)) state.seen[k].push(slide);
    state.last = { day, slide };
    write(state);
  }

  function seenCount(day) {
    return (state.seen[String(day)] || []).length;
  }

  function isSeen(day, slide) {
    return (state.seen[String(day)] || []).includes(slide);
  }

  function last() { return state.last; }

  function pref(name, value) {
    if (value === undefined) return state.prefs[name];
    state.prefs[name] = value;
    write(state);
    return value;
  }

  function reset() {
    state = blank();
    write(state);
  }

  return { markSeen, seenCount, isSeen, last, pref, reset };
})();

/* SAIL — hash router.
   Routes:  #/            landing
            #/day/3       day 3, slide 1
            #/day/3/12    day 3, slide 12
   Hash routing keeps deep links shareable and works from file:// and
   any static host with zero server configuration. */
window.SAIL = window.SAIL || {};

SAIL.router = (function () {
  "use strict";

  let onChange = null;

  function parse() {
    const h = window.location.hash.replace(/^#\/?/, "");
    const parts = h.split("/").filter(Boolean);
    if (parts[0] === "day") {
      const day = parseInt(parts[1], 10);
      const slide = parseInt(parts[2], 10) || 1;
      if (SAIL_DATA.days[day]) {
        const max = SAIL_DATA.days[day].slideCount;
        return { view: "day", day, slide: Math.min(Math.max(slide, 1), max) };
      }
    }
    return { view: "landing" };
  }

  function go(route) {
    const hash = route.view === "day"
      ? `#/day/${route.day}/${route.slide}`
      : "#/";
    if (window.location.hash === hash) handle();
    else window.location.hash = hash;
  }

  function handle() {
    if (onChange) onChange(parse());
  }

  function start(cb) {
    onChange = cb;
    window.addEventListener("hashchange", handle);
    handle();
  }

  return { start, go, parse };
})();

/* SAIL — instructor notes panel (Guide + Worksheets tabs). */
window.SAIL = window.SAIL || {};

SAIL.notes = (function () {
  "use strict";
  const { el } = SAIL.dom;

  /**
   * Build the notes panel for a day.
   * Returns { root, setActive(sectionId) }.
   */
  function create(dayData) {
    let tab = "guide";
    let activeId = null;

    const scroll = el("div.notes__scroll");
    const tabs = {
      guide: el("button.notes__tab", {
        text: "Teaching notes", role: "tab", "aria-selected": "true",
        onclick: () => setTab("guide"),
      }),
      sheets: el("button.notes__tab", {
        text: "Worksheets", role: "tab", "aria-selected": "false",
        onclick: () => setTab("sheets"),
      }),
    };
    const printBtn = el("button.notes__print", {
      text: "Print ⎙", title: "Print this tab",
      onclick: printTab,
    });

    const root = el("aside.notes", {
      "aria-label": "Instructor notes",
      hidden: SAIL.store.pref("notes") ? null : "",
    },
      el("div.notes__head", { role: "tablist" }, tabs.guide, tabs.sheets, printBtn),
      scroll);

    const sectionEls = {};

    function sectionBlock(s) {
      const body = el("div.notesec__body", null,
        el("div.prose", { html: s.html }));
      const head = el("button.notesec__head", {
        "aria-expanded": "false",
        onclick: () => block.classList.toggle("notesec--open"),
      }, el("span", { text: s.title }));
      const block = el("section.notesec", { id: `sec-${s.id}` }, head, body);
      // keep aria-expanded in sync
      new MutationObserver(() =>
        head.setAttribute("aria-expanded", block.classList.contains("notesec--open"))
      ).observe(block, { attributes: true, attributeFilter: ["class"] });
      sectionEls[s.id] = block;
      return block;
    }

    const guideContent = dayData.sections.map(sectionBlock);
    const sheetsContent = [
      el("section.notesec.notesec--open", null,
        el("div.notesec__body", null,
          el("div.prose", { html: dayData.worksheetsHtml }))),
    ];

    function renderTab() {
      SAIL.dom.clear(scroll);
      scroll.append(...(tab === "guide" ? guideContent : sheetsContent));
      tabs.guide.setAttribute("aria-selected", tab === "guide");
      tabs.sheets.setAttribute("aria-selected", tab === "sheets");
      if (tab === "guide" && activeId) highlight(activeId, true);
    }

    function setTab(t) {
      if (tab === t) return;
      tab = t;
      renderTab();
      scroll.scrollTop = 0;
    }

    function highlight(id, jump) {
      for (const [sid, node] of Object.entries(sectionEls)) {
        const isActive = sid === id;
        node.classList.toggle("notesec--active", isActive);
        node.classList.toggle("notesec--open", isActive);
        let badge = node.querySelector(".notesec__now");
        if (isActive && !badge) {
          node.querySelector(".notesec__head")
            .append(el("span.notesec__now", { text: "This slide" }));
        } else if (!isActive && badge) {
          badge.remove();
        }
      }
      const target = sectionEls[id];
      if (target && jump && tab === "guide" && target.scrollIntoView) {
        target.scrollIntoView({ block: "start" });
      }
    }

    function setActive(id) {
      activeId = id;
      if (tab === "guide") highlight(id, true);
    }

    function printTab() {
      const printable = tab === "guide" ? guideContent : sheetsContent;
      printable.forEach((n) => n.classList.add("notesec--print"));
      const cleanup = () => {
        printable.forEach((n) => n.classList.remove("notesec--print"));
        window.removeEventListener("afterprint", cleanup);
      };
      window.addEventListener("afterprint", cleanup);
      window.print();
    }

    renderTab();
    return { root, setActive };
  }

  return { create };
})();

/* SAIL — PDF slide source.
   Slides are hot-swappable: drop a new /slides/.1/day{N}.pdf and every
   page becomes that day's slide deck, one page per slide, in order.
   Uses pdf.js (loaded via CDN in <head>). Pages are cached per day so
   navigating back and forth doesn't re-render from scratch. */
window.SAIL = window.SAIL || {};
SAIL.pdfSlides = (function () {
  "use strict";

  let workerConfigured = false;
  function ensureWorker() {
    if (workerConfigured || typeof window.pdfjsLib === "undefined") return;
    const preferred = window.SAIL_PDF_LOCAL_WORKER ||
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js";
    try {
      pdfjsLib.GlobalWorkerOptions.workerSrc = preferred;
      workerConfigured = true;
    } catch (e) {
      console.warn("SAIL: couldn't set pdf.js workerSrc", e);
    }
  }

  const docCache = {};
  const pageCache = {};

  function loadDoc(day) {
    ensureWorker();
    if (typeof window.pdfjsLib === "undefined") return Promise.reject(new Error("pdf.js not available"));
    if (!docCache[day]) {
      docCache[day] = pdfjsLib.getDocument(`./slides/.1/day${day}.pdf`).promise;
    }
    return docCache[day];
  }

  function loadPage(day, n) {
    const key = `${day}:${n}`;
    if (!pageCache[key]) {
      pageCache[key] = loadDoc(day).then((doc) => doc.getPage(n));
    }
    return pageCache[key];
  }

  /** Render page n of day's PDF onto the given canvas at the given
   * target width (px); height follows the page's own aspect ratio. */
  function renderInto(canvas, day, n, targetWidth) {
    ensureWorker();
    if (typeof window.pdfjsLib === "undefined") return Promise.reject(new Error("pdf.js not available"));
    return loadPage(day, n).then((page) => {
      const baseViewport = page.getViewport({ scale: 1 });
      const scale = (targetWidth || baseViewport.width) / baseViewport.width;
      const dpr = window.devicePixelRatio || 1;
      const viewport = page.getViewport({ scale: scale * dpr });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = `${viewport.width / dpr}px`;
      canvas.style.height = `${viewport.height / dpr}px`;
      const ctx2d = canvas.getContext("2d", { willReadFrequently: true });
      return page.render({ canvasContext: ctx2d, viewport }).promise;
    });
  }

  return { renderInto };
})();

/* SAIL — day viewer: slide stage, navigation, thumbnails, notes. */
window.SAIL = window.SAIL || {};

SAIL.viewer = (function () {
  "use strict";
  const { el, clear } = SAIL.dom;

  let ctx = null; // current viewer context (per mounted day)

  function sectionTitle(dayData, id) {
    const s = dayData.sections.find((x) => x.id === id);
    if (s) return s.title;
    if (id && id.startsWith("break")) return "Break";
    return "";
  }

  function toolsForSection(dayData, id) {
    if (!id || !id.startsWith("seg")) return [];
    const n = parseInt(id.slice(3), 10);
    return dayData.tools.filter((t) => t.segments.includes(n));
  }

  function mount(root, day, slideN) {
    const dayData = SAIL_DATA.days[day];
    const notes = SAIL.notes.create(dayData);

    const els = {
      sectionChip: el("span.topbar__section"),
      stage: el("div.stage"),
      status: el("span.sr-only", { "aria-live": "polite", role: "status" }),
      callout: el("div.stage__callout"),
      counter: el("span.controls__counter"),
      bar: el("i"),
      prev: el("button.btn.btn--icon", {
        "aria-label": "Previous slide", title: "Previous slide (←)",
        html: "&#8592;",
        onclick: () => step(-1),
      }),
      next: el("button.btn.btn--icon", {
        "aria-label": "Next slide", title: "Next slide (→)",
        html: "&#8594;",
        onclick: () => step(1),
      }),
      thumbs: el("div.thumbs", { hidden: SAIL.store.pref("thumbs") ? null : "", role: "list" }),
      notesBtn: null,
      thumbsBtn: null,
      shortcuts: null,
    };

    els.notesBtn = el("button.btn.btn--icon", {
      "aria-label": "Toggle instructor notes", title: "Instructor notes (N)",
      "aria-pressed": String(!!SAIL.store.pref("notes")),
      html: "&#9776;",
      onclick: toggleNotes,
    });
    els.thumbsBtn = el("button.btn.btn--icon", {
      "aria-label": "Toggle slide thumbnails", title: "Thumbnails (T)",
      "aria-pressed": String(!!SAIL.store.pref("thumbs")),
      html: "&#9638;",
      onclick: toggleThumbs,
    });

    const topbar = el("header.topbar", null,
      el("button.btn.btn--icon", {
        "aria-label": "Back to course dashboard", title: "Dashboard (Esc)",
        html: "&#8962;",
        onclick: () => SAIL.router.go({ view: "landing" }),
      }),
      el("div.topbar__day", null,
        el("span.tag", { text: `Day ${day}` }),
        el("span.topbar__title", { text: dayData.title })),
      els.sectionChip,
      el("div.topbar__spacer"),
      el("div.topbar__tools", null,
        dayData.tools.map((t) => el("a.chip", {
          href: t.url, target: "_blank", rel: "noopener", title: t.desc,
        }, t.name, el("span.ext", { text: "↗" })))),
      el("div.topbar__btns", null,
        els.thumbsBtn, els.notesBtn,
        el("button.btn.btn--icon", {
          "aria-label": "Keyboard shortcuts", title: "Keyboard shortcuts (?)",
          text: "?",
          onclick: () => { els.shortcuts.hidden = false; },
        })));

    const controls = el("div.controls", null,
      el("div.controls__nav", null, els.prev, els.next),
      els.counter,
      el("div.controls__progress", null, els.bar),
      el("span.controls__hint", { text: "← → navigate · N notes · T thumbnails" }));

    const viewerEl = el("div.viewer", {
      dataset: { thumbs: SAIL.store.pref("thumbs") ? "on" : "off" },
    });
    root.append(viewerEl);
    viewerEl.append(
      topbar,
      el("div.viewer__body", null,
        el("div.stagewrap.dotfield", null, els.stage, els.callout, controls, els.thumbs, els.status),
        notes.root),
      els.shortcuts);

    ctx = { day, dayData, slideN, els, notes, viewerEl, thumbsBuilt: false, dir: 1 };
    if (SAIL.store.pref("thumbs")) buildThumbs();

  /* ---- slide display ---- */
  function show(n, initial) {
    const { dayData, els } = ctx;
    n = Math.min(Math.max(n, 1), dayData.slideCount);
    const slide = dayData.slides[n - 1];
    ctx.slideN = n;

    els.status.textContent =
      `Slide ${n} of ${dayData.slideCount}` + (slide.title ? `: ${slide.title}` : "");

      class: initial ? null : (ctx.dir >= 0 ? "slide--enter" : "slide--enter-back"),

    // avoids pdf.js being required when blocked by Tracking Prevention).
    if (window.pdfjsLib) {

        .catch((err) => {
          console.error("Slide render failed", err);

            text: `Couldn't load slide ${n} from ./slides/.1/day${ctx.day}.pdf`,
          }));

      // Use iframe showing page=n of the PDF. Browser will display page if it
      // supports embedded PDF viewers; otherwise the user can download the PDF.
      const src = `./slides/.1/day${ctx.day}.pdf#page=${n}`;
      const iframe = el("iframe.slide__canvas", {
        src,
        title: `Slide ${n}`,
        frameborder: 0,
      });

      iframe.style.width = "100%";
      iframe.style.height = "100%";
      frame.append(iframe);
    }

    const secTitle = sectionTitle(dayData, slide.section);
    els.sectionChip.textContent = secTitle;
    els.sectionChip.title = secTitle;
    els.counter.innerHTML = `<strong>${n}</strong> / ${dayData.slideCount}`;
    els.bar.style.width = `${(n / dayData.slideCount) * 100}%`;

    clear(els.callout);
    for (const t of toolsForSection(dayData, slide.section)) {
      els.callout.append(el("a.chip", {
        href: t.url, target: "_blank", rel: "noopener", title: t.desc,
      }, `This segment uses ${t.name}`, el("span.ext", { text: "↗" })));
    }

    SAIL.store.markSeen(ctx.day, n);
    ctx.notes.setActive(slide.section);
    updateThumbActive();
  }

    const n = ctx.slideN + delta;

  }

  function buildThumbs() {
    if (ctx.thumbsBuilt) return;

    const { dayData, els } = ctx;

      },
        el("span.thumb__img", null, thumbCanvas),
        el("span.thumb__n", { text: String(slide.n) }));

  function updateThumbActive() {
    if (!ctx || !ctx.thumbsBuilt) return;
    for (const t of ctx.els.thumbs.children) {
      const n = parseInt(t.dataset.n, 10);
      t.classList.toggle("thumb--active", n === ctx.slideN);
      t.classList.toggle("thumb--seen", SAIL.store.isSeen(ctx.day, n));
    }
    const active = ctx.els.thumbs.querySelector(".thumb--active");
    if (active && active.scrollIntoView) {
      active.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  }

  /* ---- toggles ---- */
  function toggleNotes() {
    const on = !SAIL.store.pref("notes");
    SAIL.store.pref("notes", on);
    ctx.notes.root.hidden = !on;
    ctx.els.notesBtn.setAttribute("aria-pressed", String(on));
    if (on) ctx.notes.setActive(ctx.dayData.slides[ctx.slideN - 1].section);
  }

  function toggleThumbs() {
    const on = !SAIL.store.pref("thumbs");
    SAIL.store.pref("thumbs", on);
    if (on) buildThumbs();
    ctx.viewerEl.dataset.thumbs = on ? "on" : "off";
    ctx.els.thumbs.hidden = !on;
    ctx.els.thumbsBtn.setAttribute("aria-pressed", String(on));
    if (on) updateThumbActive();
  }

  /* ---- shortcuts overlay ---- */
  function shortcutsOverlay() {
    const rows = [
      ["← / →", "Previous / next slide"],
      ["Home / End", "First / last slide"],
      ["N", "Show or hide instructor notes"],
      ["T", "Show or hide thumbnails"],
      ["Esc", "Close overlay, then back to dashboard"],
      ["?", "This help"],
    ];
    const card = el("div.shortcuts__card", { role: "dialog", "aria-label": "Keyboard shortcuts" },
      el("span.tag", { text: "Keyboard" }),
      el("h2", { text: "Shortcuts" }),
      rows.map(([k, d]) => el("div.shortcuts__row", null,
        el("span", { text: d }), el("kbd", { text: k }))));
    const overlay = el("div.shortcuts", {
      hidden: "",
      onclick: (e) => { if (e.target === overlay) overlay.hidden = true; },
    }, card);
    return overlay;
  }

  /* ---- global keyboard handling ---- */
  function onKey(e) {
    if (!ctx) return;
    if (e.target.closest && e.target.closest("input, textarea, select")) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    // Space/Enter on a focused control already activates it — don't also navigate.
    if ((e.key === " " || e.key === "Enter") &&
        e.target.closest && e.target.closest("button, a, [role=tab]")) return;
    switch (e.key) {
      case "ArrowRight":
      case "PageDown":
      case " ":
        step(1); e.preventDefault(); break;
      case "ArrowLeft":
      case "PageUp":
        step(-1); e.preventDefault(); break;
      case "Home":
        SAIL.router.go({ view: "day", day: ctx.day, slide: 1 });
        e.preventDefault(); break;
      case "End":
        SAIL.router.go({ view: "day", day: ctx.day, slide: ctx.dayData.slideCount });
        e.preventDefault(); break;
      case "n": case "N":
        toggleNotes(); break;
      case "t": case "T":
        toggleThumbs(); break;
      case "?":
        ctx.els.shortcuts.hidden = !ctx.els.shortcuts.hidden; break;
      case "Escape":
        if (!ctx.els.shortcuts.hidden) ctx.els.shortcuts.hidden = true;
        else SAIL.router.go({ view: "landing" });
        break;
    }
  }
  window.addEventListener("keydown", onKey);

  /** Route entry: mount fresh, or just change slide if same day is mounted. */
  function route(root, day, slide) {
    if (ctx && ctx.day === day && root.querySelector(".viewer")) {
      if (slide !== ctx.slideN) {
        ctx.dir = slide > ctx.slideN ? 1 : -1;  // works for back/forward too
        show(slide);
      }
      return;
    }
    ctx = null;
    clear(root);
    mount(root, day, slide);
  }

  function unmount() { ctx = null; }

  return { route, unmount };
})();

/* SAIL — bootstrap. */
(async function () {
  "use strict";
  const root = document.getElementById("app");

  /**
   * Load slide metadata for every day by inspecting the PDF in /slides.
   * If an embedded `SAIL_DATA.days[day]` exists, preserve any title/label/section
   * values but update `slideCount` and ensure `slides` reflects the PDF page count.
   */
  async function loadSlideMetadataForAllDays() {
    if (!window.pdfjsLib) return;
    const idx = Array.isArray(SAIL_DATA.index) ? SAIL_DATA.index : [];
    await Promise.all(idx.map(async (meta) => {
      const day = meta.day || (meta && meta.day) || (idx.indexOf(meta) + 1);
      try {
        const doc = await pdfjsLib.getDocument(`./slides/.1/day${day}.pdf`).promise;
        const numPages = doc.numPages || 0;
        const existing = SAIL_DATA.days && SAIL_DATA.days[day] ? SAIL_DATA.days[day] : {};
        const existingSlides = Array.isArray(existing.slides) ? existing.slides : [];
        const slides = Array.from({ length: numPages }, (_, i) => {
          const ex = existingSlides[i] || {};
          return {
            n: i + 1,
            label: ex.label || null,
            title: ex.title || null,
            section: ex.section || null,
          };
        });
        const merged = Object.assign({}, meta, existing, { day, slideCount: numPages, slides });
        SAIL_DATA.days = SAIL_DATA.days || {};
        SAIL_DATA.days[day] = merged;
      } catch (err) {
        // If loading fails (missing PDF or pdf.js error), leave any existing data intact
        console.warn("SAIL: couldn't load ./slides/.1/day" + day + ".pdf — leaving existing data.", err);
      }
    }));
  }

  await loadSlideMetadataForAllDays();

  SAIL.router.start(function (route) {
    if (route.view === "day") {
      SAIL.viewer.route(root, route.day, route.slide);
    } else {
      SAIL.viewer.unmount();
      SAIL.dom.clear(root);
      SAIL.landing.render(root);
      window.scrollTo(0, 0);
    }
  });
})();

</script>
